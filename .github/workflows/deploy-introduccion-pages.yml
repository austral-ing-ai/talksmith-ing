name: Publicar presentaciones en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - talks/introduccion/output/html/**
      - talks/claude-cowork/output/html/**
      - talks/claude-desktop-chat/output/html/**
      - .github/workflows/deploy-introduccion-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preparar el sitio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar las presentaciones
        run: |
          mkdir -p _site/claude-cowork _site/claude-desktop-chat
          cp -R talks/introduccion/output/html/. _site/
          cp -R talks/claude-cowork/output/html/. _site/claude-cowork/
          cp -R talks/claude-desktop-chat/output/html/. _site/claude-desktop-chat/

      - name: Cargar las presentaciones
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
