<marker id="hd" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="16" refY="8" orient="auto"><path d="M0,1 L16,8 L0,15 z" fill="#3B3535"/></marker>
</defs>
<rect width="360" height="412" fill="#ffffff"/>
<g stroke="#D8D2CE" stroke-width="2" fill="#F2EEEE">
<rect x="20" y="20" width="320" height="64" rx="10"/>
<rect x="20" y="174" width="320" height="64" rx="10"/>
<rect x="20" y="328" width="320" height="64" rx="10"/>
</g>
