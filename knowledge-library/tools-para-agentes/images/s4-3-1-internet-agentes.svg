<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Hacia un Internet de Agentes</title>
<desc>Un agente usa herramientas y datos mediante MCP, un enlace estándar, y se conecta con otros agentes mediante A2A, un enlace emergente todavía sin masa crítica.</desc>
