<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 370" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Tres capas, tres preguntas</title>
  <desc>Tres anillos concéntricos: Capa 1 · Datos afuera, Capa 2 · Aplicación en el medio y Capa 3 · Modelo en el núcleo; lo que sale va hacia afuera, lo que entra llega a la aplicación y el modelo decide en el centro.</desc>
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="13" refY="7" orient="auto">
      <path d="M0,1 L13,7 L0,13 Z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect width="705" height="370" fill="#FFFFFF"/>
  <rect x="20" y="20" width="500" height="330" rx="36" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="2"/>
  <rect x="70" y="78" width="400" height="214" rx="28" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="2"/>
  <rect x="120" y="136" width="300" height="104" rx="20" fill="#DA1B2E"/>
  <text x="48" y="56" font-size="20" font-weight="bold" fill="#1F1E1E">Capa 1 · Datos</text>
  <text x="96" y="113" font-size="20" font-weight="bold" fill="#1F1E1E">Capa 2 · Aplicación</text>
  <text x="270" y="176" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Capa 3 · Modelo</text>
  <text x="270" y="216" font-size="24" fill="#FFFFFF" text-anchor="middle">¿Qué decide?</text>
  <line x1="420" y1="49" x2="566" y2="49" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="576" y="56" font-size="20">¿Qué sale?</text>
  <line x1="566" y1="117" x2="470" y2="117" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="576" y="124" font-size="20">¿Qué entra?</text>
</svg>
