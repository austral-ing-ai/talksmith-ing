<line x1="630" y1="56" x2="400" y2="396"/>
</g>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="30" y="30" width="280" height="52" rx="26"/>
<rect x="490" y="30" width="280" height="52" rx="26"/>
<rect x="260" y="370" width="280" height="52" rx="26"/>
</g>
<g fill="#1F1E1E">
<text x="170" y="64">Datos privados</text>
<text x="630" y="64">Contenido no confiable</text>
