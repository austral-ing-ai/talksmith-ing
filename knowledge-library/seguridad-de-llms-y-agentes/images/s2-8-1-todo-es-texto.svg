<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 236" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#3B3535">
<title>Para el modelo, todo es texto</title>
<desc>Tres entradas de distinto origen (instrucciones del sistema, pedido del usuario y web, mail o documento) se concatenan en un único contexto, sin canal separado para las órdenes.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#3B3535"/></marker>
</defs>
<rect width="740" height="236" fill="#FFFFFF"/>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="20" y="20" width="260" height="52" rx="8"/>
<rect x="20" y="92" width="260" height="52" rx="8"/>
<rect x="20" y="164" width="260" height="52" rx="8"/>
</g>
<g text-anchor="middle">
<text x="150" y="52">Instrucciones del sistema</text>
<text x="150" y="124">Pedido del usuario</text>
<text x="150" y="196">Web, mail o documento</text>
</g>
<g fill="none" stroke="#3B3535" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M280,46 H370 A10,10 0 0 1 380,56 V118"/>
<path d="M280,190 H370 A10,10 0 0 0 380,180 V118"/>
<path d="M280,118 H380"/>
<path d="M380,118 H470" stroke-linecap="butt" marker-end="url(#ah)"/>
</g>
<circle cx="380" cy="118" r="6" fill="#3B3535"/>
<rect x="470" y="82" width="250" height="72" rx="10" fill="#DA1B2E"/>
<text x="595" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Un único contexto</text>
</svg>
