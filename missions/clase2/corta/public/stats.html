<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: estadísticas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Estadísticas</h1>
    <p class="sub">Consultá los números de un link corto</p>

    <form id="form-stats">
      <input type="text" id="codigo" placeholder="ej: a3k" required>
      <button type="submit">Buscar</button>
    </form>

    <!-- maqueta: datos de mentira, falta conectar con el server -->
    <div class="stats">
      <div class="stat"><span class="numero">123</span><span class="etiqueta">clicks</span></div>
      <div class="stat"><span class="numero">-</span><span class="etiqueta">URL original</span></div>
      <div class="stat"><span class="numero">-</span><span class="etiqueta">creado el</span></div>
    </div>

    <p class="pie"><a href="index.html">Volver a acortar</a></p>
  </main>
</body>
</html>
