<!-- talksmith-ascii-sha256: 4a704aeceb374fd98b9c288fb9d98989bfab2044312b80619bd63950689bf1e3 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="12.5">
  <title>El dato decide la arquitectura</title>
  <desc>Cuatro tipos de dato, la forma natural de cada uno y la arquitectura que le corresponde.</desc>
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 z" fill="#7A7373"/>
    </marker>
  </defs>

  <g stroke="#E2DDDD" stroke-width="1.2" fill="none">
    <path d="M 360 34 L 360 440"/><path d="M 30 236 L 690 236"/>
  </g>

  <!-- ============ TABLA ============ -->
  <text x="34" y="52" font-size="13.5" font-weight="bold">TABLA</text>
  <g fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.1">
    <rect x="34" y="66" width="182" height="20"/>
    <rect x="34" y="86" width="182" height="19"/>
    <rect x="34" y="105" width="182" height="19"/>
  </g>
  <g font-size="11" fill="#7A7373"><text x="42" y="80">edad</text><text x="100" y="80">ingreso</text><text x="168" y="80">zona</text></g>
  <g font-size="11"><text x="42" y="99">34</text><text x="100" y="99">52000</text><text x="168" y="99">12</text>
     <text x="42" y="118">41</text><text x="100" y="118">38000</text><text x="168" y="118">07</text></g>
  <path d="M 125 130 L 125 140" stroke="#7A7373" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <g fill="#ffffff" stroke="#B9B3B3" stroke-width="1.1">
    <rect x="34" y="146" width="24" height="22"/><rect x="60" y="146" width="24" height="22"/><rect x="86" y="146" width="24" height="22"/>
    <rect x="146" y="146" width="24" height="22"/>
  </g>
  <text x="118" y="162" font-size="13" fill="#7A7373">…</text>
  <g font-size="10" fill="#7A7373" text-anchor="middle"><text x="46" y="180">1</text><text x="72" y="180">2</text><text x="98" y="180">3</text><text x="158" y="180">n</text></g>
  <text x="34" y="200" font-size="12.5">una fila de n números</text>
  <rect x="34" y="208" width="52" height="20" rx="10" fill="#DA1B2E"/>
  <text x="60" y="222" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MLP</text>

  <!-- ============ SENAL 1D ============ -->
  <text x="392" y="52" font-size="13.5" font-weight="bold">SEÑAL 1D</text>
  <text x="478" y="52" font-size="11.5" fill="#7A7373">audio, ECG</text>
  <path d="M 392 112 L 410 76 L 428 118 L 446 84 L 464 116 L 482 82 L 500 120 L 518 96 L 536 112"
        stroke="#7A7373" stroke-width="1.8" fill="none"/>
  <path d="M 392 122 L 560 122" stroke="#E2DDDD" stroke-width="1.1"/>
  <path d="M 476 128 L 476 138" stroke="#7A7373" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <g fill="#ffffff" stroke="#B9B3B3" stroke-width="1.1">
    <rect x="392" y="146" width="30" height="22"/><rect x="424" y="146" width="30" height="22"/><rect x="456" y="146" width="30" height="22"/>
    <rect x="516" y="146" width="30" height="22"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#3B3535"><text x="407" y="161">x1</text><text x="439" y="161">x2</text><text x="471" y="161">x3</text><text x="531" y="161">xT</text></g>
  <text x="492" y="162" font-size="13" fill="#7A7373">…</text>
  <text x="392" y="188" font-size="10.5" fill="#7A7373">t = 1 … T,  el orden es parte del dato</text>
  <text x="392" y="207" font-size="12.5">una secuencia de T pasos</text>
  <rect x="392" y="212" width="104" height="20" rx="10" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.2"/>
  <text x="444" y="226" font-size="12" font-weight="bold" text-anchor="middle">CNN 1D / RNN</text>

  <!-- ============ IMAGEN EN GRISES ============ -->
  <text x="34" y="272" font-size="13.5" font-weight="bold">IMAGEN EN GRISES</text>
  <rect x="34" y="288" width="120" height="120" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2"/>
  <g stroke="#E2DDDD" stroke-width="0.8">
    <path d="M 64 288 L 64 408"/><path d="M 94 288 L 94 408"/><path d="M 124 288 L 124 408"/>
    <path d="M 34 318 L 154 318"/><path d="M 34 348 L 154 348"/><path d="M 34 378 L 154 378"/>
  </g>
  <text x="94" y="353" font-size="12" text-anchor="middle" fill="#7A7373">28 x 28</text>
  <text x="172" y="330" font-size="12.5">una grilla</text>
  <text x="172" y="348" font-size="12.5">alto por ancho</text>
  <text x="172" y="366" font-size="11" fill="#7A7373">importa qué píxel</text>
  <text x="172" y="380" font-size="11" fill="#7A7373">está al lado de cuál</text>
  <rect x="34" y="420" width="52" height="20" rx="10" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.2"/>
  <text x="60" y="434" font-size="12" font-weight="bold" text-anchor="middle">CNN</text>

  <!-- ============ IMAGEN RGB ============ -->
  <text x="392" y="272" font-size="13.5" font-weight="bold">IMAGEN RGB</text>
  <rect x="392" y="288" width="120" height="120" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2"/>
  <g stroke="#E2DDDD" stroke-width="0.8">
    <path d="M 422 288 L 422 408"/><path d="M 452 288 L 452 408"/><path d="M 482 288 L 482 408"/>
    <path d="M 392 318 L 512 318"/><path d="M 392 348 L 512 348"/><path d="M 392 378 L 512 378"/>
  </g>
  <rect x="452" y="318" width="30" height="30" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="452" y="400" font-size="12" text-anchor="middle" fill="#7A7373">28 x 28</text>
  <path d="M 484 333 L 526 333" stroke="#DA1B2E" stroke-width="1.5" fill="none"/>
  <g fill="#ffffff" stroke="#DA1B2E" stroke-width="1.3">
    <rect x="528" y="322" width="24" height="22"/><rect x="554" y="322" width="24" height="22"/><rect x="580" y="322" width="24" height="22"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle" fill="#DA1B2E"><text x="540" y="337">R</text><text x="566" y="337">G</text><text x="592" y="337">B</text></g>
  <text x="528" y="362" font-size="11" fill="#7A7373">tres números en</text>
  <text x="528" y="376" font-size="11" fill="#7A7373">el mismo píxel</text>
  <text x="392" y="424" font-size="12.5">la misma grilla, 3 números por píxel</text>
  <rect x="392" y="430" width="52" height="20" rx="10" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.2"/>
  <text x="418" y="444" font-size="12" font-weight="bold" text-anchor="middle">CNN</text>
</svg>
