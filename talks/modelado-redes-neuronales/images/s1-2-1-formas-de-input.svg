<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 20 820 326" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>La forma del input la decide la arquitectura</title>
  <desc>El mismo dato de 28 por 28 entra como una fila al MLP, como una grilla a la CNN y como una secuencia a un Transformer.</desc>
  <rect x="54" y="20" width="820" height="326" fill="#ffffff"/>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 z" fill="#8A8383"/>
    </marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="448" y="40" width="44" height="44" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2"/>
  <g stroke="#D6D1D1" stroke-width="0.6">
    <path d="M 459 40 L 459 84 M 470 40 L 470 84 M 481 40 L 481 84"/>
    <path d="M 448 51 L 492 51 M 448 62 L 492 62 M 448 73 L 492 73"/>
  </g>
  <text x="502" y="66" fill="#7A7373">una imagen de 28 x 28</text>

  <path d="M 462 86 L 180 134" stroke="#DA1B2E" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 470 86 L 470 134" stroke="#8A8383" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <path d="M 478 86 L 760 134" stroke="#8A8383" stroke-width="1.3" fill="none" marker-end="url(#a)"/>

  <text x="170" y="162" font-size="15" text-anchor="middle" font-weight="bold" fill="#DA1B2E">MLP (capa densa)</text>
  <text x="470" y="162" font-size="15" text-anchor="middle" font-weight="bold">CNN (convolucional)</text>
  <text x="770" y="162" font-size="15" text-anchor="middle" font-weight="bold">RNN / Transformer</text>

  <text x="170" y="182" font-size="12" text-anchor="middle" fill="#7A7373">espera una fila</text>
  <text x="470" y="182" font-size="12" text-anchor="middle" fill="#7A7373">espera una grilla</text>
  <text x="770" y="182" font-size="12" text-anchor="middle" fill="#7A7373">espera una secuencia</text>

  <g stroke="#DA1B2E" stroke-width="1.2" fill="#FBEAEC">
    <rect x="74" y="258" width="24" height="26"/><rect x="98" y="258" width="24" height="26"/>
    <rect x="122" y="258" width="24" height="26"/><rect x="146" y="258" width="24" height="26"/>
    <rect x="170" y="258" width="24" height="26"/><rect x="194" y="258" width="24" height="26"/>
    <rect x="218" y="258" width="24" height="26"/><rect x="242" y="258" width="24" height="26"/>
  </g>
  <text x="206" y="277" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" fill="#7A7373">...</text>
  <text x="86" y="300" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" fill="#7A7373">1</text>
  <text x="254" y="300" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" fill="#7A7373">784</text>

  <rect x="422" y="190" width="96" height="96" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2"/>
  <g stroke="#D6D1D1" stroke-width="0.6">
    <path d="M 434 190 L 434 286 M 446 190 L 446 286 M 458 190 L 458 286 M 470 190 L 470 286 M 482 190 L 482 286 M 494 190 L 494 286 M 506 190 L 506 286"/>
    <path d="M 422 202 L 518 202 M 422 214 L 518 214 M 422 226 L 518 226 M 422 238 L 518 238 M 422 250 L 518 250 M 422 262 L 518 262 M 422 274 L 518 274"/>
  </g>
  <text x="470" y="300" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" fill="#7A7373">28 x 28</text>

  <g stroke="#B9B3B3" stroke-width="1.2" fill="#F2EFEF">
    <rect x="703" y="210" width="26" height="76"/><rect x="739" y="210" width="26" height="76"/>
    <rect x="775" y="210" width="26" height="76"/><rect x="811" y="210" width="26" height="76"/>
  </g>
  <g font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" fill="#7A7373">
    <text x="716" y="300">t=1</text>
    <text x="752" y="300">t=2</text>
    <text x="788" y="300">t=3</text>
    <text x="824" y="300">t=T</text>
  </g>

  <text x="170" y="326" font-size="12" text-anchor="middle">hay que aplanarla primero</text>
  <text x="470" y="326" font-size="12" text-anchor="middle">la grilla queda intacta</text>
  <text x="770" y="326" font-size="12" text-anchor="middle">el orden es parte del dato</text>
</svg>
