<!-- talksmith-ascii-sha256: 4a704aeceb374fd98b9c288fb9d98989bfab2044312b80619bd63950689bf1e3 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="12">
  <title>El dato decide la arquitectura</title>
  <desc>Cada tipo de dato tiene una forma natural, y esa forma decide que arquitectura le corresponde.</desc>
  <rect x="0" y="0" width="720" height="570" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 z" fill="#7A7373"/>
    </marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <g font-size="11" font-weight="bold" fill="#7A7373">
    <text x="34" y="40">EL DATO</text><text x="330" y="40">LA FORMA QUE TIENE</text>
  </g>
  <path d="M 34 46 L 690 46" stroke="#E2DDDD" stroke-width="1.2"/>

  <text x="34" y="72" font-size="12.5" font-weight="bold">TABLA</text>
  <text x="86" y="72" font-size="10.5" fill="#7A7373">m&#178; + barrio (12)</text>
  <g fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1"><rect x="34" y="82" width="118" height="18"/><rect x="34" y="100" width="118" height="18"/><rect x="34" y="118" width="118" height="18"/></g>
  <g font-size="9.5" fill="#7A7373"><text x="40" y="94">m&#178;</text><text x="90" y="94">barrio</text></g>
  <g font-size="9.5"><text x="40" y="112">85</text><text x="90" y="112">Palermo</text><text x="40" y="130">120</text><text x="90" y="130">Caballito</text></g>
  <text x="34" y="152" font-size="9.5" fill="#7A7373">una fila por caso</text>
  <path d="M 240 108 L 314 108" stroke="#DA1B2E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <rect x="330" y="58" width="360" height="100" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.7"/>
  <rect x="350" y="86" width="144" height="24" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.1"/>
  <g stroke="#E2DDDD" stroke-width="0.8">
    <path d="M 374 86 L 374 110"/><path d="M 398 86 L 398 110"/><path d="M 422 86 L 422 110"/><path d="M 446 86 L 446 110"/><path d="M 470 86 L 470 110"/>
  </g>
  <text x="350" y="126" font-size="9.5" fill="#7A7373">n posiciones</text>
  <text x="512" y="84" font-size="11" font-weight="bold" fill="#DA1B2E">1 eje: (n)</text>
  <text x="512" y="100" font-size="10">una fila de n&#250;meros,</text>
  <text x="512" y="114" font-size="10">una posici&#243;n por variable</text>
  <rect x="518" y="127" width="150" height="22" rx="11" fill="#DA1B2E"/>
  <text x="593" y="142" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Perceptr&#243;n multicapa</text>

  <text x="34" y="206" font-size="12.5" font-weight="bold">SE&#209;AL 1D</text>
  <text x="104" y="206" font-size="10.5" fill="#7A7373">audio, ECG</text>
  <path d="M 34 246 L 52 218 L 70 254 L 88 224 L 106 252 L 124 220 L 142 256 L 160 234 L 178 246"
        stroke="#7A7373" stroke-width="1.8" fill="none"/>
  <path d="M 34 258 L 200 258" stroke="#E2DDDD" stroke-width="1.1"/>
  <text x="34" y="272" font-size="9.5" fill="#7A7373">una medici&#243;n por instante</text>
  <path d="M 240 229 L 314 229" stroke="#7A7373" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <rect x="330" y="188" width="360" height="88" rx="6" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.3"/>
  <rect x="350" y="206" width="144" height="24" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.1"/>
  <g stroke="#E2DDDD" stroke-width="0.8">
    <path d="M 374 206 L 374 230"/><path d="M 398 206 L 398 230"/><path d="M 422 206 L 422 230"/><path d="M 446 206 L 446 230"/><path d="M 470 206 L 470 230"/>
  </g>
  <path d="M 350 240 L 430 240" stroke="#B9B3B3" stroke-width="1.1" fill="none" marker-end="url(#ag)"/>
  <text x="350" y="256" font-size="9.5" fill="#7A7373">t = 1 ... T</text>
  <text x="512" y="204" font-size="11" font-weight="bold">1 eje: (T)</text>
  <text x="512" y="220" font-size="10">una secuencia de pasos,</text>
  <text x="512" y="234" font-size="10">y el orden es parte del dato</text>
  <rect x="438" y="245" width="230" height="22" rx="11" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.2"/>
  <text x="553" y="260" font-size="11" font-weight="bold" text-anchor="middle">Red recurrente o convolucional 1D</text>

  <text x="34" y="316" font-size="12.5" font-weight="bold">IMAGEN EN GRISES</text>
  <text x="168" y="316" font-size="10.5" fill="#7A7373">28 x 28</text>
  <rect x="34" y="326" width="72" height="72" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2"/>
  <g stroke="#E2DDDD" stroke-width="0.8"><path d="M 58 326 L 58 398"/><path d="M 82 326 L 82 398"/><path d="M 34 350 L 106 350"/><path d="M 34 374 L 106 374"/></g>
  <text x="34" y="414" font-size="9.5" fill="#7A7373">un valor de gris por p&#237;xel</text>
  <path d="M 240 362 L 314 362" stroke="#7A7373" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <rect x="330" y="318" width="360" height="88" rx="6" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.3"/>
  <rect x="350" y="332" width="57" height="57" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.1"/>
  <g stroke="#E2DDDD" stroke-width="0.8"><path d="M 369 332 L 369 389"/><path d="M 388 332 L 388 389"/><path d="M 350 351 L 407 351"/><path d="M 350 370 L 407 370"/></g>
  <text x="422" y="334" font-size="11" font-weight="bold">2 ejes: (alto, ancho)</text>
  <text x="422" y="350" font-size="10">una grilla, donde importa</text>
  <text x="422" y="364" font-size="10">qu&#233; p&#237;xel est&#225; al lado de cu&#225;l</text>
  <rect x="538" y="375" width="130" height="22" rx="11" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.2"/>
  <text x="603" y="390" font-size="11" font-weight="bold" text-anchor="middle">Red convolucional</text>

  <text x="34" y="436" font-size="12.5" font-weight="bold">IMAGEN RGB</text>
  <text x="126" y="436" font-size="10.5" fill="#7A7373">28 x 28 x 3</text>
  <g fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.1"><rect x="34" y="452" width="52" height="52"/><rect x="96" y="452" width="52" height="52"/><rect x="158" y="452" width="52" height="52"/></g>
  <g stroke="#E2DDDD" stroke-width="0.8">
    <path d="M 51 452 L 51 504"/><path d="M 68 452 L 68 504"/><path d="M 34 469 L 86 469"/><path d="M 34 486 L 86 486"/>
    <path d="M 113 452 L 113 504"/><path d="M 130 452 L 130 504"/><path d="M 96 469 L 148 469"/><path d="M 96 486 L 148 486"/>
    <path d="M 175 452 L 175 504"/><path d="M 192 452 L 192 504"/><path d="M 158 469 L 210 469"/><path d="M 158 486 L 210 486"/>
  </g>
  <g font-size="10.5" font-weight="bold" text-anchor="middle"><text x="60" y="448">R</text><text x="122" y="448">G</text><text x="184" y="448">B</text></g>
  <text x="34" y="520" font-size="9.5" fill="#7A7373">tres matrices, una por canal</text>
  <path d="M 240 482 L 314 482" stroke="#7A7373" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <rect x="330" y="440" width="360" height="88" rx="6" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.3"/>
  <rect x="350" y="454" width="57" height="57" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.1"/>
  <g stroke="#E2DDDD" stroke-width="0.8"><path d="M 369 454 L 369 511"/><path d="M 388 454 L 388 511"/><path d="M 350 473 L 407 473"/><path d="M 350 492 L 407 492"/></g>
  <rect x="369" y="473" width="19" height="19" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.8"/>
  <path d="M 388 482 L 412 482" stroke="#DA1B2E" stroke-width="1.2" fill="none"/>
  <g fill="#ffffff" stroke="#DA1B2E" stroke-width="1.2"><rect x="414" y="472" width="17" height="19"/><rect x="433" y="472" width="17" height="19"/><rect x="452" y="472" width="17" height="19"/></g>
  <g font-size="10" font-weight="bold" text-anchor="middle" fill="#DA1B2E"><text x="422" y="486">R</text><text x="441" y="486">G</text><text x="460" y="486">B</text></g>
  <text x="482" y="456" font-size="11" font-weight="bold">3 ejes: (alto, ancho, 3)</text>
  <text x="482" y="472" font-size="10">la misma grilla, con tres</text>
  <text x="482" y="486" font-size="10">n&#250;meros en cada p&#237;xel</text>
  <rect x="538" y="497" width="130" height="22" rx="11" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.2"/>
  <text x="603" y="512" font-size="11" font-weight="bold" text-anchor="middle">Red convolucional</text>

  <path d="M 34 542 L 690 542" stroke="#E2DDDD" stroke-width="1.2"/>
  <text x="34" y="562" font-size="11.5" fill="#7A7373">La forma no se elige: viene con el dato. Lo que se elige es la arquitectura que sabe aprovecharla.</text>
</svg>
