<!-- talksmith-ascii-sha256: 8e474bacece160d1089a9a5f628d1a00b9c18902fd04fee7bcd20abbe7e6fa68 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 19 838 209" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>Clasificación multiclase: cross-entropy</title>
  <desc>Cross-entropy ignora las clases equivocadas y solo mira la probabilidad que la red le dio a la correcta.</desc>
  <rect x="0" y="0" width="920" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <text x="60" y="50" font-size="15" font-weight="bold">3 clases, la verdadera es gato</text>

  <g fill="#F2EFEF" stroke="#D9D4D4" stroke-width="1">
    <rect x="170" y="80" width="300" height="22"/>
    <rect x="170" y="120" width="300" height="22"/>
    <rect x="170" y="160" width="300" height="22"/>
  </g>

  <rect x="170" y="80" width="240" height="22" fill="#DA1B2E"/>
  <rect x="170" y="120" width="45" height="22" fill="#B9B3B3"/>
  <rect x="170" y="160" width="15" height="22" fill="#B9B3B3"/>

  <g text-anchor="end">
    <text x="156" y="96">gato</text>
    <text x="156" y="136" fill="#7A7373">perro</text>
    <text x="156" y="176" fill="#7A7373">zorro</text>
  </g>

  <g text-anchor="end" font-family="'DejaVu Sans Mono', monospace">
    <text x="522" y="96" font-weight="bold">0,80</text>
    <text x="522" y="136" fill="#7A7373">0,15</text>
    <text x="522" y="176" fill="#7A7373">0,05</text>
    <text x="522" y="206" fill="#7A7373">1,00</text>
  </g>
  <line x1="478" y1="188" x2="522" y2="188" stroke="#B9B3B3" stroke-width="1"/>
  <text x="468" y="206" text-anchor="end" font-size="12" fill="#7A7373">suma</text>

  <path d="M 540 91 L 590 91" stroke="#DA1B2E" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>

  <text x="608" y="70" font-weight="bold">cross-entropy mira una sola casilla</text>
  <text x="608" y="97" font-size="15" font-family="'DejaVu Sans Mono', monospace" fill="#DA1B2E">L = -log(0,80) = 0,22</text>

  <text x="608" y="146" font-size="12.5" fill="#7A7373">si a gato le hubiera dado 0,05:</text>
  <text x="608" y="173" font-size="15" font-family="'DejaVu Sans Mono', monospace">L = -log(0,05) = 3,00</text>
  <text x="608" y="204" font-size="12.5" fill="#7A7373">Las otras dos casillas no entran en la cuenta.</text>
</svg>
