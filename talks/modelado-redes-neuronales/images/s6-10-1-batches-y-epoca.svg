<!-- talksmith-ascii-sha256: 7f9cf7efe7d08f4496349b6d00603c66e81396e043f36610795c23993cc348ff -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>Batch y época no son lo mismo</title>
  <desc>El train se parte en batches de tamaño fijo y cada batch produce exactamente un ajuste de los pesos.</desc>
  <rect x="0" y="0" width="700" height="310" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#7A7373"/>
    </marker>
  </defs>

  <text x="34" y="40" font-size="14" font-weight="bold">train: 10.000 filas &#183; batch = 100 &#183; da 100 batches</text>

  <g fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2">
    <rect x="34" y="60" width="112" height="44" rx="3"/>
    <rect x="166" y="60" width="112" height="44" rx="3"/>
    <rect x="298" y="60" width="112" height="44" rx="3"/>
    <rect x="554" y="60" width="112" height="44" rx="3"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="90" y="88">batch 1</text>
    <text x="222" y="88">batch 2</text>
    <text x="354" y="88">batch 3</text>
    <text x="610" y="88">batch 100</text>
  </g>
  <text x="482" y="88" font-size="18" text-anchor="middle" fill="#7A7373">&#183; &#183; &#183;</text>

  <g stroke="#7A7373" stroke-width="1.6" fill="none" marker-end="url(#ag)">
    <path d="M 90 104 L 90 130"/>
    <path d="M 222 104 L 222 130"/>
    <path d="M 354 104 L 354 130"/>
    <path d="M 610 104 L 610 130"/>
  </g>

  <g text-anchor="middle" font-size="12.5" fill="#7A7373">
    <text x="90" y="152">forward</text>
    <text x="90" y="169">backward</text>
    <text x="222" y="152">forward</text>
    <text x="222" y="169">backward</text>
    <text x="354" y="152">forward</text>
    <text x="354" y="169">backward</text>
    <text x="610" y="152">forward</text>
    <text x="610" y="169">backward</text>
  </g>

  <g fill="#ffffff" stroke="#DA1B2E" stroke-width="1.6">
    <rect x="42" y="182" width="96" height="28" rx="3"/>
    <rect x="174" y="182" width="96" height="28" rx="3"/>
    <rect x="306" y="182" width="96" height="28" rx="3"/>
    <rect x="562" y="182" width="96" height="28" rx="3"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#DA1B2E">
    <text x="90" y="201">1 ajuste</text>
    <text x="222" y="201">1 ajuste</text>
    <text x="354" y="201">1 ajuste</text>
    <text x="610" y="201">1 ajuste</text>
  </g>

  <path d="M 34 240 L 34 252 L 666 252 L 666 240" stroke="#7A7373" stroke-width="1.6" fill="none"/>
  <text x="350" y="276" font-size="14" font-weight="bold" text-anchor="middle">1 época</text>
  <text x="350" y="294" font-size="12.5" text-anchor="middle" fill="#7A7373">100 ajustes de los pesos, uno por batch</text>
</svg>
