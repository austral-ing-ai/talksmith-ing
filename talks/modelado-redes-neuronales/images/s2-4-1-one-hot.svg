<!-- talksmith-ascii-sha256: bd9387e974503762e4f0c1729677c4c81569a33af0ced125575be335d5e067cb -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Lo que entra al vector contra lo que es peso de la red</title>
  <desc>One-hot aporta k floats al vector y embedding aporta d floats, una sola fila de la tabla. En los dos casos la matriz es un peso de la red, no una entrada.</desc>
  <defs>
    <marker id="arw2" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7A7373"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="372" fill="#ffffff"/>

  <text x="30" y="30" font-size="14" font-weight="bold">ONE-HOT</text>
  <text x="122" y="30" font-size="12" fill="#9A9393">k = 4 categorías</text>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="17" text-anchor="middle" fill="#DA1B2E">
    <rect x="30" y="44" width="42" height="38" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/><text x="51" y="69">0</text>
    <rect x="72" y="44" width="42" height="38" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/><text x="93" y="69">1</text>
    <rect x="114" y="44" width="42" height="38" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/><text x="135" y="69">0</text>
    <rect x="156" y="44" width="42" height="38" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/><text x="177" y="69">0</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#9A9393">
    <text x="51" y="98">Casa</text><text x="93" y="98" fill="#3B3535">Depto</text><text x="135" y="98">PH</text><text x="177" y="98">Local</text>
  </g>
  <text x="30" y="122" font-size="12.5" fill="#DA1B2E">entran al vector: k floats, uno por categoría</text>

  <text x="238" y="70" font-size="22" text-anchor="middle" fill="#9A9393">×</text>

  <text x="290" y="30" font-size="12" fill="#9A9393">matriz W  ·  peso de la red</text>
  <rect x="290" y="44" width="150" height="96" fill="none" stroke="#B9B3B3"/>
  <rect x="327" y="44" width="38" height="96" fill="#F2EFEF" stroke="#7A7373" stroke-width="1.4"/>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#B9B3B3">
    <text x="308" y="72">·</text><text x="384" y="72">·</text><text x="422" y="72">·</text>
    <text x="308" y="100">·</text><text x="384" y="100">·</text><text x="422" y="100">·</text>
    <text x="308" y="128">·</text><text x="384" y="128">·</text><text x="422" y="128">·</text>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#7A7373">
    <text x="346" y="72">w</text><text x="346" y="100">w</text><text x="346" y="128">w</text>
  </g>
  <text x="290" y="160" font-size="11.5" fill="#9A9393">k × h  ·  el 1 le elige su columna</text>

  <line x1="30" y1="192" x2="650" y2="192" stroke="#E2DDDD" stroke-width="1.2"/>

  <text x="30" y="224" font-size="14" font-weight="bold">EMBEDDING</text>
  <text x="140" y="224" font-size="12" fill="#9A9393">d = 3</text>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="15" text-anchor="middle" fill="#DA1B2E">
    <rect x="30" y="238" width="56" height="38" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/><text x="58" y="262">.31</text>
    <rect x="86" y="238" width="56" height="38" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/><text x="114" y="262">-.08</text>
    <rect x="142" y="238" width="56" height="38" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/><text x="170" y="262">.74</text>
  </g>
  <text x="30" y="300" font-size="12.5" fill="#DA1B2E">entran al vector: d floats, y d no depende de k</text>

  <line x1="290" y1="257" x2="206" y2="257" stroke="#7A7373" stroke-width="1.4" marker-end="url(#arw2)"/>
  <text x="248" y="248" font-size="11" text-anchor="middle" fill="#9A9393">la fila</text>

  <text x="290" y="224" font-size="12" fill="#9A9393">tabla de embeddings  ·  peso de la red</text>
  <rect x="290" y="238" width="150" height="96" fill="none" stroke="#B9B3B3"/>
  <rect x="290" y="238" width="150" height="32" fill="#F2EFEF" stroke="#7A7373" stroke-width="1.4"/>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#7A7373">
    <text x="328" y="259">.31</text><text x="365" y="259">-.08</text><text x="403" y="259">.74</text>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" fill="#B9B3B3">
    <text x="328" y="291">·</text><text x="365" y="291">·</text><text x="403" y="291">·</text>
    <text x="328" y="323">·</text><text x="365" y="323">·</text><text x="403" y="323">·</text>
  </g>
  <text x="290" y="354" font-size="11.5" fill="#9A9393">k × d  ·  una fila por categoría</text>

  <text x="470" y="252" font-size="12.5" fill="#3B3535">en los dos casos la matriz</text>
  <text x="470" y="270" font-size="12.5" fill="#3B3535">es un peso de la red,</text>
  <text x="470" y="288" font-size="12.5" fill="#3B3535">no una entrada</text>
  <text x="470" y="314" font-size="12.5" fill="#DA1B2E">al vector solo entran</text>
  <text x="470" y="332" font-size="12.5" fill="#DA1B2E">los floats resaltados</text>
</svg>
