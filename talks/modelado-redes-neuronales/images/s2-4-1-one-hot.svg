<!-- talksmith-ascii-sha256: e0e4e0e3a237c013aa1d503be63eb5c442e6667823044dec32585db6d05d084d -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>One-hot selecciona una columna de W</title>
  <desc>Como solo una posición del vector one-hot vale 1, el producto con W selecciona los pesos de esa categoría.</desc>
  <defs>
    <marker id="arw2" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

  <text x="70" y="40" font-size="15" fill="#7A7373">one-hot "Depto"</text>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="18" text-anchor="middle">
    <rect x="40" y="55" width="44" height="40" fill="#F2EFEF" stroke="#B9B3B3"/><text x="62" y="81">0</text>
    <rect x="84" y="55" width="44" height="40" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.8"/><text x="106" y="81" fill="#DA1B2E">1</text>
    <rect x="128" y="55" width="44" height="40" fill="#F2EFEF" stroke="#B9B3B3"/><text x="150" y="81">0</text>
    <rect x="172" y="55" width="44" height="40" fill="#F2EFEF" stroke="#B9B3B3"/><text x="194" y="81">0</text>
  </g>
  <text x="62" y="115" font-size="12" text-anchor="middle" fill="#9A9393">Casa</text>
  <text x="106" y="115" font-size="12" text-anchor="middle" fill="#DA1B2E">Depto</text>
  <text x="150" y="115" font-size="12" text-anchor="middle" fill="#9A9393">PH</text>
  <text x="194" y="115" font-size="12" text-anchor="middle" fill="#9A9393">Local</text>

  <text x="300" y="81" font-size="24" text-anchor="middle">×</text>

  <text x="430" y="40" font-size="15" fill="#7A7373">matriz W</text>
  <g stroke="#B9B3B3" fill="none">
    <rect x="360" y="55" width="180" height="150"/>
  </g>
  <rect x="405" y="55" width="45" height="150" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.8"/>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="13" text-anchor="middle" fill="#B9B3B3">
    <text x="382" y="90">·</text><text x="472" y="90">·</text><text x="517" y="90">·</text>
    <text x="382" y="135">·</text><text x="472" y="135">·</text><text x="517" y="135">·</text>
    <text x="382" y="180">·</text><text x="472" y="180">·</text><text x="517" y="180">·</text>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="13" text-anchor="middle" fill="#DA1B2E">
    <text x="427" y="90">w</text><text x="427" y="135">w</text><text x="427" y="180">w</text>
  </g>

  <line x1="427" y1="215" x2="427" y2="248" stroke="#DA1B2E" stroke-width="1.8" marker-end="url(#arw2)"/>
  <text x="340" y="278" font-size="15" text-anchor="middle">cada categoría selecciona su propia columna de pesos en W</text>
</svg>
