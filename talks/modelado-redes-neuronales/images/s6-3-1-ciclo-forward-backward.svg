<!-- talksmith-ascii-sha256: b7971a75f9c4ec565fbe2aacd76ad8ad75a62a9bdb8158fa6cd0d7d25de023dd -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>Entrenar es un ciclo de dos movimientos</title>
  <desc>El forward recorre una fila del batch por los nodos de la red; el backward reparte la culpa por las mismas conexiones y la acumula, sin tocar los pesos.</desc>
  <rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 z" fill="#7A7373"/>
    </marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <text x="34" y="28" font-size="13" fill="#7A7373">hacia adelante: la red predice una fila del batch</text>

  <g text-anchor="middle" font-size="12" fill="#7A7373">
    <text x="110" y="54">entrada</text>
    <text x="235" y="54">capa 1</text>
    <text x="360" y="54">capa 2</text>
    <text x="470" y="54">salida</text>
  </g>

  <g stroke="#E2DDDD" stroke-width="1" fill="none">
    <line x1="110" y1="96" x2="235" y2="79"/>
    <line x1="110" y1="96" x2="235" y2="113"/>
    <line x1="110" y1="96" x2="235" y2="147"/>
    <line x1="110" y1="96" x2="235" y2="181"/>
    <line x1="110" y1="130" x2="235" y2="79"/>
    <line x1="110" y1="130" x2="235" y2="113"/>
    <line x1="110" y1="130" x2="235" y2="147"/>
    <line x1="110" y1="130" x2="235" y2="181"/>
    <line x1="110" y1="164" x2="235" y2="79"/>
    <line x1="110" y1="164" x2="235" y2="113"/>
    <line x1="110" y1="164" x2="235" y2="147"/>
    <line x1="110" y1="164" x2="235" y2="181"/>
    <line x1="235" y1="79" x2="360" y2="79"/>
    <line x1="235" y1="79" x2="360" y2="113"/>
    <line x1="235" y1="79" x2="360" y2="147"/>
    <line x1="235" y1="79" x2="360" y2="181"/>
    <line x1="235" y1="113" x2="360" y2="79"/>
    <line x1="235" y1="113" x2="360" y2="113"/>
    <line x1="235" y1="113" x2="360" y2="147"/>
    <line x1="235" y1="113" x2="360" y2="181"/>
    <line x1="235" y1="147" x2="360" y2="79"/>
    <line x1="235" y1="147" x2="360" y2="113"/>
    <line x1="235" y1="147" x2="360" y2="147"/>
    <line x1="235" y1="147" x2="360" y2="181"/>
    <line x1="235" y1="181" x2="360" y2="79"/>
    <line x1="235" y1="181" x2="360" y2="113"/>
    <line x1="235" y1="181" x2="360" y2="147"/>
    <line x1="235" y1="181" x2="360" y2="181"/>
    <line x1="360" y1="79" x2="470" y2="130"/>
    <line x1="360" y1="113" x2="470" y2="130"/>
    <line x1="360" y1="147" x2="470" y2="130"/>
    <line x1="360" y1="181" x2="470" y2="130"/>
  </g>

  <g fill="#ffffff" stroke="#B9B3B3" stroke-width="1.4">
    <circle cx="110" cy="96" r="11"/>
    <circle cx="110" cy="130" r="11"/>
    <circle cx="110" cy="164" r="11"/>
    <circle cx="235" cy="79" r="11"/>
    <circle cx="235" cy="113" r="11"/>
    <circle cx="235" cy="147" r="11"/>
    <circle cx="235" cy="181" r="11"/>
    <circle cx="360" cy="79" r="11"/>
    <circle cx="360" cy="113" r="11"/>
    <circle cx="360" cy="147" r="11"/>
    <circle cx="360" cy="181" r="11"/>
    <circle cx="470" cy="130" r="11"/>
  </g>

  <text x="36" y="136" font-size="16" font-weight="bold">x</text>
  <g stroke="#7A7373" stroke-width="1.8" fill="none" marker-end="url(#ag)">
    <path d="M 52 130 L 95 130"/>
    <path d="M 486 130 L 550 130"/>
  </g>
  <text x="519" y="120" font-size="12" text-anchor="middle" fill="#7A7373">y</text>

  <text x="616" y="96" font-size="11" text-anchor="middle" fill="#7A7373">compara y con t</text>
  <rect x="556" y="107" width="120" height="46" rx="3" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.6"/>
  <text x="616" y="136" font-size="14" font-weight="bold" text-anchor="middle" fill="#DA1B2E">L(y, t)</text>

  <path d="M 616 155 L 616 228 L 62 228" stroke="#DA1B2E" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <g stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ar)">
    <path d="M 235 224 L 235 200"/>
    <path d="M 360 224 L 360 200"/>
    <path d="M 470 224 L 470 149"/>
  </g>

  <text x="34" y="256" font-size="13" fill="#DA1B2E">hacia atr&#225;s: la culpa vuelve por las mismas conexiones,</text>
  <text x="34" y="272" font-size="13" fill="#DA1B2E">cada peso recibe su parte y se acumula como valor intermedio</text>

  <rect x="34" y="286" width="632" height="32" rx="3" fill="#F7F3F3" stroke="#B9B3B3" stroke-width="1.2"/>
  <text x="350" y="307" font-size="13.5" font-weight="bold" text-anchor="middle">W y b quedan quietos: se corrigen reci&#233;n al cerrar el batch</text>
</svg>
