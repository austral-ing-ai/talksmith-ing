  <text x="337" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#DA1B2E">ya calculado para la unidad j</text>
  <text x="504" y="350" text-anchor="middle" font-size="12" fill="#7A7373">lo &#250;nico nuevo: tres factores m&#225;s</text>
  <text x="400" y="378" text-anchor="middle" font-size="13" fill="#7A7373">bajar una capa no rehace la cuenta: le agrega tres factores adelante.</text>
  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#7A7373">si la unidad alimenta a varias, se suma su aporte a cada una.</text>
