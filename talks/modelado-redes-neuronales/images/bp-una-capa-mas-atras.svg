<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>Una capa m&#225;s atr&#225;s</title>
  <desc>Dos neuronas encadenadas, cada una dibujada como su suma ponderada y su activacion; el gradiente de un peso de la capa oculta es la misma cadena con tres factores mas adelante, y los dos ultimos ya estaban calculados.</desc>
