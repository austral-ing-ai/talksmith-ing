  <text x="400" y="32" font-size="16" font-weight="bold" text-anchor="middle">Una capa m&#225;s atr&#225;s: la cadena se estira</text>
  <text x="400" y="52" font-size="12" text-anchor="middle" fill="#7A7373">el mismo procedimiento, dos unidades de distancia del error</text>
