<!-- talksmith-ascii-sha256: c4a4cf3d692e1ff89d35493f0dcec19507e8ee1d5a96adf2192dbf04049a1083 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>Cómo se ven las cuatro activaciones de salida</title>
  <desc>Lineal, sigmoide y softplus son curvas sobre un número; softmax reparte una probabilidad entre clases que compiten.</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <g stroke="#B9B3B3" stroke-width="1.2" fill="none">
    <path d="M 45 190 L 265 190 M 155 100 L 155 240"/>
    <path d="M 340 236 L 560 236 M 450 110 L 450 252"/>
    <path d="M 635 190 L 855 190 M 745 100 L 745 240"/>
  </g>

  <text x="155" y="52" font-size="16" text-anchor="middle" font-weight="bold">Lineal</text>
  <text x="450" y="52" font-size="16" text-anchor="middle" font-weight="bold">Sigmoide</text>
  <text x="745" y="52" font-size="16" text-anchor="middle" font-weight="bold">Softplus</text>
  <text x="155" y="74" font-size="13" text-anchor="middle" fill="#7A7373">y = z</text>
  <text x="450" y="74" font-size="13" text-anchor="middle" fill="#7A7373">1 / (1 + e a la menos z)</text>
  <text x="745" y="74" font-size="13" text-anchor="middle" fill="#7A7373">log(1 + e a la z)</text>

  <path d="M 60 250 L 260 110" stroke="#3B3535" stroke-width="2.4" fill="none"/>

  <path d="M 350 234 C 395 234 420 228 450 190 C 480 152 505 146 550 146" stroke="#3B3535" stroke-width="2.4" fill="none"/>
  <line x1="340" y1="146" x2="560" y2="146" stroke="#D9D4D4" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="332" y="150" font-size="12" text-anchor="end" fill="#7A7373">1</text>
  <text x="332" y="240" font-size="12" text-anchor="end" fill="#7A7373">0</text>

  <path d="M 645 190 C 700 190 725 186 745 172 C 770 154 800 128 845 104" stroke="#3B3535" stroke-width="2.4" fill="none"/>
  <text x="627" y="194" font-size="12" text-anchor="end" fill="#7A7373">0</text>

  <text x="155" y="276" text-anchor="middle">todo R, sin piso ni techo</text>
  <text x="155" y="294" text-anchor="middle" fill="#7A7373">un precio</text>
  <text x="450" y="276" text-anchor="middle">(0, 1), tiene techo</text>
  <text x="450" y="294" text-anchor="middle" fill="#7A7373">una probabilidad</text>
  <text x="745" y="276" text-anchor="middle">(0, inf), tiene piso</text>
  <text x="745" y="294" text-anchor="middle" fill="#7A7373">un conteo</text>

  <line x1="45" y1="330" x2="855" y2="330" stroke="#E4E0E0" stroke-width="1.2"/>

  <text x="45" y="360" font-size="16" font-weight="bold" fill="#DA1B2E">Softmax</text>
  <text x="130" y="360" font-size="13" fill="#7A7373">no es una curva: reparte 1 entre N clases que compiten</text>

  <text x="45" y="392" font-size="13">gato</text>
  <rect x="130" y="380" width="620" height="16" fill="#F2EFEF" stroke="#D9D4D4" stroke-width="1"/>
  <rect x="130" y="380" width="384" height="16" fill="#DA1B2E"/>
  <text x="855" y="393" font-size="13" text-anchor="end" font-weight="bold">0.62</text>

  <text x="45" y="418" font-size="13">perro</text>
  <rect x="130" y="406" width="620" height="16" fill="#F2EFEF" stroke="#D9D4D4" stroke-width="1"/>
  <rect x="130" y="406" width="167" height="16" fill="#B9B3B3"/>
  <text x="855" y="419" font-size="13" text-anchor="end">0.27</text>

  <text x="45" y="444" font-size="13">zorro</text>
  <rect x="130" y="432" width="620" height="16" fill="#F2EFEF" stroke="#D9D4D4" stroke-width="1"/>
  <rect x="130" y="432" width="68" height="16" fill="#B9B3B3"/>
  <text x="855" y="445" font-size="13" text-anchor="end">0.11</text>
</svg>
