<!-- talksmith-ascii-sha256: 6de079c8e7f9cc25ba3c900ed3c55cc06379fa867de094f6d9619f603f669102 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 368" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>Qu&#233; vale cada factor de la cadena</title>
  <desc>Los tres factores de la cadena, cada uno resuelto, y su producto, que es el gradiente del peso.</desc>
  <rect x="0" y="0" width="440" height="368" fill="#ffffff"/>
  <text x="220" y="30" font-size="14" font-weight="bold" text-anchor="middle">Cada factor tiene una forma cerrada</text>
  <circle cx="44" cy="84" r="11" fill="#3B3535"/>
  <text x="44" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="110.4" y="72" font-family="'DejaVu Sans Mono', monospace" font-size="16">&#8706;L</text>
  <text x="107.4" y="104" font-family="'DejaVu Sans Mono', monospace" font-size="16">&#8706;y<tspan font-size="9.9" dy="4">j</tspan></text>
  <line x1="103.4" y1="82" x2="136.6" y2="82" stroke="#3B3535" stroke-width="1.5"/>
  <text x="172" y="88" font-family="'DejaVu Sans Mono', monospace" font-size="16">=</text>
  <text x="206" y="88" font-family="'DejaVu Sans Mono', monospace" font-size="16">y<tspan font-size="10" dy="4">j</tspan><tspan font-size="16" dy="-4"> &#8722; t</tspan><tspan font-size="10" dy="4">j</tspan></text>
  <circle cx="44" cy="162" r="11" fill="#3B3535"/>
  <text x="44" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="107.4" y="150" font-family="'DejaVu Sans Mono', monospace" font-size="16">&#8706;y<tspan font-size="9.9" dy="4">j</tspan></text>
  <text x="107.4" y="182" font-family="'DejaVu Sans Mono', monospace" font-size="16">&#8706;z<tspan font-size="9.9" dy="4">j</tspan></text>
  <line x1="103.4" y1="160" x2="136.6" y2="160" stroke="#3B3535" stroke-width="1.5"/>
  <text x="172" y="166" font-family="'DejaVu Sans Mono', monospace" font-size="16">=</text>
  <text x="206" y="166" font-family="'DejaVu Sans Mono', monospace" font-size="16">f'( z<tspan font-size="10" dy="4">j</tspan><tspan font-size="16" dy="-4"> )</tspan></text>
  <circle cx="44" cy="240" r="11" fill="#3B3535"/>
  <text x="44" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="107.4" y="228" font-family="'DejaVu Sans Mono', monospace" font-size="16">&#8706;z<tspan font-size="9.9" dy="4">j</tspan></text>
  <text x="104.5" y="260" font-family="'DejaVu Sans Mono', monospace" font-size="16">&#8706;w<tspan font-size="9.9" dy="4">ij</tspan></text>
  <line x1="100.5" y1="238" x2="139.5" y2="238" stroke="#3B3535" stroke-width="1.5"/>
  <text x="172" y="244" font-family="'DejaVu Sans Mono', monospace" font-size="16">=</text>
  <text x="206" y="244" font-family="'DejaVu Sans Mono', monospace" font-size="16">x<tspan font-size="10" dy="4">i</tspan></text>
  <path d="M 322 66 L 332 66 L 332 115 L 340 119 L 332 123 L 332 172 L 322 172" stroke="#B9B3B3" stroke-width="1.4" fill="none"/>
  <text x="348" y="112" font-size="11" fill="#7A7373">se calcula una</text>
  <text x="348" y="126" font-size="11" fill="#7A7373">vez por unidad</text>
  <line x1="34" y1="290" x2="406" y2="290" stroke="#E2DDDD" stroke-width="1.3"/>
  <text x="220" y="312" text-anchor="middle" font-size="11.5" fill="#7A7373">el gradiente de ese peso es el producto de los tres</text>
  <text x="80" y="348" font-family="'DejaVu Sans Mono', monospace" font-size="17" font-weight="bold" fill="#DA1B2E">( y<tspan font-size="10.5" dy="4">j</tspan><tspan font-size="17" dy="-4"> &#8722; t</tspan><tspan font-size="10.5" dy="4">j</tspan><tspan font-size="17" dy="-4"> ) &#183; f'( z</tspan><tspan font-size="10.5" dy="4">j</tspan><tspan font-size="17" dy="-4"> ) &#183; x</tspan><tspan font-size="10.5" dy="4">i</tspan></text>
</svg>
