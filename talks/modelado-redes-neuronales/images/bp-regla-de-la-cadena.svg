<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 412" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>La regla de la cadena sobre la red</title>
  <desc>Parado en una unidad de salida j: el camino de un peso al error, con los tres tramos numerados, y la regla de la cadena con sus factores numerados igual.</desc>
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#B9B3B3"/></marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#DA1B2E"/></marker>
  </defs>
  <rect x="0" y="0" width="770" height="412" fill="#ffffff"/>
  <text x="385" y="32" font-size="16" font-weight="bold" text-anchor="middle">El efecto total es el producto de tres factores</text>
  <text x="385" y="52" font-size="12" text-anchor="middle" fill="#7A7373">mirando desde una unidad de salida j</text>
  <g stroke="#B9B3B3" stroke-width="1.5" fill="none" marker-end="url(#ag)">
    <path d="M 85 119 L 180 161"/>
    <path d="M 85 231 L 180 189"/>
    <path d="M 234 175 L 277 175"/>
    <path d="M 334 175 L 373 175"/>
  </g>
  <path d="M 86 175 L 177 175" stroke="#DA1B2E" stroke-width="2.6" fill="none" marker-end="url(#ar)"/>
  <g fill="#ffffff" stroke="#B9B3B3" stroke-width="1.5">
    <circle cx="70" cy="112" r="16"/>
    <circle cx="70" cy="175" r="16"/>
    <circle cx="70" cy="238" r="16"/>
    <circle cx="210" cy="175" r="24"/>
    <circle cx="310" cy="175" r="24"/>
  </g>
  <rect x="382" y="153" width="96" height="44" rx="4" fill="#ffffff" stroke="#B9B3B3" stroke-width="1.5"/>
  <text x="63" y="117" font-size="15">x<tspan font-size="9.9" dy="4">1</tspan></text>
  <text x="63" y="180" font-size="15">x<tspan font-size="9.9" dy="4">i</tspan></text>
  <text x="63" y="243" font-size="15">x<tspan font-size="9.9" dy="4">n</tspan></text>
  <text x="210" y="183" text-anchor="middle" font-size="22">&#8721;</text>
  <text x="310" y="182" text-anchor="middle" font-size="19" font-style="italic">f</text>
  <text x="430" y="181" text-anchor="middle" font-size="16" font-weight="bold">L(y<tspan font-size="10.5" dy="4">j</tspan><tspan font-size="16" dy="-4">, t</tspan><tspan font-size="10.5" dy="4">j</tspan><tspan font-size="16" dy="-4">)</tspan></text>
  <text x="125" y="132" font-size="13" fill="#7A7373">w<tspan font-size="8.6" dy="4">1j</tspan></text>
  <text x="125" y="232" font-size="13" fill="#7A7373">w<tspan font-size="8.6" dy="4">nj</tspan></text>
  <text x="130" y="164" font-size="15" fill="#DA1B2E" font-weight="bold">w<tspan font-size="9.9" dy="4">ij</tspan></text>
  <text x="249" y="164" font-size="13.5" fill="#7A7373">z<tspan font-size="8.9" dy="4">j</tspan></text>
  <text x="347" y="164" font-size="13.5" fill="#7A7373">y<tspan font-size="8.9" dy="4">j</tspan></text>
  <path d="M 70 242 L 70 252 L 210 252 L 210 242" stroke="#B9B3B3" stroke-width="1.3" fill="none"/>
  <circle cx="140" cy="272" r="11" fill="#3B3535"/>
  <text x="140" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="140" y="303" text-anchor="middle" font-size="11.5" fill="#7A7373">la suma,</text>
  <text x="140" y="317" text-anchor="middle" font-size="11.5" fill="#7A7373">si cambia el peso</text>
  <path d="M 210 242 L 210 252 L 310 252 L 310 242" stroke="#B9B3B3" stroke-width="1.3" fill="none"/>
  <circle cx="260" cy="272" r="11" fill="#3B3535"/>
  <text x="260" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="260" y="303" text-anchor="middle" font-size="11.5" fill="#7A7373">la salida,</text>
  <text x="260" y="317" text-anchor="middle" font-size="11.5" fill="#7A7373">si cambia la suma</text>
  <path d="M 310 242 L 310 252 L 478 252 L 478 242" stroke="#B9B3B3" stroke-width="1.3" fill="none"/>
  <circle cx="394" cy="272" r="11" fill="#3B3535"/>
  <text x="394" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="394" y="303" text-anchor="middle" font-size="11.5" fill="#7A7373">el error,</text>
  <text x="394" y="317" text-anchor="middle" font-size="11.5" fill="#7A7373">si cambia la salida</text>
  <line x1="496" y1="86" x2="496" y2="330" stroke="#E2DDDD" stroke-width="1.4"/>
  <text x="530.7" y="167" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;L</text>
  <text x="524.0" y="203" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;w<tspan font-size="11.2" dy="5">ij</tspan></text>
  <line x1="520.0" y1="178" x2="563.0" y2="178" stroke="#3B3535" stroke-width="1.5"/>
  <text x="576" y="184" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="18">=</text>
  <text x="596.4" y="167" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;L</text>
  <text x="593.0" y="203" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;y<tspan font-size="11.2" dy="5">j</tspan></text>
  <line x1="589.0" y1="178" x2="625.4" y2="178" stroke="#3B3535" stroke-width="1.5"/>
  <text x="638" y="184" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#183;</text>
  <text x="655.4" y="167" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;y<tspan font-size="11.2" dy="5">j</tspan></text>
  <text x="655.4" y="203" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;z<tspan font-size="11.2" dy="5">j</tspan></text>
  <line x1="651.4" y1="178" x2="687.7" y2="178" stroke="#3B3535" stroke-width="1.5"/>
  <text x="701" y="184" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#183;</text>
  <text x="721.0" y="167" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;z<tspan font-size="11.2" dy="5">j</tspan></text>
  <text x="717.7" y="203" font-family="'DejaVu Sans Mono', monospace" font-size="18">&#8706;w<tspan font-size="11.2" dy="5">ij</tspan></text>
  <line x1="713.7" y1="178" x2="756.7" y2="178" stroke="#3B3535" stroke-width="1.5"/>
  <circle cx="607" cy="134" r="11" fill="#3B3535"/>
  <text x="607" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="670" cy="134" r="11" fill="#3B3535"/>
  <text x="670" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="735" cy="134" r="11" fill="#3B3535"/>
  <text x="735" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="559" y="256" font-family="'DejaVu Sans Mono', monospace" font-size="15">z<tspan font-size="9" dy="4">j</tspan><tspan font-size="15" dy="-4"> = &#8721;</tspan><tspan font-size="9" dy="4">i</tspan><tspan font-size="15" dy="-4"> x</tspan><tspan font-size="9" dy="4">i</tspan><tspan font-size="15" dy="-4"> w</tspan><tspan font-size="9" dy="4">ij</tspan><tspan font-size="15" dy="-4"> + b</tspan><tspan font-size="9" dy="4">j</tspan></text>
  <text x="638" y="278" text-anchor="middle" font-size="11.5" fill="#7A7373">la suma ponderada, antes de la activaci&#243;n</text>
  <text x="638" y="304" text-anchor="middle" font-size="11.5" fill="#7A7373">x es lo que entra a j: el dato si j est&#225; en la</text>
  <text x="638" y="320" text-anchor="middle" font-size="11.5" fill="#7A7373">primera capa, si no la salida de la capa anterior</text>
  <line x1="60" y1="352" x2="710" y2="352" stroke="#E2DDDD" stroke-width="1.3"/>
  <text x="385" y="378" text-anchor="middle" font-size="13" fill="#7A7373">Los tres son valores intermedios: se calculan, se multiplican y se acumulan.</text>
  <text x="385" y="398" text-anchor="middle" font-size="14" font-weight="bold">Ning&#250;n peso se movi&#243; todav&#237;a.</text>
</svg>
