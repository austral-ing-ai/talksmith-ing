<!-- talksmith-ascii-sha256: 55f4ff0f5bd879887e4936d1398d8ae567543619b772ea6fdf0751f08a0a7bca -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 26 851 348" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>Cómo se ve un tensor</title>
  <desc>La forma del tensor la decide la estructura del dato: un eje en tabular y señal, dos en una imagen gris, tres en RGB.</desc>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="130" y="52" font-size="15" text-anchor="middle" font-weight="bold">tabular</text>
  <text x="350" y="52" font-size="15" text-anchor="middle" font-weight="bold">señal 1D</text>
  <text x="570" y="52" font-size="15" text-anchor="middle" font-weight="bold">imagen gris</text>
  <text x="790" y="52" font-size="15" text-anchor="middle" font-weight="bold">imagen RGB</text>
  <text x="130" y="72" text-anchor="middle" fill="#7A7373">un cliente</text>
  <text x="350" y="72" text-anchor="middle" fill="#7A7373">un ECG</text>
  <text x="570" y="72" text-anchor="middle" fill="#7A7373">28 x 28 px</text>
  <text x="790" y="72" text-anchor="middle" fill="#7A7373">224 x 224 px</text>

  <g stroke="#B9B3B3" stroke-width="1.2" fill="#F2EFEF">
    <rect x="40" y="150" width="36" height="26"/><rect x="76" y="150" width="36" height="26"/>
    <rect x="112" y="150" width="36" height="26"/><rect x="148" y="150" width="36" height="26"/>
    <rect x="184" y="150" width="36" height="26"/>
  </g>
  <text x="58" y="168" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">0.4</text>
  <text x="94" y="168" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">1.2</text>
  <text x="130" y="168" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">0.0</text>
  <text x="166" y="168" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">...</text>
  <text x="202" y="168" font-size="11" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">0.7</text>
  <text x="130" y="200" text-anchor="middle" fill="#7A7373">10 floats, uno por variable</text>

  <g stroke="#B9B3B3" stroke-width="0.8" fill="#F2EFEF">
    <rect x="260" y="150" width="180" height="26"/>
  </g>
  <path d="M 262 168 L 275 158 L 288 172 L 301 152 L 314 170 L 327 160 L 340 174 L 353 156 L 366 168 L 379 158 L 392 172 L 405 160 L 418 166 L 438 163" stroke="#3B3535" stroke-width="1.4" fill="none"/>
  <text x="350" y="200" text-anchor="middle" fill="#7A7373">1000 muestras, la posición es el tiempo</text>

  <rect x="510" y="118" width="120" height="90" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2"/>
  <g stroke="#D9D4D4" stroke-width="0.7">
    <path d="M 540 118 L 540 208 M 570 118 L 570 208 M 600 118 L 600 208 M 510 148 L 630 148 M 510 178 L 630 178"/>
  </g>
  <text x="570" y="200" text-anchor="middle" fill="#7A7373"> </text>
  <text x="570" y="230" text-anchor="middle" fill="#7A7373">un número por píxel</text>

  <rect x="700" y="118" width="120" height="90" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.2"/>
  <g stroke="#D9D4D4" stroke-width="0.7">
    <path d="M 730 118 L 730 208 M 760 118 L 760 208 M 790 118 L 790 208 M 700 148 L 820 148 M 700 178 L 820 178"/>
  </g>
  <rect x="730" y="148" width="30" height="30" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/>
  <path d="M 760 148 L 828 128 M 760 178 L 828 196" stroke="#DA1B2E" stroke-width="0.9" fill="none" stroke-dasharray="3 3"/>
  <rect x="828" y="128" width="24" height="22" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.2"/>
  <rect x="828" y="150" width="24" height="22" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1"/>
  <rect x="828" y="172" width="24" height="22" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1"/>
  <text x="840" y="144" font-size="11" text-anchor="middle" font-weight="bold" fill="#DA1B2E">R</text>
  <text x="840" y="166" font-size="11" text-anchor="middle" fill="#7A7373">G</text>
  <text x="840" y="188" font-size="11" text-anchor="middle" fill="#7A7373">B</text>
  <text x="770" y="230" text-anchor="middle" fill="#7A7373">tres números en cada píxel</text>

  <text x="130" y="272" font-size="14" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', monospace">shape (10,)</text>
  <text x="350" y="272" font-size="14" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', monospace">shape (1000,)</text>
  <text x="570" y="272" font-size="14" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', monospace">shape (28, 28)</text>
  <text x="790" y="272" font-size="14" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono', monospace">(224, 224, 3)</text>

  <text x="130" y="294" font-size="12" text-anchor="middle" fill="#7A7373">1 eje</text>
  <text x="350" y="294" font-size="12" text-anchor="middle" fill="#7A7373">1 eje, ordenado</text>
  <text x="570" y="294" font-size="12" text-anchor="middle" fill="#7A7373">2 ejes</text>
  <text x="790" y="294" font-size="12" text-anchor="middle" fill="#7A7373">3 ejes, uno no espacial</text>

  <line x1="40" y1="326" x2="860" y2="326" stroke="#E4E0E0" stroke-width="1.2"/>
  <text x="40" y="356" font-size="14" font-weight="bold">Y siempre, adelante, el lote:</text>
  <text x="250" y="356" font-size="14" font-family="'DejaVu Sans Mono', monospace">(B, 10)</text>
  <text x="360" y="356" font-size="14" font-family="'DejaVu Sans Mono', monospace">(B, 1000)</text>
  <text x="490" y="356" font-size="14" font-family="'DejaVu Sans Mono', monospace">(B, 28, 28)</text>
  <text x="640" y="356" font-size="14" font-family="'DejaVu Sans Mono', monospace">(B, 224, 224, 3)</text>
</svg>
