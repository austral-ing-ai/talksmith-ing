<!-- talksmith-ascii-sha256: d27304a4aafaff710b73a91413eb4de967e2536b33232ced178640f5352926e6 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Una neurona, en una línea</title>
  <desc>Las entradas se combinan en la pre-activación z y una no linealidad f produce la activación a.</desc>
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="240" fill="#ffffff"/>

  <text x="53" y="66" font-size="18">x<tspan font-size="12" dy="5">1</tspan></text>
  <text x="53" y="126" font-size="18">x<tspan font-size="12" dy="5">2</tspan></text>
  <text x="53" y="186" font-size="18">x<tspan font-size="12" dy="5">3</tspan></text>

  <line x1="78" y1="62" x2="196" y2="112" stroke="#B9B3B3" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="78" y1="122" x2="196" y2="120" stroke="#B9B3B3" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="78" y1="182" x2="196" y2="128" stroke="#B9B3B3" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="200" y="90" width="150" height="60" rx="6" fill="#F2EFEF" stroke="#B9B3B3" stroke-width="1.4"/>
  <text x="275" y="116" font-size="19" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">z = W·x + b</text>
  <text x="275" y="138" font-size="13" text-anchor="middle" fill="#7A7373">pre-activación</text>

  <line x1="350" y1="120" x2="418" y2="120" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="422" y="90" width="120" height="60" rx="6" fill="#FBE7EA" stroke="#DA1B2E" stroke-width="1.6"/>
  <text x="482" y="116" font-size="22" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" fill="#DA1B2E">f</text>
  <text x="482" y="138" font-size="13" text-anchor="middle" fill="#7A7373">activación</text>

  <line x1="542" y1="120" x2="606" y2="120" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="632" y="126" font-size="20" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace">a</text>

  <text x="340" y="212" font-size="14" text-anchor="middle" fill="#7A7373">la no linealidad f es lo que hace que apilar capas sirva</text>
</svg>
