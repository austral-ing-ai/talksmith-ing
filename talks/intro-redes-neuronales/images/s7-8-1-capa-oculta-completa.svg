<title>La capa oculta, completa</title>
<desc>Extiende la 4.5: lo único que diferencia a dos unidades de la misma capa es su columna de pesos; las ocho entradas se conectan con las nueve unidades ocultas en 72 conexiones calculadas a la vez con un solo producto x · W, y después viene la activación.</desc>
