.ts-anim-s5-5-1-softmax-ejemplo .ts-anim-s5-5-1-softmax-ejemplo-w6{animation:ts-anim-s5-5-1-softmax-ejemplo-w6 1s linear 3.2s 1 normal both}
@keyframes ts-anim-s5-5-1-softmax-ejemplo-w6{0.00%{transform:translate(392.0px,250.0px)}8.33%{transform:translate(393.9px,250.0px)}16.67%{transform:translate(399.8px,250.0px)}25.00%{transform:translate(410.0px,250.0px)}30.00%{transform:translate(418.0px,250.0px)}31.67%{transform:translate(420.0px,248.9px)}60.00%{transform:translate(420.0px,185.1px)}70.00%{transform:translate(440.0px,185.0px)}78.33%{transform:translate(452.6px,185.0px)}86.67%{transform:translate(461.1px,185.0px)}95.00%{transform:translate(465.3px,185.0px)}100.00%{transform:translate(466.0px,185.0px)}}
