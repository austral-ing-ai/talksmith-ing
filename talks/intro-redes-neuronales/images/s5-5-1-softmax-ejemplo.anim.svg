@keyframes ts-anim-s5-5-1-softmax-ejemplo-w7{0.00%{transform:translate(594.0px,185.0px)}10.00%{transform:translate(596.3px,185.0px)}18.33%{transform:translate(602.0px,185.0px)}26.67%{transform:translate(611.2px,185.0px)}31.67%{transform:translate(618.5px,185.0px)}33.33%{transform:translate(620.0px,183.9px)}65.00%{transform:translate(620.0px,123.9px)}66.67%{transform:translate(620.0px,121.1px)}68.33%{transform:translate(621.5px,120.0px)}78.33%{transform:translate(634.7px,120.0px)}86.67%{transform:translate(641.8px,120.0px)}96.67%{transform:translate(645.8px,120.0px)}100.00%{transform:translate(646.0px,120.0px)}}
.ts-anim-s5-5-1-softmax-ejemplo .ts-anim-s5-5-1-softmax-ejemplo-w8{animation:ts-anim-s5-5-1-softmax-ejemplo-w8 0.9s linear 5.8s 1 normal both}
@keyframes ts-anim-s5-5-1-softmax-ejemplo-w8{0.00%{transform:translate(594.0px,185.0px)}20.00%{transform:translate(598.2px,185.0px)}76.67%{transform:translate(640.2px,185.0px)}96.67%{transform:translate(645.9px,185.0px)}100.00%{transform:translate(646.0px,185.0px)}}
.ts-anim-s5-5-1-softmax-ejemplo .ts-anim-s5-5-1-softmax-ejemplo-w9{animation:ts-anim-s5-5-1-softmax-ejemplo-w9 0.9s linear 5.8s 1 normal both}
@keyframes ts-anim-s5-5-1-softmax-ejemplo-w9{0.00%{transform:translate(594.0px,185.0px)}10.00%{transform:translate(596.3px,185.0px)}18.33%{transform:translate(602.0px,185.0px)}26.67%{transform:translate(611.2px,185.0px)}31.67%{transform:translate(618.5px,185.0px)}33.33%{transform:translate(620.0px,186.1px)}65.00%{transform:translate(620.0px,246.1px)}66.67%{transform:translate(620.0px,248.9px)}68.33%{transform:translate(621.5px,250.0px)}78.33%{transform:translate(634.7px,250.0px)}86.67%{transform:translate(641.8px,250.0px)}96.67%{transform:translate(645.8px,250.0px)}100.00%{transform:translate(646.0px,250.0px)}}
