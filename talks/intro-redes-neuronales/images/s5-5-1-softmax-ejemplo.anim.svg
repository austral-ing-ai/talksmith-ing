<svg class="ts-anim-s5-5-1-softmax-ejemplo" xmlns="http://www.w3.org/2000/svg" viewBox="10 26 890 356" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Softmax: de puntajes a probabilidades</title>
<desc>Softmax convierte los puntajes de gato, perro y caballo en probabilidades: cada exponencial se divide por el total de las tres, aproximadamente 8, y el resultado suma 1.</desc>
<style>/* talksmith-animation */
.ts-anim-s5-5-1-softmax-ejemplo [data-beat]{animation:ts-anim-s5-5-1-softmax-ejemplo-in .6s ease-out both}
