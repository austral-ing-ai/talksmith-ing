.ts-anim-s5-5-1-softmax-ejemplo .tok-exp .ball{animation:ts-anim-s5-5-1-softmax-ejemplo-move .8s ease-in-out 1.5s both}
.ts-anim-s5-5-1-softmax-ejemplo .tok-sum .ball{animation:ts-anim-s5-5-1-softmax-ejemplo-move 1s ease-in-out 3.2s both}
.ts-anim-s5-5-1-softmax-ejemplo .tok-div .ball{animation:ts-anim-s5-5-1-softmax-ejemplo-move .9s ease-in-out 5.8s both}
