<text x="60.5" y="98">x</text><text x="70.6" y="103" font-size="14">1</text>
<text x="208" y="98">w</text><text x="222.3" y="103" font-size="14">1</text>
<text x="208" y="178">w</text><text x="224.5" y="183" font-size="14">2</text>
