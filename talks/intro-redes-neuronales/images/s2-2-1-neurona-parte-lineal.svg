<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 356" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>La neurona: primero, una combinación lineal</title>
<desc>Cada entrada se multiplica por su peso, los productos se suman en un solo nodo, el sesgo desplaza la suma y sale un único número: la parte lineal de la neurona, todavía sin no linealidad.</desc>
