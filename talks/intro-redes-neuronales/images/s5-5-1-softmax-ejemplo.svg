<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 26 890 356" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Softmax: de puntajes a probabilidades</title>
<desc>Softmax convierte los puntajes de gato, perro y caballo en probabilidades: cada exponencial se divide por el total de las tres, aproximadamente 8, y el resultado suma 1.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
</marker>
<marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="10" y="26" width="890" height="356" fill="#ffffff"/>

<g font-size="12" font-weight="bold" fill="#1F1E1E" letter-spacing="1">
<text x="40" y="70">CLASE</text>
<text x="195" y="70" text-anchor="middle">PUNTAJE  a</text>
<text x="760" y="70" text-anchor="middle">PROBABILIDAD</text>
</g>
<text x="338" y="71" font-size="16" font-weight="bold" fill="#1F1E1E">e</text>
<text x="348" y="63" font-size="11" font-weight="bold" fill="#1F1E1E">a</text>

<g font-size="16" font-weight="bold" fill="#1F1E1E">
<text x="40" y="126">gato</text>
<text x="40" y="191">perro</text>
<text x="40" y="256">caballo</text>
</g>

<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="150" y="100" width="90" height="40" rx="6"/>
<rect x="150" y="165" width="90" height="40" rx="6"/>
<rect x="150" y="230" width="90" height="40" rx="6"/>
<rect x="300" y="100" width="90" height="40" rx="6"/>
<rect x="300" y="165" width="90" height="40" rx="6"/>
<rect x="300" y="230" width="90" height="40" rx="6"/>
<rect x="650" y="100" width="220" height="40" rx="6"/>
<rect x="650" y="165" width="220" height="40" rx="6"/>
<rect x="650" y="230" width="220" height="40" rx="6"/>
</g>

<g font-size="16" text-anchor="middle">
<text x="195" y="126">-0,21</text>
<text x="195" y="191">0,47</text>
<text x="195" y="256">1,72</text>
<text x="345" y="126">0,81</text>
<text x="345" y="191">1,60</text>
<text x="345" y="256">5,58</text>
</g>

<g stroke="#3B3535" stroke-width="1.5" fill="none" marker-end="url(#ah)">
<line x1="240" y1="120" x2="300" y2="120"/>
<line x1="240" y1="185" x2="300" y2="185"/>
<line x1="240" y1="250" x2="300" y2="250"/>
</g>

<g stroke="#3B3535" stroke-width="1.5" fill="none">
<line x1="390" y1="120" x2="420" y2="120"/>
<line x1="390" y1="185" x2="420" y2="185"/>
<line x1="390" y1="250" x2="420" y2="250"/>
<line x1="420" y1="120" x2="420" y2="250"/>
<line x1="420" y1="185" x2="470" y2="185" marker-end="url(#ah)"/>
</g>

<rect x="470" y="150" width="120" height="70" rx="10" fill="#DA1B2E"/>
<path d="M514,172 L490,172 L504,185 L490,198 L514,198" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linejoin="miter"/>
<path d="M524,181 q5.5,-5 11,0 t11,0 M524,190 q5.5,-5 11,0 t11,0" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<text x="556" y="195" font-size="26" font-weight="bold" fill="#ffffff">8</text>
<text x="530" y="242" font-size="12" text-anchor="middle">total de las tres</text>

<g stroke="#3B3535" stroke-width="1.5" fill="none">
<line x1="590" y1="185" x2="620" y2="185"/>
<line x1="620" y1="120" x2="620" y2="250"/>
<line x1="620" y1="120" x2="650" y2="120" marker-end="url(#ah)"/>
<line x1="620" y1="185" x2="650" y2="185" marker-end="url(#ah)"/>
<line x1="620" y1="250" x2="650" y2="250" marker-end="url(#ah)"/>
</g>

<g font-size="16" text-anchor="end">
<text x="779" y="126">0,81 / 8  =</text>
<text x="779" y="191">1,60 / 8  =</text>
<text x="779" y="256">5,58 / 8  =</text>
</g>
<g font-size="16" font-weight="bold" fill="#1F1E1E">
<text x="790" y="126">0,1</text>
<text x="790" y="191">0,2</text>
<text x="790" y="256">0,7</text>
</g>

<line x1="650" y1="288" x2="870" y2="288" stroke="#3B3535" stroke-width="1.5"/>
<text x="779" y="312" font-size="16" text-anchor="end">suman</text>
<text x="790" y="312" font-size="16" font-weight="bold" fill="#1F1E1E">1</text>

<text x="455" y="354" font-size="14" font-style="italic" text-anchor="middle">Softmax usa las tres salidas a la vez: cada exponencial se divide por el total.</text>
</svg>
