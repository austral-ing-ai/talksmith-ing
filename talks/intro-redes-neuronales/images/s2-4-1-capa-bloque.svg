</marker>
</defs>
<rect x="0" y="0" width="1058" height="263" fill="#ffffff"/>
<g transform="translate(-16,-32)">
<rect x="130" y="70" width="560" height="200" rx="10" fill="none" stroke="#DA1B2E" stroke-width="2.5"/>
