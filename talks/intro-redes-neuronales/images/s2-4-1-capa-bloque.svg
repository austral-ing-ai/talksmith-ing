<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1058 263" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>La capa: el bloque que se repite</title>
<desc>Esta es la diapositiva más importante del capítulo y vuelve en el cierre como la segunda idea.</desc>
<defs>
