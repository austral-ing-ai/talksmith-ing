<svg class="ts-anim-s5-3-1-colapso-lineal" xmlns="http://www.w3.org/2000/svg" viewBox="22 -5 857 433" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Sin activación, la red colapsa</title>
<desc>Sin activación, dos transformaciones lineales encadenadas equivalen a una sola: W2(W1 x) = (W2 W1) x = W* x.</desc>
<style>/* talksmith-animation */
.ts-anim-s5-3-1-colapso-lineal [data-beat]{animation:ts-anim-s5-3-1-colapso-lineal-in .5s ease-out both}
.ts-anim-s5-3-1-colapso-lineal [data-beat="0"]{animation-delay:.2s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="1"]{animation-delay:.2s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="2"]{animation-delay:2.5s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="3"]{animation-delay:2.5s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="4"]{animation-delay:4.5s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="5"]{animation-delay:4.7s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="6"]{animation-delay:7.3s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="7"]{animation-delay:8.3s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="8"]{animation-delay:8.3s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="9"]{animation-delay:9.7s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="10"]{animation-delay:11.9s}
.ts-anim-s5-3-1-colapso-lineal [data-beat="11"]{animation-delay:12.3s}
.ts-anim-s5-3-1-colapso-lineal .tok1{animation:ts-anim-s5-3-1-colapso-lineal-path1 1.3s linear 1s 1 normal both}
.ts-anim-s5-3-1-colapso-lineal .tok2{animation:ts-anim-s5-3-1-colapso-lineal-path2 1.3s linear 3.1s 1 normal both}
.ts-anim-s5-3-1-colapso-lineal .tok3{animation:ts-anim-s5-3-1-colapso-lineal-path3 1.9s linear 10.1s 1 normal both}
.ts-anim-s5-3-1-colapso-lineal .ghost1{animation:ts-anim-s5-3-1-colapso-lineal-join1 2.6s ease-in-out 5.2s both}
.ts-anim-s5-3-1-colapso-lineal .ghost2{animation:ts-anim-s5-3-1-colapso-lineal-join2 2.6s ease-in-out 5.2s both}
.ts-anim-s5-3-1-colapso-lineal .wstar{transform-box:fill-box;transform-origin:center;animation:ts-anim-s5-3-1-colapso-lineal-pop .8s ease-out 8.9s both}
.ts-anim-s5-3-1-colapso-lineal .hidden-h{animation:ts-anim-s5-3-1-colapso-lineal-fade .6s ease-in-out 8.9s both,ts-anim-s5-3-1-colapso-lineal-back .6s ease-in-out 12.3s forwards}
@keyframes ts-anim-s5-3-1-colapso-lineal-in{from{opacity:0}}
@keyframes ts-anim-s5-3-1-colapso-lineal-join1{0%{transform:translate(0px,0px);opacity:0}15%{transform:translate(0px,0px);opacity:1}25%{transform:translate(0px,0px);opacity:1;animation-timing-function:ease-in-out}85%{transform:translate(164px,104px);opacity:1}100%{transform:translate(164px,104px);opacity:0}}
@keyframes ts-anim-s5-3-1-colapso-lineal-join2{0%{transform:translate(0px,0px);opacity:0}15%{transform:translate(0px,0px);opacity:1}25%{transform:translate(0px,0px);opacity:1;animation-timing-function:ease-in-out}85%{transform:translate(-164px,104px);opacity:1}100%{transform:translate(-164px,104px);opacity:0}}
@keyframes ts-anim-s5-3-1-colapso-lineal-pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes ts-anim-s5-3-1-colapso-lineal-fade{from{opacity:1}to{opacity:.15}}
@keyframes ts-anim-s5-3-1-colapso-lineal-back{from{opacity:.15}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ts-anim-s5-3-1-colapso-lineal *{animation:none}}
@keyframes ts-anim-s5-3-1-colapso-lineal-path1{0.00%{transform:translate(92.0px,100.0px);opacity:0}6.67%{transform:translate(114.3px,100.0px);opacity:0.833333}8.33%{transform:translate(119.8px,100.0px);opacity:1}90.00%{transform:translate(392.6px,100.0px);opacity:1}100.00%{transform:translate(426.0px,100.0px);opacity:0}}
@keyframes ts-anim-s5-3-1-colapso-lineal-path2{0.00%{transform:translate(474.0px,100.0px);opacity:0}6.67%{transform:translate(496.1px,100.0px);opacity:0.833333}8.33%{transform:translate(501.7px,100.0px);opacity:1}90.00%{transform:translate(772.8px,100.0px);opacity:1}100.00%{transform:translate(806.0px,100.0px);opacity:0}}
@keyframes ts-anim-s5-3-1-colapso-lineal-path3{0.00%{transform:translate(92.0px,325.0px);opacity:0}6.67%{transform:translate(139.6px,325.0px);opacity:0.833333}8.33%{transform:translate(151.5px,325.0px);opacity:1}90.00%{transform:translate(734.6px,325.0px);opacity:1}100.00%{transform:translate(806.0px,325.0px);opacity:0}}
</style>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="al" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9A918D"/></marker>
</defs>
<rect x="-100" y="-100" width="1200" height="700" fill="#ffffff"/>

<!-- arrows first, so the tokens ride over the lines but under the boxes that swallow them -->
<g stroke="#3B3535" stroke-width="2" marker-end="url(#ah)">
<line data-beat="1" x1="92" y1="100" x2="180" y2="100"/>
<line data-beat="2" x1="340" y1="100" x2="426" y2="100"/>
<line data-beat="3" x1="474" y1="100" x2="560" y2="100"/>
<line data-beat="4" x1="720" y1="100" x2="806" y2="100"/>
</g>
<g data-beat="5" stroke="#9A918D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#al)">
<line x1="260" y1="130" x2="372" y2="175"/>
<line x1="640" y1="130" x2="528" y2="175"/>
</g>
<line data-beat="7" x1="450" y1="231" x2="450" y2="295" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<g data-beat="9" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)">
<line x1="92" y1="325" x2="360" y2="325"/>
<line x1="540" y1="325" x2="806" y2="325"/>
</g>

<!-- narration: the signal travelling each route -->
<g class="tok1" opacity="0"><circle r="8" fill="#DA1B2E" stroke="#ffffff" stroke-width="2"/></g>
<g class="tok2" opacity="0"><circle r="8" fill="#DA1B2E" stroke="#ffffff" stroke-width="2"/></g>
<g class="tok3" opacity="0"><circle r="8" fill="#DA1B2E" stroke="#ffffff" stroke-width="2"/></g>

<g data-beat="0">
<text x="52" y="36" font-size="15" font-weight="bold" fill="#1F1E1E" letter-spacing="1">ANTES</text>
<text x="118" y="36" font-size="15">dos capas lineales, sin activación</text>
<text x="70" y="108" font-size="22" font-style="italic" text-anchor="middle" fill="#1F1E1E">x</text>
<text x="70" y="132" font-size="13" text-anchor="middle">(1 x 8)</text>
</g>

<g data-beat="1">
<rect x="180" y="70" width="160" height="60" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="246" y="97" font-size="20" font-weight="bold" fill="#1F1E1E">W</text>
<text x="265.5" y="102" font-size="14" font-weight="bold" fill="#1F1E1E">1</text>
<text x="260" y="119" font-size="13" text-anchor="middle">8 x 9</text>
</g>

<g class="hidden-h"><g data-beat="2">
<text x="450" y="108" font-size="22" font-style="italic" text-anchor="middle" fill="#1F1E1E">h</text>
<text x="450" y="132" font-size="13" text-anchor="middle">(1 x 9)</text>
<text x="450" y="74" font-size="12" font-style="italic" text-anchor="middle" fill="#7A706C">capa oculta</text>
</g></g>

<g data-beat="3">
<rect x="560" y="70" width="160" height="60" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="626" y="97" font-size="20" font-weight="bold" fill="#1F1E1E">W</text>
<text x="645.5" y="102" font-size="14" font-weight="bold" fill="#1F1E1E">2</text>
<text x="640" y="119" font-size="13" text-anchor="middle">9 x 4</text>
</g>

<g data-beat="4">
<text x="830" y="108" font-size="22" font-style="italic" text-anchor="middle" fill="#1F1E1E">y</text>
<text x="830" y="132" font-size="13" text-anchor="middle">(1 x 4)</text>
</g>

<rect data-beat="5" x="330" y="175" width="240" height="56" rx="6" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5"/>

<g data-beat="6">
<g font-size="20" font-weight="bold" fill="#1F1E1E">
<text x="410" y="201">W</text>
<text x="462" y="201">W</text>
</g>
<g font-size="14" font-weight="bold" fill="#1F1E1E">
<text x="429.5" y="206">1</text>
<text x="481.5" y="206">2</text>
</g>
<circle cx="450" cy="194" r="2.6" fill="#1F1E1E"/>
<text x="440" y="222" font-size="13" text-anchor="end">(8 x 9)</text>
<circle cx="450" cy="218" r="1.8" fill="#3B3535"/>
<text x="460" y="222" font-size="13">(9 x 4)</text>
</g>

<g data-beat="8">
<text x="52" y="272" font-size="15" font-weight="bold" fill="#1F1E1E" letter-spacing="1">DESPUÉS</text>
<text x="138" y="272" font-size="15">una sola capa</text>
<text x="70" y="333" font-size="22" font-style="italic" text-anchor="middle" fill="#1F1E1E">x</text>
<text x="70" y="357" font-size="13" text-anchor="middle">(1 x 8)</text>
</g>

<g data-beat="9">
<text x="830" y="333" font-size="22" font-style="italic" text-anchor="middle" fill="#1F1E1E">y</text>
<text x="830" y="357" font-size="13" text-anchor="middle">(1 x 4)</text>
</g>

<text data-beat="10" x="673" y="315" font-size="12" font-style="italic" text-anchor="middle" fill="#7A706C">sin capa oculta</text>

<g class="wstar">
<rect x="360" y="295" width="180" height="60" rx="6" fill="#DA1B2E"/>
<text x="450" y="322" font-size="22" font-weight="bold" text-anchor="middle" fill="#FFFFFF">W*</text>
<text x="450" y="344" font-size="13" text-anchor="middle" fill="#FFFFFF">8 x 4</text>
</g>

<text data-beat="11" x="450" y="395" font-size="14" text-anchor="middle">Diez capas lineales tienen el mismo poder expresivo que una.</text>

<!-- narration: copies of W1 and W2 travelling into the product box -->
<g class="ghost1" opacity="0" font-weight="bold" fill="#DA1B2E">
<text x="246" y="97" font-size="20">W</text>
<text x="265.5" y="102" font-size="14">1</text>
</g>
<g class="ghost2" opacity="0" font-weight="bold" fill="#DA1B2E">
<text x="626" y="97" font-size="20">W</text>
<text x="645.5" y="102" font-size="14">2</text>
</g>
</svg>
