<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 569 478" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>El ciclo de ajuste</title>
<desc>Extiende la 3.3, el ciclo externo contra el interno: elegir la configuración, entrenar, medir el error en validación y volver a elegir hasta que el error deja de mejorar.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#DA1B2E"/></marker>
</defs>
<rect width="569" height="478" fill="#ffffff"/>
<g stroke="#D8D2CE" stroke-width="1.5" fill="#F2EEEE">
<rect x="24" y="24" width="450" height="80" rx="8"/>
<rect x="24" y="134" width="260" height="50" rx="8"/>
<rect x="24" y="214" width="260" height="50" rx="8"/>
<rect x="24" y="294" width="260" height="50" rx="8"/>
<rect x="24" y="404" width="260" height="50" rx="8" stroke="#3B3535"/>
</g>
<g text-anchor="middle" font-size="18">
<text x="249" y="57" font-size="20" font-weight="bold" fill="#1F1E1E">Configuración</text>
<text x="249" y="86" font-size="15">ancho · profundidad · tasa de aprendizaje (η)</text>
<text x="154" y="165">Entrenamiento</text>
<text x="154" y="245">Parámetros del modelo</text>
<text x="154" y="325">Error de validación</text>
<text x="154" y="435" font-weight="bold" fill="#1F1E1E">Mejor configuración</text>
</g>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="154" y1="104" x2="154" y2="134"/>
