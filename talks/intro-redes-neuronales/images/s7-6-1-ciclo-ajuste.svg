<line x1="154" y1="264" x2="154" y2="294"/>
<line x1="154" y1="344" x2="154" y2="404"/>
</g>
<text x="166" y="379" font-size="14" font-style="italic">cuando el error deja de mejorar</text>
<path d="M284,319 H420 V104" stroke="#DA1B2E" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ahr)"/>
