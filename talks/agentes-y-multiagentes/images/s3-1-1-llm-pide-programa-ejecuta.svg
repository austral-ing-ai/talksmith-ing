<svg class="ts-anim-s3-1-1-llm-pide-programa-ejecuta" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>Qué es una tool</title>
<desc>La aclaración que más ordena la sección: el LLM no ejecuta nada.</desc>
<style>/* talksmith-animation */
.ts-anim-s3-1-1-llm-pide-programa-ejecuta [data-beat]{animation:ts-beat-in 0.6s ease-out backwards}
.ts-anim-s3-1-1-llm-pide-programa-ejecuta [data-beat-effect=pulse]{animation-name:ts-beat-pulse;animation-duration:0.8s;animation-fill-mode:none;transform-box:fill-box;transform-origin:center}
.ts-anim-s3-1-1-llm-pide-programa-ejecuta [data-beat="1"]{animation-delay:0.50s}
.ts-anim-s3-1-1-llm-pide-programa-ejecuta [data-beat="2"]{animation-delay:1.60s}
.ts-anim-s3-1-1-llm-pide-programa-ejecuta [data-beat="3"]{animation-delay:2.70s}
.ts-anim-s3-1-1-llm-pide-programa-ejecuta [data-beat="4"]{animation-delay:3.80s}
@keyframes ts-beat-in{from{opacity:0}to{opacity:1}}
@keyframes ts-beat-pulse{0%,100%{transform:none}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ts-anim-s3-1-1-llm-pide-programa-ejecuta [data-beat]{animation:none}}
</style>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="420" height="466" fill="#FFFFFF"/>
<rect x="120" y="110" width="180" height="60" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="210" y="137" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1E1E">LLM</text>
<text x="210" y="158" text-anchor="middle">(decide)</text>
<rect x="120" y="290" width="180" height="60" rx="8" fill="#DA1B2E"/>
<text x="210" y="316" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">programa</text>
<text x="210" y="337" text-anchor="middle" fill="#FFFFFF">(ejecuta)</text>
<g data-beat="1">
<rect x="20" y="20" width="380" height="52" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="210" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">contexto</text>
<text x="210" y="62" text-anchor="middle">instrucciones + descripción de cada tool</text>
<line x1="210" y1="72" x2="210" y2="110" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
</g>
<g data-beat="2">
<line x1="160" y1="170" x2="160" y2="290" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="148" y="210" text-anchor="end" font-weight="bold" fill="#1F1E1E">1. pide la tool</text>
<text x="148" y="230" text-anchor="end">con nombre y</text>
<text x="148" y="250" text-anchor="end">argumentos</text>
</g>
<g data-beat="3">
<line x1="210" y1="350" x2="210" y2="390" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="390" width="340" height="56" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="210" y="414" text-anchor="middle" font-weight="bold" fill="#1F1E1E">2. API, base de datos, búsqueda</text>
<text x="210" y="435" text-anchor="middle">(el actuador)</text>
</g>
<g data-beat="4">
<line x1="260" y1="290" x2="260" y2="170" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="272" y="210" font-weight="bold" fill="#1F1E1E">3. el resultado</text>
<text x="272" y="230">vuelve al</text>
<text x="272" y="250">contexto</text>
</g>
</svg>
