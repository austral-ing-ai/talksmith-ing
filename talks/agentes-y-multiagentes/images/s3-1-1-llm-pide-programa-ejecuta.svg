<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Qué es una tool</title>
<desc>La aclaración que más ordena la sección: el LLM no ejecuta nada.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="400" height="494" fill="#ffffff"/>
<rect x="30" y="24" width="340" height="56" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="200" y="47" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">contexto</text>
<text x="200" y="69" text-anchor="middle">instrucciones + descripción de cada tool</text>
<line x1="200" y1="80" x2="200" y2="116" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="100" y="116" width="200" height="56" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="200" y="151" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1E1E">LLM</text>
<line x1="150" y1="172" x2="150" y2="288" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="250" y1="288" x2="250" y2="172" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="138" y="212" text-anchor="end" font-weight="bold" fill="#1F1E1E">1. pide la tool</text>
<text x="138" y="231" text-anchor="end">con nombre y</text>
<text x="138" y="250" text-anchor="end">argumentos</text>
<text x="262" y="212" font-weight="bold" fill="#1F1E1E">3. el resultado</text>
<text x="262" y="231">vuelve al</text>
<text x="262" y="250">contexto</text>
<rect x="100" y="288" width="200" height="64" rx="8" fill="#DA1B2E"/>
<text x="200" y="316" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">programa</text>
<text x="200" y="338" text-anchor="middle" font-size="15" fill="#FFFFFF">(ejecuta)</text>
<line x1="200" y1="352" x2="200" y2="410" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="188" y="386" text-anchor="end" font-weight="bold" fill="#1F1E1E">2. ejecuta la tool</text>
<rect x="70" y="410" width="260" height="60" rx="8" fill="#ffffff" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="200" y="435" text-anchor="middle">API, base de datos, búsqueda</text>
<text x="200" y="456" text-anchor="middle" font-style="italic">(el actuador)</text>
</svg>
