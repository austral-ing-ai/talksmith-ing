<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Pizarra: publicar y leer</title>
<desc>En la red de la lámina anterior, el agente activo le pasa el control a otro; en la pizarra cada agente publica en un espacio común y lee de ahí lo que pide su rol.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="24" y="24" width="140" height="56" rx="10"/>
<rect x="188" y="24" width="140" height="56" rx="10"/>
<rect x="352" y="24" width="140" height="56" rx="10"/>
<rect x="516" y="24" width="140" height="56" rx="10"/>
</g>
<g text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">
<text x="94" y="58">Producto</text>
<text x="258" y="58">Arquitecto</text>
<text x="422" y="58">Ingeniero</text>
<text x="586" y="58">QA</text>
</g>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="112" y1="80" x2="112" y2="154"/>
<line x1="276" y1="80" x2="276" y2="154"/>
<line x1="440" y1="80" x2="440" y2="154"/>
<line x1="604" y1="80" x2="604" y2="154"/>
</g>
<g stroke="#3B3535" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#ah)">
<path d="M140,154 V117 H240 V80"/>
<path d="M304,154 V117 H404 V80"/>
<path d="M468,154 V117 H568 V80"/>
</g>
<g text-anchor="middle" font-size="13" font-style="italic">
<text x="190" y="109">lee PRD</text>
<text x="354" y="109">lee diseño</text>
<text x="518" y="109">lee código</text>
</g>
<rect x="24" y="154" width="632" height="110" rx="10" fill="#DA1B2E"/>
<text x="340" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">PIZARRA</text>
<g fill="#FFFFFF">
<rect x="39" y="206" width="110" height="38" rx="6"/>
<rect x="203" y="206" width="110" height="38" rx="6"/>
<rect x="367" y="206" width="110" height="38" rx="6"/>
<rect x="531" y="206" width="110" height="38" rx="6"/>
</g>
<g text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">
<text x="94" y="230">PRD</text>
<text x="258" y="230">diseño</text>
<text x="422" y="230">código</text>
<text x="586" y="230">tests</text>
</g>
<line x1="167" y1="296" x2="207" y2="296" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="215" y="301">publica</text>
<line x1="310" y1="296" x2="350" y2="296" stroke="#3B3535" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="358" y="301">lee lo que pide su rol</text>
<text x="340" y="332" text-anchor="middle" font-size="15" font-style="italic">cada agente actúa cuando ya está publicado lo que necesita</text>
</svg>
