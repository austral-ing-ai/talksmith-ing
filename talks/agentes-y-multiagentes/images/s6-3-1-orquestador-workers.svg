<svg class="ts-anim-s6-3-1-orquestador-workers" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Multiagente: orquestador y workers</title>
<desc>El orquestador parte la tarea en tiempo de ejecución, cada worker trabaja en su pedazo con su propio loop, y el mismo orquestador sintetiza los resultados.</desc>
<style>/* talksmith-animation */
.ts-anim-s6-3-1-orquestador-workers [data-beat]{animation:ts-beat-in 0.6s ease-out backwards}
.ts-anim-s6-3-1-orquestador-workers [data-beat-effect=pulse]{animation-name:ts-beat-pulse;animation-duration:0.8s;animation-fill-mode:none;transform-box:fill-box;transform-origin:center}
.ts-anim-s6-3-1-orquestador-workers [data-beat="1"]{animation-delay:0.50s}
.ts-anim-s6-3-1-orquestador-workers [data-beat="2"]{animation-delay:1.60s}
.ts-anim-s6-3-1-orquestador-workers [data-beat="3"]{animation-delay:2.70s}
.ts-anim-s6-3-1-orquestador-workers [data-beat="4"]{animation-delay:3.80s}
@keyframes ts-beat-in{from{opacity:0}to{opacity:1}}
@keyframes ts-beat-pulse{0%,100%{transform:none}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ts-anim-s6-3-1-orquestador-workers [data-beat]{animation:none}}
</style>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="600" height="540" fill="#ffffff"/>
<g transform="translate(-65,0)">
<rect x="280" y="20" width="120" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="41" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Pedido</text>
<g data-beat="1">
<line x1="340" y1="52" x2="340" y2="90" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="210" y="90" width="260" height="74" rx="10" fill="#DA1B2E"/>
<text x="340" y="123" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Orquestador (LLM)</text>
<text x="340" y="147" text-anchor="middle" fill="#FFFFFF">decide subtareas</text>
</g>
<g data-beat="2">
<line x1="270" y1="164" x2="160" y2="240" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="340" y1="164" x2="340" y2="240" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="410" y1="164" x2="520" y2="240" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="196" y="200" text-anchor="end" font-size="13" font-style="italic">delega</text>
<rect x="85" y="240" width="150" height="48" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="160" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Worker 1</text>
<rect x="265" y="240" width="150" height="48" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Worker 2</text>
<rect x="445" y="240" width="150" height="48" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="520" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Worker 3</text>
</g>
<g data-beat="3">
<line x1="160" y1="288" x2="270" y2="376" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="340" y1="288" x2="340" y2="376" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="520" y1="288" x2="410" y2="376" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="196" y="352" text-anchor="end" font-size="13" font-style="italic">resultados</text>
<rect x="210" y="376" width="260" height="74" rx="10" fill="#DA1B2E"/>
<text x="340" y="409" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Orquestador</text>
<text x="340" y="433" text-anchor="middle" fill="#FFFFFF">sintetiza</text>
<path d="M470,127 H622 V413 H470" fill="none" stroke="#DA1B2E" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="643" y="270" text-anchor="middle" font-size="13" font-style="italic" fill="#DA1B2E" transform="rotate(-90 643 270)">mismo agente</text>
</g>
<g data-beat="4">
<line x1="340" y1="450" x2="340" y2="488" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="280" y="488" width="120" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="509" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Respuesta</text>
</g>
</g>
</svg>
