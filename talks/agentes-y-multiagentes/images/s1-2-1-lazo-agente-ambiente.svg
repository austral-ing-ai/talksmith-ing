<svg class="ts-anim-s1-2-1-lazo-agente-ambiente" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" text-anchor="middle">
<title>La definición de Russell &amp; Norvig</title>
<desc>El lazo agente-ambiente: el ambiente llega como percepciones a los sensores, el agente decide qué acción tomar y los actuadores devuelven acciones al ambiente.</desc>
<style>/* talksmith-animation */
.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat]{animation:ts-beat-in 0.6s ease-out backwards}
.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat-effect=pulse]{animation-name:ts-beat-pulse;animation-duration:0.8s;animation-fill-mode:none;transform-box:fill-box;transform-origin:center}
.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat="1"]{animation-delay:0.50s}
.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat="2"]{animation-delay:1.60s}
.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat="3"]{animation-delay:2.70s}
.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat="4"]{animation-delay:3.80s}
.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat="5"]{animation-delay:4.90s}
@keyframes ts-beat-in{from{opacity:0}to{opacity:1}}
@keyframes ts-beat-pulse{0%,100%{transform:none}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ts-anim-s1-2-1-lazo-agente-ambiente [data-beat]{animation:none}}
</style>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>
<g data-beat="1">
<rect x="20" y="20" width="640" height="70" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="52" font-size="22" font-weight="bold" fill="#1F1E1E">AMBIENTE</text>
<text x="340" y="76" font-size="15">todo lo que no es el agente</text>
</g>
<g data-beat="2">
<line x1="120" y1="90" x2="120" y2="170" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="132" y="135" font-size="16" text-anchor="start">percepciones</text>
<rect x="20" y="170" width="200" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="120" y="197" font-size="19" font-weight="bold" fill="#1F1E1E">Sensores</text>
<text x="120" y="219" font-size="14">interfaz</text>
</g>
<g data-beat="3">
<line x1="120" y1="230" x2="120" y2="300" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="300" width="640" height="80" rx="8" fill="#DA1B2E"/>
<text x="340" y="333" font-size="22" font-weight="bold" fill="#FFFFFF">AGENTE</text>
<text x="340" y="361" font-size="17" fill="#FFFFFF">decide qué acción tomar a partir de lo que percibió</text>
</g>
<g data-beat="4">
<line x1="560" y1="300" x2="560" y2="230" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="170" width="200" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="560" y="197" font-size="19" font-weight="bold" fill="#1F1E1E">Actuadores</text>
<text x="560" y="219" font-size="14">interfaz</text>
</g>
<g data-beat="5">
<line x1="560" y1="170" x2="560" y2="90" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="548" y="135" font-size="16" text-anchor="end">acciones</text>
</g>
</svg>
