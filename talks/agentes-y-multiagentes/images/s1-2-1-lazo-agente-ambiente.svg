<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>La definición de Russell &amp; Norvig</title>
<desc>Leer la cita completa: el lazo agente-ambiente, donde la única caja que decide es la del agente.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="372" fill="#ffffff"/>
<rect x="20" y="20" width="640" height="72" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1E1E" letter-spacing="1">AMBIENTE</text>
<text x="340" y="75" text-anchor="middle" font-size="13">todo lo que no es el agente</text>
<rect x="80" y="152" width="180" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="170" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">Sensores</text>
<text x="170" y="199" text-anchor="middle" font-size="12">interfaz de entrada</text>
<rect x="420" y="152" width="180" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="510" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">Actuadores</text>
<text x="510" y="199" text-anchor="middle" font-size="12">interfaz de salida</text>
<rect x="20" y="272" width="640" height="80" rx="8" fill="#DA1B2E"/>
<text x="340" y="305" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF" letter-spacing="1">AGENTE</text>
<text x="340" y="333" text-anchor="middle" font-size="15" fill="#FFFFFF">decide qué acción tomar a partir de lo que percibió</text>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="170" y1="92" x2="170" y2="152"/>
<line x1="170" y1="212" x2="170" y2="272"/>
<line x1="510" y1="272" x2="510" y2="212"/>
<line x1="510" y1="152" x2="510" y2="92"/>
</g>
<text x="182" y="127" font-size="15" font-style="italic">percepciones</text>
<text x="522" y="127" font-size="15" font-style="italic">acciones</text>
</svg>
