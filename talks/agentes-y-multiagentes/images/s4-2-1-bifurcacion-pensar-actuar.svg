<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>ReAct: pensar también es una acción</title>
<desc>La idea entera de ReAct entra en esta lámina: el modelo puede hacer algo en el mundo o escribir un razonamiento, y el razonamiento queda en el contexto para la próxima decisión.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="14" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="680" height="424" fill="#ffffff"/>
<rect x="230" y="20" width="220" height="64" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="302.0" y="52" font-size="21" fill="#1F1E1E" xml:space="preserve"><tspan font-family="'Arial Unicode MS', sans-serif">π</tspan><tspan>(â</tspan><tspan dy="6" font-size="14">t</tspan><tspan dy="-6"> | c</tspan><tspan dy="6" font-size="14">t</tspan><tspan dy="-6">)</tspan></text>
<text x="340" y="73" text-anchor="middle" font-size="12">el LLM elige la próxima acción</text>
<path d="M340,84 V106 H160 V140" fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<path d="M340,106 H520 V140" fill="none" stroke="#DA1B2E" stroke-width="3" marker-end="url(#ahr)"/>
<rect x="20" y="140" width="280" height="66" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="133.5" y="170" font-size="20" font-weight="bold" fill="#1F1E1E" xml:space="preserve"><tspan>â</tspan><tspan dy="6" font-size="14">t</tspan><tspan dy="-6"> </tspan><tspan font-family="'Arial Unicode MS', sans-serif" font-weight="normal">∈</tspan><tspan> A</tspan></text>
<text x="160" y="193" text-anchor="middle" font-size="14">acción</text>
<rect x="380" y="140" width="280" height="66" rx="10" fill="#DA1B2E"/>
<text x="494.5" y="170" font-size="20" font-weight="bold" fill="#FFFFFF" xml:space="preserve"><tspan>â</tspan><tspan dy="6" font-size="14">t</tspan><tspan dy="-6"> </tspan><tspan font-family="'Arial Unicode MS', sans-serif" font-weight="normal">∈</tspan><tspan> L</tspan></text>
<text x="520" y="193" text-anchor="middle" font-size="14" fill="#FFFFFF">pensamiento</text>
<line x1="160" y1="206" x2="160" y2="240" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="240" width="280" height="64" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="160" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E" letter-spacing="1">AMBIENTE</text>
<text x="160" y="290" text-anchor="middle" font-size="13" font-family="'Andale Mono', monospace">search[entity]</text>
<line x1="160" y1="304" x2="160" y2="338" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="520" y1="206" x2="520" y2="338" stroke="#DA1B2E" stroke-width="3" marker-end="url(#ahr)"/>
<text x="534" y="268" font-size="13" font-weight="bold" fill="#DA1B2E">no pasa</text>
<text x="534" y="285" font-size="13" font-weight="bold" fill="#DA1B2E">por el ambiente</text>
<rect x="20" y="338" width="280" height="66" rx="10" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="160" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">hay observación</text>
<text x="101.0" y="387" font-size="15" xml:space="preserve"><tspan>c</tspan><tspan dy="4" font-size="10">t+1</tspan><tspan dy="-4"> suma a</tspan><tspan dy="4" font-size="10">t</tspan><tspan dy="-4"> y o</tspan><tspan dy="4" font-size="10">t+1</tspan></text>
<rect x="380" y="338" width="280" height="66" rx="10" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2"/>
<text x="520" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">no hay observación</text>
<text x="480.0" y="387" font-size="15" xml:space="preserve"><tspan>c</tspan><tspan dy="4" font-size="10">t+1</tspan><tspan dy="-4"> = (c</tspan><tspan dy="4" font-size="10">t</tspan><tspan dy="-4">, â</tspan><tspan dy="4" font-size="10">t</tspan><tspan dy="-4">)</tspan></text>
</svg>
