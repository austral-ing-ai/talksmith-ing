<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 376" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>Supervisor o red adaptativa</title>
<desc>Es la misma pregunta de los patrones de LangChain vista desde la topología: un supervisor central frente a una red donde cada agente pasa el control.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="715" height="376" fill="#ffffff"/>
<line x1="342" y1="30" x2="342" y2="346" stroke="#D8D2CE" stroke-width="1"/>
<g text-anchor="middle">
<text x="160" y="43" font-size="18" font-weight="bold" fill="#1F1E1E" letter-spacing="1">SUPERVISOR</text>
<text x="540" y="43" font-size="18" font-weight="bold" fill="#1F1E1E" letter-spacing="1">RED ADAPTATIVA</text>

<rect x="100" y="66" width="120" height="34" rx="17" fill="#ffffff" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="160" y="88">Usuario</text>
<line x1="160" y1="100" x2="160" y2="140" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="80" y="140" width="160" height="44" rx="6" fill="#DA1B2E"/>
<text x="160" y="167" font-weight="bold" fill="#ffffff">Orquestador</text>
<line x1="120" y1="184" x2="70" y2="244" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="160" y1="184" x2="160" y2="244" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="200" y1="184" x2="250" y2="244" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="244" width="80" height="44" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="70" y="271">Agente A</text>
<rect x="120" y="244" width="80" height="44" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="160" y="271">Agente B</text>
<rect x="210" y="244" width="80" height="44" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="250" y="271">Agente C</text>
<text x="160" y="332" font-style="italic">todo pasa por el centro</text>

<rect x="480" y="66" width="120" height="34" rx="17" fill="#ffffff" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="540" y="88">Usuario</text>
<line x1="540" y1="100" x2="540" y2="140" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="460" y="140" width="160" height="44" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="540" y="167">Agente A</text>
<line x1="500" y1="184" x2="450" y2="244" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>
<line x1="580" y1="184" x2="630" y2="244" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>
<rect x="395" y="244" width="110" height="44" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="450" y="271">Agente B</text>
<rect x="575" y="244" width="110" height="44" rx="6" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="630" y="271">Agente C</text>
<line x1="540" y1="266" x2="505" y2="266" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>
<line x1="540" y1="266" x2="575" y2="266" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>
<text x="540" y="322" font-style="italic">cada agente ejecuta,</text>
<text x="540" y="342" font-style="italic">delega o enriquece</text>
</g>
</svg>
