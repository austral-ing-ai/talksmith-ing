<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 666 504" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">
<title>Multiagente: orquestador y workers</title>
<desc>La diferencia con Reflexion: ahí los tres roles se turnaban sobre una misma tarea.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="666" height="504" fill="#ffffff"/>
<g transform="translate(-4,0)">
<rect x="310" y="20" width="120" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="370" y="41" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Pedido</text>
<line x1="370" y1="52" x2="370" y2="88" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="225" y="88" width="290" height="72" rx="10" fill="#DA1B2E"/>
<text x="370" y="119" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Orquestador (LLM)</text>
<text x="370" y="142" text-anchor="middle" font-size="14" fill="#FFFFFF">descompone la tarea</text>
<text x="530" y="120" font-style="italic">subtareas decididas</text>
<text x="530" y="137" font-style="italic">para cada pedido</text>
<line x1="280" y1="160" x2="180" y2="224" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="370" y1="160" x2="370" y2="224" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="460" y1="160" x2="560" y2="224" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="105" y="224" width="150" height="56" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="180" y="249" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Worker 1</text>
<text x="180" y="268" text-anchor="middle">loop de tools</text>
<rect x="295" y="224" width="150" height="56" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="370" y="249" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Worker 2</text>
<text x="370" y="268" text-anchor="middle">loop de tools</text>
<rect x="485" y="224" width="150" height="56" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="560" y="249" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Worker 3</text>
<text x="560" y="268" text-anchor="middle">loop de tools</text>
<text x="92" y="257" text-anchor="end" font-style="italic">en paralelo</text>
<line x1="180" y1="280" x2="280" y2="344" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="370" y1="280" x2="370" y2="344" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="560" y1="280" x2="460" y2="344" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="225" y="344" width="290" height="72" rx="10" fill="#DA1B2E"/>
<text x="370" y="375" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Orquestador</text>
<text x="370" y="398" text-anchor="middle" font-size="14" fill="#FFFFFF">sintetiza los resultados</text>
<text x="530" y="384" font-style="italic">el mismo agente</text>
<line x1="370" y1="416" x2="370" y2="452" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="300" y="452" width="140" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="370" y="473" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Respuesta</text>
</g>
</svg>
