<svg class="ts-anim-s5-8-1-tuberia-rewoo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 542" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>ReWOO: planificar con variables</title>
<desc>La diferencia con Plan-and-Execute es la variable.</desc>
<style>/* talksmith-animation */
.ts-anim-s5-8-1-tuberia-rewoo [data-beat]{animation:ts-beat-in 0.6s ease-out both}
.ts-anim-s5-8-1-tuberia-rewoo [data-beat-effect=pulse]{animation-name:ts-beat-pulse;animation-duration:0.8s;transform-box:fill-box;transform-origin:center}
.ts-anim-s5-8-1-tuberia-rewoo [data-beat="1"]{animation-delay:0.50s}
.ts-anim-s5-8-1-tuberia-rewoo [data-beat="2"]{animation-delay:1.60s}
.ts-anim-s5-8-1-tuberia-rewoo [data-beat="3"]{animation-delay:2.70s}
.ts-anim-s5-8-1-tuberia-rewoo [data-beat="4"]{animation-delay:3.80s}
@keyframes ts-beat-in{from{opacity:0}to{opacity:1}}
@keyframes ts-beat-pulse{0%,100%{transform:none}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ts-anim-s5-8-1-tuberia-rewoo [data-beat]{animation:none}}
</style>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
<marker id="ahs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="9" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="520" height="542" fill="#ffffff"/>
<rect x="200" y="20" width="120" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="260" y="41" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Pedido</text>
<g data-beat="1">
<line x1="260" y1="52" x2="260" y2="92" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="92" width="480" height="170" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="260" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">Planner (LLM)</text>
<text x="260" y="142" text-anchor="middle">escribe todo el plan</text>
<rect x="100" y="156" width="320" height="90" rx="6" fill="#F2F2F2" stroke="#D8D2CE" stroke-width="1"/>
</g>
<g data-beat="2" font-family="'Andale Mono', monospace" font-size="15">
<text x="116" y="184" xml:space="preserve">Plan: ...  <tspan fill="#DA1B2E" font-weight="bold">E1</tspan> = Search[...]</text>
<text x="116" y="208" xml:space="preserve">Plan: ...  <tspan fill="#DA1B2E" font-weight="bold">E2</tspan> = LLM[... <tspan fill="#DA1B2E" font-weight="bold">#E1</tspan>]</text>
<text x="116" y="232" xml:space="preserve">Plan: ...  E3 = Search[... <tspan fill="#DA1B2E" font-weight="bold">#E2</tspan>]</text>
</g>
<g data-beat="3">
<line x1="260" y1="262" x2="260" y2="302" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="272" y="287" font-size="13" font-style="italic">plan</text>
<rect x="20" y="302" width="480" height="84" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="260" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">Worker</text>
<text x="260" y="353" text-anchor="middle">ejecuta E1, E2, E3 en orden</text>
<text x="260" y="372" text-anchor="middle">y reemplaza cada #E por su resultado</text>
</g>
<g data-beat="4">
<line x1="260" y1="386" x2="260" y2="426" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="272" y="411" font-size="13" font-style="italic">evidencias</text>
<rect x="20" y="426" width="480" height="70" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="260" y="454" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">Solver (LLM)</text>
<text x="262" y="478" text-anchor="end">plan + evidencias</text>
<line x1="270" y1="473" x2="296" y2="473" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ahs)"/>
<text x="304" y="478">respuesta</text>
<text x="260" y="518" text-anchor="middle" font-size="13" font-style="italic">sin flecha de vuelta al Planner: si algo sale distinto, nadie replanifica</text>
</g>
</svg>
