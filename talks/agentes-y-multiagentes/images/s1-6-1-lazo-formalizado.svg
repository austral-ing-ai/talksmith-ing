<!-- talksmith-ascii-sha256: 70db78b3ae8d5c6d3da8d19f5676a03deae7e5b58983934beb0eb57072f28e4b -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 348" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>El agente LLM, formalizado</title>
<desc>Es la misma figura de la lámina 1.2 escrita con símbolos: el contexto alimenta a la política, la política elige una acción sobre el ambiente y la nueva observación vuelve al contexto.</desc>
<defs>
<marker id="hd" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto"><path d="M0,1 L12,6 L0,11 z" fill="#3B3535"/></marker>
<marker id="hr" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 13 13" refX="13" refY="6.5" orient="auto"><path d="M0,1 L13,6.5 L0,12 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="501" height="348" fill="#ffffff"/>
<rect x="24" y="24" width="240" height="80" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="97.9" y="56" font-size="18" fill="#1F1E1E"><tspan font-weight="bold">contexto</tspan> c<tspan dy="4" font-size="12">t</tspan></text>
<text x="65.7" y="86" font-size="16">(o<tspan dy="4" font-size="11">1</tspan><tspan dy="-4">, a</tspan><tspan dy="4" font-size="11">1</tspan><tspan dy="-4">, …, o</tspan><tspan dy="4" font-size="11">t-1</tspan><tspan dy="-4">, a</tspan><tspan dy="4" font-size="11">t-1</tspan><tspan dy="-4">, o</tspan><tspan dy="4" font-size="11">t</tspan><tspan dy="-4">)</tspan></text>
<line x1="144" y1="104" x2="144" y2="144" stroke="#3B3535" stroke-width="2" marker-end="url(#hd)"/>
<rect x="44" y="144" width="200" height="70" rx="8" fill="#DA1B2E"/>
<text x="144" y="172" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">política (LLM)</text>
<text x="112.7" y="200" font-size="18" fill="#FFFFFF">π(a<tspan dy="4" font-size="12">t</tspan><tspan dy="-4"> | c</tspan><tspan dy="4" font-size="12">t</tspan><tspan dy="-4">)</tspan></text>
<line x1="144" y1="214" x2="144" y2="274" stroke="#3B3535" stroke-width="2" marker-end="url(#hd)"/>
<text x="156" y="249" font-size="16">a<tspan dy="4" font-size="11">t</tspan><tspan dy="-4"> </tspan><tspan font-family="'Arial Unicode MS', sans-serif">∈</tspan> A</text>
<rect x="44" y="274" width="200" height="50" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="144" y="305" font-size="18" font-weight="bold" fill="#1F1E1E" text-anchor="middle">AMBIENTE</text>
<path d="M244,299 L330,299 L330,64 L264,64" fill="none" stroke="#DA1B2E" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#hr)"/>
<text x="344" y="160" font-size="16" fill="#1F1E1E">o<tspan dy="4" font-size="11">t+1</tspan><tspan dy="-4"> </tspan><tspan font-family="'Arial Unicode MS', sans-serif">∈</tspan> O</text>
<text x="344" y="184" font-size="15">se suma al contexto</text>
<text x="344" y="204" font-size="15">c<tspan dy="4" font-size="10">t+1</tspan><tspan dy="-4"> y el loop sigue</tspan></text>
</svg>
