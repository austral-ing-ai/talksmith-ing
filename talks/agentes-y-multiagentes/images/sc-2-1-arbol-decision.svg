<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 612" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#3B3535">
<title>Cómo elegir la arquitectura</title>
<desc>Recorrer el árbol con un caso que proponga la sala: cada pregunta descarta la opción más compleja si la simple alcanza, y solo al final del camino más largo aparece el multiagente.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="920" height="612" fill="#ffffff"/>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="290" y1="76" x2="290" y2="126"/>
<line x1="290" y1="182" x2="290" y2="232"/>
<line x1="290" y1="312" x2="290" y2="362"/>
<line x1="290" y1="462" x2="290" y2="512"/>
<line x1="560" y1="48" x2="640" y2="48"/>
<line x1="560" y1="154" x2="640" y2="154"/>
<line x1="560" y1="412" x2="640" y2="412"/>
</g>
<g stroke="#D8D2CE" stroke-width="1.5">
<rect x="20" y="20" width="540" height="56" rx="8" fill="#F2EEEE"/>
<rect x="20" y="126" width="540" height="56" rx="8" fill="#F2EEEE"/>
<rect x="20" y="362" width="540" height="100" rx="8" fill="#F2EEEE"/>
<rect x="640" y="20" width="260" height="56" rx="8" fill="#ffffff"/>
<rect x="640" y="126" width="260" height="56" rx="8" fill="#ffffff"/>
<rect x="640" y="384" width="260" height="56" rx="8" fill="#ffffff"/>
</g>
<rect x="20" y="232" width="540" height="80" rx="8" fill="#ffffff" stroke="#3B3535" stroke-width="2"/>
<rect x="20" y="512" width="540" height="80" rx="8" fill="#DA1B2E"/>
<g text-anchor="middle">
<text x="290" y="54">¿Alcanza una llamada al LLM, con RAG o ejemplos?</text>
<text x="290" y="160">¿Los pasos se conocen de antemano?</text>
<text x="290" y="266" font-weight="bold" fill="#1F1E1E">Un agente con buenas tools</text>
<text x="290" y="293" font-size="16">(ReAct; planificar o reflexionar si la tarea lo pide)</text>
<text x="290" y="394">¿La información no entra en un contexto, hay equipos</text>
<text x="290" y="418">dueños de dominios distintos, o el trabajo se reparte</text>
<text x="290" y="442">en lecturas paralelas que valen ~15× tokens?</text>
<text x="290" y="545" font-weight="bold" fill="#ffffff">Multiagente: estrella, router, red,</text>
<text x="290" y="571" font-weight="bold" fill="#ffffff">pipeline, pizarra o jerarquía</text>
<text x="770" y="44" font-weight="bold" fill="#1F1E1E">Una llamada</text>
<text x="770" y="66" font-size="16">sin agente</text>
<text x="770" y="150" font-weight="bold" fill="#1F1E1E">Workflow</text>
<text x="770" y="172" font-size="16">pasos fijos en código</text>
<text x="770" y="418" font-weight="bold" fill="#1F1E1E">Quedarse con un agente</text>
<text x="600" y="40" font-size="16" font-weight="bold">sí</text>
<text x="600" y="146" font-size="16" font-weight="bold">sí</text>
<text x="600" y="404" font-size="16" font-weight="bold">no</text>
</g>
<g font-size="16" font-weight="bold">
<text x="302" y="107">no</text>
<text x="302" y="213">no</text>
<text x="302" y="493">sí</text>
</g>
</svg>
