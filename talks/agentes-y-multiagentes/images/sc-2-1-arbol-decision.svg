<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 584" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#3B3535">
<title>Cómo elegir la arquitectura</title>
<desc>Árbol de decisión: cada pregunta descarta la opción más compleja si la simple alcanza; solo al final del camino más largo aparece el multiagente.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
<path d="M0,0 L11,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="920" height="584" fill="#ffffff"/>
<g stroke="#3B3535" stroke-width="1.8" fill="none" marker-end="url(#ah)">
<line x1="290" y1="76" x2="290" y2="126"/>
<line x1="290" y1="182" x2="290" y2="232"/>
<line x1="290" y1="308" x2="290" y2="358"/>
<line x1="290" y1="458" x2="290" y2="508"/>
<line x1="560" y1="48" x2="640" y2="48"/>
<line x1="560" y1="154" x2="640" y2="154"/>
<line x1="560" y1="408" x2="640" y2="408"/>
</g>
<g stroke="#D8D2CE" stroke-width="1.5">
<rect x="20" y="20" width="540" height="56" rx="8" fill="#F2EEEE"/>
<rect x="20" y="126" width="540" height="56" rx="8" fill="#F2EEEE"/>
<rect x="20" y="358" width="540" height="100" rx="8" fill="#F2EEEE"/>
<rect x="640" y="20" width="260" height="56" rx="8" fill="#ffffff"/>
<rect x="640" y="126" width="260" height="56" rx="8" fill="#ffffff"/>
<rect x="640" y="380" width="260" height="56" rx="8" fill="#ffffff"/>
</g>
<rect x="20" y="232" width="540" height="76" rx="8" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<rect x="20" y="508" width="540" height="56" rx="8" fill="#DA1B2E"/>
<g text-anchor="middle">
<text x="290" y="54">¿Alcanza una llamada al LLM, con RAG o ejemplos?</text>
<text x="290" y="160">¿Los pasos se conocen de antemano?</text>
<text x="290" y="264" font-weight="bold" fill="#1F1E1E">Un agente con buenas tools</text>
<text x="290" y="290" font-size="16">(ReAct; planificar o reflexionar si la tarea lo pide)</text>
<text x="290" y="390">¿La información no entra en un contexto, hay equipos</text>
<text x="290" y="414">dueños de dominios distintos, o el trabajo se reparte</text>
<text x="290" y="438">en lecturas paralelas que valen ~15x tokens?</text>
<text x="290" y="542" font-weight="bold" fill="#ffffff">Multiagente: subagents, skills, handoffs o router</text>
<text x="770" y="44" font-weight="bold" fill="#1F1E1E">Una llamada</text>
<text x="770" y="66" font-size="16">sin agente</text>
<text x="770" y="150" font-weight="bold" fill="#1F1E1E">Workflow</text>
<text x="770" y="172" font-size="16">pasos fijos en código</text>
<text x="770" y="414" font-weight="bold" fill="#1F1E1E">Quedarse con un agente</text>
<text x="600" y="40" font-size="16" font-weight="bold">sí</text>
<text x="600" y="146" font-size="16" font-weight="bold">sí</text>
<text x="600" y="400" font-size="16" font-weight="bold">no</text>
</g>
<g font-size="16" font-weight="bold">
<text x="302" y="107">no</text>
<text x="302" y="213">no</text>
<text x="302" y="489">sí</text>
</g>
</svg>
