<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">
<title>Compartir el contexto no alcanza</title>
<desc>El ejemplo de Cognition: cada subagente ve el contexto del orquestador y su propio trabajo, pero no el de su hermano; la pila completa aparece recién en la caja que combina.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
<g transform="translate(0,10)">
<rect x="340" y="20" width="120" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="400" y="41" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Tarea</text>
<rect x="250" y="92" width="300" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="400" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">Orquestador</text>
<text x="400" y="139" text-anchor="middle">divide la tarea</text>
<rect x="180" y="212" width="180" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="270" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">Subagente 1</text>
<text x="270" y="259" text-anchor="middle">hace la subtarea 1</text>
<rect x="440" y="212" width="180" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="530" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">Subagente 2</text>
<text x="530" y="259" text-anchor="middle">hace la subtarea 2</text>
<rect x="250" y="332" width="300" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="400" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">Orquestador</text>
<text x="400" y="379" text-anchor="middle">combina los resultados</text>
<rect x="330" y="432" width="140" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="400" y="453" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Resultado</text>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="400" y1="52" x2="400" y2="92"/>
<line x1="270" y1="152" x2="270" y2="212"/>
<line x1="530" y1="152" x2="530" y2="212"/>
<line x1="270" y1="272" x2="270" y2="332"/>
<line x1="530" y1="272" x2="530" y2="332"/>
<line x1="400" y1="392" x2="400" y2="432"/>
</g>
<g font-weight="bold" fill="#1F1E1E" text-anchor="middle">
<rect x="566" y="109" width="40" height="26" rx="5" fill="#D8D2CE"/>
<text x="586" y="127">G</text>
<rect x="30" y="229" width="40" height="26" rx="5" fill="#D8D2CE"/>
<text x="50" y="247">G</text>
<rect x="78" y="229" width="40" height="26" rx="5" fill="#B8E6F5"/>
<text x="98" y="247">B1</text>
<rect x="634" y="229" width="40" height="26" rx="5" fill="#D8D2CE"/>
<text x="654" y="247">G</text>
<rect x="682" y="229" width="40" height="26" rx="5" fill="#F7BBC1"/>
<text x="702" y="247">B2</text>
<rect x="566" y="349" width="40" height="26" rx="5" fill="#D8D2CE"/>
<text x="586" y="367">G</text>
<rect x="614" y="349" width="40" height="26" rx="5" fill="#B8E6F5"/>
<text x="634" y="367">B1</text>
<rect x="662" y="349" width="40" height="26" rx="5" fill="#F7BBC1"/>
<text x="682" y="367">B2</text>
<rect x="710" y="349" width="40" height="26" rx="5" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5"/>
<text x="730" y="367">P</text>
</g>
<g font-weight="bold" fill="#DA1B2E" text-anchor="middle">
<rect x="126" y="229" width="40" height="26" rx="5" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2" stroke-dasharray="4 3"/>
<text x="146" y="247">B2</text>
<line x1="130" y1="251" x2="162" y2="233" stroke="#DA1B2E" stroke-width="2"/>
<rect x="730" y="229" width="40" height="26" rx="5" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2" stroke-dasharray="4 3"/>
<text x="750" y="247">B1</text>
<line x1="734" y1="251" x2="766" y2="233" stroke="#DA1B2E" stroke-width="2"/>
<text x="146" y="272" font-size="12" font-weight="normal" font-style="italic">no lo ve</text>
<text x="750" y="272" font-size="12" font-weight="normal" font-style="italic">no lo ve</text>
</g>
<text x="658" y="394" text-anchor="middle" font-size="12" font-style="italic">pila completa: acá aparece el choque</text>
<line x1="30" y1="490" x2="770" y2="490" stroke="#D8D2CE" stroke-width="1"/>
<g font-weight="bold" fill="#1F1E1E" text-anchor="middle">
<rect x="30" y="504" width="40" height="22" rx="5" fill="#D8D2CE"/>
<text x="50" y="520">G</text>
<rect x="290" y="504" width="40" height="22" rx="5" fill="#B8E6F5"/>
<text x="310" y="520">B1</text>
<rect x="338" y="504" width="40" height="22" rx="5" fill="#F7BBC1"/>
<text x="358" y="520">B2</text>
<rect x="30" y="538" width="40" height="22" rx="5" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5"/>
<text x="50" y="554">P</text>
<rect x="290" y="538" width="40" height="22" rx="5" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="294" y1="556" x2="326" y2="542" stroke="#DA1B2E" stroke-width="2"/>
</g>
<text x="80" y="520">contexto del orquestador</text>
<text x="388" y="520">trabajo de cada subtarea</text>
<text x="80" y="554">trabajo de combinación</text>
<text x="340" y="554">ficha que ese agente no ve</text>
</g>
</svg>
