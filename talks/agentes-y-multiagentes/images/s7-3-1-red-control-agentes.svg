<!-- talksmith-ascii-sha256: a42f9d1a42409e61ccdccfb2a4177463728388c8862815b20ddfcafd0561d644 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 418" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Red: el control pasa de agente en agente</title>
<desc>Un ejemplo de Kore.ai para contarlo en voz alta: en una red no hay nodo que coordine y cada agente le pasa el control al siguiente con un handoff.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
<marker id="ahs" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto">
<path d="M12,0 L0,6 L12,12 z" fill="#3B3535"/>
</marker>
<marker id="ahd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
</marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="14" refY="7" orient="auto">
<path d="M0,0 L14,7 L0,14 z" fill="#DA1B2E"/>
</marker>
<marker id="ahrs" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="0" refY="7" orient="auto">
<path d="M14,0 L0,7 L14,14 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="0" y="0" width="615" height="418" fill="#ffffff"/>
<g stroke="#3B3535" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
<path d="M205,268 L80,268 L80,166" marker-end="url(#ahd)"/>
<path d="M520,284 L520,312 L80,312 L80,268"/>
</g>
<text x="96" y="332" font-style="italic">quien recibe el control sigue con el usuario</text>
<rect x="20" y="134" width="120" height="32" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="80" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Usuario</text>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<path d="M80,134 L80,48 L325,48"/>
<path d="M383.8,76 L296.2,228" marker-start="url(#ahs)"/>
<path d="M416.2,76 L503.8,228" marker-start="url(#ahs)"/>
</g>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="325" y="20" width="150" height="56" rx="10"/>
<rect x="205" y="228" width="150" height="56" rx="10"/>
<rect x="445" y="228" width="150" height="56" rx="10"/>
</g>
<g text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">
<text x="400" y="54">Agente A</text>
<text x="280" y="262">Agente B</text>
<text x="520" y="262">Agente C</text>
</g>
<path d="M355,256 L445,256" stroke="#DA1B2E" stroke-width="3" fill="none" marker-start="url(#ahrs)" marker-end="url(#ahr)"/>
<g text-anchor="middle" font-size="15" font-style="italic">
<text x="400" y="372">cada agente ejecuta, delega o enriquece</text>
<text x="400" y="394">y le pasa el control al siguiente</text>
</g>
</svg>
