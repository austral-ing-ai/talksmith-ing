<svg class="ts-anim-s7-7-1-caso-descomposicion" xmlns="http://www.w3.org/2000/svg" viewBox="40 0 730 470" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3B3535">
<title>Un caso: cómo se descompone</title>
<desc>El orquestador reparte dos lecturas en paralelo, que no se pisan, y deja la única escritura, la transferencia, sola y al final, después de validar.</desc>
<style>/* talksmith-animation */
.ts-anim-s7-7-1-caso-descomposicion [data-beat]{animation:ts-beat-in 0.6s ease-out backwards}
.ts-anim-s7-7-1-caso-descomposicion [data-beat-effect=pulse]{animation-name:ts-beat-pulse;animation-duration:0.8s;animation-fill-mode:none;transform-box:fill-box;transform-origin:center}
.ts-anim-s7-7-1-caso-descomposicion [data-beat="1"]{animation-delay:0.50s}
.ts-anim-s7-7-1-caso-descomposicion [data-beat="2"]{animation-delay:1.60s}
.ts-anim-s7-7-1-caso-descomposicion [data-beat="3"]{animation-delay:2.70s}
.ts-anim-s7-7-1-caso-descomposicion [data-beat="4"]{animation-delay:3.80s}
.ts-anim-s7-7-1-caso-descomposicion [data-beat="5"]{animation-delay:4.90s}
@keyframes ts-beat-in{from{opacity:0}to{opacity:1}}
@keyframes ts-beat-pulse{0%,100%{transform:none}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ts-anim-s7-7-1-caso-descomposicion [data-beat]{animation:none}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect x="40" y="0" width="730" height="470" fill="#ffffff"/>
<g data-beat="1">
<rect x="180" y="20" width="280" height="50" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="320" y="51" text-anchor="middle" font-weight="bold" fill="#1F1E1E">Orquestador: descompone</text>
</g>
<g data-beat="2">
<path d="M250,70 V95 H170 V130" fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<path d="M390,70 V95 H470 V130" fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="320" y="100" text-anchor="middle" font-size="14" font-style="italic">en paralelo</text>
<rect x="60" y="130" width="220" height="90" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="170" y="160" text-anchor="middle" font-weight="bold" fill="#1F1E1E">Loan Agent</text>
<text x="170" y="184" text-anchor="middle">cotiza saldo</text>
<text x="170" y="206" text-anchor="middle" font-size="14">(lee)</text>
<rect x="360" y="130" width="220" height="90" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="470" y="160" text-anchor="middle" font-weight="bold" fill="#1F1E1E">Transaction Manager</text>
<text x="470" y="184" text-anchor="middle">verifica fondos</text>
<text x="470" y="206" text-anchor="middle" font-size="14">(lee)</text>
</g>
<g data-beat="3">
<path d="M170,220 V245 H250 V280" fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<path d="M470,220 V245 H390 V280" fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="180" y="280" width="280" height="50" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="320" y="311" text-anchor="middle" font-weight="bold" fill="#1F1E1E">Orquestador: valida</text>
</g>
<g data-beat="4">
<path d="M460,305 H630" fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="545" y="296" text-anchor="middle" font-size="14" font-style="italic">no cierra</text>
<rect x="630" y="285" width="120" height="40" rx="20" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="690" y="310" text-anchor="middle" fill="#1F1E1E">replanifica</text>
</g>
<g data-beat="5">
<path d="M320,330 V390" fill="none" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<text x="332" y="365" font-size="14" font-style="italic">cierra</text>
<rect x="180" y="390" width="280" height="60" rx="8" fill="#DA1B2E"/>
<text x="320" y="415" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Payment Processor</text>
<text x="320" y="438" text-anchor="middle" fill="#FFFFFF">transfiere (escribe)</text>
</g>
</svg>
