<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Qué es un subagente</title>
<desc>Cada subagente lee mucho y devuelve poco: el orquestador le pasa un encargo a cada uno, cada uno trabaja en su propia ventana de contexto y devuelve un hallazgo.</desc>
