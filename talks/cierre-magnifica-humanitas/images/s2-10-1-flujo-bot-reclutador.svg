<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 500" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#3B3535">
<title>El bot reclutador que cayó en la trampa</title>
<desc>El About del candidato, texto que no controlamos, se pega crudo junto a la orden del reclutador; el modelo genera el mensaje y se envía sin revisión humana.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#3B3535"/></marker>
</defs>
<rect width="770" height="500" fill="#FFFFFF"/>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="20" y="20" width="280" height="52" rx="8"/>
<rect x="330" y="20" width="420" height="72" rx="8"/>
<rect x="280" y="256" width="140" height="48" rx="8"/>
<rect x="255" y="336" width="190" height="48" rx="8"/>
<rect x="280" y="432" width="140" height="48" rx="8"/>
</g>
<g fill="none" stroke="#3B3535" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M160,72 V180 A10,10 0 0 0 170,190 H350"/>
<path d="M540,92 V180 A10,10 0 0 1 530,190 H350"/>
<path d="M350,190 V256" stroke-linecap="butt" marker-end="url(#ah)"/>
<path d="M350,304 V336" stroke-linecap="butt" marker-end="url(#ah)"/>
<path d="M350,384 V432" stroke-linecap="butt" marker-end="url(#ah)"/>
</g>
<circle cx="350" cy="190" r="6" fill="#3B3535"/>
<g font-family="'Andale Mono', monospace" font-size="17">
<text x="160" y="52" text-anchor="middle">leer_linkedin(candidato)</text>
<text x="350" y="286" text-anchor="middle">prompt</text>
<text x="350" y="366" text-anchor="middle">modelo.generar</text>
<text x="350" y="462" text-anchor="middle">enviar</text>
<text x="174" y="106">about</text>
<text x="364" y="220">+ about</text>
<text x="364" y="414">mensaje</text>
</g>
<g text-anchor="middle">
<text x="540" y="50">“Sos un reclutador. Escribí una</text>
<text x="540" y="74">invitación cordial usando este perfil:”</text>
</g>
<rect x="172" y="118" width="256" height="34" rx="17" fill="#DA1B2E"/>
<text x="300" y="141" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">texto que NO controlamos</text>
<g font-size="16">
<text x="364" y="244">pegamos el About crudo junto a la orden</text>
<text x="436" y="462">sin revisión humana</text>
</g>
</svg>
