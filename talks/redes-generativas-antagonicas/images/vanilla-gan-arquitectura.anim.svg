<svg class="ts-anim-vanilla-gan-arquitectura" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 370" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Arquitectura de una Vanilla GAN</title>
<desc>Redibujo vectorial del diagrama del slide 15 del pptx original (AIG4B Clase 8), con las mismas piezas: el ruido z entra al Generador (G), que produce una muestra falsa; los datos reales aportan una muestra real; el Discriminador (D) recibe ambas y decide si es real o falsa; esa decisión da la pérdida de G y la pérdida de D, que vuelven para actualizar cada red. La salida del D es un veredicto, la probabilidad de que la imagen sea real; no es una bifurcación: la pérdida de G usa los veredictos sobre las generadas y la de D los veredictos sobre reales y generadas.</desc>
<style>/* talksmith-animation */
.ts-anim-vanilla-gan-arquitectura [data-beat]{animation:ts-anim-vanilla-gan-arquitectura-in .6s ease-out both}
.ts-anim-vanilla-gan-arquitectura [data-beat="1"]{animation-delay:0.3s}
.ts-anim-vanilla-gan-arquitectura [data-beat="2"]{animation-delay:0.9s}
.ts-anim-vanilla-gan-arquitectura [data-beat="3"]{animation-delay:2.1s}
.ts-anim-vanilla-gan-arquitectura [data-beat="4"]{animation-delay:3.6s}
.ts-anim-vanilla-gan-arquitectura [data-beat="5"]{animation-delay:5.1s}
.ts-anim-vanilla-gan-arquitectura [data-beat="6"]{animation-delay:6.8s}
.ts-anim-vanilla-gan-arquitectura [data-beat="7"]{animation-delay:8.5s}
.ts-anim-vanilla-gan-arquitectura [data-beat="8"]{animation-delay:10.5s}
.ts-anim-vanilla-gan-arquitectura .tk-ruido{offset-path:path("M55,125 L215,125");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 0.9s linear 1.3s both,ts-anim-vanilla-gan-arquitectura-move 0.9s ease-in-out 1.3s both}
.ts-anim-vanilla-gan-arquitectura .tk-falsa{offset-path:path("M215,125 L405,125");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 0.9s linear 2.5s both,ts-anim-vanilla-gan-arquitectura-move 0.9s ease-in-out 2.5s both}
.ts-anim-vanilla-gan-arquitectura .tk-real{offset-path:path("M215,266 L405,266");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 0.9s linear 4.0s both,ts-anim-vanilla-gan-arquitectura-move 0.9s ease-in-out 4.0s both}
.ts-anim-vanilla-gan-arquitectura .tk-falsa-d{offset-path:path("M405,125 L460,128 L510,170 L600,195");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 1.1s linear 5.5s both,ts-anim-vanilla-gan-arquitectura-move 1.1s ease-in-out 5.5s both}
.ts-anim-vanilla-gan-arquitectura .tk-real-d{offset-path:path("M405,266 L460,262 L510,220 L600,195");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 1.1s linear 5.5s both,ts-anim-vanilla-gan-arquitectura-move 1.1s ease-in-out 5.5s both}
.ts-anim-vanilla-gan-arquitectura .tk-ver-falsa{offset-path:path("M600,195 L790,195");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 0.8s linear 7.2s both,ts-anim-vanilla-gan-arquitectura-move 0.8s ease-in-out 7.2s both}
.ts-anim-vanilla-gan-arquitectura .tk-ver-real{offset-path:path("M600,195 L790,195");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 0.8s linear 7.45s both,ts-anim-vanilla-gan-arquitectura-move 0.8s ease-in-out 7.45s both}
.ts-anim-vanilla-gan-arquitectura .tk-pg-falsa{offset-path:path("M790,195 L790,108 L923,108");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 1.1s linear 8.9s both,ts-anim-vanilla-gan-arquitectura-move 1.1s ease-in-out 8.9s both}
.ts-anim-vanilla-gan-arquitectura .tk-pd-falsa{offset-path:path("M790,195 L790,286 L923,286");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 1.1s linear 8.9s both,ts-anim-vanilla-gan-arquitectura-move 1.1s ease-in-out 8.9s both}
.ts-anim-vanilla-gan-arquitectura .tk-pd-real{offset-path:path("M790,195 L790,286 L923,286");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 1.1s linear 9.15s both,ts-anim-vanilla-gan-arquitectura-move 1.1s ease-in-out 9.15s both}
.ts-anim-vanilla-gan-arquitectura .tk-act-g{offset-path:path("M923,108 L923,40 L215,40 L215,125");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 1.6s linear 10.9s both,ts-anim-vanilla-gan-arquitectura-move 1.6s ease-in-out 10.9s both}
.ts-anim-vanilla-gan-arquitectura .tk-act-d{offset-path:path("M923,286 L923,346 L600,346 L600,195");offset-rotate:0deg;animation:ts-anim-vanilla-gan-arquitectura-show 1.4s linear 10.9s both,ts-anim-vanilla-gan-arquitectura-move 1.4s ease-in-out 10.9s both}
.ts-anim-vanilla-gan-arquitectura .pulso-d{animation:ts-anim-vanilla-gan-arquitectura-pulse 1s ease-in-out 12.3s both}
.ts-anim-vanilla-gan-arquitectura .pulso-g{animation:ts-anim-vanilla-gan-arquitectura-pulse 1s ease-in-out 12.5s both}
@keyframes ts-anim-vanilla-gan-arquitectura-in{from{opacity:0}}
@keyframes ts-anim-vanilla-gan-arquitectura-show{0%{opacity:0}10%,88%{opacity:1}100%{opacity:0}}
@keyframes ts-anim-vanilla-gan-arquitectura-move{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes ts-anim-vanilla-gan-arquitectura-pulse{0%{opacity:0}35%,65%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ts-anim-vanilla-gan-arquitectura *{animation:none}}
</style>
<defs>
