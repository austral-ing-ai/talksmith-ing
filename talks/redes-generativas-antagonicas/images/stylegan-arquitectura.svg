<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -8 1238 634" font-family="Helvetica, Arial, sans-serif" fill="#1F1E1E">
<title>Arquitectura de StyleGAN</title>
<desc>Redibujo del slide 41: el vector latente pasa por la Mapping Network (Normalise y 8 capas FC) y da w en W; cada bloque A lleva ese estilo a una capa Ada IN de la Synthesis Network g, que parte de una constante 4X4X512, suma ruido por los bloques B y sube de resolución hasta 1024 X 1024. El ProGan Discriminator compara esa salida con imágenes reales reducidas (Downscaling); la Loss vuelve como Training.</desc>
