<svg class="ts-anim-generador-red" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 1100" width="1940" height="1100" font-family="Helvetica, Arial, sans-serif">
<title>Generador</title>
<desc>El Generador recibe z = 0.7 (deslizador de 0 a 1) y un Bias de valor 1, los conecta con pesos +1, -1, -1, +1 a cuatro neuronas sigmoide: σ(1.7) = 0.85, σ(-1.7) = 0.15, σ(-1.7) = 0.15 y σ(1.7) = 0.85, que forman la imagen 2×2 (0.85, 0.15 / 0.15, 0.85).</desc>
