<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 990" width="1420" height="990" font-family="Helvetica, Arial, sans-serif">
<title>Discriminador como red: entrada, oculta y salida</title>
<desc>La grilla 2×2 de la cara prototipo (1, 0 / 0, 1) alimenta las cuatro neuronas de la capa de entrada, conectadas directamente a la neurona de salida (σ), sin capa oculta, con pesos +1 (rojo), -1, -1 (azul) y +1 (rojo); un nodo Bias de valor 1 aporta con peso -1 (verde).</desc>
