<text x="583.8" y="96">el</text>
<text x="619.0" y="96">pago</text>
<text x="654.2" y="96">de</text>
<text x="693.6" y="96">marzo</text>
<text x="745.6" y="96">falló</text>
<text x="789.2" y="96">por</text>
<text x="820.2" y="96">un</text>
<text x="868.0" y="96">timeout</text>
<text x="920.0" y="96">del</text>
<text x="963.6" y="96">banco</text>
</g>

<g stroke="#3B3535" stroke-width="1.3" marker-end="url(#ah)">
<line x1="212.2" y1="108" x2="172.0" y2="176"/>
<line x1="247.4" y1="108" x2="260.0" y2="176"/>
