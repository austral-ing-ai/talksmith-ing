</defs>
<rect x="0" y="0" width="1040" height="426" fill="#ffffff"/>
<rect x="30" y="30" width="460" height="264" rx="6" fill="#F6F5F4"/>
<rect x="550" y="30" width="460" height="264" rx="6" fill="#F6F5F4"/>

<text x="260" y="57" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="1.6" fill="#6E6462">UNA FRASE CORTA</text>
<text x="780" y="57" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="1.6" fill="#6E6462">UNA FRASE LARGA</text>

<g font-family="Andale Mono, monospace" font-size="14" text-anchor="middle">
