<text x="260" y="282" text-anchor="middle" font-size="13">Tres palabras, un vector.</text>
<text x="780" y="282" text-anchor="middle" font-size="13">Diez palabras, un vector del mismo tamaño exacto.</text>

<line x1="30" y1="322" x2="1010" y2="322" stroke="#E0DBDA" stroke-width="1"/>
<text x="520" y="348" text-anchor="middle" font-size="14">El estado no crece con la frase. Lo que el modelo sabe del token 1 cuando llega al</text>
<text x="520" y="370" text-anchor="middle" font-size="14">token 10 tuvo que sobrevivir nueve reescrituras del mismo vector. Esa compresión es</text>
<text x="520" y="392" text-anchor="middle" font-size="14">el cuello de botella, y es independiente de que la red esté bien o mal entrenada.</text>
</svg>
