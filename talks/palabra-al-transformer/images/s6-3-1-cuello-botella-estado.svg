<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 426" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Todo el pasado en un vector</title>
<desc>El estado de tamaño fijo recibe tres palabras o diez y su tamaño no cambia: cuanto más larga la frase, más comprimido queda cada token.</desc>
<defs>
