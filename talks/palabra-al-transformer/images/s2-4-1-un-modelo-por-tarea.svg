<rect x="496" y="148" width="190" height="48" rx="3"/>
</g>

<g text-anchor="middle" font-size="12.5">
<text x="119" y="72">textos crudos</text>
<text x="355" y="72">textos crudos</text>
<text x="591" y="72">textos crudos</text>
</g>
