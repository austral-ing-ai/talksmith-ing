<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 353" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Un modelo por tarea</title>
<desc>El costo del enfoque tradicional no esta en entrenar sino en etiquetar, y no se amortiza entre tareas.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B3535"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#DA1B2E"/></marker>
<marker id="ahrs" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#DA1B2E"/></marker>
<marker id="ahre" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="710" height="353" fill="#ffffff"/>

<line x1="237" y1="50" x2="237" y2="282" stroke="#D5CFCF" stroke-width="1" stroke-dasharray="2 5"/>
<line x1="473" y1="50" x2="473" y2="282" stroke="#D5CFCF" stroke-width="1" stroke-dasharray="2 5"/>

<text x="119" y="34" text-anchor="middle" font-size="13.5" font-weight="bold">TAREA 1 · sentimiento</text>
<text x="355" y="34" text-anchor="middle" font-size="13.5" font-weight="bold">TAREA 2 · traducción</text>
<text x="591" y="34" text-anchor="middle" font-size="13.5" font-weight="bold">TAREA 3 · entidades</text>

<g fill="#ffffff" stroke="#B9B2B2" stroke-width="1.2">
<rect x="24" y="52" width="190" height="44" rx="3"/>
<rect x="260" y="52" width="190" height="44" rx="3"/>
