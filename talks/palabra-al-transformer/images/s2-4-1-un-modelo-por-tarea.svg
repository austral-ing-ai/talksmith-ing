<text x="131" y="116">etiqueta</text>
<text x="131" y="130">una persona</text>
<text x="367" y="116">etiqueta</text>
<text x="367" y="130">una persona</text>
<text x="603" y="116">etiqueta</text>
<text x="603" y="130">una persona</text>
</g>

<text x="24" y="306" font-size="12.5">Nada cruza de una columna a la otra: sumar una tarea cuesta una columna entera.</text>
<text x="24" y="325" font-size="12.5">El tramo caro es el del medio — lo escribe una persona, una fila por vez.</text>
</svg>
