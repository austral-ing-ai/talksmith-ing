<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 402" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
<title>Promediar una frase pierde el orden</title>
<desc>Dos frases con las mismas palabras y sentido opuesto colapsan en el mismo vector promedio, porque sumar es conmutativo.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#8A8080"/></marker>
<marker id="aha" markerWidth="10" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="728" height="402" fill="#ffffff"/>

<rect x="24" y="24" width="320" height="36" rx="6" fill="#F4F2F2" stroke="#C9C2C2"/>
<text x="184" y="47" text-anchor="middle" font-size="15" font-weight="bold">“el cliente canceló el pedido”</text>
<rect x="384" y="24" width="320" height="36" rx="6" fill="#F4F2F2" stroke="#C9C2C2"/>
<text x="544" y="47" text-anchor="middle" font-size="15" font-weight="bold">“el pedido canceló al cliente”</text>

<g stroke="#8A8080" stroke-width="1.4" marker-end="url(#ah)">
<line x1="70" y1="62" x2="70" y2="81"/>
<line x1="146" y1="62" x2="146" y2="81"/>
<line x1="222" y1="62" x2="222" y2="81"/>
<line x1="298" y1="62" x2="298" y2="81"/>
<line x1="430" y1="62" x2="430" y2="81"/>
<line x1="506" y1="62" x2="506" y2="81"/>
<line x1="582" y1="62" x2="582" y2="81"/>
<line x1="658" y1="62" x2="658" y2="81"/>
</g>

<g fill="#FFFFFF" stroke="#C9C2C2">
<rect x="36" y="82" width="68" height="40" rx="5"/>
<rect x="112" y="82" width="68" height="40" rx="5"/>
<rect x="188" y="82" width="68" height="40" rx="5"/>
<rect x="264" y="82" width="68" height="40" rx="5"/>
<rect x="396" y="82" width="68" height="40" rx="5"/>
<rect x="472" y="82" width="68" height="40" rx="5"/>
<rect x="548" y="82" width="68" height="40" rx="5"/>
<rect x="624" y="82" width="68" height="40" rx="5"/>
</g>
<g text-anchor="middle" font-size="13" font-weight="bold">
<text x="70" y="102">el</text>
<text x="146" y="102">cliente</text>
<text x="222" y="102">canceló</text>
<text x="298" y="102">pedido</text>
<text x="430" y="102">el</text>
<text x="506" y="102">pedido</text>
<text x="582" y="102">canceló</text>
<text x="658" y="102">cliente</text>
</g>
<g text-anchor="middle" font-family="Andale Mono, monospace" font-size="9" fill="#8A8080">
<text x="70" y="115">[ . . . ]</text>
<text x="146" y="115">[ . . . ]</text>
<text x="222" y="115">[ . . . ]</text>
<text x="298" y="115">[ . . . ]</text>
<text x="430" y="115">[ . . . ]</text>
<text x="506" y="115">[ . . . ]</text>
<text x="582" y="115">[ . . . ]</text>
<text x="658" y="115">[ . . . ]</text>
</g>

<g stroke="#8A8080" stroke-width="1.4" fill="none">
<line x1="70" y1="124" x2="182" y2="146"/>
<line x1="146" y1="124" x2="182" y2="146"/>
<line x1="222" y1="124" x2="186" y2="146"/>
<line x1="298" y1="124" x2="186" y2="146"/>
<line x1="430" y1="124" x2="542" y2="146"/>
<line x1="506" y1="124" x2="542" y2="146"/>
<line x1="582" y1="124" x2="546" y2="146"/>
<line x1="658" y1="124" x2="546" y2="146"/>
<line x1="184" y1="146" x2="184" y2="162" marker-end="url(#ah)"/>
<line x1="544" y1="146" x2="544" y2="162" marker-end="url(#ah)"/>
<line x1="184" y1="196" x2="184" y2="222" marker-end="url(#ah)"/>
<line x1="544" y1="196" x2="544" y2="222" marker-end="url(#ah)"/>
</g>

<rect x="119" y="162" width="130" height="34" rx="5" fill="#F4F2F2" stroke="#C9C2C2"/>
<text x="184" y="184" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="1.2">PROMEDIO</text>
<rect x="479" y="162" width="130" height="34" rx="5" fill="#F4F2F2" stroke="#C9C2C2"/>
<text x="544" y="184" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="1.2">PROMEDIO</text>

<rect x="34" y="222" width="300" height="40" rx="6" fill="#FCEEF0" stroke="#DA1B2E" stroke-width="2"/>
<text x="184" y="247" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15" fill="#DA1B2E">[ 0.41  -0.08  0.22  ... ]</text>
<rect x="394" y="222" width="300" height="40" rx="6" fill="#FCEEF0" stroke="#DA1B2E" stroke-width="2"/>
<text x="544" y="247" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15" fill="#DA1B2E">[ 0.41  -0.08  0.22  ... ]</text>

<g stroke="#DA1B2E" stroke-width="2" fill="none">
<path d="M184,262 L184,280 L544,280 L544,262"/>
<line x1="364" y1="280" x2="364" y2="292"/>
</g>
<rect x="234" y="292" width="260" height="40" rx="20" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="364" y="318" text-anchor="middle" font-size="17" font-weight="bold" fill="#DA1B2E" letter-spacing="1.2">EL MISMO VECTOR</text>

<g text-anchor="middle" font-size="12.5" fill="#6B6363">
<text x="364" y="356">Las mismas palabras en otro orden colapsan en el mismo punto.</text>
<text x="364" y="374">El promedio es conmutativo: sumar no depende del orden.</text>
</g>
</svg>
