<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 634 536" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="12">
<title>Una red sin memoria</title>
<desc>Dos columnas identicas, red directa y red recurrente: en el paso 2 de la derecha entran dos cosas, la palabra y el estado h1 del paso anterior.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto"><path d="M0,0 L9.5,4.5 L0,9 Z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10.5" refY="5" orient="auto"><path d="M0,0 L10.5,5 L0,10 Z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="634" height="536" fill="#ffffff"/>
<line x1="317" y1="30" x2="317" y2="508" stroke="#EDE9E9" stroke-width="1"/>

<text x="157" y="38" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.1">RED DIRECTA</text>
<line x1="24" y1="46" x2="290" y2="46" stroke="#3B3535" stroke-width="1.4"/>
<text x="157" y="72" text-anchor="middle" font-size="11.5" fill="#7A7070" letter-spacing="0.7">paso 1</text>
<rect x="115" y="80" width="84" height="30" rx="15" fill="#ffffff" stroke="#9A9090" stroke-width="1.3"/>
<text x="157" y="100" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15">"The"</text>
<line x1="157" y1="110" x2="157" y2="136" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="101" y="136" width="112" height="46" rx="5" fill="#F2EFEF" stroke="#3B3535" stroke-width="1.6"/>
<text x="157" y="165" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16">red</text>
<line x1="157" y1="182" x2="157" y2="208" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="107" y="208" width="100" height="27" rx="13" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<text x="157" y="226" text-anchor="middle" font-size="13">salida A</text>
<text x="157" y="268" text-anchor="middle" font-size="11.5" fill="#7A7070" letter-spacing="0.7">paso 2</text>
<rect x="115" y="276" width="84" height="30" rx="15" fill="#ffffff" stroke="#9A9090" stroke-width="1.3"/>
<text x="157" y="296" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15">"cat"</text>
<line x1="157" y1="306" x2="157" y2="332" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="101" y="332" width="112" height="46" rx="5" fill="#F2EFEF" stroke="#3B3535" stroke-width="1.6"/>
<text x="157" y="361" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16">red</text>
<line x1="157" y1="378" x2="157" y2="404" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="107" y="404" width="100" height="27" rx="13" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<text x="157" y="422" text-anchor="middle" font-size="13">salida B</text>
<line x1="24" y1="454" x2="290" y2="454" stroke="#DDD8D8" stroke-width="1"/>
<text x="24" y="474">En cada paso entra solo la palabra.</text>
<text x="24" y="491">La salida de &#8220;cat&#8221; es siempre la misma,</text>
<text x="24" y="508">aparezca donde aparezca en la frase.</text>

<text x="477" y="38" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.1">RED RECURRENTE</text>
<line x1="344" y1="46" x2="610" y2="46" stroke="#3B3535" stroke-width="1.4"/>
<text x="477" y="72" text-anchor="middle" font-size="11.5" fill="#7A7070" letter-spacing="0.7">paso 1</text>
<rect x="435" y="80" width="84" height="30" rx="15" fill="#ffffff" stroke="#9A9090" stroke-width="1.3"/>
<text x="477" y="100" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15">"The"</text>
<line x1="477" y1="110" x2="477" y2="136" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="421" y="136" width="112" height="46" rx="5" fill="#F2EFEF" stroke="#3B3535" stroke-width="1.6"/>
<text x="477" y="165" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16">red</text>
<line x1="477" y1="182" x2="477" y2="208" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="427" y="208" width="100" height="27" rx="13" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<text x="477" y="226" text-anchor="middle" font-size="13">salida A</text>
<text x="477" y="268" text-anchor="middle" font-size="11.5" fill="#7A7070" letter-spacing="0.7">paso 2</text>
<rect x="435" y="276" width="84" height="30" rx="15" fill="#ffffff" stroke="#9A9090" stroke-width="1.3"/>
<text x="477" y="296" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15">"cat"</text>
<line x1="477" y1="306" x2="477" y2="332" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="421" y="332" width="162" height="46" rx="5" fill="#FCEEF0" stroke="#DA1B2E" stroke-width="2.2"/>
<text x="502" y="361" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16">red</text>
<path d="M533 159 H545 Q553 159 553 167 V332" fill="none" stroke="#DA1B2E" stroke-width="2.4" marker-end="url(#ahr)"/>
<rect x="556" y="236" width="28" height="20" fill="#ffffff"/>
<text x="560" y="251" font-family="Andale Mono, monospace" font-size="15" font-weight="bold" fill="#DA1B2E">h1</text>
<line x1="502" y1="378" x2="502" y2="404" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="452" y="404" width="100" height="27" rx="13" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<text x="502" y="422" text-anchor="middle" font-size="13">salida C</text>
<line x1="344" y1="454" x2="610" y2="454" stroke="#DDD8D8" stroke-width="1"/>
<text x="344" y="474">En el paso 2 entran dos cosas: la palabra</text>
<text x="344" y="491">Y el estado h1. La salida de &#8220;cat&#8221; cambia</text>
<text x="344" y="508">seg&#250;n qu&#233; palabra vino antes.</text>
