<!-- talksmith-ascii-sha256: cf3ef97d0c1b2867e97c68b03625692a3c231938862d33fcc6dd8908e3edb343 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 670" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>Recuperar y ordenar son dos trabajos</title>
<desc>Cada etapa persigue una métrica distinta: recall arriba, precisión abajo, y la caída de magnitud es el argumento.</desc>
<defs>
<marker id="fd" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
<path d="M0,0 L10,4.5 L0,9 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="0" y="0" width="820" height="670" fill="#ffffff"/>

<polygon points="60,118 520,118 410,210 170,210" fill="#F1EEEE"/>
<polygon points="170,256 410,256 355,350 225,350" fill="#FDF3F4"/>

<rect x="60" y="70" width="460" height="48" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="290" y="100" text-anchor="middle" font-size="16" font-weight="bold">100.000+ documentos</text>

<rect x="170" y="210" width="240" height="46" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="290" y="240" text-anchor="middle" font-size="15" font-weight="bold">50 candidatos</text>

<rect x="225" y="350" width="130" height="46" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.6"/>
<text x="290" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#DA1B2E">5 docs</text>
<line x1="357" y1="373" x2="424" y2="373" stroke="#DA1B2E" stroke-width="2.2" marker-end="url(#fd)"/>
<text x="434" y="377" font-size="12.5" font-weight="bold" fill="#DA1B2E">al prompt</text>

<text x="560" y="160" font-size="13" font-weight="bold" letter-spacing="0.5">ETAPA 1 · recuperar</text>
<text x="560" y="178" fill="#5E5757">recall: no perder nada relevante</text>
<text x="560" y="198" font-size="13" font-family="Andale Mono, monospace" font-weight="bold">x 1/2000</text>

<text x="560" y="296" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#DA1B2E">ETAPA 2 · ordenar</text>
<text x="560" y="314" fill="#5E5757">precisión: quedarse con lo mejor</text>
<text x="560" y="334" font-size="13" font-family="Andale Mono, monospace" font-weight="bold" fill="#DA1B2E">x 1/10</text>

<text x="60" y="462" font-size="12.5" font-weight="bold" fill="#5E5757">el corpus entero</text>
<rect x="60" y="470" width="460" height="20" fill="#C9C0C0"/>

<text x="60" y="512" font-size="12.5" font-weight="bold" fill="#DA1B2E">lo que el modelo caro llega a leer</text>
<rect x="60" y="520" width="4" height="20" fill="#DA1B2E"/>
<text x="76" y="535" font-size="12.5" font-weight="bold" fill="#DA1B2E">esa raya son los 5 documentos: 0,005 % del corpus</text>

<line x1="60" y1="580" x2="760" y2="580" stroke="#D8D2D2" stroke-width="1.2"/>
<text x="410" y="606" text-anchor="middle" font-size="13.5" font-weight="bold">Dos recortes de magnitud muy distinta, y el segundo cuesta más que el primero.</text>
</svg>
