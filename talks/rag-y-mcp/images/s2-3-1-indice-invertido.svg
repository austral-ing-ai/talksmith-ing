<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 412" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="10">
<title>Cómo funciona un índice invertido</title>
<desc>El diagrama muestra la inversión: se entra con documento a términos y se sale con término a documentos, y recién ahí una consulta se resuelve cruzando dos listas cortas.</desc>
<defs>
<marker id="ha" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#DA1B2E"/></marker>
<marker id="hg" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8C8484"/></marker>
</defs>
<rect x="0" y="0" width="684" height="412" fill="#ffffff"/>

<text x="24" y="34" font-size="12" font-weight="bold" letter-spacing="0.6" fill="#9A9292">DOCUMENTO</text>
<line x1="114" y1="30" x2="136" y2="30" stroke="#9A9292" stroke-width="1.3" marker-end="url(#hg)"/>
<text x="142" y="34" font-size="12" font-weight="bold" letter-spacing="0.6" fill="#9A9292">TÉRMINOS</text>
<text x="24" y="48" font-size="9" fill="#9A9292">lo natural — y lo que no sirve para buscar</text>

<text x="350" y="34" font-size="12" font-weight="bold" letter-spacing="0.6" fill="#DA1B2E" text-anchor="middle">INVERTIR</text>
<text x="350" y="48" font-size="8.5" fill="#8C8484" text-anchor="middle">los mismos datos,</text>
<text x="350" y="59" font-size="8.5" fill="#8C8484" text-anchor="middle">leídos al revés</text>

<text x="400" y="34" font-size="12" font-weight="bold" letter-spacing="0.6" fill="#DA1B2E">TÉRMINO</text>
<line x1="466" y1="30" x2="488" y2="30" stroke="#DA1B2E" stroke-width="1.3" marker-end="url(#ha)"/>
<text x="494" y="34" font-size="12" font-weight="bold" letter-spacing="0.6" fill="#DA1B2E">DOCUMENTOS</text>
<text x="400" y="48" font-size="9" fill="#8C8484">el índice invertido — lo que hace posible buscar</text>

<rect x="24" y="58" width="276" height="72" rx="5" fill="#F7F5F5" stroke="#E0DADA" stroke-width="1"/>
<text x="38" y="71" font-size="7.5" font-weight="bold" letter-spacing="0.8" fill="#A39B9B">documentos crudos</text>
<text x="38" y="89" font-family="Andale Mono, monospace" font-size="8.5" fill="#6E6767" xml:space="preserve">Doc1  el servicio devuelve timeout intermitente</text>
<text x="38" y="105" font-family="Andale Mono, monospace" font-size="8.5" fill="#6E6767" xml:space="preserve">Doc2  el cliente devuelve error de conexión</text>
<text x="38" y="121" font-family="Andale Mono, monospace" font-size="8.5" fill="#6E6767" xml:space="preserve">Doc3  el servicio y el cliente reintentan solos</text>

<line x1="60" y1="130" x2="60" y2="170" stroke="#9A9292" stroke-width="1.3" marker-end="url(#hg)"/>
<text x="76" y="154" font-size="9" fill="#8C8484">tokenizar · minúsculas · sin stopwords</text>

<rect x="24" y="170" width="276" height="88" rx="5" fill="#F7F5F5" stroke="#E0DADA" stroke-width="1"/>
<text x="38" y="183" font-size="7.5" font-weight="bold" letter-spacing="0.8" fill="#A39B9B">tokenizados</text>

<path d="M300,221 C348,221 352,182 400,182" fill="none" stroke="#D6CFCF" stroke-width="1" marker-end="url(#hg)"/>
<path d="M300,221 C350,221 356,203 400,203" fill="none" stroke="#D6CFCF" stroke-width="1" marker-end="url(#hg)"/>
<path d="M112,199 L300,199 C345,199 355,74 400,74" fill="none" stroke="#DA1B2E" stroke-width="1.6" marker-end="url(#ha)"/>
<path d="M112,243 L300,243 C352,243 358,74 400,74" fill="none" stroke="#DA1B2E" stroke-width="1.6" marker-end="url(#ha)"/>

<text x="38" y="202" font-family="Andale Mono, monospace" font-size="8.5" font-weight="bold" fill="#6E6767">Doc1</text>
<rect x="64" y="190" width="48" height="18" rx="3" fill="#FCEBED" stroke="#DA1B2E" stroke-width="1.3"/>
<text x="88" y="202" font-family="Andale Mono, monospace" font-size="7.5" fill="#DA1B2E" text-anchor="middle">servicio</text>
<rect x="116" y="190" width="48" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="140" y="202" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">devuelve</text>
<rect x="168" y="190" width="44" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="190" y="202" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">timeout</text>
<rect x="216" y="190" width="66" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="249" y="202" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">intermitente</text>

<text x="38" y="224" font-family="Andale Mono, monospace" font-size="8.5" font-weight="bold" fill="#6E6767">Doc2</text>
<rect x="64" y="212" width="44" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="86" y="224" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">cliente</text>
<rect x="112" y="212" width="48" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="136" y="224" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">devuelve</text>
<rect x="164" y="212" width="35" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="181.5" y="224" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">error</text>
<rect x="203" y="212" width="48" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="227" y="224" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">conexión</text>

<text x="38" y="246" font-family="Andale Mono, monospace" font-size="8.5" font-weight="bold" fill="#6E6767">Doc3</text>
<rect x="64" y="234" width="48" height="18" rx="3" fill="#FCEBED" stroke="#DA1B2E" stroke-width="1.3"/>
<text x="88" y="246" font-family="Andale Mono, monospace" font-size="7.5" fill="#DA1B2E" text-anchor="middle">servicio</text>
<rect x="116" y="234" width="44" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="138" y="246" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">cliente</text>
<rect x="164" y="234" width="57" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="192.5" y="246" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">reintentan</text>
<rect x="225" y="234" width="35" height="18" rx="3" fill="#ffffff" stroke="#DFD9D9" stroke-width="1"/>
<text x="242.5" y="246" font-family="Andale Mono, monospace" font-size="7.5" fill="#6E6767" text-anchor="middle">solos</text>

<rect x="400" y="58" width="260" height="200" rx="5" fill="#ffffff" stroke="#E9A9B1" stroke-width="1.3"/>
<rect x="406" y="65" width="198" height="20" rx="3" fill="#FCEBED"/>

<g font-family="Andale Mono, monospace" font-size="10">
<text x="414" y="78" fill="#DA1B2E" font-weight="bold">servicio</text>
<text x="524" y="78" fill="#DA1B2E" font-weight="bold">[Doc1, Doc3]</text>
<text x="414" y="100">devuelve</text>
<text x="524" y="100">[Doc1, Doc2]</text>
<text x="414" y="121">cliente</text>
<text x="524" y="121">[Doc2, Doc3]</text>
<text x="414" y="143">timeout</text>
<text x="524" y="143">[Doc1]</text>
<text x="414" y="164">intermitente</text>
<text x="524" y="164">[Doc1]</text>
<text x="414" y="186">error</text>
<text x="524" y="186">[Doc2]</text>
<text x="414" y="207">conexión</text>
<text x="524" y="207">[Doc2]</text>
<text x="414" y="229">reintentan</text>
<text x="524" y="229">[Doc3]</text>
<text x="414" y="250">solos</text>
<text x="524" y="250">[Doc3]</text>
</g>
<g stroke-width="1.2" fill="none">
<line x1="494" y1="74.5" x2="516" y2="74.5" stroke="#DA1B2E" marker-end="url(#ha)"/>
<line x1="494" y1="96.5" x2="516" y2="96.5" stroke="#A39B9B" marker-end="url(#hg)"/>
<line x1="494" y1="117.5" x2="516" y2="117.5" stroke="#A39B9B" marker-end="url(#hg)"/>
<line x1="494" y1="139.5" x2="516" y2="139.5" stroke="#A39B9B" marker-end="url(#hg)"/>
<line x1="494" y1="160.5" x2="516" y2="160.5" stroke="#A39B9B" marker-end="url(#hg)"/>
<line x1="494" y1="182.5" x2="516" y2="182.5" stroke="#A39B9B" marker-end="url(#hg)"/>
<line x1="494" y1="203.5" x2="516" y2="203.5" stroke="#A39B9B" marker-end="url(#hg)"/>
<line x1="494" y1="225.5" x2="516" y2="225.5" stroke="#A39B9B" marker-end="url(#hg)"/>
<line x1="494" y1="246.5" x2="516" y2="246.5" stroke="#A39B9B" marker-end="url(#hg)"/>
</g>
<path d="M606,68 C612,68 608,150 614,158 C608,166 612,248 606,248" fill="none" stroke="#B9B1B1" stroke-width="1.1"/>
<text transform="translate(630,158) rotate(-90)" text-anchor="middle" font-size="9" letter-spacing="0.8" fill="#8C8484">posting lists</text>

<rect x="24" y="274" width="636" height="88" rx="6" fill="#FAF8F8" stroke="#DFD9D9" stroke-width="1"/>
<text x="40" y="294" font-size="9.5" font-weight="bold" letter-spacing="1" fill="#8C8484">CONSULTA</text>
<rect x="40" y="304" width="128" height="30" rx="4" fill="#ffffff" stroke="#B9B1B1" stroke-width="1.2"/>
<text x="104" y="323" font-family="Andale Mono, monospace" font-size="11" text-anchor="middle">servicio cliente</text>
<line x1="176" y1="319" x2="202" y2="319" stroke="#8C8484" stroke-width="1.2" marker-end="url(#hg)"/>

<text x="208" y="310" font-family="Andale Mono, monospace" font-size="10">servicio</text>
<line x1="264" y1="306.5" x2="286" y2="306.5" stroke="#A39B9B" stroke-width="1.2" marker-end="url(#hg)"/>
<text x="294" y="310" font-family="Andale Mono, monospace" font-size="10">[Doc1, <tspan fill="#DA1B2E" font-weight="bold">Doc3</tspan>]</text>
<text x="208" y="334" font-family="Andale Mono, monospace" font-size="10">cliente</text>
<line x1="264" y1="330.5" x2="286" y2="330.5" stroke="#A39B9B" stroke-width="1.2" marker-end="url(#hg)"/>
<text x="294" y="334" font-family="Andale Mono, monospace" font-size="10">[Doc2, <tspan fill="#DA1B2E" font-weight="bold">Doc3</tspan>]</text>

<path d="M376,306 L402,319" fill="none" stroke="#B9B1B1" stroke-width="1.2"/>
<path d="M376,331 L402,319" fill="none" stroke="#B9B1B1" stroke-width="1.2"/>
<text x="435" y="309" font-size="9.5" fill="#8C8484" text-anchor="middle">intersección</text>
<line x1="402" y1="319" x2="476" y2="319" stroke="#DA1B2E" stroke-width="1.6" marker-end="url(#ha)"/>
<rect x="476" y="302" width="84" height="34" rx="5" fill="#FCEBED" stroke="#DA1B2E" stroke-width="1.6"/>
<text x="518" y="325" font-family="Andale Mono, monospace" font-size="14" font-weight="bold" fill="#DA1B2E" text-anchor="middle">Doc3</text>
<text x="574" y="314" font-size="8" fill="#8C8484">el único con los</text>
<text x="574" y="326" font-size="8" fill="#8C8484">dos términos</text>

<text x="105" y="384" font-size="12.5">Buscar deja de ser leer cada documento y pasa a ser <tspan fill="#DA1B2E" font-weight="bold">cruzar dos listas cortas.</tspan></text>
</svg>
