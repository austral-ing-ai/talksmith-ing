<!-- talksmith-ascii-sha256: 0bfd2edb58eb51292d87d74f2f528fb361753abf5280dc936d1783b3ca8a5f1d -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>El cross-encoder lee los dos juntos</title>
<desc>La diferencia no es de tamaño de modelo sino de arquitectura: quién ve a quién en la misma pasada.</desc>
<defs>
<marker id="bd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L9,4 L0,8 z" fill="#3B3535"/>
</marker>
<marker id="br" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
<path d="M0,0 L10,4.5 L0,9 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="650" fill="#ffffff"/>

<text x="60" y="80" font-size="14" font-weight="bold" letter-spacing="0.8">BI-ENCODER</text>
<text x="196" y="80" font-size="12" fill="#6B6262">(búsqueda vectorial)</text>
<line x1="60" y1="90" x2="430" y2="90" stroke="#B9AFAF" stroke-width="1.6"/>

<text x="470" y="80" font-size="14" font-weight="bold" letter-spacing="0.8" fill="#DA1B2E">CROSS-ENCODER</text>
<text x="640" y="80" font-size="12" fill="#6B6262">(reranker)</text>
<line x1="470" y1="90" x2="840" y2="90" stroke="#DA1B2E" stroke-width="1.8"/>

<text x="175" y="132" text-anchor="middle" font-size="12.5">consulta</text>
<text x="315" y="132" text-anchor="middle" font-size="12.5">documento</text>
<line x1="175" y1="140" x2="175" y2="162" stroke="#3B3535" stroke-width="1.6" marker-end="url(#bd)"/>
<line x1="315" y1="140" x2="315" y2="162" stroke="#3B3535" stroke-width="1.6" marker-end="url(#bd)"/>

<rect x="125" y="166" width="100" height="36" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
<text x="175" y="189" text-anchor="middle" font-size="12.5" font-weight="bold">modelo</text>
<rect x="265" y="166" width="100" height="36" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
<text x="315" y="189" text-anchor="middle" font-size="12.5" font-weight="bold">modelo</text>

<line x1="175" y1="202" x2="175" y2="226" stroke="#3B3535" stroke-width="1.6" marker-end="url(#bd)"/>
<line x1="315" y1="202" x2="315" y2="226" stroke="#3B3535" stroke-width="1.6" marker-end="url(#bd)"/>
<text x="175" y="246" text-anchor="middle" font-size="12.5" font-weight="bold">vector A</text>
<text x="315" y="246" text-anchor="middle" font-size="12.5" font-weight="bold">vector B</text>

<line x1="175" y1="256" x2="238" y2="288" stroke="#3B3535" stroke-width="1.6"/>
<line x1="315" y1="256" x2="252" y2="288" stroke="#3B3535" stroke-width="1.6"/>
<circle cx="245" cy="292" r="7" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="245" y="322" text-anchor="middle" font-size="13" font-family="Andale Mono, monospace" font-weight="bold">cos(A, B)</text>
<text x="245" y="344" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6262">los dos textos nunca se ven</text>

<rect x="490" y="118" width="330" height="32" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2.2"/>
<text x="655" y="139" text-anchor="middle" font-size="12" font-family="Andale Mono, monospace" font-weight="bold" fill="#DA1B2E">consulta + [SEP] + documento</text>
<line x1="655" y1="150" x2="655" y2="174" stroke="#DA1B2E" stroke-width="2.2" marker-end="url(#br)"/>

<rect x="530" y="178" width="250" height="96" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.2"/>
<text x="655" y="202" text-anchor="middle" font-size="13" font-weight="bold">modelo</text>
<text x="655" y="226" text-anchor="middle">la atención cruza cada token</text>
<text x="655" y="244" text-anchor="middle">de la consulta con cada token</text>
<text x="655" y="262" text-anchor="middle">del documento</text>

<line x1="655" y1="274" x2="655" y2="298" stroke="#DA1B2E" stroke-width="2.2" marker-end="url(#br)"/>
<text x="655" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#DA1B2E">score de relevancia 0..1</text>
<text x="655" y="344" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6262">una sola pasada, los dos juntos</text>

<text x="60" y="392" font-size="12" fill="#5E5757">el vector del documento se precalcula una sola vez</text>
<text x="60" y="414" font-size="13" font-family="Andale Mono, monospace" font-weight="bold">O(1) por doc en la consulta</text>
<text x="60" y="434" font-size="12" fill="#5E5757">escala a millones de documentos</text>

<text x="470" y="392" font-size="12" fill="#5E5757">hay que correr el modelo una vez por cada par</text>
<text x="470" y="414" font-size="13" font-family="Andale Mono, monospace" font-weight="bold" fill="#DA1B2E">O(n) por consulta</text>
<text x="470" y="434" font-size="12" fill="#5E5757">solo sobre los top-50</text>

<rect x="60" y="470" width="780" height="82" fill="#F7F5F5" stroke="#E3DDDD" stroke-width="1.2"/>
<text x="78" y="494" font-size="12.5" font-weight="bold" letter-spacing="0.6">EL CASO «BANCO»</text>
<text x="78" y="518" font-size="12.5" fill="#5E5757">bi-encoder: «banco» tiene un único vector, sirva la consulta para hablar de dinero o de un río.</text>
<text x="78" y="540" font-size="12.5" font-weight="bold" fill="#DA1B2E">cross-encoder: «banco» se lee pegado a la consulta, y la consulta dice de cuál de los dos se trata.</text>

<text x="450" y="590" text-anchor="middle" font-size="13.5" font-weight="bold">No es un modelo más grande: es quién ve a quién.</text>
</svg>
