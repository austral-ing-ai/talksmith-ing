<!-- talksmith-ascii-sha256: 24ac5bc7b511fc6b680484100233286fdeb4a6eb817db51a4731122976207f08 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>Tamaño del fragmento y solapamiento</title>
<desc>Sin solapamiento, cualquier idea que cruce un límite de corte queda incompleta en los dos fragmentos.</desc>
<rect x="0" y="0" width="900" height="604" fill="#ffffff"/>

<text x="60" y="80" font-size="13" font-weight="bold" letter-spacing="0.8" fill="#6B6262">SIN SOLAPAMIENTO</text>

<rect x="60" y="94" width="260" height="34" fill="#ffffff" stroke="#9C9090" stroke-width="1.5"/>
<text x="190" y="116" text-anchor="middle" font-size="12" fill="#5E5757">chunk 1</text>
<rect x="320" y="94" width="260" height="34" fill="#ffffff" stroke="#9C9090" stroke-width="1.5"/>
<text x="450" y="116" text-anchor="middle" font-size="12" fill="#5E5757">chunk 2</text>
<rect x="580" y="94" width="260" height="34" fill="#ffffff" stroke="#9C9090" stroke-width="1.5"/>
<text x="710" y="116" text-anchor="middle" font-size="12" fill="#5E5757">chunk 3</text>

<rect x="200" y="142" width="240" height="26" fill="#E6E1E1" stroke="#9C9090" stroke-width="1.2"/>
<text x="258" y="159" text-anchor="middle" font-size="10" fill="#4A4444">el token expira</text>
<text x="382" y="159" text-anchor="middle" font-size="10" fill="#4A4444">a los 3600 segundos</text>
<line x1="320" y1="86" x2="320" y2="178" stroke="#4A4444" stroke-width="2.2"/>
<text x="60" y="198" font-size="12.5" fill="#5E5757">la idea queda partida en dos, y ninguno de los dos fragmentos la explica solo</text>

<text x="60" y="242" font-size="13" font-weight="bold" letter-spacing="0.8" fill="#DA1B2E">CON SOLAPAMIENTO  (50 tokens)</text>

<rect x="300" y="256" width="80" height="76" fill="#F7D2D7" stroke="#DA1B2E" stroke-width="1.4" stroke-dasharray="5 3"/>
<rect x="540" y="298" width="80" height="76" fill="#F7D2D7" stroke="#DA1B2E" stroke-width="1.4" stroke-dasharray="5 3"/>

<rect x="60" y="256" width="320" height="34" fill="none" stroke="#7A7070" stroke-width="1.6"/>
<text x="220" y="278" text-anchor="middle" font-size="12" fill="#5E5757">chunk 1</text>
<rect x="300" y="298" width="320" height="34" fill="none" stroke="#7A7070" stroke-width="1.6"/>
<text x="460" y="320" text-anchor="middle" font-size="12" fill="#5E5757">chunk 2</text>
<rect x="540" y="340" width="300" height="34" fill="none" stroke="#7A7070" stroke-width="1.6"/>
<text x="690" y="362" text-anchor="middle" font-size="12" fill="#5E5757">chunk 3</text>

<line x1="340" y1="332" x2="340" y2="342" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="340" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#DA1B2E">zona repetida</text>
<line x1="580" y1="374" x2="580" y2="384" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="580" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#DA1B2E">zona repetida</text>

<text x="60" y="432" font-size="12.5" font-weight="bold" fill="#DA1B2E">la zona repetida cose el corte: alguna copia contiene la idea entera</text>

<line x1="60" y1="470" x2="840" y2="470" stroke="#D8D2D2" stroke-width="1.2"/>
<text x="60" y="498" font-size="12.5" font-weight="bold" fill="#5E5757">fragmento chico</text>
<text x="260" y="498" font-size="12.5" fill="#5E5757">más preciso, pierde el contexto de alrededor</text>
<text x="60" y="520" font-size="12.5" font-weight="bold" fill="#5E5757">fragmento grande</text>
<text x="260" y="520" font-size="12.5" fill="#5E5757">guarda contexto, diluye lo que hay que hallar</text>
<text x="60" y="542" font-size="12.5" font-weight="bold" fill="#DA1B2E">el solapamiento</text>
<text x="260" y="542" font-size="12.5" fill="#DA1B2E">cuesta almacenamiento y duplica recuperaciones</text>
</svg>
