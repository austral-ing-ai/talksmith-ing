<!-- talksmith-ascii-sha256: a88775294715dff759638f4543d9f46fd19e45c6afcf7ef2cff4f997a810c6b3 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>El ciclo de vida de una herramienta MCP</title>
<desc>De los seis pasos, el que decide la calidad del sistema es el tercero: el modelo elige leyendo texto en lenguaje natural, no una firma de tipos.</desc>
<defs>
<marker id="cd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L9,4 L0,8 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="588" fill="#ffffff"/>

<line x1="200" y1="70" x2="200" y2="450" stroke="#C9C0C0" stroke-width="2"/>

<text x="176" y="100" text-anchor="end" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B6262">1. ARRANQUE</text>
<text x="176" y="170" text-anchor="end" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B6262">2. DESCUBRIMIENTO</text>
<text x="176" y="244" text-anchor="end" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#DA1B2E">3. CONSULTA</text>
<text x="176" y="312" text-anchor="end" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B6262">4. LLAMADA</text>
<text x="176" y="370" text-anchor="end" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B6262">5. EJECUCIÓN</text>
<text x="176" y="432" text-anchor="end" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#6B6262">6. USO</text>

<circle cx="200" cy="96" r="14" fill="#ffffff" stroke="#7A7070" stroke-width="1.8"/>
<text x="200" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#5E5757">1</text>
<circle cx="200" cy="166" r="14" fill="#ffffff" stroke="#7A7070" stroke-width="1.8"/>
<text x="200" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#5E5757">2</text>
<circle cx="200" cy="240" r="16" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2.6"/>
<text x="200" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#DA1B2E">3</text>
<circle cx="200" cy="308" r="14" fill="#ffffff" stroke="#7A7070" stroke-width="1.8"/>
<text x="200" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#5E5757">4</text>
<circle cx="200" cy="366" r="14" fill="#ffffff" stroke="#7A7070" stroke-width="1.8"/>
<text x="200" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#5E5757">5</text>
<circle cx="200" cy="428" r="14" fill="#ffffff" stroke="#7A7070" stroke-width="1.8"/>
<text x="200" y="433" text-anchor="middle" font-size="13" font-weight="bold" fill="#5E5757">6</text>

<text x="240" y="90" font-size="12.5">el servidor MCP levanta y declara sus herramientas:</text>
<text x="240" y="110" font-size="12.5" fill="#5E5757">nombre + descripción + esquema de parámetros</text>

<rect x="240" y="140" width="80" height="50" fill="#F4F2F2" stroke="#B9AFAF" stroke-width="1.3"/>
<text x="280" y="170" text-anchor="middle" font-size="11.5">agente</text>
<rect x="566" y="140" width="86" height="50" fill="#F4F2F2" stroke="#B9AFAF" stroke-width="1.3"/>
<text x="609" y="170" text-anchor="middle" font-size="11.5">servidor</text>
<line x1="322" y1="156" x2="562" y2="156" stroke="#3B3535" stroke-width="1.6" marker-end="url(#cd)"/>
<text x="442" y="149" text-anchor="middle" font-size="10.5" font-family="Andale Mono, monospace">tools/list</text>
<line x1="564" y1="180" x2="324" y2="180" stroke="#3B3535" stroke-width="1.6" marker-end="url(#cd)"/>
<text x="444" y="173" text-anchor="middle" font-size="10.5">catálogo</text>

<rect x="240" y="210" width="600" height="64" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2.4"/>
<text x="258" y="236" font-size="12.5">el usuario pregunta algo y el LLM elige una herramienta</text>
<text x="258" y="258" font-size="13" font-weight="bold" fill="#DA1B2E">leyendo las DESCRIPCIONES del catálogo, no una firma de tipos</text>

<rect x="240" y="294" width="80" height="28" fill="#F4F2F2" stroke="#B9AFAF" stroke-width="1.3"/>
<text x="280" y="313" text-anchor="middle" font-size="11.5">agente</text>
<line x1="326" y1="308" x2="560" y2="308" stroke="#3B3535" stroke-width="1.6" marker-end="url(#cd)"/>
<text x="443" y="301" text-anchor="middle" font-size="10.5" font-family="Andale Mono, monospace">tools/call { name, arguments }</text>
<rect x="566" y="294" width="86" height="28" fill="#F4F2F2" stroke="#B9AFAF" stroke-width="1.3"/>
<text x="609" y="313" text-anchor="middle" font-size="11.5">servidor</text>

<text x="240" y="362" font-size="12.5">el servidor corre el código y devuelve</text>
<text x="240" y="382" font-size="12.5">un resultado estructurado</text>

<text x="240" y="424" font-size="12.5">el LLM lee el resultado y sigue razonando,</text>
<text x="240" y="444" font-size="12.5">o responde al usuario</text>

<line x1="60" y1="496" x2="840" y2="496" stroke="#D8D2D2" stroke-width="1.2"/>
<text x="450" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#DA1B2E">El modelo elige por la descripción. La descripción es la interfaz.</text>
</svg>
