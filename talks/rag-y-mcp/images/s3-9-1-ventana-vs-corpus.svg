<!-- talksmith-ascii-sha256: b9d940fe62cddbcbbaeebc707ae51c6e8578696e0a9a364e787482b6f87beb07 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 630" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>Con 1M de tokens, ¿para qué recuperar?</title>
<desc>Es la objeción que corresponde hacer después de la clase de prompting, y tiene tres respuestas que no dependen del largo de la ventana.</desc>
<defs>
<marker id="wr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
<path d="M0,0 L10,4.5 L0,9 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="0" y="0" width="860" height="630" fill="#ffffff"/>

<rect x="60" y="60" width="740" height="230" fill="#F1EEEE" stroke="#B9AFAF" stroke-width="1.6"/>
<text x="80" y="86" font-size="13.5" font-weight="bold" letter-spacing="0.8" fill="#6B6262">TODO EL CORPUS DE LA EMPRESA</text>
<text x="80" y="106" font-size="12" fill="#544E4E">documentación + ADRs + tickets + código + logs</text>

<rect x="100" y="150" width="180" height="54" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.6"/>
<text x="190" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#DA1B2E">ventana de</text>
<text x="190" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#DA1B2E">1M tokens</text>
<line x1="284" y1="177" x2="326" y2="177" stroke="#DA1B2E" stroke-width="2.2" marker-end="url(#wr)"/>
<text x="336" y="181" font-size="12.5" font-weight="bold" fill="#DA1B2E">lo único que el modelo ve</text>
<text x="80" y="270" font-size="12" fill="#544E4E">el resto sigue existiendo, y hay que ir a buscarlo</text>

<text x="76" y="354" font-size="20" font-weight="bold" fill="#8C8080">1</text>
<text x="110" y="350" font-size="13" font-weight="bold" letter-spacing="0.5">NO ENTRA</text>
<text x="330" y="350" font-size="12.5" fill="#4A4444">el corpus crece más rápido que la ventana</text>

<rect x="60" y="382" width="740" height="48" fill="#FDF3F4"/>
<rect x="60" y="382" width="4" height="48" fill="#DA1B2E"/>
<text x="76" y="416" font-size="20" font-weight="bold" fill="#DA1B2E">2</text>
<text x="110" y="412" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#DA1B2E">SI ENTRA, ENCUENTRA PEOR</text>
<text x="330" y="412" font-size="12.5" fill="#4A4444">el modelo rinde peor buscando dentro de entradas muy largas</text>

<text x="76" y="474" font-size="20" font-weight="bold" fill="#8C8080">3</text>
<text x="110" y="470" font-size="13" font-weight="bold" letter-spacing="0.5">SE PAGA TODO</text>
<text x="330" y="470" font-size="12.5" fill="#4A4444">cada consulta reenvía el corpus completo, y se cobra por token de entrada</text>

<line x1="60" y1="520" x2="800" y2="520" stroke="#D8D2D2" stroke-width="1.2"/>
<text x="430" y="546" text-anchor="middle" font-size="13.5" font-weight="bold">Seleccionar los pasajes relevantes es en sí mismo un problema no trivial.</text>
<text x="430" y="566" text-anchor="middle" font-size="12.5" fill="#6B6262">Eso es lo que hace un sistema RAG, y no desaparece porque la ventana crezca.</text>
</svg>
