<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>Un agente, varios servidores</title>
<desc>El agente ve un catálogo único y plano aunque las herramientas vengan de servidores independientes.</desc>
<defs>
<marker id="nd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L9,4 L0,8 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="580" fill="#ffffff"/>

<rect x="320" y="64" width="260" height="56" fill="#F4F2F2" stroke="#3B3535" stroke-width="1.8"/>
<text x="450" y="86" text-anchor="middle" font-size="14" font-weight="bold">AGENTE DE SOPORTE</text>
<text x="450" y="104" text-anchor="middle" font-size="11.5" fill="#5E5757">(cliente MCP)</text>

