<!-- talksmith-ascii-sha256: 1179fbdc2b4844d7ab4d91600df3244e98919c40b81d46d83565650e3d3a04af -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>Embeddings: cada texto es un punto</title>
<desc>La proyección a dos dimensiones es una mentira útil: el espacio real tiene 384 ejes y ninguno es interpretable por separado.</desc>
<defs>
<marker id="ax" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
<path d="M0,0 L9,4 L0,8 z" fill="#8C8080"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="640" fill="#ffffff"/>

<text x="380" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" letter-spacing="0.6" fill="#6B6262">PROYECCIÓN 2D DE UN ESPACIO DE 384 DIMENSIONES</text>

<line x1="150" y1="340" x2="640" y2="340" stroke="#8C8080" stroke-width="1.5" marker-end="url(#ax)"/>
<line x1="150" y1="340" x2="150" y2="106" stroke="#8C8080" stroke-width="1.5" marker-end="url(#ax)"/>
<text x="614" y="358" font-size="11" fill="#8C8080">dim 1</text>
<text x="160" y="112" font-size="11" fill="#8C8080">dim 2</text>

<ellipse cx="297" cy="188" rx="76" ry="60" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="373" y1="188" x2="396" y2="188" stroke="#DA1B2E" stroke-width="1.4"/>
<text x="404" y="182" font-size="11.5" font-weight="bold" fill="#DA1B2E">un vecindario =</text>
<text x="404" y="198" font-size="11.5" font-weight="bold" fill="#DA1B2E">un campo de significado</text>

<circle cx="250" cy="188" r="4.5" fill="#DA1B2E"/>
<text x="260" y="192" font-size="12" font-weight="bold" fill="#DA1B2E">timeout</text>
<circle cx="288" cy="156" r="4.5" fill="#DA1B2E"/>
<text x="298" y="160" font-size="12" font-weight="bold" fill="#DA1B2E">latencia</text>
<circle cx="262" cy="220" r="4.5" fill="#DA1B2E"/>
<text x="272" y="224" font-size="12" font-weight="bold" fill="#DA1B2E">reintento</text>

<circle cx="440" cy="238" r="4" fill="#8C8080"/>
<text x="450" y="242" font-size="12" fill="#8C8080">factura</text>
<circle cx="412" cy="272" r="4" fill="#8C8080"/>
<text x="422" y="276" font-size="12" fill="#8C8080">pago</text>
<circle cx="548" cy="312" r="4" fill="#8C8080"/>
<text x="558" y="316" font-size="12" fill="#8C8080">tipografía</text>

<text x="60" y="400" font-size="12" font-family="Andale Mono, monospace" font-weight="bold" fill="#DA1B2E">«timeout»</text>
<text x="190" y="400" font-size="11.5" font-family="Andale Mono, monospace">[ 0.82  -0.31   0.54   0.12  ... ]</text>
<text x="450" y="400" fill="#6B6262">384 dimensiones</text>

<text x="60" y="428" font-size="12" font-family="Andale Mono, monospace" font-weight="bold" fill="#DA1B2E">«latencia»</text>
<text x="190" y="428" font-size="11.5" font-family="Andale Mono, monospace">[ 0.79  -0.28   0.51   0.15  ... ]</text>
<text x="450" y="428" fill="#6B6262">vecino de «timeout»</text>

<text x="60" y="456" font-size="12" font-family="Andale Mono, monospace" font-weight="bold" fill="#DA1B2E">«reintento»</text>
<text x="190" y="456" font-size="11.5" font-family="Andale Mono, monospace">[ 0.71  -0.22   0.48   0.09  ... ]</text>
<text x="450" y="456" fill="#6B6262">cerca, pero no tanto</text>

<text x="60" y="484" font-size="12" font-family="Andale Mono, monospace" fill="#8C8080">«factura»</text>
<text x="190" y="484" font-size="11.5" font-family="Andale Mono, monospace" fill="#8C8080">[ -0.12   0.65  -0.33   0.87  ... ]</text>
<text x="450" y="484" fill="#8C8080">otro barrio</text>

<line x1="60" y1="530" x2="700" y2="530" stroke="#D8D2D2" stroke-width="1.2"/>
<text x="380" y="556" text-anchor="middle" font-size="13.5" font-weight="bold">Los ejes no significan nada por separado.</text>
<text x="380" y="576" text-anchor="middle" font-size="12.5" fill="#6B6262">La única lectura válida del espacio es la distancia entre dos puntos.</text>
</svg>
