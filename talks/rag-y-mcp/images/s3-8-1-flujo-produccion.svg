<!-- talksmith-ascii-sha256: 7487d65844818cd5b8884fc1a464fd3d1ef8412e6ab80b5f3bc6ae382d1531bb -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3B3535">
<title>El flujo completo en producción</title>
<desc>Las dos búsquedas corren en paralelo, se funden en un solo ranking y recién ahí interviene el modelo caro.</desc>
<defs>
<marker id="pd" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
<path d="M0,0 L10,4.5 L0,9 z" fill="#3B3535"/>
</marker>
<marker id="pr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
<path d="M0,0 L10,4.5 L0,9 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="0" y="0" width="820" height="760" fill="#ffffff"/>

<rect x="300" y="56" width="220" height="34" rx="17" fill="#F4F2F2" stroke="#C9C0C0" stroke-width="1.4"/>
<text x="410" y="78" text-anchor="middle" font-size="12.5" font-weight="bold">consulta del usuario</text>

<line x1="410" y1="90" x2="410" y2="116" stroke="#3B3535" stroke-width="2"/>
<line x1="250" y1="116" x2="570" y2="116" stroke="#3B3535" stroke-width="2"/>
<line x1="250" y1="116" x2="250" y2="150" stroke="#3B3535" stroke-width="2" marker-end="url(#pd)"/>
<line x1="570" y1="116" x2="570" y2="150" stroke="#3B3535" stroke-width="2" marker-end="url(#pd)"/>

<rect x="140" y="150" width="220" height="66" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="250" y="176" text-anchor="middle" font-size="13.5" font-weight="bold">BM25 / léxica</text>
<text x="250" y="196" text-anchor="middle" font-size="11" fill="#6B6262">top-50 por coincidencia exacta</text>

<rect x="460" y="150" width="220" height="66" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="570" y="176" text-anchor="middle" font-size="13.5" font-weight="bold">vectorial / ANN</text>
<text x="570" y="196" text-anchor="middle" font-size="11" fill="#6B6262">top-50 por cercanía semántica</text>

<line x1="250" y1="216" x2="250" y2="270" stroke="#3B3535" stroke-width="2"/>
<line x1="570" y1="216" x2="570" y2="270" stroke="#3B3535" stroke-width="2"/>
<line x1="250" y1="270" x2="570" y2="270" stroke="#3B3535" stroke-width="2"/>
<line x1="410" y1="270" x2="410" y2="302" stroke="#3B3535" stroke-width="2" marker-end="url(#pd)"/>

<rect x="290" y="302" width="240" height="56" fill="#F4F2F2" stroke="#3B3535" stroke-width="1.8"/>
<text x="410" y="335" text-anchor="middle" font-size="13.5" font-weight="bold">FUSIÓN RRF</text>
<text x="548" y="322" fill="#6B6262">un ranking único,</text>
<text x="548" y="338" fill="#6B6262">sin normalizar scores</text>

<line x1="410" y1="358" x2="410" y2="392" stroke="#DA1B2E" stroke-width="2.4" marker-end="url(#pr)"/>

<rect x="270" y="392" width="280" height="56" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2.6"/>
<text x="410" y="425" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#DA1B2E">RERANK cross-encoder</text>
<text x="568" y="416" font-size="15" font-weight="bold" fill="#DA1B2E">de 50 a 5</text>
<text x="568" y="434" fill="#6B6262">el modelo caro, sobre pocos</text>

<line x1="410" y1="448" x2="410" y2="482" stroke="#DA1B2E" stroke-width="2.4" marker-end="url(#pr)"/>

<rect x="190" y="482" width="440" height="44" fill="#ffffff" stroke="#C9C0C0" stroke-width="1.5"/>
<text x="410" y="510" text-anchor="middle" font-size="12.5" font-family="Andale Mono, monospace">prompt = instrucción + top-5 + consulta</text>

<line x1="410" y1="526" x2="410" y2="560" stroke="#3B3535" stroke-width="2" marker-end="url(#pd)"/>

<rect x="330" y="560" width="160" height="48" fill="#F4F2F2" stroke="#3B3535" stroke-width="1.8"/>
<text x="410" y="590" text-anchor="middle" font-size="15" font-weight="bold">LLM</text>
<line x1="490" y1="584" x2="556" y2="584" stroke="#3B3535" stroke-width="2" marker-end="url(#pd)"/>
<text x="566" y="588" font-size="12.5" font-weight="bold">respuesta con citas</text>

<line x1="60" y1="650" x2="760" y2="650" stroke="#D8D2D2" stroke-width="1.2"/>
<text x="410" y="676" text-anchor="middle" font-size="13.5" font-weight="bold">Lo barato filtra, lo caro ordena.</text>
<text x="410" y="696" text-anchor="middle" font-size="12" fill="#6B6262">BM25 y la búsqueda vectorial procesan cien mil documentos en milisegundos; el cross-encoder, alrededor de cien.</text>
</svg>
