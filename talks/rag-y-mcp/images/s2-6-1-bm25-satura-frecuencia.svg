<svg xmlns="http://www.w3.org/2000/svg" viewBox="82 3 566 405" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="11">
<title>BM25 satura la frecuencia</title>
<desc>El peso de un termino crece con su frecuencia pero se acerca a un techo: la segunda aparicion agrega mucho, la centesima casi nada.</desc>

<rect x="82" y="3" width="566" height="405" fill="#ffffff"/>

<text x="104" y="34" font-size="12" font-weight="bold">peso del término</text>

<line x1="110" y1="300" x2="110" y2="50" stroke="#6B6560" stroke-width="1.6"/>
<path d="M110,42 L105.5,53 L114.5,53 Z" fill="#6B6560"/>
<line x1="110" y1="300" x2="617" y2="300" stroke="#6B6560" stroke-width="1.6"/>
<path d="M626,300 L616,295.5 L616,304.5 Z" fill="#6B6560"/>

<line x1="110" y1="110" x2="615" y2="110" stroke="#DA1B2E" stroke-width="1.3" stroke-dasharray="6 5" opacity="0.45"/>
<text x="615" y="102" text-anchor="end" font-size="11" fill="#8A8480">techo del peso — k1 regula qué tan rápido se llega</text>

<line x1="110" y1="300" x2="247" y2="60.7" stroke="#B5AFAB" stroke-width="1.6"/>
<path d="M252,52 L250.9,62.9 L243.1,58.5 Z" fill="#B5AFAB"/>
<text x="258" y="62" font-size="11.5" fill="#9A9490">TF-IDF: crece lineal</text>
<text x="258" y="77" font-size="11.5" fill="#9A9490">y sin techo</text>

<path d="M110,300 L112.5,288.1 L116.1,272.9 L122.3,252.5 L128.4,236.7 L134.5,224 L146.8,205 L159,191.4 L171.3,181.3 L183.5,173.3 L208,161.8 L232.5,153.8 L257,148 L306,140 L355,134.8 L404,131.1 L477.5,127.3 L600,123.3" fill="none" stroke="#DA1B2E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="250" y="172" font-size="14" font-weight="bold" fill="#DA1B2E">BM25: satura</text>

<line x1="134.5" y1="224" x2="159" y2="224" stroke="#C9C4C0" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="159" y1="224" x2="159" y2="191.4" stroke="#DA1B2E" stroke-width="2.4"/>
<line x1="154" y1="224" x2="164" y2="224" stroke="#DA1B2E" stroke-width="2.4"/>
<line x1="154" y1="191.4" x2="164" y2="191.4" stroke="#DA1B2E" stroke-width="2.4"/>
<circle cx="134.5" cy="224" r="3" fill="#DA1B2E"/>
<circle cx="159" cy="191.4" r="3" fill="#DA1B2E"/>
<line x1="159" y1="226" x2="159" y2="242" stroke="#C9C4C0" stroke-width="1.1" stroke-dasharray="3 3"/>
<text x="166" y="254" font-size="11.5" font-weight="bold">De 1 a 2 apariciones:</text>
<text x="166" y="270" font-size="11" fill="#8A8480">una sola más, el peso salta</text>

<line x1="355" y1="134.7" x2="600" y2="134.7" stroke="#C9C4C0" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="600" y1="134.7" x2="600" y2="123.3" stroke="#DA1B2E" stroke-width="2.4"/>
<line x1="595" y1="134.7" x2="605" y2="134.7" stroke="#DA1B2E" stroke-width="2.4"/>
<line x1="595" y1="123.3" x2="605" y2="123.3" stroke="#DA1B2E" stroke-width="2.4"/>
<circle cx="355" cy="134.8" r="3" fill="#DA1B2E"/>
<circle cx="600" cy="123.3" r="3" fill="#DA1B2E"/>
<line x1="600" y1="137" x2="600" y2="152" stroke="#C9C4C0" stroke-width="1.1" stroke-dasharray="3 3"/>
<text x="612" y="166" text-anchor="end" font-size="11.5" font-weight="bold">De 10 a 20 apariciones:</text>
<text x="612" y="182" text-anchor="end" font-size="11" fill="#8A8480">diez más, casi no se mueve</text>

<line x1="110" y1="300" x2="110" y2="305" stroke="#6B6560" stroke-width="1.2"/>
<line x1="134.5" y1="300" x2="134.5" y2="305" stroke="#6B6560" stroke-width="1.2"/>
<line x1="159" y1="300" x2="159" y2="305" stroke="#6B6560" stroke-width="1.2"/>
<line x1="232.5" y1="300" x2="232.5" y2="305" stroke="#6B6560" stroke-width="1.2"/>
<line x1="355" y1="300" x2="355" y2="305" stroke="#6B6560" stroke-width="1.2"/>
<line x1="477.5" y1="300" x2="477.5" y2="305" stroke="#6B6560" stroke-width="1.2"/>
<line x1="600" y1="300" x2="600" y2="305" stroke="#6B6560" stroke-width="1.2"/>
<text x="110" y="318" text-anchor="middle" font-size="11" fill="#8A8480">0</text>
<text x="134.5" y="318" text-anchor="middle" font-size="11" fill="#8A8480">1</text>
<text x="159" y="318" text-anchor="middle" font-size="11" fill="#8A8480">2</text>
<text x="232.5" y="318" text-anchor="middle" font-size="11" fill="#8A8480">5</text>
<text x="355" y="318" text-anchor="middle" font-size="11" fill="#8A8480">10</text>
<text x="477.5" y="318" text-anchor="middle" font-size="11" fill="#8A8480">15</text>
<text x="600" y="318" text-anchor="middle" font-size="11" fill="#8A8480">20</text>
<text x="110" y="338" font-size="11" fill="#8A8480">tf — veces que el término aparece en el documento</text>

<rect x="104" y="353" width="3" height="33" fill="#DA1B2E"/>
<text x="116" y="366" font-size="12.5" font-weight="bold">La 2a aparición agrega mucho; la 100a no agrega casi nada.</text>
<text x="116" y="382" font-size="11.5" fill="#8A8480">El documento ya trataba del tema: por eso BM25 pone un techo y TF-IDF no.</text>
</svg>
