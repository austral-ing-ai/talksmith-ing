<svg class="ts-anim-s5-11-1-llama-tokens-brave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 567" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3B3535">
<title>Buscar: lo que escribe Llama 3.1</title>
<desc>Es la misma lámina que la de Wolfram Alpha, con otra herramienta: el system prompt trae la fecha de corte y la de hoy, el usuario pide un precio actual, el assistant escribe la consulta entre python_tag y eom_id y se detiene, y el agente agrega los resultados con el rol ipython.</desc>
