<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>El reward model</title>
<desc>El mismo modelo puntúa las dos respuestas del par, y entrenarlo es lograr que la ganadora quede arriba.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 Z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="312" fill="#ffffff"/>
<g font-size="16" text-anchor="middle">
<rect x="20" y="20" width="250" height="52" rx="8" fill="#ffffff" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="145" y="51">(prompt, respuesta ganadora)</text>
<rect x="20" y="132" width="250" height="52" rx="8" fill="#ffffff" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="145" y="163">(prompt, respuesta perdedora)</text>
</g>
<g stroke="#3B3535" stroke-width="2" marker-end="url(#ah)">
<line x1="272" y1="46" x2="350" y2="46"/>
<line x1="272" y1="158" x2="350" y2="158"/>
<line x1="530" y1="46" x2="590" y2="46"/>
<line x1="530" y1="158" x2="590" y2="158"/>
</g>
<g font-size="18" font-weight="bold" fill="#1F1E1E" text-anchor="middle">
<rect x="350" y="20" width="180" height="52" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="440" y="52">reward model</text>
<rect x="350" y="132" width="180" height="52" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="440" y="164">reward model</text>
</g>
<line x1="440" y1="72" x2="440" y2="132" stroke="#3B3535" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="452" y="107" font-size="14" font-style="italic">mismos pesos</text>
<rect x="590" y="20" width="70" height="52" rx="8" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
<text x="613" y="55" font-family="'Times New Roman', Times, serif" font-size="28" font-style="italic" fill="#1F1E1E" xml:space="preserve">s<tspan dy="7" font-size="20">w</tspan></text>
<rect x="590" y="132" width="70" height="52" rx="8" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
<text x="617" y="167" font-family="'Times New Roman', Times, serif" font-size="28" font-style="italic" fill="#1F1E1E" xml:space="preserve">s<tspan dy="7" font-size="20">l</tspan></text>
<text x="672" y="51" font-size="15">ganadora</text>
<text x="672" y="163" font-size="15">perdedora</text>
<rect x="20" y="206" width="350" height="86" rx="10" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="195" y="236" font-size="16" font-weight="bold" fill="#DA1B2E" text-anchor="middle">bien ordenado</text>
<text x="153" y="276" font-family="'Times New Roman', Times, serif" font-size="32" font-style="italic" fill="#1F1E1E" xml:space="preserve">s<tspan dy="8" font-size="22">w</tspan><tspan dy="-8" font-size="32" font-style="normal"> &gt; </tspan><tspan font-size="32">s</tspan><tspan dy="8" font-size="22">l</tspan></text>
<rect x="390" y="206" width="350" height="86" rx="10" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="565" y="236" font-size="16" font-weight="bold" text-anchor="middle">al revés</text>
<text x="523" y="276" font-family="'Times New Roman', Times, serif" font-size="32" font-style="italic" xml:space="preserve">s<tspan dy="8" font-size="22">w</tspan><tspan dy="-8" font-size="32" font-style="normal"> &lt; </tspan><tspan font-size="32">s</tspan><tspan dy="8" font-size="22">l</tspan></text>
