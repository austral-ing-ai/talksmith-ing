<!-- talksmith-ascii-sha256: 4c4cd779821e79d46160c62badb887488d18ab5665193b359dbcc475d7604cfa -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Búsqueda web: la ejecuta el proveedor</title>
<desc>Segunda herramienta: la búsqueda web la ejecuta la plataforma del proveedor dentro del mismo pedido; una herramienta del cliente la ejecuta el agente de tu app.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="860" height="490" fill="#FFFFFF"/>

<text x="20" y="33" font-size="16" font-weight="bold" fill="#1F1E1E">(a) Herramienta del servidor<tspan font-weight="normal" fill="#3B3535"> · búsqueda web</tspan></text>
<rect x="20" y="58" width="190" height="160" rx="8" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5"/>
<text x="115" y="143" font-size="17" font-weight="bold" fill="#1F1E1E" text-anchor="middle">Tu app</text>
<rect x="340" y="58" width="500" height="160" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="360" y="84" font-size="14" font-weight="bold" fill="#1F1E1E">Proveedor<tspan font-weight="normal" fill="#3B3535"> · un solo pedido a la API</tspan></text>
<rect x="365" y="108" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="405" y="133" font-size="15" font-weight="bold" text-anchor="middle">LLM</text>
<rect x="530" y="108" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="590" y="133" font-size="15" font-weight="bold" text-anchor="middle">búsqueda</text>
<rect x="735" y="108" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="780" y="133" font-size="15" text-anchor="middle">resultado</text>
<line x1="445" y1="128" x2="530" y2="128" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="487" y="120" text-anchor="middle">llamada</text>
<line x1="650" y1="128" x2="735" y2="128" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M780 148 V178 H405 V148" fill="none" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="592" y="200" font-style="italic" text-anchor="middle">varias veces en el mismo pedido</text>
<line x1="210" y1="112" x2="340" y2="112" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="275" y="104" text-anchor="middle">pedido</text>
<line x1="340" y1="172" x2="210" y2="172" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="275" y="146" text-anchor="middle">respuesta</text>
<text x="275" y="164" text-anchor="middle">con citas</text>

<line x1="20" y1="240" x2="840" y2="240" stroke="#D8D2CE" stroke-width="1"/>

<text x="20" y="270" font-size="16" font-weight="bold" fill="#1F1E1E">(b) Herramienta del cliente<tspan font-weight="normal" fill="#3B3535"> · funciones propias, base de datos, MCP</tspan></text>
<rect x="20" y="288" width="190" height="180" rx="8" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5"/>
<text x="115" y="313" font-size="17" font-weight="bold" fill="#1F1E1E" text-anchor="middle">Tu app</text>
<rect x="35" y="330" width="160" height="120" rx="6" fill="#FFFFFF" stroke="#1F1E1E" stroke-width="2.5"/>
<text x="115" y="370" font-size="15" font-weight="bold" text-anchor="middle">El agente</text>
<text x="115" y="394" font-size="12.5" text-anchor="middle">ejecuta la llamada</text>
<text x="115" y="412" font-size="12.5" text-anchor="middle">y manda el resultado</text>
<rect x="340" y="288" width="500" height="180" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="360" y="313" font-size="14" font-weight="bold" fill="#1F1E1E">Proveedor<tspan font-weight="normal" fill="#3B3535"> · la API devuelve la llamada y espera</tspan></text>
<rect x="365" y="326" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="405" y="351" font-size="15" font-weight="bold" text-anchor="middle">LLM</text>
<text x="462" y="351" font-size="14">emite la llamada y espera</text>
<rect x="365" y="398" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="405" y="423" font-size="15" font-weight="bold" text-anchor="middle">LLM</text>
<text x="462" y="423" font-size="14">sigue con el resultado y responde</text>
<line x1="210" y1="330" x2="340" y2="330" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="275" y="323" text-anchor="middle">pedido</text>
<line x1="340" y1="362" x2="210" y2="362" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="275" y="355" text-anchor="middle">llamada</text>
<line x1="210" y1="402" x2="340" y2="402" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="275" y="395" text-anchor="middle">resultado</text>
<line x1="340" y1="434" x2="210" y2="434" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="275" y="427" text-anchor="middle">respuesta</text>
</svg>
