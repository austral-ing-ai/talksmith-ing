<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 686" font-family="Helvetica, Arial, sans-serif" fill="#1F1E1E">
<title>Tres etapas, cuatro conjuntos de datos</title>
<desc>Mapa de la clase: las tres etapas de entrenamiento de un LLM (pre-training, SFT o Supervised Fine-Tuning y RLHF o Reinforcement Learning from Human Feedback) con sus cuatro conjuntos de datos y la escala de cada uno.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="1500" height="686" fill="#ffffff"/>

<g font-size="19" text-anchor="middle" fill="#3B3535">
<text x="180" y="48">Datos de baja calidad</text>
<text x="925" y="48">Datos de alta calidad</text>
</g>
<g fill="none" stroke="#3B3535" stroke-width="1.5">
<path d="M30,70 V62 H330 V70"/>
<path d="M400,70 V62 H1450 V70"/>
</g>

<rect x="757" y="86" width="713" height="450" rx="10" fill="none" stroke="#3B3535" stroke-width="1.5" stroke-dasharray="9 6"/>

<g font-size="23" font-weight="bold" text-anchor="middle">
<text x="180" y="120">Pre-training</text>
<text x="550" y="120" font-size="21">SFT · Supervised Fine-Tuning</text>
<text x="1113" y="120" font-size="21">RLHF · Reinforcement Learning from Human Feedback</text>
</g>

<g fill="#ffffff" stroke="#D8D2CE" stroke-width="2">
<rect x="30" y="138" width="300" height="62" rx="16"/>
<rect x="400" y="138" width="300" height="62" rx="16"/>
<rect x="780" y="138" width="300" height="62" rx="16"/>
<rect x="1150" y="138" width="300" height="62" rx="16"/>
</g>
<g font-size="20" text-anchor="middle">
<text x="180" y="176">Texto (p. ej. internet)</text>
<text x="550" y="176">Datos de demostración</text>
<text x="930" y="176">Datos de comparación</text>
<text x="1300" y="176">Prompts</text>
</g>

<g fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5">
<rect x="30" y="240" width="300" height="78"/>
<rect x="400" y="240" width="300" height="78"/>
<rect x="780" y="240" width="300" height="78"/>
<rect x="1150" y="240" width="300" height="78"/>
</g>
<g font-size="21" font-weight="bold" text-anchor="middle">
<text x="180" y="273">Modelado de</text>
<text x="180" y="299">lenguaje</text>
<text x="550" y="273">Fine-tuning</text>
<text x="550" y="299">supervisado</text>
<text x="930" y="286">Clasificación</text>
<text x="1300" y="273">Aprendizaje por</text>
<text x="1300" y="299">refuerzo</text>
</g>

<g font-size="19" fill="#3B3535">
<text x="78" y="350">optimizado para</text>
<text x="78" y="374">completar texto</text>
<text x="448" y="350">ajustado para</text>
<text x="448" y="374">diálogo</text>
<text x="828" y="350">entrenado para dar un</text>
<text x="828" y="374">puntaje a (prompt,</text>
<text x="828" y="398">respuesta)</text>
<text x="1198" y="350">optimizado para generar</text>
<text x="1198" y="374">respuestas que maximicen</text>
