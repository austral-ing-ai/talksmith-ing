<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Dónde entra el fine-tuning</title>
<desc>Es el mapa de la Introducción con una caja más abajo: las tres etapas de arriba las paga el proveedor; la de abajo, el equipo.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect width="760" height="466" fill="#ffffff"/>
<rect x="20" y="20" width="720" height="130" fill="#ffffff" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="36" y="42" font-size="13" font-weight="bold" fill="#1F1E1E">Lo hace el proveedor del modelo</text>
<g fill="#F2EEEE" stroke="#D8D2CE">
<rect x="40" y="56" width="190" height="72"/>
<rect x="285" y="56" width="190" height="72"/>
<rect x="530" y="56" width="190" height="72"/>
</g>
<g text-anchor="middle">
<g font-size="16" font-weight="bold" fill="#1F1E1E">
<text x="135" y="88">pre-training</text>
<text x="380" y="88">SFT</text>
<text x="625" y="88">RLHF / preferencias</text>
</g>
<g font-size="13">
<text x="135" y="110">la web</text>
<text x="380" y="110">demostraciones</text>
<text x="625" y="110">comparaciones</text>
</g>
</g>
<g stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)">
<line x1="230" y1="92" x2="285" y2="92"/>
<line x1="475" y1="92" x2="530" y2="92"/>
<line x1="380" y1="150" x2="380" y2="172"/>
<line x1="380" y1="202" x2="380" y2="228"/>
<line x1="380" y1="390" x2="380" y2="416"/>
</g>
<rect x="210" y="172" width="340" height="30" rx="15" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="380" y="192" font-size="13" text-anchor="middle">modelo del proveedor (base o chat / instruct)</text>
<rect x="20" y="228" width="720" height="162" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
<text x="36" y="250" font-size="13" font-weight="bold" fill="#1F1E1E">Lo hace el equipo</text>
<text x="40" y="282" font-size="19" font-weight="bold" fill="#DA1B2E">El fine-tuning</text>
<text x="190" y="282" font-size="13" font-style="italic">la misma receta del post-training, a escala chica</text>
<g font-size="14">
<g font-weight="bold" fill="#1F1E1E">
<text x="40" y="314">datos</text>
<text x="40" y="342">método</text>
<text x="40" y="370">técnica</text>
</g>
<text x="130" y="314">ejemplos propios, en JSONL</text>
<text x="130" y="342"><tspan font-weight="bold" fill="#1F1E1E">SFT</tspan>; a veces <tspan font-weight="bold" fill="#1F1E1E">preferencias</tspan> (DPO) o RL con un evaluador (RFT)</text>
<text x="130" y="370">adaptadores LoRA o QLoRA, o ajuste completo</text>
</g>
<rect x="305" y="416" width="150" height="30" rx="15" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="380" y="436" font-size="14" font-weight="bold" fill="#1F1E1E" text-anchor="middle">modelo propio</text>
</svg>
