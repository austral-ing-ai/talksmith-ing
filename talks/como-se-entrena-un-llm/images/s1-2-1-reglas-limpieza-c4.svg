<!-- talksmith-ascii-sha256: fd2f7dfb53b988ceb802163df87412a13b9f3ee1e31efe7df2200e892fbff877 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>C4: cómo Google depuró Common Crawl</title>
<desc>Cada regla de limpieza de C4 tiene un motivo concreto y ataca un tipo de basura: de ~20 TB de Common Crawl quedan 745 GB de texto en inglés.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
</defs>
<rect width="760" height="576" fill="#FFFFFF"/>
<rect x="200" y="20" width="360" height="56" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="380" y="44" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">Common Crawl, abril de 2019</text>
<text x="380" y="65" text-anchor="middle" font-size="14">texto extraído: ~20 TB</text>
<line x1="380" y1="76" x2="380" y2="104" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="104" width="720" height="36" fill="#F2EEEE"/>
<rect x="20" y="362" width="720" height="34" fill="#F9D2D6"/>
<rect x="20" y="430" width="720" height="34" fill="#F9D2D6"/>
<rect x="20" y="362" width="6" height="34" fill="#DA1B2E"/>
<rect x="20" y="430" width="6" height="34" fill="#DA1B2E"/>
<g stroke="#D8D2CE" stroke-width="1">
<line x1="20" y1="174" x2="740" y2="174"/>
<line x1="20" y1="226" x2="740" y2="226"/>
<line x1="20" y1="260" x2="740" y2="260"/>
<line x1="20" y1="294" x2="740" y2="294"/>
<line x1="20" y1="328" x2="740" y2="328"/>
<line x1="20" y1="362" x2="740" y2="362"/>
<line x1="20" y1="396" x2="740" y2="396"/>
<line x1="20" y1="430" x2="740" y2="430"/>
<line x1="420" y1="104" x2="420" y2="464"/>
</g>
<line x1="20" y1="140" x2="740" y2="140" stroke="#3B3535" stroke-width="1.5"/>
<rect x="20" y="104" width="720" height="360" fill="none" stroke="#3B3535" stroke-width="1.5"/>
<g font-weight="bold" fill="#1F1E1E">
<text x="38" y="127">regla</text>
<text x="436" y="127">qué saca</text>
</g>
<g>
<text x="38" y="162">líneas sin <tspan font-family="'Andale Mono', monospace">. ! ?</tspan> o comillas al final</text>
<text x="38" y="196">páginas con menos de 3 oraciones;</text>
<text x="38" y="216">líneas con menos de 5 palabras</text>
<text x="38" y="248">líneas con <tspan font-family="'Andale Mono', monospace">"Javascript"</tspan></text>
<text x="38" y="282">páginas con <tspan font-family="'Andale Mono', monospace">"lorem ipsum"</tspan></text>
<text x="38" y="316">páginas con <tspan font-family="'Andale Mono', monospace">"{"</tspan></text>
<text x="38" y="350">líneas con <tspan font-family="'Andale Mono', monospace">"cookie policy"</tspan>, etc.</text>
<text x="38" y="384">páginas con palabras de la lista negra</text>
<text x="38" y="418">tramos de 3 oraciones repetidos</text>
<text x="38" y="452">idioma inglés con prob. ≥ 0,99</text>
</g>
<g font-weight="bold" fill="#1F1E1E">
<text x="436" y="162">menús, botones</text>
<text x="436" y="205">fragmentos sueltos</text>
<text x="436" y="248">avisos "active Javascript"</text>
<text x="436" y="282">texto de relleno</text>
<text x="436" y="316">código</text>
<text x="436" y="350">avisos legales</text>
<text x="436" y="384">contenido ofensivo</text>
<text x="436" y="418">duplicados</text>
<text x="436" y="452">otros idiomas</text>
</g>
<g font-size="13" font-weight="bold" fill="#DA1B2E" text-anchor="end">
<text x="726" y="384">sigue en 1.4</text>
<text x="726" y="452">sigue en 1.5</text>
</g>
<line x1="380" y1="464" x2="380" y2="494" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="200" y="494" width="360" height="62" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="380" y="521" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">C4: 745 GB de texto en inglés</text>
<text x="380" y="543" text-anchor="middle" font-size="14">sin filtros: 6,1 TB</text>
</svg>
