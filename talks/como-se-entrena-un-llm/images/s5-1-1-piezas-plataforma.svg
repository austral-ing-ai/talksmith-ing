<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Las piezas de una plataforma</title>
<desc>El mapa de toda la sección: tu aplicación arriba, la plataforma abajo con la API, la plantilla de chat, el parser de llamadas, el modelo y las herramientas nativas; el modelo está en el medio y nunca ejecuta nada.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 Z" fill="#3B3535"/></marker>
</defs>
<rect width="760" height="662" fill="#ffffff"/>
<text x="20" y="33" font-size="15" font-weight="bold" fill="#1F1E1E">TU APLICACIÓN <tspan font-weight="normal" fill="#3B3535">(tu agente)</tspan></text>
<rect x="20" y="42" width="720" height="72" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
<text x="40" y="70" font-size="14">arma el pedido: mensajes + definición de las herramientas</text>
<text x="40" y="96" font-size="14"><tspan font-weight="bold" fill="#1F1E1E">ejecuta TUS herramientas:</tspan> funciones, base de datos, servidores MCP</text>
<g stroke="#3B3535" stroke-width="1.8" fill="none" marker-end="url(#ah)">
<line x1="160" y1="114" x2="160" y2="222"/>
<line x1="600" y1="222" x2="600" y2="114"/>
<line x1="160" y1="262" x2="160" y2="302"/>
<line x1="600" y1="302" x2="600" y2="262"/>
<line x1="160" y1="382" x2="160" y2="422"/>
<line x1="600" y1="422" x2="600" y2="382"/>
<line x1="366" y1="502" x2="366" y2="542"/>
<line x1="394" y1="542" x2="394" y2="502"/>
</g>
<text x="172" y="145" font-size="13">JSON: messages + tools</text>
<text x="588" y="145" font-size="13" text-anchor="end">JSON: tool_calls o texto</text>
<rect x="20" y="166" width="720" height="476" rx="10" fill="none" stroke="#3B3535" stroke-width="1.5"/>
<text x="380" y="191" font-size="15" font-weight="bold" fill="#1F1E1E" text-anchor="middle">PLATAFORMA</text>
<text x="380" y="209" font-size="13" text-anchor="middle">un proveedor, o vLLM / Ollama en tu máquina</text>
<rect x="40" y="222" width="680" height="40" rx="6" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="306" y="247" font-size="14"><tspan font-weight="bold" fill="#1F1E1E">API:</tspan> entra y sale JSON</text>
<rect x="40" y="302" width="240" height="80" rx="6" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="160" y="326" font-size="14" font-weight="bold" fill="#1F1E1E" text-anchor="middle">PLANTILLA DE CHAT</text>
<text x="160" y="348" font-size="13" text-anchor="middle">de JSON a texto con tags</text>
<text x="160" y="367" font-size="13" font-style="italic" text-anchor="middle">(ida)</text>
<rect x="480" y="302" width="240" height="80" rx="6" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="600" y="326" font-size="14" font-weight="bold" fill="#1F1E1E" text-anchor="middle">PARSER DE LLAMADAS</text>
<text x="600" y="348" font-size="13" text-anchor="middle">de texto del modelo a tool_calls</text>
<text x="600" y="367" font-size="13" font-style="italic" text-anchor="middle">(vuelta)</text>
<rect x="40" y="422" width="680" height="80" rx="6" fill="#F2EEEE" stroke="#1F1E1E" stroke-width="2.5"/>
<text x="380" y="447" font-size="16" font-weight="bold" fill="#1F1E1E" text-anchor="middle">MODELO</text>
<text x="380" y="469" font-size="14" text-anchor="middle">lee y escribe texto con tags; escribe la llamada,</text>
<text x="380" y="491" font-size="14" font-weight="bold" fill="#DA1B2E" text-anchor="middle">no la ejecuta</text>
<text x="356" y="527" font-size="12" text-anchor="end">llamada</text>
<text x="404" y="527" font-size="12">resultado</text>
<rect x="40" y="542" width="680" height="80" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
<text x="380" y="566" font-size="14" font-weight="bold" fill="#1F1E1E" text-anchor="middle">HERRAMIENTAS NATIVAS (solo proveedores)</text>
<text x="380" y="587" font-size="13" text-anchor="middle">búsqueda web, ejecución de código</text>
<text x="380" y="607" font-size="13" font-weight="bold" fill="#1F1E1E" text-anchor="middle">las ejecuta la plataforma y agrega el resultado</text>
</svg>
