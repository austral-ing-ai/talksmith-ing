<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 748" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#3B3535">
<title>Las piezas de una plataforma</title>
<desc>Es el mapa de toda la sección: cada lámina que sigue es un zoom sobre una de estas piezas.</desc>
<defs><marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="13" markerHeight="13" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker></defs>
<rect x="0" y="0" width="800" height="748" fill="#FFFFFF"/>
<rect x="24" y="24" width="752" height="116" rx="12" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="3"/>
<text x="48.0" y="62" font-size="21" font-weight="bold" fill="#DA1B2E">TU APLICACIÓN</text>
<text x="218.3" y="62" font-size="21">(tu agente)</text>
<text x="48.0" y="94">arma el pedido: mensajes + definición de las herramientas</text>
<text x="48.0" y="122" font-weight="bold" fill="#1F1E1E">ejecuta TUS herramientas:</text>
<text x="280.0" y="122">funciones, base de datos, servidores MCP</text>
<rect x="24" y="196" width="752" height="528" rx="16" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="2"/>
<text x="161.8" y="226" font-size="17" font-weight="bold" fill="#1F1E1E">PLATAFORMA:</text>
<text x="291.3" y="226" font-size="17">un proveedor, o vLLM / Ollama en tu máquina</text>
<rect x="44" y="244" width="712" height="48" rx="10" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="2"/>
<text x="306.5" y="274" font-weight="bold" fill="#1F1E1E">API:</text>
<text x="347.5" y="274">entra y sale JSON</text>
<line x1="120" y1="140" x2="120" y2="244" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="680" y1="244" x2="680" y2="140" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="134.0" y="174" font-size="16">JSON: messages + tools</text>
<text x="495.4" y="174" font-size="16">JSON: tool_calls o texto</text>
<rect x="44" y="328" width="332" height="108" rx="10" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="2"/>
<rect x="424" y="328" width="332" height="108" rx="10" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="2"/>
<text x="112.4" y="362" font-size="19" font-weight="bold" fill="#1F1E1E">PLANTILLA DE CHAT</text>
<text x="117.0" y="392">JSON</text>
<line x1="170.0" y1="386.1" x2="179.0" y2="386.1" stroke="#3B3535" stroke-width="2"/>
<path d="M178.0,381.1 L186.0,386.1 L178.0,391.1 z" fill="#3B3535"/>
<text x="191.0" y="392">texto con tags</text>
<text x="194.0" y="420" font-size="16">(ida)</text>
<text x="478.6" y="362" font-size="19" font-weight="bold" fill="#1F1E1E">PARSER DE LLAMADAS</text>
<text x="473.5" y="392">texto del modelo</text>
<line x1="610.5" y1="386.1" x2="619.5" y2="386.1" stroke="#3B3535" stroke-width="2"/>
<path d="M618.5,381.1 L626.5,386.1 L618.5,391.1 z" fill="#3B3535"/>
<text x="631.5" y="392">tool_calls</text>
<text x="563.4" y="420" font-size="16">(vuelta)</text>
<line x1="120" y1="292" x2="120" y2="328" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="680" y1="328" x2="680" y2="292" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="44" y="472" width="712" height="96" rx="10" fill="#FFFFFF" stroke="#1F1E1E" stroke-width="3"/>
<text x="349.5" y="506" font-size="23" font-weight="bold" fill="#1F1E1E">MODELO</text>
<text x="154.0" y="544">lee y escribe texto con tags; escribe la llamada, </text>
<text x="537.0" y="544" font-weight="bold" fill="#1F1E1E">no la ejecuta</text>
<line x1="120" y1="436" x2="120" y2="472" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="680" y1="472" x2="680" y2="436" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="44" y="604" width="712" height="100" rx="12" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="3"/>
<text x="66.0" y="638" font-size="20" font-weight="bold" fill="#DA1B2E">HERRAMIENTAS NATIVAS</text>
<text x="325.6" y="638" font-size="20">(solo proveedores)</text>
<text x="66.0" y="666">búsqueda web, ejecución de código.</text>
<text x="66.0" y="692" font-weight="bold" fill="#1F1E1E">Las ejecuta la plataforma</text>
<text x="286.0" y="692">y agrega el resultado</text>
<line x1="384" y1="568" x2="384" y2="604" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="416" y1="604" x2="416" y2="568" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>
