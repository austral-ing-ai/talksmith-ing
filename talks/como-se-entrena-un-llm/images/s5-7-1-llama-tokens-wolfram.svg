<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 459" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3B3535">
<title>Calcular: lo que escribe Llama 3.1</title>
<desc>La conversación de Llama 3.1 con una llamada a Wolfram Alpha, turno por turno, tal como la ve el modelo: el assistant escribe la llamada entre python_tag y eom_id y se detiene; el agente agrega el resultado con el rol ipython.</desc>
