<text x="36" y="226" fill="#DA1B2E">assistant</text>
<text x="36" y="318">ipython</text>
<text x="36" y="374">assistant</text>
</g>
<g font-family="'Andale Mono', monospace" font-size="24" fill="#1F1E1E" xml:space="preserve">
<text x="186" y="82">Environment: ipython</text>
<text x="186" y="118">Tools: brave_search, wolfram_alpha</text>
<text x="186" y="173">What is the 100th decimal of pi?</text>
<text x="372" y="228" fill="#DA1B2E">wolfram_alpha.call(query="100th decimal of pi")</text>
<text x="186" y="320">{"Result": "7"}</text>
<text x="186" y="376">The 100th decimal of pi is 7.</text>
</g>
