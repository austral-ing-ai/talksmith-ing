<!-- talksmith-ascii-sha256: 9b78377498e22cce4f7a7986c741f19be468021cd835042713314abc2d3ab884 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 280" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>La cuenta de memoria</title>
<desc>Adam guarda dos valores por parámetro más el gradiente: un fine-tuning completo de 13B pide unos 109 GB frente a 31 GB de inferencia.</desc>
<rect width="832" height="280" fill="#ffffff"/>
<text x="20" y="33" font-size="17" font-weight="bold" fill="#1F1E1E">Modelo de 13B parámetros · 2 bytes por valor (16 bits)</text>
<g stroke="#3B3535" stroke-width="1.5" stroke-dasharray="5 4">
<line x1="420" y1="74" x2="420" y2="160"/>
<line x1="660" y1="74" x2="660" y2="160"/>
</g>
<g font-size="12" text-anchor="middle">
<text x="420" y="66">1 GPU · 48 GB</text>
<text x="660" y="66">2 GPU · 96 GB</text>
</g>
<text x="20" y="102" font-size="15" font-weight="bold" fill="#1F1E1E">Inferencia</text>
<text x="20" y="120" font-size="12">pesos + activaciones y KV</text>
<rect x="180" y="84" width="155" height="44" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="257.5" y="111" font-size="13" text-anchor="middle">26 GB × 1,2</text>
<text x="347" y="112" font-size="16" font-weight="bold" fill="#1F1E1E">≈ 31 GB</text>
<text x="20" y="178" font-size="15" font-weight="bold" fill="#1F1E1E">Fine-tuning completo</text>
<text x="20" y="196" font-size="12">con Adam</text>
<rect x="180" y="160" width="155" height="44" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="257.5" y="187" font-size="13" text-anchor="middle">pesos + activ. 31 GB</text>
<rect x="335" y="160" width="390" height="44" fill="#DA1B2E"/>
<text x="530" y="187" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">gradientes + 2 estados de Adam · 78 GB</text>
<text x="737" y="188" font-size="16" font-weight="bold" fill="#1F1E1E">≈ 109 GB</text>
<text x="530" y="226" font-size="13" fill="#DA1B2E" text-anchor="middle">13B × 3 valores × 2 bytes = 78 GB que la inferencia no necesita</text>
<text x="20" y="256" font-size="14" font-weight="bold" fill="#1F1E1E">Una GPU de 48 GB no alcanza; tampoco dos.</text>
</svg>
