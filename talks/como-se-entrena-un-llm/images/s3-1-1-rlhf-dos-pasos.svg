<!-- talksmith-ascii-sha256: ea9a7408264ee2c2a598b9c89519e0cb7215e93a21d60e1103f2d235b55b0112 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>RLHF en dos pasos</title>
<desc>El mapa de la sección antes del detalle: primero se entrena un juez (reward model) con comparaciones entre respuestas y después PPO optimiza el modelo SFT contra ese juez, en un ciclo que se repite muchas veces hasta dar el modelo final.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect width="800" height="450" fill="#FFFFFF"/>

<rect x="20" y="20" width="310" height="340" rx="10" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<rect x="420" y="20" width="360" height="340" rx="10" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>

<rect x="40" y="37" width="62" height="22" rx="11" fill="#F9D2D6"/>
<text x="71" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1E1E">PASO 1</text>
<text x="112" y="53" font-size="15" font-weight="bold" fill="#1F1E1E">Entrenar un juez</text>

<rect x="440" y="37" width="62" height="22" rx="11" fill="#F9D2D6"/>
<text x="471" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1E1E">PASO 2</text>
<text x="512" y="53" font-size="15" font-weight="bold" fill="#1F1E1E">Optimizar contra el juez</text>

<rect x="40" y="72" width="270" height="46" rx="6" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="175" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">Datos de comparación</text>
<text x="175" y="109" text-anchor="middle" font-size="12">(prompt, ganadora, perdedora)</text>
<line x1="175" y1="118" x2="175" y2="138" stroke="#3B3535" stroke-width="1.75" marker-end="url(#ag)"/>

<rect x="40" y="138" width="270" height="46" rx="6" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="175" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">Copia del modelo SFT</text>
<text x="175" y="175" text-anchor="middle" font-size="12">con una salida de un solo número</text>
<line x1="175" y1="184" x2="175" y2="208" stroke="#3B3535" stroke-width="1.75" marker-end="url(#ag)"/>

<rect x="40" y="208" width="270" height="52" rx="6" fill="#DA1B2E"/>
<text x="175" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">REWARD MODEL</text>
<text x="175" y="249" text-anchor="middle" font-size="13" fill="#FFFFFF">(el juez)</text>

<text x="175" y="296" text-anchor="middle" font-size="13" font-style="italic">aprende de las preferencias</text>
<text x="175" y="314" text-anchor="middle" font-size="13" font-style="italic">de las personas</text>

<line x1="310" y1="234" x2="440" y2="234" stroke="#DA1B2E" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="375" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#DA1B2E">el juez</text>

<rect x="440" y="76" width="270" height="40" rx="6" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.25"/>
<text x="575" y="101" text-anchor="middle" font-size="14">Prompts, sin respuestas</text>
<line x1="575" y1="116" x2="575" y2="142" stroke="#3B3535" stroke-width="1.75" marker-end="url(#ag)"/>

<rect x="440" y="142" width="270" height="44" rx="6" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="575" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">El modelo SFT genera una respuesta</text>
<line x1="575" y1="186" x2="575" y2="212" stroke="#3B3535" stroke-width="1.75" marker-end="url(#ag)"/>

<rect x="440" y="212" width="270" height="44" rx="6" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="1.75"/>
<text x="575" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">El reward model la puntúa</text>
<line x1="575" y1="256" x2="575" y2="282" stroke="#3B3535" stroke-width="1.75" marker-end="url(#ag)"/>

<rect x="440" y="282" width="270" height="64" rx="6" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="575" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">PPO ajusta el modelo</text>
<text x="575" y="320" text-anchor="middle" font-size="12">para subir el puntaje,</text>
<text x="575" y="336" text-anchor="middle" font-size="12">sin alejarse del SFT</text>

<path d="M710,314 H738 V164 H710" fill="none" stroke="#3B3535" stroke-width="2" stroke-linejoin="round" marker-end="url(#ag)"/>
<text x="760" y="239" text-anchor="middle" font-size="12" font-style="italic" transform="rotate(-90 760 239)">se repite muchas veces</text>

<line x1="575" y1="360" x2="575" y2="390" stroke="#3B3535" stroke-width="1.75" marker-end="url(#ag)"/>
<rect x="490" y="390" width="170" height="40" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="2"/>
<text x="575" y="415" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">MODELO FINAL</text>
</svg>
