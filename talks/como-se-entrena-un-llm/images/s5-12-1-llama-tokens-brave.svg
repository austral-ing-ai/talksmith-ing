<text x="36" y="80">system</text>
<text x="36" y="243">user</text>
<text x="36" y="298" fill="#DA1B2E">assistant</text>
<text x="36" y="427">ipython</text>
<text x="36" y="483">assistant</text>
</g>
<g font-family="'Andale Mono', monospace" font-size="24" fill="#1F1E1E" xml:space="preserve">
<text x="186" y="82">Environment: ipython</text>
<text x="186" y="118">Tools: brave_search, wolfram_alpha</text>
<text x="186" y="154">Cutting Knowledge Date: December 2023</text>
<text x="186" y="190">Today Date: 21 September 2024</text>
<text x="186" y="245">Search the web for the latest price of 1oz gold?</text>
<text x="372" y="300" fill="#DA1B2E">brave_search.call(</text>
<text x="372" y="336" fill="#DA1B2E">query="latest price of 1oz gold")</text>
</g>
