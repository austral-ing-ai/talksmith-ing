<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 567" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3B3535">
<title>Buscar: lo que escribe Llama 3.1</title>
<desc>La conversación de Llama 3.1 con brave_search, turno por turno: el system prompt trae la fecha de corte y la de hoy, el usuario pide un precio actual, el assistant escribe la consulta entre python_tag y eom_id y se detiene; el agente agrega los resultados con el rol ipython.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,1 L12,7 L0,13 z" fill="#DA1B2E"/></marker>
</defs>
