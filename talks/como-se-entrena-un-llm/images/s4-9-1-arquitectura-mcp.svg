<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>MCP: host, cliente y servidor</title>
<desc>Callback a la clase de RAG y MCP: allá armaron un servidor MCP y lo conectaron a un agente.</desc>
<defs>
<marker id="a" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect width="1000" height="380" fill="#ffffff"/>
<rect x="20" y="20" width="620" height="290" rx="10" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="40" y="52" font-size="17"><tspan font-weight="bold" fill="#DA1B2E">MCP host</tspan><tspan fill="#3B3535"> · la aplicación de IA</tspan></text>
<g stroke="#D8D2CE" stroke-width="1.5" fill="#F2EEEE">
<rect x="40" y="140" width="110" height="90" rx="6"/>
<rect x="250" y="80" width="160" height="210" rx="6"/>
<rect x="460" y="100" width="140" height="50" rx="6"/>
<rect x="460" y="220" width="140" height="50" rx="6"/>
<rect x="780" y="95" width="200" height="60" rx="6"/>
<rect x="780" y="215" width="200" height="60" rx="6"/>
</g>
<g text-anchor="middle">
<text x="95" y="191" font-size="18" font-weight="bold" fill="#1F1E1E">LLM</text>
<text x="330" y="165" font-size="17" font-weight="bold" fill="#1F1E1E">agente</text>
<text x="330" y="192">junta las tools</text>
<text x="330" y="212">y enruta</text>
<text x="530" y="130" font-weight="bold" fill="#1F1E1E">cliente MCP A</text>
<text x="530" y="250" font-weight="bold" fill="#1F1E1E">cliente MCP B</text>
<text x="880" y="120" font-weight="bold" fill="#1F1E1E">servidor MCP local</text>
<text x="880" y="141" font-size="14">(archivos)</text>
<text x="880" y="240" font-weight="bold" fill="#1F1E1E">servidor MCP remoto</text>
<text x="880" y="261" font-size="14">(Sentry)</text>
<text x="200" y="163" font-size="13">llamada</text>
<text x="200" y="218" font-size="13">resultado</text>
<text x="710" y="116" font-size="13">STDIO</text>
<text x="710" y="236" font-size="13">Streamable HTTP</text>
</g>
<g stroke="#3B3535" stroke-width="1.8" fill="none" marker-end="url(#a)">
<line x1="150" y1="172" x2="250" y2="172"/>
<line x1="250" y1="198" x2="150" y2="198"/>
<line x1="410" y1="125" x2="460" y2="125"/>
<line x1="410" y1="245" x2="460" y2="245"/>
<line x1="600" y1="125" x2="780" y2="125"/>
<line x1="600" y1="245" x2="780" y2="245"/>
</g>
<rect x="40" y="333" width="96" height="27" rx="4" fill="#F2F2F2"/>
<rect x="560" y="333" width="96" height="27" rx="4" fill="#F2F2F2"/>
<g font-size="14">
<text x="48" y="351" font-family="'Andale Mono', monospace" fill="#1F1E1E">tools/list</text>
<text x="146" y="351">qué herramientas ofrece el servidor</text>
<text x="568" y="351" font-family="'Andale Mono', monospace" fill="#1F1E1E">tools/call</text>
<text x="666" y="351">ejecutar una, con sus argumentos</text>
