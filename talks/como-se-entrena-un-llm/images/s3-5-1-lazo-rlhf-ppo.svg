<!-- talksmith-ascii-sha256: f2e30d3cb4b90992cad0b75b25e0434a28abb4cb6978e1f54923aaf0c292dbac -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 466" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>RLHF con PPO</title>
<desc>La fórmula es la de InstructGPT: el LLM genera, el reward model puntúa y PPO sube el puntaje con una penalización KL contra el modelo SFT.</desc>
<defs>
<marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#8A8282"/></marker>
</defs>
<rect x="0" y="0" width="722" height="466" fill="#ffffff"/>
<g fill="#F2EEEE" stroke="#D8D2CE">
<rect x="30" y="30" width="150" height="56" rx="6"/>
<rect x="300" y="30" width="200" height="56" rx="6"/>
<rect x="300" y="140" width="200" height="60" rx="6"/>
<rect x="150" y="240" width="500" height="90" rx="8"/>
<rect x="250" y="380" width="300" height="56" rx="6"/>
</g>
<g text-anchor="middle" fill="#1F1E1E">
<text x="105" y="63">prompts</text>
<text x="400" y="63" font-weight="bold" font-size="16">LLM (política)</text>
<text x="400" y="167" font-weight="bold">modelo de recompensa</text>
<text x="400" y="186" font-size="13" font-style="italic" fill="#6E6666">(reward model)</text>
<text x="400" y="413">PPO actualiza los pesos del LLM</text>
</g>
<g stroke="#8A8282" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="180" y1="58" x2="300" y2="58"/>
<line x1="400" y1="86" x2="400" y2="140"/>
<line x1="400" y1="200" x2="400" y2="240"/>
<line x1="400" y1="330" x2="400" y2="380"/>
<path d="M550 408 H690 V58 H500"/>
</g>
<g font-size="13" font-style="italic" fill="#6E6666">
<text x="240" y="50" text-anchor="middle">prompt</text>
<text x="410" y="118">respuesta</text>
<text x="410" y="225">puntaje r</text>
</g>
<text x="345" y="277" text-anchor="end" font-size="18" fill="#1F1E1E">objetivo = r − β ·</text>
<rect x="355" y="255" width="240" height="32" rx="16" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
<text x="475" y="277" text-anchor="middle" font-size="18" font-weight="bold" fill="#DA1B2E">KL( LLM || modelo SFT )</text>
<text x="475" y="314" text-anchor="middle" font-size="13" fill="#DA1B2E">freno: no alejarse del modelo SFT</text>
</svg>
