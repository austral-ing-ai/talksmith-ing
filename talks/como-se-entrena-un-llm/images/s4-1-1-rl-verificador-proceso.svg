<g text-anchor="middle">
<text x="300" y="50" font-size="17" font-weight="bold" fill="#1F1E1E">DATOS: problemas con respuesta verificable</text>
<text x="99" y="88" font-size="15">matemática 26K</text>
<text x="233" y="88" font-size="15">código 17K</text>
<text x="367" y="88" font-size="15">STEM 22K</text>
<text x="501" y="88" font-size="15">lógica 15K</text>
<text x="300" y="177" font-size="17" font-weight="bold" fill="#1F1E1E">El modelo genera 16 respuestas por problema</text>
<text x="300" y="210" font-size="15" font-family="'Andale Mono', monospace">&lt;think&gt; razonamiento &lt;/think&gt; respuesta final</text>
<text x="300" y="294" font-size="18" font-weight="bold" fill="#DA1B2E">VERIFICADOR: reglas, sin personas</text>
<text x="300" y="326">¿La respuesta es correcta? Coincide o pasa los tests</text>
<text x="300" y="354">¿Respeta el formato &lt;think&gt;?</text>
