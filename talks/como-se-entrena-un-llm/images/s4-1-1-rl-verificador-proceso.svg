<text x="300" y="518" font-size="18" font-weight="bold" fill="#1F1E1E">GRPO</text>
<text x="300" y="546">compara cada recompensa con el promedio del grupo</text>
<text x="300" y="570">sube la probabilidad de las respuestas mejores que el promedio</text>
<text x="300" y="594">y baja la de las peores</text>
