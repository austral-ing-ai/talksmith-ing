<!-- talksmith-ascii-sha256: cbb7581a0be5088df38f4e76f0b932cadc8a2db07dd56c8256aedfaa55ef5c62 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 458" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>RL con verificador: el proceso</title>
<desc>La diferencia con RLHF está en el verificador: en lugar de un reward model entrenado con preferencias de personas, una regla dice si la respuesta es correcta.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="16" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="1450" height="458" fill="#FFFFFF"/>
<rect x="24" y="24" width="1402" height="84" rx="12" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="2"/>
<text x="48" y="75" font-size="24" font-weight="bold" fill="#1F1E1E">Datos: problemas con respuesta verificable</text>
<g font-size="20">
<rect x="600" y="44" width="190" height="44" rx="8" fill="#F2EEEE"/>
<text x="614" y="73">matemática</text>
<text x="776" y="73" text-anchor="end" font-weight="bold" fill="#1F1E1E">26K</text>
<rect x="804" y="44" width="190" height="44" rx="8" fill="#F2EEEE"/>
<text x="818" y="73">código</text>
<text x="980" y="73" text-anchor="end" font-weight="bold" fill="#1F1E1E">17K</text>
<rect x="1008" y="44" width="190" height="44" rx="8" fill="#F2EEEE"/>
<text x="1022" y="73">STEM</text>
<text x="1184" y="73" text-anchor="end" font-weight="bold" fill="#1F1E1E">22K</text>
<rect x="1212" y="44" width="190" height="44" rx="8" fill="#F2EEEE"/>
<text x="1226" y="73">lógica</text>
<text x="1388" y="73" text-anchor="end" font-weight="bold" fill="#1F1E1E">15K</text>
</g>
<g stroke="#3B3535" stroke-width="2.5" fill="none" marker-end="url(#ah)">
<line x1="184" y1="108" x2="184" y2="160"/>
<line x1="344" y1="270" x2="408" y2="270"/>
<line x1="748" y1="270" x2="838" y2="270"/>
<line x1="976" y1="270" x2="1066" y2="270"/>
<path d="M1246,380 V420 H184 V380"/>
</g>
<rect x="24" y="160" width="320" height="220" rx="14" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="2"/>
<g text-anchor="middle">
<text x="184" y="204" font-size="26" font-weight="bold" fill="#1F1E1E">El modelo</text>
<text x="184" y="240" font-size="21">genera 16 respuestas</text>
<text x="184" y="266" font-size="21">por problema</text>
</g>
<rect x="42" y="286" width="284" height="70" rx="8" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<g font-family="'Andale Mono', monospace" font-size="18" xml:space="preserve">
<text x="56" y="314">&lt;think&gt; razonamiento</text>
<text x="56" y="342">&lt;/think&gt; respuesta final</text>
</g>
<rect x="408" y="160" width="340" height="220" rx="14" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="3"/>
<g text-anchor="middle">
<text x="578" y="206" font-size="28" font-weight="bold" fill="#DA1B2E">VERIFICADOR</text>
<rect x="463" y="222" width="230" height="32" rx="16" fill="#F9D2D6"/>
<text x="578" y="245" font-size="20" font-weight="bold" fill="#1F1E1E">reglas, sin personas</text>
<text x="578" y="292" font-size="21">¿la respuesta es correcta?</text>
<text x="578" y="320" font-size="21">coincide o pasa los tests</text>
<text x="578" y="350" font-size="21">¿respeta el formato &lt;think&gt;?</text>
</g>
<text x="907" y="188" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F1E1E">16 recompensas</text>
<g stroke-width="1.5">
<rect x="838" y="201" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="874" y="201" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#D8D2CE"/>
<rect x="910" y="201" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="946" y="201" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="838" y="237" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#D8D2CE"/>
<rect x="874" y="237" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="910" y="237" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#D8D2CE"/>
<rect x="946" y="237" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#D8D2CE"/>
<rect x="838" y="273" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="874" y="273" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="910" y="273" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#D8D2CE"/>
<rect x="946" y="273" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="838" y="309" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#D8D2CE"/>
<rect x="874" y="309" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="910" y="309" width="30" height="30" rx="4" fill="#F2EEEE" stroke="#3B3535"/>
<rect x="946" y="309" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#D8D2CE"/>
</g>
<g text-anchor="middle" font-size="18">
<g font-weight="bold" fill="#1F1E1E">
<text x="853" y="222">1</text><text x="925" y="222">1</text><text x="961" y="222">1</text>
<text x="889" y="258">1</text>
<text x="853" y="294">1</text><text x="889" y="294">1</text><text x="961" y="294">1</text>
<text x="889" y="330">1</text><text x="925" y="330">1</text>
</g>
<text x="889" y="222">0</text>
<text x="853" y="258">0</text><text x="925" y="258">0</text><text x="961" y="258">0</text>
<text x="925" y="294">0</text>
<text x="853" y="330">0</text><text x="961" y="330">0</text>
</g>
<text x="907" y="366" text-anchor="middle" font-size="19">1 = correcta · 0 = no</text>
<rect x="1066" y="160" width="360" height="220" rx="14" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="2"/>
<g text-anchor="middle">
<text x="1246" y="204" font-size="26" font-weight="bold" fill="#1F1E1E">GRPO</text>
<text x="1246" y="240" font-size="21">compara cada recompensa</text>
<text x="1246" y="266" font-size="21">con el promedio del grupo</text>
</g>
<line x1="1090" y1="288" x2="1402" y2="288" stroke="#D8D2CE" stroke-width="1.5"/>
<path d="M1088,316 L1100,316 L1094,304 z" fill="#3B3535"/>
<text x="1108" y="316" font-size="19">sube las mejores que el promedio</text>
<path d="M1088,336 L1100,336 L1094,348 z" fill="#3B3535"/>
<text x="1108" y="348" font-size="19">baja las peores</text>
<rect x="653" y="406" width="124" height="28" fill="#FFFFFF"/>
<text x="715" y="427" text-anchor="middle" font-size="21" font-weight="bold">se repite</text>
</svg>
