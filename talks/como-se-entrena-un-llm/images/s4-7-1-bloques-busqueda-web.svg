<!-- talksmith-ascii-sha256: bba6d64b5fa7326f5acd472787128b10c15d5b6a498d32b0188d5942e42a7a31 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 412" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>Qué genera el modelo al buscar</title>
<desc>Una respuesta de la API con búsqueda web trae cuatro bloques en orden: tres los genera el modelo y uno, el resultado de la búsqueda, lo agrega la plataforma.</desc>
<rect width="890" height="412" fill="#FFFFFF"/>
<rect x="20" y="20" width="850" height="372" rx="12" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="44" y="52" font-size="18" font-weight="bold" fill="#1F1E1E">Una respuesta de la API</text>
<g font-family="'Andale Mono', monospace" font-size="13">
<text x="44" y="76">stop_reason: "end_turn"</text>
<text x="270" y="76">web_search_requests: 1</text>
</g>
<line x1="20" y1="92" x2="870" y2="92" stroke="#D8D2CE"/>
<g font-size="12" font-weight="bold" fill="#1F1E1E">
<text x="48" y="114" text-anchor="middle">#</text>
<text x="76" y="114">Bloque</text>
<text x="290" y="114">Contenido</text>
<text x="800" y="114" text-anchor="middle">Quién lo genera</text>
</g>
<line x1="20" y1="126" x2="870" y2="126" stroke="#D8D2CE"/>
<line x1="20" y1="178" x2="870" y2="178" stroke="#D8D2CE"/>
<line x1="20" y1="230" x2="870" y2="230" stroke="#D8D2CE"/>
<line x1="20" y1="282" x2="870" y2="282" stroke="#D8D2CE"/>
<rect x="21" y="231" width="5" height="50" fill="#DA1B2E"/>
<g font-size="13" font-weight="bold" text-anchor="middle">
<circle cx="48" cy="152" r="12" fill="#F2EEEE"/><text x="48" y="157">1</text>
<circle cx="48" cy="204" r="12" fill="#F2EEEE"/><text x="48" y="209">2</text>
<circle cx="48" cy="256" r="12" fill="#DA1B2E"/><text x="48" y="261" fill="#FFFFFF">3</text>
<circle cx="48" cy="331" r="12" fill="#F2EEEE"/><text x="48" y="336">4</text>
</g>
<text x="76" y="157">texto</text>
<text x="76" y="209" font-family="'Andale Mono', monospace" font-size="14">server_tool_use</text>
<text x="76" y="261" font-family="'Andale Mono', monospace" font-size="14" fill="#1F1E1E">web_search_tool_result</text>
<text x="76" y="336">texto con cita</text>
<g font-family="'Andale Mono', monospace" font-size="14">
<text x="290" y="157">"I'll search for when Claude Shannon was born."</text>
<text x="290" y="209">query: "claude shannon birth date"</text>
<text x="290" y="309">"Claude Shannon was born on April 30, 1916,</text>
<text x="290" y="329" xml:space="preserve"> in Petoskey, Michigan"</text>
<text x="344" y="360" font-size="13">"Claude Elwood Shannon (April 30, 1916 – ..."</text>
</g>
<text x="290" y="261" fill="#1F1E1E">resultado de Wikipedia <tspan font-family="'Andale Mono', monospace" font-size="14">(url, title, page_age)</tspan></text>
<line x1="292" y1="344" x2="292" y2="366" stroke="#D8D2CE" stroke-width="3"/>
<text x="302" y="360" font-size="13" font-weight="bold">cita:</text>
<g font-size="14" font-weight="bold" text-anchor="middle">
<rect x="750" y="138" width="100" height="28" rx="14" fill="#F2EEEE"/><text x="800" y="157">modelo</text>
<rect x="750" y="190" width="100" height="28" rx="14" fill="#F2EEEE"/><text x="800" y="209">modelo</text>
<rect x="750" y="242" width="100" height="28" rx="14" fill="#DA1B2E"/><text x="800" y="261" fill="#FFFFFF">plataforma</text>
<rect x="750" y="317" width="100" height="28" rx="14" fill="#F2EEEE"/><text x="800" y="336">modelo</text>
</g>
</svg>
