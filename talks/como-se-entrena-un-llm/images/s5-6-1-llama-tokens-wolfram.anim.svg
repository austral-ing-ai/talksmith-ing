<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 459" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3B3535" class="ts-anim-s5-6-1-llama-tokens-wolfram">
