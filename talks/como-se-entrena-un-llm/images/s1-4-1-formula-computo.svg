<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Tres perillas y una cuenta</title>
<desc>La definición de ley de escala de las notas, dicha con la fórmula: C ≈ 6 · N · D, con el ejemplo de Chinchilla.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
<rect x="110" y="20" width="180" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F1E1E">N</text>
<text x="200" y="70" text-anchor="middle" font-size="14">parámetros</text>
<rect x="390" y="20" width="180" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="480" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F1E1E">D</text>
<text x="480" y="70" text-anchor="middle" font-size="14">tokens</text>
<line x1="200" y1="80" x2="290" y2="140" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="480" y1="80" x2="390" y2="140" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="190" y="140" width="300" height="85" rx="10" fill="#DA1B2E"/>
<text x="340" y="182" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">C ≈ 6 · N · D</text>
<text x="340" y="210" text-anchor="middle" font-size="14" fill="#FFFFFF">FLOPs de entrenamiento</text>
<line x1="340" y1="225" x2="340" y2="265" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="190" y="265" width="300" height="50" rx="8" fill="#F2EEEE" stroke="#D8D2CE"/>
<text x="340" y="296" text-anchor="middle" font-size="16">pérdida (cross-entropy) al final</text>
<rect x="20" y="340" width="640" height="70" rx="10" fill="#FFFFFF" stroke="#D8D2CE"/>
<rect x="36" y="359" width="110" height="30" rx="15" fill="#F9D2D6"/>
<text x="91" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">Chinchilla</text>
<text x="166" y="372" font-size="18" font-weight="bold" fill="#1F1E1E">6 · 70·10<tspan dy="-8" font-size="11">9</tspan><tspan dy="8"> · 1,4·10</tspan><tspan dy="-8" font-size="11">12</tspan><tspan dy="8">  ≈  5,9·10</tspan><tspan dy="-8" font-size="11">23</tspan><tspan dy="8"> FLOPs</tspan></text>
<text x="166" y="396" font-size="13">N = 70 mil millones de parámetros · D = 1,4 billones de tokens</text>
</svg>
