<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 602" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#3B3535">
<title>Calcular: de los tokens al JSON</title>
<desc>Es el puente entre las dos láminas: la anterior muestra lo que ve el modelo, la siguiente lo que ve tu código.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="16" markerHeight="16" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="1440" height="602" fill="#FFFFFF"/>

<text x="40" y="59" font-size="26" font-weight="bold" fill="#1F1E1E">IDA · del modelo a tu código</text>
<text x="836" y="59" font-size="26" font-weight="bold" fill="#1F1E1E">VUELTA · de tu código al modelo</text>

<rect x="40" y="284" width="1360" height="108" rx="14" fill="#F2EEEE"/>
<rect x="120" y="300" width="440" height="76" rx="38" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="3"/>
<rect x="960" y="300" width="440" height="76" rx="38" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="3"/>
<g text-anchor="middle" fill="#1F1E1E">
<text x="340" y="332">el servidor saca los tags</text>
<text x="340" y="359">y lee el JSON</text>
<text x="1180" y="332">el servidor lo convierte en un turno</text>
<text x="1180" y="359">que el modelo sabe leer</text>
<text x="800" y="334" font-size="22" font-weight="bold" fill="#DA1B2E" letter-spacing="2">SERVIDOR</text>
<text x="800" y="362" font-size="18" fill="#3B3535">traduce en el medio</text>
</g>

<text x="40" y="112"><tspan font-weight="bold" fill="#1F1E1E">modelo</tspan> · texto con tags</text>
<text x="836" y="112"><tspan font-weight="bold" fill="#1F1E1E">servidor</tspan> · texto con tags</text>
<text x="40" y="438"><tspan font-weight="bold" fill="#1F1E1E">servidor</tspan> · JSON de la API</text>
<text x="960" y="438"><tspan font-weight="bold" fill="#1F1E1E">tu código</tspan> · JSON</text>
<text x="800" y="458" text-anchor="middle" font-weight="bold" fill="#1F1E1E">tu código</text>

<rect x="40" y="124" width="600" height="140" rx="10" fill="#FFFFFF" stroke="#3B3535" stroke-width="2"/>
<rect x="836" y="124" width="564" height="84" rx="10" fill="#FFFFFF" stroke="#3B3535" stroke-width="2"/>
<rect x="40" y="450" width="600" height="112" rx="10" fill="#F2F2F2" stroke="#D8D2CE" stroke-width="2"/>
<rect x="960" y="450" width="440" height="112" rx="10" fill="#F2F2F2" stroke="#D8D2CE" stroke-width="2"/>
<rect x="710" y="470" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="2"/>
<text x="800" y="499" text-anchor="middle">calcula</text>

<g font-family="'Andale Mono', monospace" xml:space="preserve">
<text x="64" y="156"><tspan fill="#DA1B2E" font-weight="bold">&lt;|python_tag|&gt;</tspan>{"type": "function",</text>
<text x="64" y="184">  "name": "calcular",</text>
<text x="64" y="212">  "parameters": {"expresion": "1234 * 5678"}}</text>
<text x="64" y="240" fill="#DA1B2E" font-weight="bold">&lt;|eom_id|&gt;</text>
<text x="860" y="156" fill="#DA1B2E" font-weight="bold">&lt;|start_header_id|&gt;ipython&lt;|end_header_id|&gt;</text>
<text x="860" y="184">7006652<tspan fill="#DA1B2E" font-weight="bold">&lt;|eot_id|&gt;</tspan></text>
<text x="64" y="482">"tool_calls": [{"function": {</text>
<text x="64" y="510">  "name": "calcular",</text>
<text x="64" y="538">  "arguments": {"expresion": "1234 * 5678"}}}]</text>
<text x="984" y="482">{"role": "tool",</text>
<text x="984" y="510"> "tool_name": "calcular",</text>
<text x="984" y="538"> "content": "7006652"}</text>
<text x="800" y="531" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F1E1E">7006652</text>
</g>

<g stroke="#3B3535" stroke-width="2.5" fill="none" marker-end="url(#ah)">
<line x1="340" y1="264" x2="340" y2="300"/>
<line x1="340" y1="376" x2="340" y2="450"/>
<line x1="640" y1="506" x2="710" y2="506"/>
<line x1="890" y1="506" x2="960" y2="506"/>
<line x1="1180" y1="450" x2="1180" y2="376"/>
<line x1="1180" y1="300" x2="1180" y2="208"/>
</g>
</svg>
