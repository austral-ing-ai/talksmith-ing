<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 515" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="14">
<title>De dónde salió el thinking</title>
<desc>Esta es la lámina que contesta la pregunta que la sección nunca contestaba: cómo se logró que un modelo razone.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L10,6 L0,11 Z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="720" height="515" fill="#ffffff"/>
<text x="40" y="36" font-size="20" font-weight="bold" fill="#1F1E1E">DeepSeek-R1-Zero durante el entrenamiento por refuerzo</text>
<text x="40" y="60" font-size="14">(AIME 2024, pass@1 promedio)</text>
<g stroke="#F2EEEE" stroke-width="1">
<line x1="90" y1="110" x2="600" y2="110"/><line x1="90" y1="170" x2="600" y2="170"/><line x1="90" y1="230" x2="600" y2="230"/><line x1="90" y1="290" x2="600" y2="290"/><line x1="90" y1="350" x2="600" y2="350"/>
</g>
<g font-size="12" text-anchor="end">
<text x="82" y="114">100%</text><text x="82" y="174">80%</text><text x="82" y="234">60%</text><text x="82" y="294">40%</text><text x="82" y="354">20%</text><text x="82" y="414">0%</text>
</g>
<text transform="translate(36,260) rotate(-90)" text-anchor="middle" font-size="13">precisión (AIME 2024, pass@1)</text>
<line x1="90" y1="100" x2="90" y2="410" stroke="#3B3535" stroke-width="1.5"/>
<line x1="90" y1="410" x2="622" y2="410" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="90" y="432" font-size="13">inicio</text>
<text x="620" y="432" font-size="13" text-anchor="end">pasos de entrenamiento por refuerzo</text>
<path d="M90,401 C300,397 430,330 560,250" fill="none" stroke="#3B3535" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="574" y="250" font-size="13">largo promedio</text>
<text x="574" y="266" font-size="13">de la respuesta</text>
<text x="574" y="282" font-size="11">(escala propia)</text>
<path d="M90,363 C250,330 380,200 560,176" fill="none" stroke="#DA1B2E" stroke-width="3.5"/>
<line x1="560" y1="170" x2="560" y2="156" stroke="#DA1B2E" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="90" cy="363" r="5.5" fill="#DA1B2E"/>
<circle cx="560" cy="176" r="5.5" fill="#DA1B2E"/>
<circle cx="560" cy="150" r="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="102" y="386" font-size="20" font-weight="bold" fill="#1F1E1E">15,6%</text>
<text x="546" y="214" font-size="20" font-weight="bold" fill="#1F1E1E" text-anchor="end">77,9%</text>
<text x="574" y="148" font-size="22" font-weight="bold" fill="#DA1B2E">86,7%</text>
<text x="574" y="166" font-size="13">con <tspan font-style="italic">self-consistency</tspan></text>
<text x="574" y="182" font-size="13">(cons@16)</text>
<text x="40" y="470" font-size="16" font-weight="bold" fill="#1F1E1E">En paralelo: el largo promedio de la respuesta crece solo.</text>
<text x="40" y="494" font-size="15">Nadie le pide al modelo que escriba más. Le conviene, y lo hace.</text>
</svg>
