<!-- talksmith-ascii-sha256: e2b01b6fa8415e122bc87a04491ee105587fc990be4174e87292b67e6d7d9db0 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 558 499" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Chain of Thought (CoT)</title>
<desc>Comparación vertical: sin CoT la pregunta salta directo a la respuesta; con CoT los mismos extremos se conectan a través de pasos escritos intermedios.</desc>
<defs>
<marker id="ahG" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#9A9494"/></marker>
<marker id="ahR" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="558" height="499" fill="#ffffff"/>

<text x="124" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#8A8484">SIN CoT</text>
<text x="434" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#DA1B2E">CON CoT</text>

<path d="M24,80 L534,80" stroke="#E0DCDC" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
<path d="M24,392 L534,392" stroke="#E0DCDC" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

<path d="M124,102 L124,370" stroke="#9A9494" stroke-width="1.6" fill="none" marker-end="url(#ahG)"/>

<text x="140" y="220" font-size="13" fill="#8A8484">un solo salto</text>
<text x="140" y="238" font-size="13" fill="#8A8484">nada escrito</text>
<text x="140" y="256" font-size="13" fill="#8A8484">entre medio</text>

<path d="M434,102 L434,136" stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ahR)"/>
<path d="M434,180 L434,214" stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ahR)"/>
<path d="M434,258 L434,292" stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ahR)"/>
<path d="M434,336 L434,370" stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ahR)"/>

<rect x="334" y="136" width="200" height="44" rx="4" fill="#FDECEE" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="434" y="163" text-anchor="middle" font-size="15">paso 1</text>
<rect x="334" y="214" width="200" height="44" rx="4" fill="#FDECEE" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="434" y="241" text-anchor="middle" font-size="15">paso 2</text>
<rect x="334" y="292" width="200" height="44" rx="4" fill="#FDECEE" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="434" y="319" text-anchor="middle" font-size="15">paso 3</text>

<rect x="24" y="58" width="200" height="44" rx="4" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="124" y="86" text-anchor="middle" font-size="16" font-weight="bold">pregunta</text>
<rect x="334" y="58" width="200" height="44" rx="4" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="434" y="86" text-anchor="middle" font-size="16" font-weight="bold">pregunta</text>

<rect x="24" y="370" width="200" height="44" rx="4" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="124" y="398" text-anchor="middle" font-size="16" font-weight="bold">respuesta</text>
<rect x="334" y="370" width="200" height="44" rx="4" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
<text x="434" y="398" text-anchor="middle" font-size="16" font-weight="bold">respuesta</text>

<text x="279" y="452" text-anchor="middle" font-size="14">cada paso escrito entra al contexto</text>
<text x="279" y="471" text-anchor="middle" font-size="14">y condiciona la predicción del siguiente</text>
</svg>
