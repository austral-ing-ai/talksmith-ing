<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 492" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>Chain of Thought (CoT)</title>
<desc>Sin CoT el modelo salta de la pregunta a la respuesta sin nada escrito entre medio; con CoT escribe pasos intermedios, y cada paso escrito entra al contexto y condiciona la predicción del siguiente.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="528" height="492" fill="#FFFFFF"/>
<g font-size="18" font-weight="bold" fill="#1F1E1E" text-anchor="middle">
<text x="114" y="37">SIN CoT</text>
<text x="414" y="37">CON CoT</text>
</g>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="24" y="57" width="180" height="44" rx="8"/>
<rect x="324" y="57" width="180" height="44" rx="8"/>
<rect x="24" y="365" width="180" height="44" rx="8"/>
<rect x="324" y="365" width="180" height="44" rx="8"/>
</g>
<g fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2">
<rect x="324" y="137" width="180" height="40" rx="8"/>
<rect x="324" y="213" width="180" height="40" rx="8"/>
<rect x="324" y="289" width="180" height="40" rx="8"/>
</g>
<g font-size="16" fill="#1F1E1E" text-anchor="middle">
<text x="114" y="84">pregunta</text>
<text x="414" y="84">pregunta</text>
<text x="114" y="392">respuesta</text>
<text x="414" y="392">respuesta</text>
</g>
<g font-size="16" font-weight="bold" fill="#DA1B2E" text-anchor="middle">
<text x="414" y="162">paso 1</text>
<text x="414" y="238">paso 2</text>
<text x="414" y="314">paso 3</text>
</g>
<g stroke="#3B3535" stroke-width="2" marker-end="url(#ah)">
<line x1="114" y1="101" x2="114" y2="365"/>
<line x1="414" y1="101" x2="414" y2="137"/>
<line x1="414" y1="329" x2="414" y2="365"/>
</g>
<g stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)">
<line x1="414" y1="177" x2="414" y2="213"/>
<line x1="414" y1="253" x2="414" y2="289"/>
</g>
<text x="128" y="220" font-weight="bold" fill="#1F1E1E">un solo salto</text>
<text x="128" y="240">nada escrito</text>
<text x="128" y="258">entre medio</text>
<g text-anchor="middle">
<text x="264" y="446">cada paso escrito entra al contexto</text>
<text x="264" y="466">y condiciona la predicción del siguiente</text>
</g>
</svg>
