<!-- talksmith-ascii-sha256: 52461f0e55357b6f0b78f24556bd84aaab93a093d80e83bb79cc7ebb208b59fc -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Elegir modelo: la primera pregunta que dé “sí” decide</title>
<desc>El árbol vale más por el orden de las preguntas que por los nombres que devuelve.</desc>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L10,4 L0,8 Z" fill="#6B6B6B"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="552" fill="#ffffff"/>

<text x="70" y="40" font-size="13" letter-spacing="1.1" fill="#8A8383">PREGUNTAS, EN ORDEN FIJO</text>
<text x="480" y="40" font-size="13" letter-spacing="1.1" fill="#8A8383">LA PRIMERA QUE DÉ “SÍ” DECIDE</text>

<rect x="70" y="58" width="340" height="64" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
<rect x="70" y="178" width="340" height="64" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
<rect x="70" y="298" width="340" height="64" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>

<circle cx="44" cy="90" r="14" fill="#DA1B2E"/>
<circle cx="44" cy="210" r="14" fill="#DA1B2E"/>
<circle cx="44" cy="330" r="14" fill="#DA1B2E"/>
<text x="44" y="95" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="44" y="215" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="44" y="335" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

<text x="94" y="85" font-size="17" font-weight="bold">¿La tarea es simple?</text>
<text x="94" y="106" font-size="13.5" fill="#6B6B6B">clasificar, extraer, rotular</text>
<text x="94" y="205" font-size="17" font-weight="bold">¿Necesita más de 1M de contexto?</text>
<text x="94" y="226" font-size="13.5" fill="#6B6B6B">restricción dura, no negociable</text>
<text x="94" y="325" font-size="17" font-weight="bold">¿El costo es crítico por volumen?</text>
<text x="94" y="346" font-size="13.5" fill="#6B6B6B">se pregunta última, no primera</text>

<rect x="480" y="58" width="490" height="64" rx="6" fill="#F4F2F2" stroke="#C9C4C4" stroke-width="1.2"/>
<rect x="480" y="178" width="490" height="64" rx="6" fill="#F4F2F2" stroke="#C9C4C4" stroke-width="1.2"/>
<rect x="480" y="298" width="490" height="64" rx="6" fill="#F4F2F2" stroke="#C9C4C4" stroke-width="1.2"/>
<rect x="480" y="418" width="490" height="64" rx="6" fill="#F4F2F2" stroke="#C9C4C4" stroke-width="1.2"/>

<text x="504" y="85" font-size="17" font-weight="bold">Modelo chico y barato</text>
<text x="504" y="106" font-size="13.5" fill="#6B6B6B">Haiku 4.5 · GPT-4o Mini · Gemini Flash</text>
<text x="504" y="205" font-size="17" font-weight="bold">El de ventana más grande disponible</text>
<text x="504" y="226" font-size="13.5" fill="#6B6B6B">hoy: Gemini Pro, 2M</text>
<text x="504" y="325" font-size="17" font-weight="bold">Model cascading</text>
<text x="504" y="346" font-size="13.5" fill="#6B6B6B">barato primero, caro sólo si hace falta</text>
<text x="504" y="445" font-size="17" font-weight="bold">El mejor modelo</text>
<text x="504" y="466" font-size="13.5" fill="#6B6B6B">para la calidad que se necesita</text>

<line x1="410" y1="90" x2="480" y2="90" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="410" y1="210" x2="480" y2="210" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="410" y1="330" x2="480" y2="330" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="445" y="82" font-size="13" font-weight="bold" fill="#3B3535" text-anchor="middle">SÍ</text>
<text x="445" y="202" font-size="13" font-weight="bold" fill="#3B3535" text-anchor="middle">SÍ</text>
<text x="445" y="322" font-size="13" font-weight="bold" fill="#3B3535" text-anchor="middle">SÍ</text>

<line x1="240" y1="122" x2="240" y2="178" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="240" y1="242" x2="240" y2="298" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M240,362 L240,450 L480,450" fill="none" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="252" y="155" font-size="13" font-weight="bold" fill="#6B6B6B">NO</text>
<text x="252" y="275" font-size="13" font-weight="bold" fill="#6B6B6B">NO</text>
<text x="252" y="400" font-size="13" font-weight="bold" fill="#6B6B6B">NO</text>

<text x="30" y="518" font-size="14" fill="#6B6B6B">El orden es el contenido: primero dificultad, después contexto, después costo. Los nombres de modelo cambian; las preguntas no.</text>
</svg>
