<!-- talksmith-ascii-sha256: 3fe4e733568c444ed0b1001db6f767cbfa89c9a9631e6e4811af5896fa6132fa -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 510" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">
<title>Thinking: el mecanismo</title>
<desc>Esta es la lámina del mecanismo, y la palabra que hay que fijar es “adaptativo”: el modelo decide petición por petición si escribe un bloque de razonamiento.</desc>
<defs>
<marker id="ag" markerWidth="9" markerHeight="9" refX="8.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.7 L8.4 4.5 L0 8.3 Z" fill="#8A8080"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.7 L8.4 4.5 L0 8.3 Z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="668" height="510" fill="#ffffff"/>

<text x="334" y="36" text-anchor="middle" font-size="15.5" font-weight="bold">Lo que pasa en una petición</text>

<rect x="268" y="54" width="132" height="38" rx="6" fill="#F5F3F3" stroke="#B9B2B2" stroke-width="1.6"/>
<text x="334" y="78" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="13">prompt</text>
<path d="M334 92 V110" stroke="#8A8080" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>

<rect x="104" y="110" width="460" height="52" rx="6" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.8"/>
<text x="334" y="132" text-anchor="middle" font-size="13">el modelo evalúa la dificultad de esta petición</text>
<text x="334" y="152" text-anchor="middle" font-size="13">y decide, ahí mismo, si piensa y cuánto</text>

<rect x="24" y="216" width="620" height="258" rx="10" fill="none" stroke="#B9B2B2" stroke-width="1.4" stroke-dasharray="7 5"/>

<path d="M334 162 V190 H181 V232" stroke="#8A8080" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
<path d="M334 162 V190 H487 V232" stroke="#DA1B2E" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="258" y="184" text-anchor="middle" font-size="11.5" fill="#8A8080">tarea simple</text>
<text x="410" y="184" text-anchor="middle" font-size="11.5" fill="#DA1B2E">tarea de varios pasos</text>

<rect x="40" y="232" width="282" height="114" rx="6" fill="#F5F3F3" stroke="#B9B2B2" stroke-width="1.8"/>
<text x="181" y="262" text-anchor="middle" font-size="14" font-weight="bold">SIN BLOQUE</text>
<text x="181" y="286" text-anchor="middle">la respuesta vuelve directo,</text>
<text x="181" y="304" text-anchor="middle">sin pasos intermedios</text>
<text x="181" y="328" text-anchor="middle" font-size="11.5" fill="#8A8080">el modelo decidió no pensar</text>

<rect x="346" y="232" width="282" height="114" rx="6" fill="#FCEFF1" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="487" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#DA1B2E">BLOQUE DE THINKING</text>
<text x="487" y="286" text-anchor="middle">tipo propio, aparte del texto</text>
<text x="487" y="304" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="11">display: summarized u omitted</text>
<text x="487" y="328" text-anchor="middle" font-size="11.5" fill="#8A8080">puede volver resumido o vacío</text>

<path d="M181 346 V376 H334" stroke="#8A8080" stroke-width="1.6" fill="none"/>
<path d="M487 346 V376 H334" stroke="#8A8080" stroke-width="1.6" fill="none"/>
<path d="M334 376 V398" stroke="#8A8080" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>

<rect x="164" y="398" width="340" height="58" rx="6" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.8"/>
<text x="334" y="422" text-anchor="middle" font-size="14" font-weight="bold">TEXTO DE LA RESPUESTA</text>
<text x="334" y="442" text-anchor="middle" font-size="11.5" fill="#8A8080">lo único que ve el usuario</text>

<rect x="190" y="462" width="290" height="24" rx="12" fill="#FFFFFF" stroke="#B9B2B2" stroke-width="1.4"/>
<text x="207" y="478" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', monospace" font-size="12">max_tokens</tspan><tspan font-family="Helvetica, Arial, sans-serif" font-size="12"> — techo duro de toda la salida</tspan></text>
</svg>
