<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Thinking: el mecanismo</title>
<desc>Esta es la lámina del mecanismo, y la palabra que hay que fijar es "adaptativo".</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="740" height="560" fill="#ffffff"/>
<text x="370" y="38" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.5" fill="#1F1E1E">LO QUE PASA EN UNA PETICIÓN</text>
<rect x="40" y="66" width="130" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="105" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">prompt</text>
<path d="M170 96 H230" stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="230" y="58" width="280" height="76" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="370" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">el modelo evalúa la dificultad</text>
<text x="370" y="114" text-anchor="middle" font-size="14">y decide, en esta misma petición</text>
<path d="M320 134 V162 H200 V230" stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M420 134 V162 H540 V230" stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="190" y="186" text-anchor="end" font-size="14" font-style="italic">tarea simple</text>
<text x="550" y="186" font-size="14" font-style="italic">tarea de varios pasos</text>
<rect x="46" y="204" width="648" height="298" rx="12" fill="none" stroke="#3B3535" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="60" y="230" width="280" height="132" rx="8" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="2"/>
<path d="M60 266 V238 a8 8 0 0 1 8 -8 H332 a8 8 0 0 1 8 8 V266 z" fill="#D8D2CE"/>
<text x="200" y="254" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#1F1E1E">SIN BLOQUE</text>
<text x="200" y="296" text-anchor="middle" font-size="15">la respuesta vuelve</text>
<text x="200" y="319" text-anchor="middle" font-size="15">directo, sin pasos</text>
<text x="200" y="342" text-anchor="middle" font-size="15">intermedios</text>
<rect x="400" y="230" width="280" height="132" rx="8" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2"/>
<path d="M400 266 V238 a8 8 0 0 1 8 -8 H672 a8 8 0 0 1 8 8 V266 z" fill="#DA1B2E"/>
<text x="540" y="254" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#FFFFFF">BLOQUE DE THINKING</text>
<text x="540" y="296" text-anchor="middle" font-size="15">tipo propio, aparte del texto</text>
<text x="456" y="321" font-size="14" font-family="'Andale Mono', monospace" xml:space="preserve">display: summarized</text>
<text x="456" y="342" font-size="14" font-family="'Andale Mono', monospace" xml:space="preserve">         u omitted</text>
<path d="M200 362 V394 H540 V362" stroke="#3B3535" stroke-width="2" fill="none"/>
<path d="M370 394 V422" stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="200" y="422" width="340" height="64" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="370" y="449" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#1F1E1E">TEXTO DE LA RESPUESTA</text>
<text x="370" y="471" text-anchor="middle" font-size="14">lo único que ve el usuario</text>
<text x="152" y="530" font-size="15" xml:space="preserve"><tspan font-family="'Andale Mono', monospace" font-weight="bold" fill="#1F1E1E">max_tokens</tspan><tspan> es el techo duro de TODA la salida: thinking + texto</tspan></text>
</svg>
