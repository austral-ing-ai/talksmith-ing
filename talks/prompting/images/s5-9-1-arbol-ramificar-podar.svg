<text x="398" y="224" font-weight="bold" font-size="12.5">3. EXPANDIR</text>
<text x="398" y="241" font-size="11.5" fill="#8A8282">solo la mejor</text>

<text x="398" y="306" font-weight="bold" font-size="12.5">4. SELECCIONAR</text>
<text x="398" y="323" font-size="11.5" fill="#8A8282">la solución</text>

<text x="24" y="356" font-size="12" fill="#6E6666">CoT es este árbol con una sola rama y sin vuelta atrás.</text>
