<svg class="ts-anim-s5-8-1-cadena-cuatro-etapas" xmlns="http://www.w3.org/2000/svg" viewBox="36 0 792 522" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Prompt chaining</title>
