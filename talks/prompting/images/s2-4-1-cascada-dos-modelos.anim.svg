<line x1="200" y1="310" x2="200" y2="360"/>
<line x1="200" y1="440" x2="200" y2="474"/>
</g>
<!-- pedidos: ride under the boxes, which swallow them while they process -->
<g class="b1" opacity="0"><circle r="8" fill="#1F5FA8" stroke="#FFFFFF" stroke-width="2"/></g>
<g class="b2" opacity="0"><circle r="8" fill="#1F5FA8" stroke="#FFFFFF" stroke-width="2"/></g>
