<text class="k1" x="365" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F5FA8" opacity="0">×1</text>
<text class="k2" x="365" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F5FA8" opacity="0">×2</text>
<text class="k3" x="365" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F5FA8" opacity="0">×3</text>
<text class="k4" x="365" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F5FA8" opacity="0">×4</text>
<text class="c1" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Entra un pedido: el modelo barato intenta resolverlo</text>
<text class="c2" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Confianza suficiente: SÍ, sale por la rama corta</text>
<text class="c3" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Otros pedidos hacen el mismo recorrido corto, cada vez más rápido</text>
<text class="c4" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Llega un pedido más</text>
<text class="c5" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">La confianza no alcanza: NO, baja al modelo caro, que resuelve</text>
<text class="c6" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Sale por el retorno de abajo: DOS llamadas, una sola vez</text>
<text class="k5" x="214" y="340" font-size="16" font-weight="bold" fill="#1F5FA8" opacity="0">×1</text>
