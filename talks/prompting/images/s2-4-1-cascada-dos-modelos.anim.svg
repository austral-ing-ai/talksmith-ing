<defs>
<marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect x="46" y="2" width="698" height="598" fill="#FFFFFF"/>
<text x="200" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Pedido entra</text>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="200" y1="46" x2="200" y2="76"/>
<line x1="200" y1="156" x2="200" y2="190"/>
