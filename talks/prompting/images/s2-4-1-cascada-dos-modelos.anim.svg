<text class="c1" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Entra un pedido</text>
<text class="c2" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">El modelo barato (Haiku 4.5) intenta resolverlo</text>
<text class="c3" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">¿Confianza suficiente? SÍ: sale por la rama corta</text>
<text class="c4" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Retorna la respuesta: UNA llamada</text>
<text class="c5" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Otros pedidos hacen el mismo recorrido corto, cada vez más rápido</text>
<text class="c6" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Llega un pedido más</text>
<text class="c7" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">La confianza no alcanza: NO, baja al modelo caro</text>
<text class="c8" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">El modelo caro (Opus 4.8) resuelve</text>
<text class="c9" x="402" y="574" text-anchor="middle" font-size="15" fill="#1F1E1E" opacity="0">Sale por el retorno de abajo: DOS llamadas, una sola vez</text>
