<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">
<title>Los 6 componentes</title>
<desc>Seis componentes y el orden importa: rol y contexto arriba, input abajo, porque el modelo atiende mejor el principio y el final que el medio.</desc>
<rect width="680" height="452" fill="#ffffff"/>

<text x="40" y="232" font-size="11" letter-spacing="0.8" fill="#6B6464" text-anchor="middle" transform="rotate(-90 40 232)">atención del modelo</text>
<line x1="86" y1="102" x2="86" y2="362" stroke="#B8B2B2" stroke-width="1.5"/>

<rect x="100" y="32" width="556" height="368" rx="4" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
<line x1="86" y1="102" x2="99" y2="102" stroke="#DA1B2E" stroke-width="1.5"/>
<text x="78" y="106" font-size="11" font-weight="bold" fill="#DA1B2E" text-anchor="end">ALTA</text>
<line x1="86" y1="206" x2="99" y2="206" stroke="#6B6464" stroke-width="1.5"/>
<text x="78" y="210" font-size="11" fill="#6B6464" text-anchor="end">BAJA</text>
<line x1="86" y1="362" x2="99" y2="362" stroke="#DA1B2E" stroke-width="1.5"/>
<text x="78" y="366" font-size="11" font-weight="bold" fill="#DA1B2E" text-anchor="end">ALTA</text>

<text x="120" y="61" font-size="14" font-weight="bold" letter-spacing="1.1">ANATOMÍA DE UN PROMPT DE PRODUCCIÓN</text>
<text x="636" y="61" fill="#DA1B2E" text-anchor="end">el orden importa</text>

<rect x="116" y="80" width="524" height="44" fill="#FBEDEE" stroke="#DA1B2E" stroke-width="1.5"/>
<text x="134" y="107" font-size="13" font-weight="bold" fill="#DA1B2E">1</text>
<text x="158" y="107" font-size="13" font-weight="bold" fill="#DA1B2E">ROL / PERSONA</text>
<text x="312" y="107" fill="#6B6464">quién es el modelo</text>

<rect x="116" y="132" width="524" height="44" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.5"/>
<text x="134" y="159" font-size="13" font-weight="bold" fill="#6B6464">2</text>
<text x="158" y="159" font-size="13" font-weight="bold">CONTEXTO</text>
<text x="312" y="159" fill="#6B6464">qué necesita saber</text>

<rect x="116" y="184" width="524" height="44" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.5"/>
<text x="134" y="211" font-size="13" font-weight="bold" fill="#6B6464">3</text>
<text x="158" y="211" font-size="13" font-weight="bold">INSTRUCCIONES</text>
<text x="312" y="211" fill="#6B6464">qué tiene que hacer, paso a paso</text>

<rect x="116" y="236" width="524" height="44" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.5"/>
<text x="134" y="263" font-size="13" font-weight="bold" fill="#6B6464">4</text>
<text x="158" y="263" font-size="13" font-weight="bold">RESTRICCIONES</text>
<text x="312" y="263" fill="#6B6464">qué NO debe hacer, y en qué formato responde</text>

<rect x="116" y="288" width="524" height="44" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.5"/>
<text x="134" y="315" font-size="13" font-weight="bold" fill="#6B6464">5</text>
<text x="158" y="315" font-size="13" font-weight="bold">EJEMPLOS</text>
<text x="244" y="315" font-size="11" fill="#6B6464">(few-shot)</text>
<text x="312" y="315" fill="#6B6464">cómo se ve una respuesta correcta · 3 a 5 alcanzan</text>

<rect x="116" y="340" width="524" height="44" fill="#FBEDEE" stroke="#DA1B2E" stroke-width="1.5"/>
<text x="134" y="367" font-size="13" font-weight="bold" fill="#DA1B2E">6</text>
<text x="158" y="367" font-size="13" font-weight="bold" fill="#DA1B2E">INPUT</text>
<text x="312" y="367" fill="#6B6464">el dato de ESTA llamada</text>

<text x="378" y="426" font-size="13" text-anchor="middle">El orden no es cosmético: el modelo lee mejor el principio y el final que el medio.</text>
</svg>
