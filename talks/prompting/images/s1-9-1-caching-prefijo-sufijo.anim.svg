<text class="byte" x="222" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E" opacity="0">1 byte distinto</text>
<text class="capA" x="30" y="323" font-size="17" fill="#1F1E1E" opacity="0"><tspan font-weight="bold">Solicitud 1:</tspan> se procesa de punta a punta</text>
<text class="capB" x="30" y="323" font-size="17" fill="#1F1E1E" opacity="0"><tspan font-weight="bold">MISS:</tspan> el prefijo hasta cache_control queda guardado</text>
<text class="capC" x="30" y="323" font-size="17" fill="#1F1E1E" opacity="0"><tspan font-weight="bold">Solicitud 2:</tspan> mismo prefijo, otro pedido del usuario</text>
<text class="capH" x="30" y="323" font-size="17" fill="#1F1E1E" opacity="0"><tspan font-weight="bold">HIT:</tspan> el prefijo se cobra al 10%; el sufijo, a precio lleno</text>
<text class="capD" x="30" y="323" font-size="17" fill="#1F1E1E" opacity="0"><tspan font-weight="bold">Solicitud 3:</tspan> cambia un byte del prompt de sistema</text>
<text class="capE" x="30" y="323" font-size="17" fill="#1F1E1E" opacity="0"><tspan font-weight="bold">MISS:</tspan> deja de coincidir, se procesa entero otra vez</text>
