</defs>
<rect width="1000" height="580" fill="#ffffff"/>
<text x="500" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F1E1E">UNA SOLICITUD = PREFIJO ESTÁTICO + SUFIJO DINÁMICO</text>
<g stroke="#3B3535" stroke-width="1.5" fill="none">
