<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 -1 775 483" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Self-consistency: votación</title>
<desc>Antes del diagrama, el número que sostiene la decisión y que ya no está en la lámina: cinco llamadas cuestan cinco veces, la precisión mejora de forma medible, y CoT más self-consistency combinados dan ganancias adicionales (Wang et al., 2022).</desc>
<defs>
