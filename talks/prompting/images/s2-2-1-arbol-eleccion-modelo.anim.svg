<g font-size="16" fill="#3B3535"><text class="c1" x="560" y="430" opacity="0">Llega una tarea: revisar cada cambio<tspan x="560" dy="24">de código, miles por día.</tspan></text><text class="c2" x="560" y="430" opacity="0">¿Simple? No: hay que entender el código.<tspan x="560" dy="24">Baja a la segunda pregunta.</tspan></text><text class="c3" x="560" y="430" opacity="0">¿Más de 1M de contexto? No: cada<tspan x="560" dy="24">cambio entra holgado en la ventana.</tspan></text><text class="c4" x="560" y="430" opacity="0">¿Costo crítico? Sí: son miles por día.<tspan x="560" dy="24">Sale hacia la cascada de modelos.</tspan></text><text class="c5" x="560" y="430" opacity="0">Primer «sí» y la decisión termina:<tspan x="560" dy="24">la última salida queda sin recorrer.</tspan></text></g>
