<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 512" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Ciclo de vida: dónde entra el LLM</title>
<desc>Esta slide reordena toda la clase en el eje que a ellos les resulta natural: el flujo de trabajo.</desc>
<defs><marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker></defs>
<rect x="0" y="0" width="980" height="512" fill="#ffffff"/>
<text x="30" y="44" font-size="14" font-weight="bold" fill="#1F1E1E" letter-spacing="1">DÓNDE ENTRA EL LLM EN CADA ESTADIO</text>
<rect x="30" y="64" width="200" height="140" rx="8" fill="#ffffff"/>
<path d="M30,108 V72 Q30,64 38,64 H222 Q230,64 230,72 V108 Z" fill="#F2EEEE"/>
<line x1="30" y1="108" x2="230" y2="108" stroke="#D8D2CE" stroke-width="1.5"/>
<rect x="30" y="64" width="200" height="140" rx="8" fill="none" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="130" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">ISSUE</text>
<text x="130" y="143" text-anchor="middle" font-size="14">clasifica, agrupa</text>
<text x="130" y="161" text-anchor="middle" font-size="14">duplicados y pide</text>
<text x="130" y="179" text-anchor="middle" font-size="14">lo que falta</text>
<rect x="270" y="64" width="200" height="140" rx="8" fill="#ffffff"/>
<path d="M270,108 V72 Q270,64 278,64 H462 Q470,64 470,72 V108 Z" fill="#F2EEEE"/>
<line x1="270" y1="108" x2="470" y2="108" stroke="#D8D2CE" stroke-width="1.5"/>
<rect x="270" y="64" width="200" height="140" rx="8" fill="none" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="370" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">DISEÑO</text>
<text x="370" y="152" text-anchor="middle" font-size="14">contrasta alternativas</text>
<text x="370" y="170" text-anchor="middle" font-size="14">y redacta el ADR</text>
<rect x="510" y="64" width="200" height="140" rx="8" fill="#ffffff"/>
<path d="M510,108 V72 Q510,64 518,64 H702 Q710,64 710,72 V108 Z" fill="#F2EEEE"/>
<line x1="510" y1="108" x2="710" y2="108" stroke="#D8D2CE" stroke-width="1.5"/>
<rect x="510" y="64" width="200" height="140" rx="8" fill="none" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="610" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">IMPLEMENTACIÓN</text>
<text x="610" y="143" text-anchor="middle" font-size="14">escribe el test</text>
<text x="610" y="161" text-anchor="middle" font-size="14">antes que la</text>
<text x="610" y="179" text-anchor="middle" font-size="14">implementación</text>
<rect x="750" y="64" width="200" height="140" rx="8" fill="#ffffff"/>
<path d="M750,108 V72 Q750,64 758,64 H942 Q950,64 950,72 V108 Z" fill="#F2EEEE"/>
<line x1="750" y1="108" x2="950" y2="108" stroke="#D8D2CE" stroke-width="1.5"/>
<rect x="750" y="64" width="200" height="140" rx="8" fill="none" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="850" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">REVIEW</text>
<text x="850" y="143" text-anchor="middle" font-size="14">resume el diff y</text>
<text x="850" y="161" text-anchor="middle" font-size="14">marca lo que hay</text>
<text x="850" y="179" text-anchor="middle" font-size="14">que mirar a mano</text>
<rect x="750" y="284" width="200" height="140" rx="8" fill="#ffffff"/>
<path d="M750,328 V292 Q750,284 758,284 H942 Q950,284 950,292 V328 Z" fill="#F2EEEE"/>
<line x1="750" y1="328" x2="950" y2="328" stroke="#D8D2CE" stroke-width="1.5"/>
<rect x="750" y="284" width="200" height="140" rx="8" fill="none" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="850" y="312" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">DEPLOY</text>
<text x="850" y="363" text-anchor="middle" font-size="14">redacta las notas</text>
<text x="850" y="381" text-anchor="middle" font-size="14">de versión desde</text>
<text x="850" y="399" text-anchor="middle" font-size="14">los commits</text>
<rect x="30" y="284" width="200" height="140" rx="8" fill="#ffffff"/>
<path d="M30,328 V292 Q30,284 38,284 H222 Q230,284 230,292 V328 Z" fill="#F2EEEE"/>
<line x1="30" y1="328" x2="230" y2="328" stroke="#D8D2CE" stroke-width="1.5"/>
<rect x="30" y="284" width="200" height="140" rx="8" fill="none" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="130" y="312" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F1E1E">INCIDENTE</text>
<text x="130" y="363" text-anchor="middle" font-size="14">correlaciona logs</text>
<text x="130" y="381" text-anchor="middle" font-size="14">y propone la</text>
<text x="130" y="399" text-anchor="middle" font-size="14">hipótesis</text>
<line x1="230" y1="134" x2="270" y2="134" stroke="#3B3535" stroke-width="2" marker-end="url(#ag)"/>
<line x1="470" y1="134" x2="510" y2="134" stroke="#3B3535" stroke-width="2" marker-end="url(#ag)"/>
<line x1="710" y1="134" x2="750" y2="134" stroke="#3B3535" stroke-width="2" marker-end="url(#ag)"/>
<line x1="850" y1="204" x2="850" y2="284" stroke="#3B3535" stroke-width="2" marker-end="url(#ag)"/>
<line x1="750" y1="354" x2="230" y2="354" stroke="#3B3535" stroke-width="2" marker-end="url(#ag)"/>
<line x1="130" y1="284" x2="130" y2="204" stroke="#DA1B2E" stroke-width="3" marker-end="url(#ar)"/>
<text x="144" y="249" font-size="13" font-weight="bold" fill="#DA1B2E">post-mortem</text>
<text x="30" y="464" font-size="15">El post-mortem vuelve como issue: el ciclo se cierra, no termina.</text>
<text x="30" y="488" font-size="15">Hay un LLM útil en los seis estadios, no solo en “escribir código”.</text>
</svg>
