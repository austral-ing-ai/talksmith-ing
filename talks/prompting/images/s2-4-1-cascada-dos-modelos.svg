<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 2 698 598" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Model cascading</title>
<desc>La idea es de una línea y la trampa está en el rombo del medio.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
</defs>
<rect x="46" y="2" width="698" height="598" fill="#FFFFFF"/>
<text x="200" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Pedido entra</text>
<g stroke="#3B3535" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="200" y1="46" x2="200" y2="76"/>
<line x1="200" y1="156" x2="200" y2="190"/>
<line x1="330" y1="250" x2="400" y2="250"/>
<line x1="200" y1="310" x2="200" y2="360"/>
<line x1="200" y1="440" x2="200" y2="474"/>
</g>
<rect x="80" y="76" width="240" height="80" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="200" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Modelo barato</text>
<text x="200" y="124" text-anchor="middle" font-size="14">(Haiku 4.5)</text>
<text x="200" y="144" text-anchor="middle" font-size="13">intenta resolver</text>
<path d="M200,190 L330,250 L200,310 L70,250 Z" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="200" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">¿confianza</text>
<text x="200" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">suficiente?</text>
<text x="365" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">SÍ</text>
<text x="186" y="340" text-anchor="end" font-size="14" font-weight="bold" fill="#1F1E1E">NO</text>
<rect x="400" y="220" width="200" height="60" rx="30" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5"/>
<text x="500" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Retornar respuesta</text>
<text x="500" y="265" text-anchor="middle" font-size="12">costo mínimo, latencia baja</text>
<text x="616" y="246" font-size="14" font-weight="bold" fill="#1F1E1E">UNA llamada</text>
<text x="616" y="265" font-size="14">el caso frecuente</text>
<rect x="80" y="360" width="240" height="80" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="200" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Modelo caro</text>
<text x="200" y="408" text-anchor="middle" font-size="14">(Opus 4.8)</text>
<text x="200" y="428" text-anchor="middle" font-size="13">resuelve</text>
<rect x="100" y="474" width="200" height="60" rx="30" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5"/>
<text x="200" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">Retornar respuesta</text>
<text x="200" y="519" text-anchor="middle" font-size="12">solo cuando hace falta</text>
<text x="316" y="500" font-size="14" font-weight="bold" fill="#1F1E1E">DOS llamadas</text>
<text x="316" y="519" font-size="14">la excepción</text>
<text x="402" y="574" text-anchor="middle" font-size="15" font-style="italic" fill="#1F1E1E">El ahorro sale de que la rama corta sea la mayoritaria.</text>
</svg>
