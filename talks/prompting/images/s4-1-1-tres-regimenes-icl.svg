<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 503" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3B3535">
<title>In-context learning (ICL)</title>
<desc>Los tres regimenes de in-context learning son el mismo prompt con distinta cantidad de ejemplos entre la instruccion y el caso nuevo; los pesos del modelo no cambian.</desc>
<rect x="0" y="0" width="760" height="503" fill="#ffffff"/>
<text x="24" y="36" font-size="16" font-weight="bold">Lo que viaja dentro del prompt, en cada régimen</text>
<text x="132" y="74" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="0.6">ZERO-SHOT</text>
<text x="132" y="92" text-anchor="middle" font-size="10.5" fill="#6E6666">sin ejemplos</text>
<rect x="24" y="106" width="216" height="212" rx="4" fill="#ffffff" stroke="#E0DCDC"/>
<rect x="36" y="120" width="192" height="30" rx="3" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
<text x="132" y="139" text-anchor="middle" font-size="12">instrucción</text>
<rect x="36" y="164" width="192" height="98" rx="3" fill="none" stroke="#D8D4D4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="132" y="217" text-anchor="middle" font-size="10.5" fill="#9A9494">ningún ejemplo</text>
<rect x="36" y="276" width="192" height="30" rx="3" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
<text x="132" y="295" text-anchor="middle" font-size="12">caso nuevo</text>
<text x="380" y="74" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="0.6">FEW-SHOT</text>
<text x="380" y="92" text-anchor="middle" font-size="10.5" fill="#6E6666">2 a 10 ejemplos</text>
<rect x="272" y="106" width="216" height="212" rx="4" fill="#ffffff" stroke="#E0DCDC"/>
<rect x="284" y="120" width="192" height="30" rx="3" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
