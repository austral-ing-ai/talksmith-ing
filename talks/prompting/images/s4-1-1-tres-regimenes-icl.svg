<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 784" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="12">
<title>In-context learning (ICL)</title>
<desc>Los tres regimenes de in-context learning son el mismo prompt con distinta cantidad de ejemplos: el costo sube siempre y la precision satura.</desc>
<rect x="0" y="0" width="880" height="784" fill="#ffffff"/>

<text x="26" y="40" font-size="17" font-weight="bold" fill="#1F1E1E">Lo que viaja dentro del prompt, en cada régimen</text>

<g>
  <text x="156" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">ZERO-SHOT</text>
  <text x="156" y="94" text-anchor="middle" font-size="11.5" fill="#6A737D">sin ejemplos</text>
  <rect x="26" y="106" width="260" height="158" rx="6" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="38" y="102" font-size="9.5" fill="#A9A2A2">prompt</text>
  <rect x="40" y="118" width="232" height="26" rx="4" fill="#F2EEEE" stroke="#D8D4D4"/>
  <text x="156" y="135" text-anchor="middle" font-size="12.5">instrucción</text>
  <rect x="40" y="152" width="232" height="62" rx="4" fill="#FFFFFF" stroke="#D8D4D4" stroke-dasharray="4 4"/>
  <text x="156" y="187" text-anchor="middle" font-size="11.5" fill="#A9A2A2">(ningún ejemplo)</text>
  <rect x="40" y="226" width="232" height="26" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.3"/>
  <text x="156" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1E1E">caso nuevo</text>
</g>

<g>
  <text x="440" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">FEW-SHOT</text>
  <text x="440" y="94" text-anchor="middle" font-size="11.5" fill="#6A737D">2 a 10 ejemplos</text>
  <rect x="310" y="106" width="260" height="158" rx="6" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="322" y="102" font-size="9.5" fill="#A9A2A2">prompt</text>
  <rect x="324" y="118" width="232" height="26" rx="4" fill="#F2EEEE" stroke="#D8D4D4"/>
  <text x="440" y="135" text-anchor="middle" font-size="12.5">instrucción</text>
  <rect x="324" y="152" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="346" y="165" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="376" y="152" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="398" y="165" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="324" y="174" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="346" y="187" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="324" y="226" width="232" height="26" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.3"/>
  <text x="440" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1E1E">caso nuevo</text>
</g>

<g>
  <text x="724" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">MANY-SHOT</text>
  <text x="724" y="94" text-anchor="middle" font-size="11.5" fill="#6A737D">decenas o cientos</text>
  <rect x="594" y="106" width="260" height="158" rx="6" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="606" y="102" font-size="9.5" fill="#A9A2A2">prompt</text>
  <rect x="608" y="118" width="232" height="26" rx="4" fill="#F2EEEE" stroke="#D8D4D4"/>
  <text x="724" y="135" text-anchor="middle" font-size="12.5">instrucción</text>
  <rect x="608" y="152" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="630" y="165" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="660" y="152" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="682" y="165" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="712" y="152" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="734" y="165" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="764" y="152" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="786" y="165" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="608" y="174" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="630" y="187" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="660" y="174" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="682" y="187" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="712" y="174" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="734" y="187" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="764" y="174" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="786" y="187" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="608" y="196" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="630" y="209" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="660" y="196" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="682" y="209" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <rect x="712" y="196" width="44" height="18" rx="3" fill="#F9D2D6" stroke="#EFC0C6"/>
  <text x="734" y="209" text-anchor="middle" font-size="10" fill="#1F1E1E">ej</text>
  <text x="786" y="209" text-anchor="middle" font-size="13" fill="#6A737D">. . .</text>
  <rect x="608" y="226" width="232" height="26" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.3"/>
  <text x="724" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1E1E">caso nuevo</text>
