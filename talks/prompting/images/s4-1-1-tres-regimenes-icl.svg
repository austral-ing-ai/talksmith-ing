<text x="26" y="302" font-size="15" font-weight="bold" fill="#1F1E1E">Cómo cambia cada magnitud al moverse a la derecha</text>
<text x="26" y="322" font-size="11.5" fill="#6A737D">Tres progresiones independientes: cada fila tiene su propia escala y no se compara con las otras.</text>

<text x="310" y="350" text-anchor="middle" font-size="11.5" fill="#6A737D">zero-shot</text>
<text x="474" y="350" text-anchor="middle" font-size="11.5" fill="#6A737D">few-shot</text>
<text x="638" y="350" text-anchor="middle" font-size="11.5" fill="#6A737D">many-shot</text>

<g>
  <rect x="26" y="362" width="828" height="100" rx="6" fill="#FCFBFB" stroke="#E5E1E1"/>
  <text x="44" y="414" font-size="13" font-weight="bold" fill="#1F1E1E">tokens por llamada</text>
  <text x="44" y="430" font-size="10.5" fill="#A9A2A2">escala propia</text>
  <rect x="240" y="421" width="140" height="26" rx="4" fill="#F2EEEE" stroke="#D8D4D4"/>
  <text x="310" y="438" text-anchor="middle" font-size="12.5">bajo</text>
  <rect x="404" y="397" width="140" height="26" rx="4" fill="#E4DEDE" stroke="#C4BEBE"/>
  <text x="474" y="414" text-anchor="middle" font-size="12.5">medio</text>
  <rect x="568" y="373" width="140" height="26" rx="4" fill="#D8D4D4" stroke="#ABA5A5"/>
  <text x="638" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1E1E">alto</text>
  <text x="724" y="418" font-size="11.5" fill="#6A737D">sube en cada paso</text>
</g>

<g>
  <rect x="26" y="474" width="828" height="100" rx="6" fill="#FCFBFB" stroke="#E5E1E1"/>
  <text x="44" y="526" font-size="13" font-weight="bold" fill="#1F1E1E">costo</text>
  <text x="44" y="542" font-size="10.5" fill="#A9A2A2">escala propia</text>
  <rect x="240" y="533" width="140" height="26" rx="4" fill="#F2EEEE" stroke="#D8D4D4"/>
  <text x="310" y="550" text-anchor="middle" font-size="12.5">bajo</text>
  <rect x="404" y="509" width="140" height="26" rx="4" fill="#E4DEDE" stroke="#C4BEBE"/>
  <text x="474" y="526" text-anchor="middle" font-size="12.5">medio</text>
  <rect x="568" y="485" width="140" height="26" rx="4" fill="#D8D4D4" stroke="#ABA5A5"/>
  <text x="638" y="502" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1E1E">alto</text>
  <text x="724" y="530" font-size="11.5" fill="#6A737D">sube en cada paso</text>
</g>

<g>
  <rect x="26" y="586" width="828" height="100" rx="6" fill="#FCFBFB" stroke="#F0C4C9"/>
  <rect x="26" y="586" width="4" height="100" rx="2" fill="#DA1B2E"/>
  <text x="44" y="638" font-size="13" font-weight="bold" fill="#1F1E1E">precisión</text>
  <text x="44" y="654" font-size="10.5" fill="#A9A2A2">escala propia</text>
  <rect x="240" y="645" width="140" height="26" rx="4" fill="#F2EEEE" stroke="#D8D4D4"/>
  <text x="310" y="662" text-anchor="middle" font-size="12.5">baja</text>
  <rect x="404" y="597" width="140" height="26" rx="4" fill="#F7BBC1" stroke="#DA1B2E" stroke-width="1.6"/>
  <text x="474" y="614" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#DA1B2E">alta</text>
  <rect x="568" y="597" width="140" height="26" rx="4" fill="#F7BBC1" stroke="#DA1B2E" stroke-width="1.6"/>
  <text x="638" y="614" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#DA1B2E">alta</text>
  <rect x="549" y="605" width="14" height="3" fill="#DA1B2E"/>
  <rect x="549" y="612" width="14" height="3" fill="#DA1B2E"/>
  <text x="724" y="632" font-size="13" font-weight="bold" fill="#DA1B2E">SATURA</text>
  <text x="724" y="648" font-size="11" fill="#6A737D">se queda plana</text>
</g>

<text x="440" y="708" text-anchor="middle" font-size="11.5" fill="#6A737D">El salto grande está entre zero-shot y few-shot; de few-shot a many-shot la precisión casi no se mueve.</text>

<rect x="26" y="724" width="828" height="34" rx="6" fill="#F2EEEE" stroke="#D8D4D4"/>
<text x="440" y="746" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F1E1E">Los pesos del modelo no cambian en ningún punto de la progresión.</text>
</svg>
