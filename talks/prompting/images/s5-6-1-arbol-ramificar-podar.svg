<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 492" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="14">
<title>Tree of Thought (ToT)</title>
<desc>El árbol es el punto entero de la técnica: se generan varias ramas, cada una recibe un score, las malas se podan y solo la mejor se expande.</desc>
<rect x="0" y="0" width="810" height="492" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#DA1B2E"/></marker>
<marker id="ag" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#9C9595"/></marker>
</defs>

<path d="M320,70 L320,101 M140,101 L500,101 M320,101 L320,134" stroke="#9C9595" stroke-width="1.4" fill="none"/>
<path d="M500,101 L500,134" stroke="#9C9595" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<path d="M320,101 L320,134" stroke="#9C9595" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<path d="M320,70 L320,101 L140,101 L140,134" stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

<path d="M140,184 L140,215 L225,215 L225,248" stroke="#9C9595" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<path d="M140,184 L140,215 L85,215 L85,248" stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M85,298 L85,362" stroke="#DA1B2E" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

<rect x="255" y="20" width="130" height="50" rx="4" fill="#F5F4F4" stroke="#7A7373" stroke-width="1.3"/>
<text x="320" y="51" text-anchor="middle" font-size="15" font-weight="bold">problema</text>

<rect x="75" y="134" width="130" height="50" rx="4" fill="#FDEEF0" stroke="#DA1B2E" stroke-width="1.7"/>
<text x="140" y="154" text-anchor="middle" font-size="15" font-weight="bold">rama A</text>
<text x="140" y="172" text-anchor="middle" font-size="11" fill="#DA1B2E">puntaje 8</text>

<rect x="255" y="134" width="130" height="50" rx="4" fill="#F5F4F4" stroke="#9C9595" stroke-width="1.2"/>
<text x="320" y="154" text-anchor="middle" font-size="15" fill="#7A7373">rama B</text>
<text x="320" y="172" text-anchor="middle" font-size="11" fill="#9C9595">puntaje 5</text>

<rect x="435" y="134" width="130" height="50" rx="4" fill="#F5F4F4" stroke="#9C9595" stroke-width="1.2"/>
<text x="500" y="154" text-anchor="middle" font-size="15" fill="#7A7373">rama C</text>
<text x="500" y="172" text-anchor="middle" font-size="11" fill="#9C9595">puntaje 2</text>

<path d="M312,202 L328,218 M328,202 L312,218" stroke="#9C9595" stroke-width="2.2" fill="none"/>
<text x="320" y="238" text-anchor="middle" font-size="10.5" fill="#9C9595">podada</text>
<path d="M492,202 L508,218 M508,202 L492,218" stroke="#9C9595" stroke-width="2.2" fill="none"/>
<text x="500" y="238" text-anchor="middle" font-size="10.5" fill="#9C9595">podada</text>

<rect x="20" y="248" width="130" height="50" rx="4" fill="#FDEEF0" stroke="#DA1B2E" stroke-width="1.7"/>
<text x="85" y="268" text-anchor="middle" font-size="15" font-weight="bold">A.1</text>
<text x="85" y="286" text-anchor="middle" font-size="11" fill="#DA1B2E">puntaje 9</text>

<rect x="160" y="248" width="130" height="50" rx="4" fill="#F5F4F4" stroke="#9C9595" stroke-width="1.2"/>
<text x="225" y="268" text-anchor="middle" font-size="15" fill="#7A7373">A.2</text>
<text x="225" y="286" text-anchor="middle" font-size="11" fill="#9C9595">puntaje 4</text>

<path d="M217,316 L233,332 M233,316 L217,332" stroke="#9C9595" stroke-width="2.2" fill="none"/>
<text x="225" y="352" text-anchor="middle" font-size="10.5" fill="#9C9595">podada</text>

<rect x="20" y="362" width="130" height="50" rx="4" fill="#FDEEF0" stroke="#DA1B2E" stroke-width="2"/>
<text x="85" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">solución</text>

<path d="M598,20 L598,412" stroke="#D8D4D4" stroke-width="1.2"/>
<text x="620" y="97" font-size="13" font-weight="bold">1. GENERAR</text>
<text x="620" y="114" font-size="11.5" fill="#7A7373">ramas</text>
<text x="620" y="155" font-size="13" font-weight="bold">2. EVALUAR</text>
<text x="620" y="172" font-size="11.5" fill="#7A7373">cada rama</text>
<text x="620" y="269" font-size="13" font-weight="bold">3. EXPANDIR</text>
<text x="620" y="286" font-size="11.5" fill="#7A7373">la mejor</text>
<text x="620" y="391" font-size="13" font-weight="bold">4. SELECCIONAR</text>

<path d="M20,441 L790,441" stroke="#D8D4D4" stroke-width="1.2"/>
<text x="20" y="467" font-size="13.5">CoT es este árbol con una sola rama y sin vuelta atrás.</text>
</svg>
