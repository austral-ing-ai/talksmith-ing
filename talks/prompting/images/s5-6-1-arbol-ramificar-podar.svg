<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 474" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Tree of Thought (ToT)</title>
<desc>El árbol de la lámina es el punto entero de la técnica: se generan varias ramas, cada una recibe un puntaje, las malas se podan y solo la mejor se expande.</desc>
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#DA1B2E"/></marker>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#9A9090"/></marker>
</defs>
<rect x="0" y="0" width="776" height="474" fill="#ffffff"/>
<g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M330,90 L510,90 M330,90 L330,120" stroke="#9A9090"/>
<path d="M330,90 L330,118 M510,90 L510,118" stroke="#9A9090" marker-end="url(#ag)"/>
<path d="M330,64 L330,90 L150,90 L150,118" stroke="#DA1B2E" stroke-width="3" marker-end="url(#ar)"/>
<path d="M150,205 L220,205 L220,233" stroke="#9A9090" marker-end="url(#ag)"/>
<path d="M150,180 L150,205 L80,205 L80,233" stroke="#DA1B2E" stroke-width="3" marker-end="url(#ar)"/>
<path d="M80,295 L80,358" stroke="#DA1B2E" stroke-width="3" marker-end="url(#ar)"/>
<path d="M330,180 L330,200 M510,180 L510,200 M220,295 L220,315" stroke="#9A9090"/>
<path d="M323,201 L337,215 M337,201 L323,215 M503,201 L517,215 M517,201 L503,215 M213,316 L227,330 M227,316 L213,330" stroke="#3B3535" stroke-width="2.5"/>
<line x1="605" y1="20" x2="605" y2="404" stroke="#D8D2CE" stroke-width="1"/>
<line x1="20" y1="426" x2="756" y2="426" stroke="#D8D2CE" stroke-width="1"/>
</g>
<g text-anchor="middle">
<rect x="260" y="20" width="140" height="44" rx="8" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
<text x="330" y="48" font-size="16" font-weight="bold" fill="#1F1E1E">problema</text>
<rect x="85" y="120" width="130" height="60" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="3"/>
<text x="150" y="146" font-size="16" font-weight="bold" fill="#1F1E1E">rama A</text>
<text x="150" y="168" font-size="13">puntaje 8</text>
<rect x="265" y="120" width="130" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="330" y="146" font-size="16" font-weight="bold" fill="#8A8080">rama B</text>
<text x="330" y="168" font-size="13" fill="#8A8080">puntaje 5</text>
<rect x="445" y="120" width="130" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="510" y="146" font-size="16" font-weight="bold" fill="#8A8080">rama C</text>
<text x="510" y="168" font-size="13" fill="#8A8080">puntaje 2</text>
<text x="330" y="236" font-size="13" font-style="italic">podada</text>
<text x="510" y="236" font-size="13" font-style="italic">podada</text>
<rect x="25" y="235" width="110" height="60" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="3"/>
<text x="80" y="261" font-size="16" font-weight="bold" fill="#1F1E1E">A.1</text>
<text x="80" y="283" font-size="13">puntaje 9</text>
<rect x="165" y="235" width="110" height="60" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="220" y="261" font-size="16" font-weight="bold" fill="#8A8080">A.2</text>
<text x="220" y="283" font-size="13" fill="#8A8080">puntaje 4</text>
<text x="220" y="351" font-size="13" font-style="italic">podada</text>
<rect x="20" y="360" width="120" height="44" rx="8" fill="#DA1B2E"/>
<text x="80" y="388" font-size="16" font-weight="bold" fill="#ffffff">solución</text>
</g>
<g font-size="13">
<text x="625" y="88" font-size="15" font-weight="bold" fill="#1F1E1E">1. GENERAR</text>
<text x="625" y="106">ramas</text>
<text x="625" y="146" font-size="15" font-weight="bold" fill="#1F1E1E">2. EVALUAR</text>
<text x="625" y="164">cada rama</text>
<text x="625" y="256" font-size="15" font-weight="bold" fill="#1F1E1E">3. EXPANDIR</text>
<text x="625" y="274">la mejor</text>
<text x="625" y="387" font-size="15" font-weight="bold" fill="#1F1E1E">4. SELECCIONAR</text>
<text x="20" y="452" font-size="15" font-style="italic">CoT es este árbol con una sola rama y sin vuelta atrás.</text>
</g>
</svg>
