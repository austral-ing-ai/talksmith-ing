<text x="199.5" y="224" text-anchor="middle" fill="#6B6464">M1</text>
<rect x="235" y="205" width="63" height="28" rx="2.5" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
<text x="266.5" y="224" text-anchor="middle" fill="#6B6464">R1</text>
<rect x="302" y="205" width="63" height="28" rx="2.5" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
<text x="333.5" y="224" text-anchor="middle" fill="#6B6464">M2</text>
<rect x="369" y="205" width="63" height="28" rx="2.5" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
<text x="400.5" y="224" text-anchor="middle" fill="#6B6464">R2</text>
<rect x="436" y="205" width="63" height="28" rx="2.5" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
<text x="467.5" y="224" text-anchor="middle" fill="#6B6464">M3</text>
<rect x="503" y="205" width="63" height="28" rx="2.5" fill="#F5F4F4" stroke="#B8B2B2" stroke-width="1.2"/>
<text x="534.5" y="224" text-anchor="middle" fill="#6B6464">R3</text>
<rect x="570" y="205" width="63" height="28" rx="2.5" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
<text x="601.5" y="224" text-anchor="middle" font-weight="bold">M4</text>
<text x="645" y="224" font-size="12" font-weight="bold" fill="#DA1B2E">7</text>

<path d="M168,241 L174,249 L560,249 L566,241" fill="none" stroke="#DA1B2E" stroke-width="1.5"/>
<text x="367.0" y="265" font-size="11" fill="#DA1B2E" text-anchor="middle">ya se pagó 3 veces</text>
<path d="M570,241 L575,249 L628,249 L633,241" fill="none" stroke="#6B6464" stroke-width="1.5"/>
<text x="601.5" y="265" font-size="11" fill="#6B6464" text-anchor="middle">lo nuevo</text>

<line x1="24" y1="287" x2="656" y2="287" stroke="#EDEAEA" stroke-width="1"/>
<text x="24" y="307" font-size="11" fill="#6B6464">M = mensaje del usuario   ·   R = respuesta del modelo</text>
<text x="24" y="331">El usuario escribe lo mismo en cada turno. La cuenta crece igual,</text>
<text x="24" y="350">porque cada llamada reenvía toda la conversación anterior.</text>
</svg>
