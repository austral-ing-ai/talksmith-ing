<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 408" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">
<title>La fórmula del costo</title>
<desc>Esta es la slide que explica por qué la factura de un chatbot crece sin que crezca el uso.</desc>
<rect x="0" y="0" width="780" height="408" fill="#ffffff"/>
<text x="200" y="34" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F1E1E">LO QUE EL USUARIO ESCRIBE</text>
<text x="200" y="53" text-anchor="middle" font-style="italic" font-size="12">(siempre parecido)</text>
<text x="510" y="34" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F1E1E">LO QUE LA APP LE MANDA AL MODELO</text>
<text x="510" y="53" text-anchor="middle" font-style="italic" font-size="12">(crece en cada turno)</text>
<line x1="322" y1="70" x2="322" y2="250" stroke="#D8D2CE" stroke-width="1"/>
<text x="24" y="98" font-size="13">turno 1</text>
<rect x="178" y="78" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="200" y="98" text-anchor="middle">M1</text>
<rect x="344" y="78" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="366" y="98" text-anchor="middle">M1</text>
<text x="692" y="98" font-weight="bold" fill="#1F1E1E">1 bloque</text>
<text x="24" y="144" font-size="13">turno 2</text>
<rect x="178" y="124" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="200" y="144" text-anchor="middle">M2</text>
<rect x="344" y="124" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="366" y="144" text-anchor="middle">M1</text>
<rect x="392" y="124" width="44" height="30" rx="4" fill="#F2EEEE" stroke="#B9B1AC" stroke-width="1.2"/>
<text x="414" y="144" text-anchor="middle">R1</text>
<rect x="440" y="124" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="462" y="144" text-anchor="middle">M2</text>
<text x="692" y="144" font-weight="bold" fill="#1F1E1E">3 bloques</text>
<text x="24" y="190" font-size="13">turno 3</text>
<rect x="178" y="170" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="200" y="190" text-anchor="middle">M3</text>
<rect x="344" y="170" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="366" y="190" text-anchor="middle">M1</text>
<rect x="392" y="170" width="44" height="30" rx="4" fill="#F2EEEE" stroke="#B9B1AC" stroke-width="1.2"/>
<text x="414" y="190" text-anchor="middle">R1</text>
<rect x="440" y="170" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="462" y="190" text-anchor="middle">M2</text>
<rect x="488" y="170" width="44" height="30" rx="4" fill="#F2EEEE" stroke="#B9B1AC" stroke-width="1.2"/>
<text x="510" y="190" text-anchor="middle">R2</text>
<rect x="536" y="170" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="558" y="190" text-anchor="middle">M3</text>
<text x="692" y="190" font-weight="bold" fill="#1F1E1E">5 bloques</text>
<text x="24" y="236" font-size="13">turno 4</text>
<rect x="178" y="216" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="200" y="236" text-anchor="middle">M4</text>
<rect x="344" y="216" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="366" y="236" text-anchor="middle">M1</text>
<rect x="392" y="216" width="44" height="30" rx="4" fill="#F2EEEE" stroke="#B9B1AC" stroke-width="1.2"/>
<text x="414" y="236" text-anchor="middle">R1</text>
<rect x="440" y="216" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="462" y="236" text-anchor="middle">M2</text>
<rect x="488" y="216" width="44" height="30" rx="4" fill="#F2EEEE" stroke="#B9B1AC" stroke-width="1.2"/>
<text x="510" y="236" text-anchor="middle">R2</text>
<rect x="536" y="216" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="558" y="236" text-anchor="middle">M3</text>
<rect x="584" y="216" width="44" height="30" rx="4" fill="#F2EEEE" stroke="#B9B1AC" stroke-width="1.2"/>
<text x="606" y="236" text-anchor="middle">R3</text>
<rect x="632" y="216" width="44" height="30" rx="4" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="654" y="236" text-anchor="middle">M4</text>
<text x="692" y="236" font-weight="bold" fill="#1F1E1E">7 bloques</text>
<path d="M344 256 q0 7 7 7 H479.0 q7 0 7 7 q0 -7 7 -7 H621 q7 0 7 -7" fill="none" stroke="#DA1B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="486" y="294" text-anchor="middle" font-weight="bold" font-size="14" fill="#DA1B2E">ya pagado en turnos anteriores</text>
<path d="M632 256 q0 7 7 7 H647.0 q7 0 7 7 q0 -7 7 -7 H669 q7 0 7 -7" fill="none" stroke="#3B3535" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="654" y="294" text-anchor="middle" font-size="14">lo nuevo</text>
<rect x="24" y="312" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#3B3535" stroke-width="1.2"/>
<text x="50" y="323" font-size="12">M = mensaje del usuario</text>
<rect x="220" y="312" width="18" height="14" rx="3" fill="#F2EEEE" stroke="#B9B1AC" stroke-width="1.2"/>
<text x="246" y="323" font-size="12">R = respuesta del modelo</text>
<line x1="24" y1="340" x2="756" y2="340" stroke="#D8D2CE" stroke-width="1"/>
<text x="24" y="362" font-size="15" fill="#1F1E1E">El usuario escribe lo mismo en cada turno. La cuenta crece igual,</text>
<text x="24" y="382" font-size="15" fill="#1F1E1E">porque cada llamada reenvía toda la conversación anterior.</text>
</svg>
