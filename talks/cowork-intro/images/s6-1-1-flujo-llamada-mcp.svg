<!-- talksmith-ascii-sha256: d06d6c82ee71e7af5d5c7ac3e512bd6732e357053b4981d127c08609f9b385c8 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 865 210" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Qué es MCP</title>
  <desc>Un MCP server expone las acciones de un servicio como herramientas tipadas y el agente de código las llama como parte de su loop.</desc>

  <defs>
    <marker id="ah-grey" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8A8080"/>
    </marker>
    <marker id="ah-red" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="865" height="210" fill="#ffffff"/>

  <rect x="20" y="20" width="175" height="100" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <text x="107.5" y="58" text-anchor="middle" font-size="17" font-weight="bold">Agente de código</text>
  <text x="107.5" y="80" text-anchor="middle" font-size="12.5" fill="#6B6262">Claude Code / Codex</text>

  <rect x="325" y="20" width="190" height="100" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="420" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#DA1B2E">MCP server</text>
  <text x="420" y="80" text-anchor="middle" font-size="12.5" fill="#6B6262">expone acciones</text>
  <text x="420" y="98" text-anchor="middle" font-size="12.5" fill="#6B6262">como tools</text>

  <rect x="645" y="20" width="200" height="100" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <text x="745" y="58" text-anchor="middle" font-size="17" font-weight="bold">Servicio externo</text>
  <text x="745" y="80" text-anchor="middle" font-size="12.5" fill="#6B6262">GitHub · Railway</text>
  <text x="745" y="98" text-anchor="middle" font-size="12.5" fill="#6B6262">base de datos</text>

  <line x1="195" y1="58" x2="325" y2="58" stroke="#8A8080" stroke-width="1.8" marker-end="url(#ah-grey)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#6B6262">pide una acción</text>
  <line x1="325" y1="88" x2="195" y2="88" stroke="#8A8080" stroke-width="1.8" marker-end="url(#ah-grey)"/>
  <text x="260" y="106" text-anchor="middle" font-size="12" fill="#6B6262">resultado</text>

  <line x1="515" y1="58" x2="645" y2="58" stroke="#8A8080" stroke-width="1.8" marker-end="url(#ah-grey)"/>
  <text x="580" y="50" text-anchor="middle" font-size="12" fill="#6B6262">llama a la API</text>
  <line x1="645" y1="88" x2="515" y2="88" stroke="#8A8080" stroke-width="1.8" marker-end="url(#ah-grey)"/>
  <text x="580" y="106" text-anchor="middle" font-size="12" fill="#6B6262">respuesta</text>

  <rect x="20" y="155" width="230" height="34" rx="17" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <text x="135" y="177" text-anchor="middle" font-size="13.5" font-style="italic">“crea el repo y pushea”</text>

  <line x1="252" y1="172" x2="300" y2="172" stroke="#DA1B2E" stroke-width="1.8" marker-end="url(#ah-red)"/>

  <rect x="302" y="155" width="208" height="34" rx="17" fill="#FBE9EB" stroke="#DA1B2E" stroke-width="1.8"/>
  <text x="406" y="177" text-anchor="middle" font-size="13.5" font-family="'DejaVu Sans Mono', monospace" fill="#DA1B2E">create_repository</text>

  <text x="540" y="168" font-size="12" fill="#6B6262">el pedido en lenguaje natural</text>
  <text x="540" y="185" font-size="12" fill="#6B6262">se traduce en una tool concreta</text>
</svg>
