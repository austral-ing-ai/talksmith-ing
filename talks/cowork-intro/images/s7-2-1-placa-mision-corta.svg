<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>La misión: del caos a producción</title>
  <desc>Placa de cierre de la clase: la misión Corta, sus cinco milestones y los dos extras.</desc>
  <rect x="0" y="0" width="920" height="360" fill="#ffffff"/>
  <rect x="20" y="20" width="880" height="320" fill="#FAF8F8" stroke="#D8D2D2" stroke-width="2"/>
  <rect x="20" y="20" width="880" height="8" fill="#DA1B2E"/>

  <text x="60" y="105" font-size="42" font-weight="bold" letter-spacing="1">LA MISIÓN: CORTA</text>
  <text x="62" y="142" font-size="24" fill="#6B6363">del caos a producción</text>

  <line x1="140" y1="212" x2="840" y2="212" stroke="#D8D2D2" stroke-width="3"/>

  <circle cx="140" cy="212" r="21" fill="#EFEBEB" stroke="#B9B1B1" stroke-width="2"/>
  <circle cx="315" cy="212" r="21" fill="#EFEBEB" stroke="#B9B1B1" stroke-width="2"/>
  <circle cx="490" cy="212" r="21" fill="#EFEBEB" stroke="#B9B1B1" stroke-width="2"/>
  <circle cx="665" cy="212" r="21" fill="#EFEBEB" stroke="#B9B1B1" stroke-width="2"/>
  <circle cx="840" cy="212" r="21" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="2"/>

  <text x="140" y="220" font-size="21" font-weight="bold" text-anchor="middle">1</text>
  <text x="315" y="220" font-size="21" font-weight="bold" text-anchor="middle">2</text>
  <text x="490" y="220" font-size="21" font-weight="bold" text-anchor="middle">3</text>
  <text x="665" y="220" font-size="21" font-weight="bold" text-anchor="middle">4</text>
  <text x="840" y="220" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>

  <text x="140" y="264" font-size="18" text-anchor="middle">trackear</text>
  <text x="315" y="264" font-size="18" text-anchor="middle">ordenar</text>
