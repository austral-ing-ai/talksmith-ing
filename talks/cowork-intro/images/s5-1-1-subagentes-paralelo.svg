<!-- talksmith-ascii-sha256: 74afa30184435794979f23fbce18f3d8fd3578822eff6d7073c32325f717ddf1 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 558 304" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Subagentes: varios trabajando a la vez</title>
  <desc>El agente principal reparte una tarea entre tres subagentes que corren en paralelo con contexto propio y devuelve un resumen combinado.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8080"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="558" height="304" fill="#ffffff"/>

  <rect x="179" y="20" width="200" height="48" rx="4" fill="#F2F0EF" stroke="#8A8080" stroke-width="1.5"/>
  <text x="279" y="50" text-anchor="middle" font-size="16">agente principal</text>

  <path d="M269,68 L105,108" stroke="#DA1B2E" stroke-width="1.5" fill="none" marker-end="url(#ahr)"/>
  <path d="M279,68 L279,108" stroke="#DA1B2E" stroke-width="1.5" fill="none" marker-end="url(#ahr)"/>
  <path d="M289,68 L453,108" stroke="#DA1B2E" stroke-width="1.5" fill="none" marker-end="url(#ahr)"/>

  <rect x="20" y="110" width="150" height="84" rx="4" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="95" y="139" text-anchor="middle" font-size="16">sub A</text>
  <text x="95" y="161" text-anchor="middle" font-size="13" fill="#6B6260">contexto</text>
  <text x="95" y="178" text-anchor="middle" font-size="13" fill="#6B6260">propio</text>

  <rect x="204" y="110" width="150" height="84" rx="4" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="279" y="139" text-anchor="middle" font-size="16">sub B</text>
  <text x="279" y="161" text-anchor="middle" font-size="13" fill="#6B6260">contexto</text>
  <text x="279" y="178" text-anchor="middle" font-size="13" fill="#6B6260">propio</text>

  <rect x="388" y="110" width="150" height="84" rx="4" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="463" y="139" text-anchor="middle" font-size="16">sub C</text>
  <text x="463" y="161" text-anchor="middle" font-size="13" fill="#6B6260">contexto</text>
  <text x="463" y="178" text-anchor="middle" font-size="13" fill="#6B6260">propio</text>

  <path d="M95,194 L265,234" stroke="#8A8080" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M279,194 L279,234" stroke="#8A8080" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M463,194 L293,234" stroke="#8A8080" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="169" y="236" width="220" height="48" rx="4" fill="#F2F0EF" stroke="#8A8080" stroke-width="1.5"/>
  <text x="279" y="266" text-anchor="middle" font-size="16">resumen combinado</text>
</svg>
