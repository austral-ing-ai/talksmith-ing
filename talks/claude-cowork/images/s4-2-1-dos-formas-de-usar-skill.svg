<!-- talksmith-ascii-sha256: d687f80af72700e91af8c9c5b1e14a35847ccc222a1c56b5a3a6e78631778301 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445"
     font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3B3535">
<title>Cómo se usa una Skill</title>
<desc>Una Skill guardada se usa de dos formas: explícita, tipeando la barra y eligiéndola como comando, o automática, cuando el pedido en español coincide con su descripción.</desc>

<defs>
<marker id="ah" viewBox="0 0 11 9" refX="11" refY="4.5" markerWidth="11" markerHeight="9"
        orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L11,4.5 L0,9 z" fill="#3B3535"/>
</marker>
</defs>

<rect x="0" y="0" width="640" height="445" fill="#ffffff"/>

<text x="310" y="42" text-anchor="middle" font-size="16" font-weight="bold">CÓMO SE USA UNA SKILL</text>

<text x="155" y="70" text-anchor="middle" font-size="14" font-weight="bold">EXPLÍCITO</text>
<text x="155" y="87" text-anchor="middle" fill="#6B6363">se elige la Skill como comando</text>

<text x="465" y="70" text-anchor="middle" font-size="14" font-weight="bold">AUTOMÁTICO</text>
<text x="465" y="87" text-anchor="middle" fill="#6B6363">se pide la tarea en español</text>

<rect x="30" y="100" width="250" height="62" rx="8" fill="#F7F5F5" stroke="#8A8080" stroke-width="1.4"/>
<text x="155" y="128" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold">/informe-mensual</text>
<text x="155" y="147" text-anchor="middle" font-size="10.5" fill="#6B6363">aparece al tipear / en el chat</text>

<rect x="320" y="100" width="290" height="62" rx="8" fill="#F7F5F5" stroke="#8A8080" stroke-width="1.4"/>
<text x="465" y="126" text-anchor="middle" font-size="12" font-style="italic">“armame el informe de mayo</text>
<text x="465" y="144" text-anchor="middle" font-size="12" font-style="italic">con lo que hay en notas/”</text>

<line x1="465" y1="162" x2="465" y2="188" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="320" y="188" width="290" height="72" rx="8" fill="#EDEAEA" stroke="#3B3535" stroke-width="1.8"/>
<text x="465" y="212" text-anchor="middle" font-size="13" font-weight="bold">COMPARA CON LA DESCRIPCIÓN</text>
<text x="465" y="230" text-anchor="middle" font-size="10.5" fill="#6B6363">Claude mide el pedido contra la descripción</text>
<text x="465" y="246" text-anchor="middle" font-size="10.5" fill="#6B6363">de cada habilidad habilitada</text>

<text x="306" y="216" text-anchor="end" font-size="11" font-weight="bold">paso extra</text>
<text x="306" y="231" text-anchor="end" font-size="10.5" fill="#6B6363">solo en este camino</text>
<line x1="309" y1="223" x2="320" y2="223" stroke="#8A8080" stroke-width="1.2"/>

<line x1="155" y1="162" x2="155" y2="298" stroke="#3B3535" stroke-width="1.6"/>
<line x1="465" y1="260" x2="465" y2="298" stroke="#3B3535" stroke-width="1.6"/>
<line x1="154.2" y1="298" x2="465.8" y2="298" stroke="#3B3535" stroke-width="1.6"/>
<line x1="310" y1="298" x2="310" y2="326" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="180" y="326" width="260" height="56" rx="8" fill="#FBEEF0" stroke="#DA1B2E" stroke-width="2"/>
<rect x="184.5" y="330.5" width="251" height="47" rx="5" fill="none" stroke="#DA1B2E" stroke-width="1"/>
<text x="310" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#DA1B2E">SKILL EN EJECUCIÓN</text>

<text x="310" y="412" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6363">la descripción es lo que decide si se dispara sola</text>
</svg>
