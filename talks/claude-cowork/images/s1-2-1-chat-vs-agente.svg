<!-- talksmith-ascii-sha256: 7714d91a232df5df81779b42e0148e69098d979e1acba0f217923b4734746e9e -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
  <title>De chat a agente: el cambio de paradigma</title>
  <desc>El concepto-ancla de la charla: los conectores y las tareas programadas extendieron qué puede hacer el chat; el agente cambia el rol de la persona, que pasa de hacer cada paso a delegar un resultado.</desc>
  <defs>
    <marker id="arrGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8A8484"/>
    </marker>
    <marker id="arrDark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3B3535"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>

  <!-- Left header -->
  <text x="155" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535">ANTES · chatear</text>

  <!-- Left panel -->
  <rect x="30" y="62" width="250" height="176" rx="6" fill="#F4F3F3" stroke="#8A8484" stroke-width="1.5"/>

  <!-- Left rows: usuario: mensaje -> respuesta -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">
    <text x="44" y="96">usuario: mensaje</text>
    <line x1="152" y1="92" x2="192" y2="92" stroke="#8A8484" stroke-width="1.5" marker-end="url(#arrGrey)"/>
    <text x="200" y="96">respuesta</text>

    <text x="44" y="130">usuario: mensaje</text>
    <line x1="152" y1="126" x2="192" y2="126" stroke="#8A8484" stroke-width="1.5" marker-end="url(#arrGrey)"/>
    <text x="200" y="130">respuesta</text>

    <text x="44" y="164">usuario: mensaje</text>
    <line x1="152" y1="160" x2="192" y2="160" stroke="#8A8484" stroke-width="1.5" marker-end="url(#arrGrey)"/>
    <text x="200" y="164">respuesta</text>

    <text x="44" y="198">usuario: mensaje</text>
    <line x1="152" y1="194" x2="192" y2="194" stroke="#8A8484" stroke-width="1.5" marker-end="url(#arrGrey)"/>
    <text x="200" y="198">respuesta</text>
  </g>
  <text x="155" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#8A8484">un mensaje a la vez</text>

  <!-- Left caption -->
  <text x="155" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">paso a paso, lo hace la persona</text>

  <!-- Paradigm arrow -->
  <text x="340" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#DA1B2E">delegar</text>
  <line x1="296" y1="150" x2="376" y2="150" stroke="#DA1B2E" stroke-width="4" marker-end="url(#arrRed)"/>

  <!-- Right header -->
  <text x="522" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535">AHORA · agente (Cowork)</text>

  <!-- Right panel -->
  <rect x="397" y="62" width="250" height="176" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">
    <text x="522" y="92" text-anchor="middle">usuario: &#8220;entrega X&#8221;</text>
    <line x1="522" y1="100" x2="522" y2="118" stroke="#3B3535" stroke-width="1.5" marker-end="url(#arrDark)"/>
    <text x="522" y="138" text-anchor="middle" font-weight="bold">agente: planifica</text>
    <text x="522" y="164" text-anchor="middle" font-weight="bold">agente: toca archivos</text>
    <line x1="522" y1="174" x2="522" y2="190" stroke="#3B3535" stroke-width="1.5" marker-end="url(#arrDark)"/>
    <text x="522" y="210" text-anchor="middle">usuario: lee y guía</text>
  </g>

  <!-- Right caption -->
  <text x="522" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">se entrega un resultado</text>
</svg>
