<!-- talksmith-ascii-sha256: bdb0bfc3f9f2578f209fbbf88d0a2e2f842d37406580ec9ff4ecc2334634620a -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 275" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="11">
<title>Iterar en .md, exportar al final</title>
<desc>Las fuentes entran una vez, todas las vueltas de trabajo pasan adentro de los archivos .md y el entregable se genera una sola vez al final.</desc>
<defs>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto"><path d="M0,0 L12,4.5 L0,9 Z" fill="#6B6060"/></marker>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto"><path d="M0,0 L14,5.5 L0,11 Z" fill="#DA1B2E"/></marker>
</defs>

<rect x="0" y="0" width="718" height="275" fill="#ffffff"/>

<text x="359" y="34" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="1.6">DÓNDE VIVE LA ITERACIÓN</text>

<rect x="24" y="92" width="160" height="116" rx="6" fill="#ffffff" stroke="#C9C1C1" stroke-width="1.4"/>
<text x="104" y="118" text-anchor="middle" font-size="11" font-weight="bold" letter-spacing="1.4" fill="#6B6060">FUENTES</text>
<line x1="44" y1="128" x2="164" y2="128" stroke="#E3DCDC" stroke-width="1"/>
<text x="104" y="155" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', monospace" xml:space="preserve">.docx    pdf</text>
<text x="104" y="177" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', monospace" xml:space="preserve">mails    webs</text>
<text x="104" y="230" text-anchor="middle" font-size="10.5" fill="#6B6060">“convertime esto a .md”</text>

<rect x="234" y="74" width="250" height="152" rx="6" fill="#FDF7F7" stroke="#DA1B2E" stroke-width="1.5"/>
<text x="359" y="101" text-anchor="middle" font-size="12" font-weight="bold" font-family="'DejaVu Sans Mono', monospace">ARCHIVOS .MD</text>
<line x1="254" y1="111" x2="464" y2="111" stroke="#EFD6D9" stroke-width="1"/>

<path d="M 316 144.3 A 32 32 0 1 1 284 144.3" fill="none" stroke="#DA1B2E" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="300" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#DA1B2E">muchas</text>
<text x="300" y="181" text-anchor="middle" font-size="10" font-weight="bold" fill="#DA1B2E">vueltas</text>
<line x1="334" y1="172" x2="344" y2="172" stroke="#DA1B2E" stroke-width="1.5"/>

<rect x="346" y="140" width="104" height="20" rx="10" fill="#ffffff" stroke="#D9D2D2" stroke-width="1"/>
<text x="398" y="154" text-anchor="middle" font-size="10.5" font-family="'DejaVu Sans Mono', monospace">“sumá Sur”</text>
<rect x="346" y="164" width="104" height="20" rx="10" fill="#ffffff" stroke="#D9D2D2" stroke-width="1"/>
<text x="398" y="178" text-anchor="middle" font-size="10.5" font-family="'DejaVu Sans Mono', monospace">“acortalo”</text>
<rect x="346" y="188" width="104" height="20" rx="10" fill="#ffffff" stroke="#D9D2D2" stroke-width="1"/>
<text x="398" y="202" text-anchor="middle" font-size="10.5" font-family="'DejaVu Sans Mono', monospace">“reordena”</text>

<text x="359" y="248" text-anchor="middle" font-size="10.5" fill="#6B6060">cada vuelta: barata, sin romper el formato</text>

<rect x="534" y="92" width="160" height="116" rx="6" fill="#ffffff" stroke="#C9C1C1" stroke-width="1.4"/>
<text x="614" y="118" text-anchor="middle" font-size="11" font-weight="bold" letter-spacing="1.4" fill="#6B6060">ENTREGA</text>
<line x1="554" y1="128" x2="674" y2="128" stroke="#E3DCDC" stroke-width="1"/>
<text x="614" y="155" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', monospace" xml:space="preserve">.docx   .xlsx</text>
<text x="614" y="177" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', monospace" xml:space="preserve">PDF     slides</text>
<text x="614" y="230" text-anchor="middle" font-size="10.5" fill="#6B6060">“generame el entregable”</text>

<line x1="184" y1="150" x2="234" y2="150" stroke="#6B6060" stroke-width="2" marker-end="url(#ag)"/>
<text x="209" y="132" text-anchor="middle" font-size="9" fill="#8A7E7E">entra</text>
<text x="209" y="142" text-anchor="middle" font-size="9" fill="#8A7E7E">1 vez</text>

<line x1="484" y1="150" x2="534" y2="150" stroke="#6B6060" stroke-width="2" marker-end="url(#ag)"/>
<text x="509" y="132" text-anchor="middle" font-size="9" fill="#8A7E7E">sale</text>
<text x="509" y="142" text-anchor="middle" font-size="9" fill="#8A7E7E">1 vez</text>
</svg>
