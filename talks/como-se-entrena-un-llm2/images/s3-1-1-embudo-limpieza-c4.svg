<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 640 532" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>De Common Crawl a C4</title>
<desc>Common Crawl es una organización sin fines de lucro que archiva la web; casi todos los corpus abiertos (C4, RefinedWeb, RedPajama) salen de ahí.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
</defs>
<rect x="20" y="0" width="640" height="532" fill="#ffffff"/>
<rect x="40" y="20" width="600" height="100" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">Common Crawl · abril 2019 · páginas en inglés</text>
<line x1="340" y1="68" x2="340" y2="110" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="190" y="90" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F1E1E">1.100 M</text>
<text x="190" y="110" text-anchor="middle" font-size="14">documentos (M = millones)</text>
<text x="490" y="90" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F1E1E">1,4 billones</text>
<text x="490" y="110" text-anchor="middle" font-size="14">tokens</text>
<line x1="340" y1="120" x2="340" y2="160" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="80" y="160" width="520" height="174" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">Reglas de limpieza</text>
<g font-size="16">
<circle cx="116" cy="215" r="3"/><text x="128" y="220">Líneas que terminan en . ! ? o comillas</text>
<circle cx="116" cy="239" r="3"/><text x="128" y="244">Líneas de 5 palabras o más</text>
<circle cx="116" cy="263" r="3"/><text x="128" y="268">Páginas de 3 oraciones o más</text>
<circle cx="116" cy="287" r="3"/><text x="128" y="292">Sin “lorem ipsum”, sin “{”, sin la blocklist</text>
<circle cx="116" cy="311" r="3"/><text x="128" y="316">Un solo ejemplar de cada tramo repetido</text>
</g>
<line x1="340" y1="334" x2="340" y2="374" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<rect x="130" y="374" width="420" height="138" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="340" y="404" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F1E1E">C4.en</text>
<line x1="340" y1="420" x2="340" y2="464" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="240" y="444" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F1E1E">365 M</text>
<text x="240" y="464" text-anchor="middle" font-size="14">documentos</text>
<text x="440" y="444" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F1E1E">156.000 M</text>
<text x="440" y="464" text-anchor="middle" font-size="14">tokens</text>
<text x="314" y="497" text-anchor="end" font-size="24" font-weight="bold" fill="#DA1B2E">11 %</text>
<text x="322" y="496" font-size="16">de los tokens</text>
</svg>
