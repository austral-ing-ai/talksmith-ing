<!-- talksmith-ascii-sha256: cf3ef97d0c1b2867e97c68b03625692a3c231938862d33fcc6dd8908e3edb343 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Reranking: la segunda etapa</title>
<desc>El reranking cierra la sección de perillas porque es la que hace viables las otras: un pool de 50 con umbral bajo sería un desastre en el prompt, y con la segunda etapa se convierte en 5 buenos.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
</marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect width="560" height="440" fill="#ffffff"/>

<rect x="20" y="20" width="520" height="44" fill="#EDEDED" stroke="#3B3535" stroke-width="1.5"/>
<text x="280" y="47" text-anchor="middle" font-weight="bold">100.000+ documentos</text>

<line x1="280" y1="64" x2="280" y2="134" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="295" y="88" font-weight="bold">ETAPA 1 · recall · x 1/2000</text>
<text x="295" y="105" font-size="12">recuperador rápido:</text>
<text x="295" y="121" font-size="12">no dejar afuera ningún relevante</text>

<rect x="165" y="134" width="230" height="44" fill="#EDEDED" stroke="#3B3535" stroke-width="1.5"/>
<text x="280" y="161" text-anchor="middle" font-weight="bold">50 candidatos</text>

<line x1="280" y1="178" x2="280" y2="248" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="295" y="202" font-weight="bold">ETAPA 2 · precisión · x 1/10</text>
<text x="295" y="219" font-size="12">cross-encoder:</text>
<text x="295" y="235" font-size="12">quedarse solo con los mejores</text>

<rect x="220" y="248" width="120" height="44" fill="#FBE3E5" stroke="#DA1B2E" stroke-width="2"/>
<text x="280" y="275" text-anchor="middle" font-weight="bold" fill="#DA1B2E">5 docs</text>
<line x1="340" y1="270" x2="410" y2="270" stroke="#DA1B2E" stroke-width="1.5" marker-end="url(#ahr)"/>
<text x="418" y="275" fill="#DA1B2E">al prompt</text>

<text x="20" y="335" font-size="12">el corpus entero</text>
<rect x="260" y="322" width="280" height="16" fill="#C9C9C9"/>
<text x="20" y="363" font-size="12">lo que el modelo caro llega a leer</text>
<rect x="260" y="350" width="3" height="16" fill="#DA1B2E"/>
<text x="270" y="363" font-size="12" fill="#DA1B2E">50 de 100.000+</text>

<text x="20" y="402" font-size="13">Dos recortes de magnitud muy distinta,</text>
<text x="20" y="419" font-size="13">y el segundo cuesta más que el primero.</text>
</svg>
