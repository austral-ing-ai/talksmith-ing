<!-- talksmith-ascii-sha256: e006e53358d1761f31767cada340079214f91df33528df7ecb79ea45956037f6 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 386" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">
<title>M×N conectores, o M+N piezas</title>
<desc>El argumento de crecimiento con el diagrama: la malla crece con el producto, la estrella con la suma, y se ve en cuánto cuesta agregar un actor nuevo.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B3535"/></marker>
</defs>
<rect width="860" height="386" fill="#ffffff"/>
<rect x="20" y="20" width="390" height="300" rx="6" fill="#f4f4f4" stroke="#d0d0d0"/>
<rect x="430" y="20" width="410" height="300" rx="6" fill="#f4f4f4" stroke="#d0d0d0"/>
<text x="215" y="44" text-anchor="middle" font-size="15" font-weight="bold">SIN PROTOCOLO</text>
<text x="215" y="62" text-anchor="middle">cada par necesita su conector</text>
<text x="635" y="44" text-anchor="middle" font-size="15" font-weight="bold">CON UN PROTOCOLO</text>
<text x="635" y="62" text-anchor="middle">cada lado habla el mismo idioma</text>
<g stroke="#3B3535" stroke-width="1.4">
<line x1="115" y1="110" x2="290" y2="110"/><line x1="115" y1="110" x2="290" y2="160"/><line x1="115" y1="110" x2="290" y2="210"/>
<line x1="115" y1="160" x2="290" y2="110"/><line x1="115" y1="160" x2="290" y2="160"/><line x1="115" y1="160" x2="290" y2="210"/>
<line x1="115" y1="210" x2="290" y2="110"/><line x1="115" y1="210" x2="290" y2="160"/><line x1="115" y1="210" x2="290" y2="210"/>
</g>
<g fill="#ffffff" stroke="#3B3535" stroke-width="1.2">
<rect x="45" y="97" width="70" height="26" rx="4"/><rect x="45" y="147" width="70" height="26" rx="4"/><rect x="45" y="197" width="70" height="26" rx="4"/>
<rect x="290" y="97" width="90" height="26" rx="4"/><rect x="290" y="147" width="90" height="26" rx="4"/><rect x="290" y="197" width="90" height="26" rx="4"/>
</g>
<g text-anchor="middle" font-size="13">
<text x="80" y="114">app1</text><text x="80" y="164">app2</text><text x="80" y="214">app3</text>
<text x="335" y="114">fuente A</text><text x="335" y="164">fuente B</text><text x="335" y="214">fuente C</text>
</g>
<text x="45" y="262" font-size="14" font-weight="bold">M × N = 9 conectores</text>
<text x="45" y="284">sumar una fuente: <tspan font-weight="bold" fill="#DA1B2E">+3 conectores</tspan></text>
<text x="45" y="302">sumar una app: <tspan font-weight="bold" fill="#DA1B2E">+3 conectores</tspan></text>
<g stroke="#3B3535" stroke-width="1.4" fill="none">
<line x1="525" y1="110" x2="555" y2="110"/><line x1="525" y1="160" x2="555" y2="160"/><line x1="525" y1="210" x2="555" y2="210"/>
<line x1="555" y1="110" x2="555" y2="210"/>
<line x1="555" y1="160" x2="590" y2="160" marker-end="url(#ah)"/>
<line x1="670" y1="160" x2="700" y2="160"/>
<line x1="700" y1="110" x2="700" y2="210"/>
<line x1="700" y1="110" x2="730" y2="110" marker-end="url(#ah)"/><line x1="700" y1="160" x2="730" y2="160" marker-end="url(#ah)"/><line x1="700" y1="210" x2="730" y2="210" marker-end="url(#ah)"/>
</g>
<g fill="#ffffff" stroke="#3B3535" stroke-width="1.2">
<rect x="455" y="97" width="70" height="26" rx="4"/><rect x="455" y="147" width="70" height="26" rx="4"/><rect x="455" y="197" width="70" height="26" rx="4"/>
<rect x="730" y="97" width="90" height="26" rx="4"/><rect x="730" y="147" width="90" height="26" rx="4"/><rect x="730" y="197" width="90" height="26" rx="4"/>
</g>
<rect x="590" y="140" width="80" height="40" rx="5" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="630" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">MCP</text>
<g text-anchor="middle" font-size="13">
<text x="490" y="114">app1</text><text x="490" y="164">app2</text><text x="490" y="214">app3</text>
<text x="775" y="114">fuente A</text><text x="775" y="164">fuente B</text><text x="775" y="214">fuente C</text>
</g>
<text x="455" y="262" font-size="14" font-weight="bold">M + N = 6 implementaciones</text>
<text x="455" y="284">sumar una fuente: <tspan font-weight="bold" fill="#DA1B2E">+1 servidor</tspan></text>
<text x="455" y="302">sumar una app: <tspan font-weight="bold" fill="#DA1B2E">+1 cliente</tspan></text>
<text x="430" y="345" text-anchor="middle" font-style="italic">Cada conector a medida se mantiene por separado, se autentica distinto</text>
<text x="430" y="362" text-anchor="middle" font-style="italic">y se rompe por su cuenta.</text>
</svg>
