<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 564" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="12">
<title>En producción se usan las dos</title>
<desc>Las dos búsquedas corren en paralelo, se funden en un ranking único por posiciones y el modelo al final ve solo cinco documentos.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
</marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/>
</marker>
</defs>
<rect width="680" height="564" fill="#ffffff"/>

<rect x="230" y="24" width="220" height="36" rx="18" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
<text x="340" y="47" text-anchor="middle" font-size="14">consulta del usuario</text>

<path d="M340,60 V80 H139 V110" fill="none" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M340,80 H541 V110" fill="none" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="24" y="110" width="230" height="80" rx="4" fill="#f2f2f2" stroke="#3B3535" stroke-width="1.5"/>
<text x="139" y="136" text-anchor="middle" font-size="15" font-weight="bold">BM25 / léxica</text>
<text x="139" y="158" text-anchor="middle">top-50 por</text>
<text x="139" y="175" text-anchor="middle">coincidencia exacta</text>

<rect x="426" y="110" width="230" height="80" rx="4" fill="#f2f2f2" stroke="#3B3535" stroke-width="1.5"/>
<text x="541" y="136" text-anchor="middle" font-size="15" font-weight="bold">vectorial / ANN</text>
<text x="541" y="158" text-anchor="middle">top-50 por</text>
<text x="541" y="175" text-anchor="middle">cercanía semántica</text>

<path d="M139,190 V215 H541 V190" fill="none" stroke="#3B3535" stroke-width="1.5"/>
<path d="M340,215 V245" fill="none" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="245" y="245" width="190" height="50" rx="4" fill="#f2f2f2" stroke="#3B3535" stroke-width="1.5"/>
<text x="340" y="275" text-anchor="middle" font-size="15" font-weight="bold">FUSIÓN RRF</text>
<text x="460" y="266">un ranking único,</text>
<text x="460" y="283">sin normalizar scores</text>

<path d="M340,295 V330" fill="none" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>

<rect x="230" y="330" width="220" height="50" rx="4" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="340" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">RERANK cross-encoder</text>
<text x="466" y="360" font-size="15" font-weight="bold" fill="#DA1B2E">de 50 a 5</text>

<path d="M340,380 V415" fill="none" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="170" y="415" width="340" height="40" rx="4" fill="#f2f2f2" stroke="#3B3535" stroke-width="1.5"/>
<text x="340" y="440" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="13">prompt = instrucción + top-5 + consulta</text>

<path d="M340,455 V490" fill="none" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="270" y="490" width="140" height="50" rx="4" fill="#f2f2f2" stroke="#3B3535" stroke-width="1.5"/>
<text x="340" y="520" text-anchor="middle" font-size="15" font-weight="bold">LLM</text>

<path d="M410,515 H450" fill="none" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="450" y="497" width="180" height="36" rx="18" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
<text x="540" y="519" text-anchor="middle" font-size="13">respuesta con citas</text>
</svg>
