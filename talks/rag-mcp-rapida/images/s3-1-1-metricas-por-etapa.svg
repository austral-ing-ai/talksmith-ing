<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 0 620 350" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Evaluar las dos etapas por separado</title>
<desc>Todas las perillas se ajustan contra Context Relevance, y sin un conjunto de evaluación propio no hay forma de saber si un cambio mejoró algo.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="45" y="0" width="620" height="350" fill="#ffffff"/>
<text x="140" y="30" font-size="12" text-anchor="middle">consulta</text>
<line x1="140" y1="38" x2="140" y2="70" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="65" y="70" width="150" height="44" rx="4" fill="#F2F2F2" stroke="#3B3535" stroke-width="1.5"/>
<text x="140" y="97" font-size="13" font-weight="bold" text-anchor="middle">RECUPERAR</text>
<line x1="215" y1="92" x2="285" y2="92" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="250" y="108" font-size="10" text-anchor="middle">fragmentos</text>
<rect x="285" y="70" width="150" height="44" rx="4" fill="#F2F2F2" stroke="#3B3535" stroke-width="1.5"/>
<text x="360" y="97" font-size="13" font-weight="bold" text-anchor="middle">GENERAR</text>
<line x1="435" y1="92" x2="520" y2="92" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="520" y="74" width="120" height="36" rx="18" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
<text x="580" y="96" font-size="12" text-anchor="middle">respuesta</text>
<line x1="140" y1="114" x2="140" y2="160" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>
<line x1="360" y1="114" x2="360" y2="160" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>
<line x1="580" y1="110" x2="580" y2="160" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>
<text x="140" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#DA1B2E">CONTEXT RELEVANCE</text>
<text x="140" y="196" font-size="11" text-anchor="middle">¿trajo los documentos</text>
<text x="140" y="210" font-size="11" text-anchor="middle">correctos?</text>
<text x="360" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#DA1B2E">ANSWER FAITHFULNESS</text>
<text x="360" y="196" font-size="11" text-anchor="middle">¿lo que dice está sostenido</text>
<text x="360" y="210" font-size="11" text-anchor="middle">por los fragmentos?</text>
<text x="580" y="178" font-size="12" font-weight="bold" text-anchor="middle" fill="#DA1B2E">ANSWER RELEVANCE</text>
<text x="580" y="196" font-size="11" text-anchor="middle">¿contesta lo que</text>
<text x="580" y="210" font-size="11" text-anchor="middle">se preguntó?</text>
<text x="355" y="256" font-size="12" font-style="italic" text-anchor="middle">Una sola respuesta visible. Dos etapas que pueden fallar solas.</text>
<rect x="70" y="278" width="570" height="52" fill="#F2F2F2"/>
<rect x="70" y="278" width="5" height="52" fill="#DA1B2E"/>
<text x="90" y="299" font-size="12" font-weight="bold">Si Context Relevance es bajo,</text>
<text x="90" y="318" font-size="12">tocar el prompt de generación no mueve el resultado: la falla está aguas arriba.</text>
</svg>
