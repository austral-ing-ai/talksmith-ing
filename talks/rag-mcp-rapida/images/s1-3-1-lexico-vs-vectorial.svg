<!-- talksmith-ascii-sha256: 756ecb348a32917b66fa76b67afa0e4a746c0f2fa5aa777580e74a096d8b00b4 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Por significado: embeddings y similitud</title>
<desc>Mismo problema, cero palabras en común: el índice invertido no lo puede resolver y el índice vectorial sí.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect width="800" height="392" fill="#ffffff"/>

<text x="200" y="38" text-anchor="middle" font-size="14" font-weight="bold">UN ÍNDICE LÉXICO COMPARA</text>
<text x="200" y="56" text-anchor="middle" font-size="12">cadenas de caracteres</text>

<rect x="20" y="74" width="170" height="28" rx="3" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="105" y="92" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', monospace">"olvidé mi contraseña"</text>
<rect x="190" y="74" width="170" height="28" rx="3" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="275" y="92" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', monospace">"no puedo iniciar sesión"</text>

<path d="M105,102 V132" stroke="#3B3535" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<path d="M275,102 V132" stroke="#3B3535" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<text x="190" y="121" text-anchor="middle" font-size="10">tokenizar</text>

<rect x="20" y="132" width="170" height="40" rx="3" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="105" y="150" text-anchor="middle" font-size="10" font-family="'DejaVu Sans Mono', monospace">[olvidé][mi]</text>
<text x="105" y="164" text-anchor="middle" font-size="10" font-family="'DejaVu Sans Mono', monospace">[contraseña]</text>
<rect x="190" y="132" width="170" height="40" rx="3" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="275" y="150" text-anchor="middle" font-size="10" font-family="'DejaVu Sans Mono', monospace">[no][puedo]</text>
<text x="275" y="164" text-anchor="middle" font-size="10" font-family="'DejaVu Sans Mono', monospace">[iniciar][sesión]</text>

<path d="M105,172 V200 H200 M275,172 V200 H200" stroke="#3B3535" stroke-width="1.2" fill="none"/>
<path d="M200,200 V226" stroke="#3B3535" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<text x="208" y="217" font-size="10">intersectar</text>

<rect x="110" y="226" width="180" height="28" rx="3" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="200" y="244" text-anchor="middle" font-size="12">0 términos en común</text>

<path d="M200,254 V284" stroke="#3B3535" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>

<rect x="110" y="284" width="180" height="30" rx="15" fill="#E4E4E4" stroke="#3B3535" stroke-width="1"/>
<text x="200" y="304" text-anchor="middle" font-size="13" font-weight="bold">SIN COINCIDENCIA</text>

<text x="600" y="38" text-anchor="middle" font-size="14" font-weight="bold">UN ÍNDICE VECTORIAL COMPARA</text>
<text x="600" y="56" text-anchor="middle" font-size="12">posiciones en un espacio</text>

<rect x="420" y="74" width="170" height="28" rx="3" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="505" y="92" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', monospace">"olvidé mi contraseña"</text>
<rect x="590" y="74" width="170" height="28" rx="3" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="675" y="92" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', monospace">"no puedo iniciar sesión"</text>

<path d="M505,102 V132" stroke="#3B3535" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<path d="M675,102 V132" stroke="#3B3535" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<text x="590" y="121" text-anchor="middle" font-size="10">modelo de embeddings</text>

<rect x="420" y="132" width="170" height="40" rx="3" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="505" y="156" text-anchor="middle" font-size="10" font-family="'DejaVu Sans Mono', monospace">[ 0.71 -0.22 0.48 ... ]</text>
<rect x="590" y="132" width="170" height="40" rx="3" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="675" y="156" text-anchor="middle" font-size="10" font-family="'DejaVu Sans Mono', monospace">[ 0.69 -0.25 0.51 ... ]</text>

<path d="M505,172 V200 H600 M675,172 V200 H600" stroke="#3B3535" stroke-width="1.2" fill="none"/>
<path d="M600,200 V226" stroke="#3B3535" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<text x="608" y="217" font-size="10">medir el ángulo</text>

<rect x="510" y="226" width="180" height="28" rx="3" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="600" y="244" text-anchor="middle" font-size="12">vectores casi paralelos</text>

<path d="M600,254 V284" stroke="#DA1B2E" stroke-width="1.5" fill="none" marker-end="url(#ahr)"/>

<rect x="510" y="284" width="180" height="30" rx="15" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
<text x="600" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#DA1B2E">MUY PARECIDOS</text>

<text x="400" y="352" text-anchor="middle" font-size="12">Las dos frases describen el mismo problema sin compartir una palabra.</text>
<text x="400" y="370" text-anchor="middle" font-size="12">Un índice léxico no las relaciona; el vectorial sí.</text>
</svg>
