<!-- talksmith-ascii-sha256: 21641dd6a8404ea381e15e4485f8116feb1112175e63b82a0b8187c5e77b8fd3 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 536" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">
<title>El ciclo de vida de una herramienta</title>
<desc>La descripción de la herramienta es la interfaz que consume el modelo, así que escribirla es trabajo de diseño y no de documentación.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect width="680" height="536" fill="#ffffff"/>

<text x="20" y="52" font-weight="bold">1. ARRANQUE</text>
<rect x="220" y="20" width="440" height="54" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="234" y="42">el servidor MCP levanta y declara sus herramientas:</text>
<text x="234" y="60">nombre + descripción + esquema de parámetros</text>
<line x1="440" y1="74" x2="440" y2="96" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<text x="20" y="141" font-weight="bold">2. DESCUBRIMIENTO</text>
<rect x="220" y="96" width="440" height="80" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<rect x="240" y="108" width="90" height="56" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="285" y="141" text-anchor="middle">agente</text>
<rect x="550" y="108" width="90" height="56" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="595" y="141" text-anchor="middle">servidor</text>
<line x1="330" y1="126" x2="550" y2="126" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="440" y="120" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="12">tools/list</text>
<line x1="550" y1="152" x2="330" y2="152" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="440" y="146" text-anchor="middle" font-size="12">catálogo de herramientas</text>
<line x1="440" y1="176" x2="440" y2="198" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<text x="20" y="230" font-weight="bold" fill="#DA1B2E">3. CONSULTA</text>
<rect x="220" y="198" width="440" height="54" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="234" y="220">el usuario pregunta algo; el LLM lee las</text>
<text x="234" y="238"><tspan font-weight="bold" fill="#DA1B2E">DESCRIPCIONES</tspan> del catálogo y elige una herramienta</text>
<line x1="440" y1="252" x2="440" y2="274" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<text x="20" y="306" font-weight="bold">4. LLAMADA</text>
<rect x="220" y="274" width="440" height="54" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<rect x="232" y="286" width="68" height="30" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="266" y="306" text-anchor="middle">agente</text>
<rect x="580" y="286" width="68" height="30" fill="#ffffff" stroke="#3B3535" stroke-width="1"/>
<text x="614" y="306" text-anchor="middle">servidor</text>
<line x1="300" y1="301" x2="580" y2="301" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="440" y="295" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="11">tools/call { name, arguments }</text>
<line x1="440" y1="328" x2="440" y2="350" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<text x="20" y="382" font-weight="bold">5. EJECUCIÓN</text>
<rect x="220" y="350" width="440" height="54" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="234" y="372">el servidor corre el código y devuelve un</text>
<text x="234" y="390">resultado estructurado</text>
<line x1="440" y1="404" x2="440" y2="426" stroke="#3B3535" stroke-width="1.5" marker-end="url(#ah)"/>

<text x="20" y="458" font-weight="bold">6. USO</text>
<rect x="220" y="426" width="440" height="54" fill="#F2F2F2" stroke="#3B3535" stroke-width="1"/>
<text x="234" y="448">el LLM lee el resultado y sigue razonando,</text>
<text x="234" y="466">o responde al usuario</text>

<text x="340" y="514" text-anchor="middle" font-weight="bold" font-size="14" fill="#DA1B2E">El modelo elige por la descripción. La descripción es la interfaz.</text>
</svg>
