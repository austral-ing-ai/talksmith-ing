<line x1="540" y1="410" x2="632" y2="410"/>
</g>

<g fill="#FBE3E6" stroke="#DA1B2E" stroke-width="1.5">
<rect x="632" y="201" width="76" height="34" rx="5"/>
<rect x="632" y="249" width="76" height="34" rx="5"/>
<rect x="632" y="297" width="76" height="34" rx="5"/>
<rect x="632" y="345" width="76" height="34" rx="5"/>
<rect x="632" y="393" width="76" height="34" rx="5"/>
</g>
<g font-family="Andale Mono, monospace" text-anchor="middle" fill="#DA1B2E">
<text x="670" y="224">cat</text>
<text x="670" y="272">sat</text>
<text x="670" y="320">on</text>
<text x="670" y="368">the</text>
<text x="670" y="416">mat</text>
</g>

<line x1="32" y1="465" x2="727" y2="465" stroke="#E2DCDC" stroke-width="1"/>
<text x="32" y="492" font-size="15">Una frase de 6 tokens dio 5 ejemplos, y cada respuesta ya estaba escrita en el texto.</text>
<text x="32" y="518" font-size="17" font-weight="bold" fill="#DA1B2E">Nadie etiquetó.</text>
</svg>
