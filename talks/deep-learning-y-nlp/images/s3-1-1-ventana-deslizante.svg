<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 777 554" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3B3535">
<title>Predecir la palabra que sigue</title>
<desc>La ventana deslizante convierte una frase cruda de seis tokens en cinco pares entrada-respuesta, sin que nadie escriba una etiqueta.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto">
<path d="M0,0 L11,4.5 L0,9 Z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="0" y="0" width="777" height="554" fill="#ffffff"/>

<rect x="620" y="194" width="100" height="243" rx="8" fill="#FDF2F3"/>

<text x="32" y="44" font-size="16">Una frase del corpus, sin una sola etiqueta escrita a mano</text>

<rect x="88" y="60" width="62" height="34" rx="5" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<rect x="164" y="60" width="62" height="34" rx="5" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<rect x="240" y="60" width="62" height="34" rx="5" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<rect x="316" y="60" width="62" height="34" rx="5" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<rect x="392" y="60" width="62" height="34" rx="5" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<rect x="468" y="60" width="62" height="34" rx="5" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.2"/>
<g font-family="Andale Mono, monospace" text-anchor="middle">
<text x="119" y="82">the</text>
<text x="195" y="82">cat</text>
<text x="271" y="82">sat</text>
<text x="347" y="82">on</text>
<text x="423" y="82">the</text>
<text x="499" y="82">mat</text>
</g>

<text x="32" y="122" font-size="15" font-weight="bold">La ventana avanza un token por vez.</text>
<text x="32" y="143" font-size="14" fill="#5F5757">Lo que quedó a la izquierda es la entrada; el token siguiente es la respuesta correcta.</text>

<text x="668" y="150" font-size="12" fill="#DA1B2E" text-anchor="middle">esto es lo que en la lámina</text>
<text x="668" y="165" font-size="12" fill="#DA1B2E" text-anchor="middle">anterior escribía una persona</text>

<text x="305" y="182" font-size="13" fill="#7A7070" text-anchor="middle">entrada</text>
<text x="670" y="182" font-size="13" fill="#7A7070" text-anchor="middle">respuesta correcta</text>
<line x1="81" y1="190" x2="530" y2="190" stroke="#E2DCDC" stroke-width="1"/>
<line x1="620" y1="190" x2="720" y2="190" stroke="#DA1B2E" stroke-width="1.2"/>

<g fill="#EFECEC" stroke="#B7AFAF" stroke-width="1.2">
<rect x="81" y="199" width="76" height="38" rx="6"/>
<rect x="81" y="247" width="152" height="38" rx="6"/>
<rect x="81" y="295" width="228" height="38" rx="6"/>
<rect x="81" y="343" width="304" height="38" rx="6"/>
<rect x="81" y="391" width="380" height="38" rx="6"/>
</g>

<g font-family="Andale Mono, monospace" text-anchor="middle">
<text x="119" y="224">the</text>
<text x="119" y="272">the</text><text x="195" y="272">cat</text>
<text x="119" y="320">the</text><text x="195" y="320">cat</text><text x="271" y="320">sat</text>
<text x="119" y="368">the</text><text x="195" y="368">cat</text><text x="271" y="368">sat</text><text x="347" y="368">on</text>
<text x="119" y="416">the</text><text x="195" y="416">cat</text><text x="271" y="416">sat</text><text x="347" y="416">on</text><text x="423" y="416">the</text>
</g>


<g font-family="Andale Mono, monospace" text-anchor="middle" fill="#DA1B2E">
<text x="195" y="224">cat</text>
<text x="271" y="272">sat</text>
<text x="347" y="320">on</text>
<text x="423" y="368">the</text>
<text x="499" y="416">mat</text>
</g>

<g stroke="#DA1B2E" stroke-width="1.4" marker-end="url(#ah)">
<line x1="236" y1="218" x2="632" y2="218"/>
<line x1="312" y1="266" x2="632" y2="266"/>
<line x1="388" y1="314" x2="632" y2="314"/>
