<line x1="44" y1="314" x2="404" y2="314" stroke="#E5E1DF" stroke-width="1"/>
<line x1="484" y1="314" x2="844" y2="314" stroke="#E5E1DF" stroke-width="1"/>

<g font-size="12.5">
<text x="44" y="336">Todos los pares están a la misma distancia:</text>
<text x="44" y="354">el espacio no guarda nada sobre el significado.</text>
<text x="484" y="336">La distancia dice algo, y es lo único que hay</text>
<text x="484" y="354">que medir para comparar.</text>
</g>

<rect x="44" y="368" width="192" height="26" rx="13" fill="#F0EEED"/>
<rect x="484" y="368" width="182" height="26" rx="13" fill="#F0EEED"/>
<g text-anchor="middle">
<text x="140" y="385">|V| dimensiones, una por token</text>
<text x="575" y="385">unos cientos de dimensiones</text>
</g>
</svg>
