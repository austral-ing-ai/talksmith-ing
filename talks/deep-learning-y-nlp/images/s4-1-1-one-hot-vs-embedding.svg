<path d="M570 88 L564 88 L564 107 L570 107"/><path d="M740 88 L746 88 L746 107 L740 107"/>
<path d="M570 118 L564 118 L564 137 L570 137"/><path d="M740 118 L746 118 L746 137 L740 137"/>
<path d="M570 148 L564 148 L564 167 L570 167"/><path d="M740 148 L746 148 L746 167 L740 167"/>
</g>

<g font-family="Andale Mono, monospace" font-size="13" xml:space="preserve">
<text x="132" y="102">0 1 0 0 0 0 0 ... 0</text>
<text x="132" y="132">0 0 1 0 0 0 0 ... 0</text>
<text x="132" y="162">0 0 0 0 0 1 0 ... 0</text>
