<g text-anchor="middle">
<text x="169" y="208">distancia d</text>
<text x="169" y="264">distancia d</text>
</g>
<g text-anchor="middle" font-size="13.5" font-weight="bold" fill="#DA1B2E">
<text x="549" y="208">cerca</text>
<text x="639" y="264">lejos</text>
</g>

<g text-anchor="middle" font-family="Andale Mono, monospace">
<text x="74" y="240">cat</text><text x="264" y="240">dog</text>
<text x="74" y="296">cat</text><text x="264" y="296">heladera</text>
<text x="514" y="240">cat</text><text x="584" y="240">dog</text>
<text x="514" y="296">cat</text><text x="764" y="296">heladera</text>
