<g stroke="#8C8580" stroke-width="1.6" stroke-linecap="butt">
<line x1="74" y1="220" x2="264" y2="220"/>
<line x1="74" y1="212" x2="74" y2="228"/><line x1="264" y1="212" x2="264" y2="228"/>
<line x1="74" y1="276" x2="264" y2="276"/>
<line x1="74" y1="268" x2="74" y2="284"/><line x1="264" y1="268" x2="264" y2="284"/>
</g>
