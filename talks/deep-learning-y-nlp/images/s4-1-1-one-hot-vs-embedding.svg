<text x="44" y="56" font-size="18" font-weight="bold" letter-spacing="1.6">ONE-HOT</text>
<text x="484" y="56" font-size="18" font-weight="bold" letter-spacing="1.6">EMBEDDING</text>

<line x1="44" y1="72" x2="404" y2="72" stroke="#E5E1DF" stroke-width="1"/>
<line x1="484" y1="72" x2="844" y2="72" stroke="#E5E1DF" stroke-width="1"/>

<g font-family="Andale Mono, monospace" font-size="13.5">
<text x="44" y="102">cat</text>
<text x="44" y="132">dog</text>
<text x="44" y="162">heladera</text>
<text x="484" y="102">cat</text>
<text x="484" y="132">dog</text>
<text x="484" y="162">heladera</text>
</g>

<g fill="none" stroke="#8C8580" stroke-width="1.4" stroke-linecap="square">
<path d="M130 88 L124 88 L124 107 L130 107"/><path d="M284 88 L290 88 L290 107 L284 107"/>
<path d="M130 118 L124 118 L124 137 L130 137"/><path d="M284 118 L290 118 L290 137 L284 137"/>
