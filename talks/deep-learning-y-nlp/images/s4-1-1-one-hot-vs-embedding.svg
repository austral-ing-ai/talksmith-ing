<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 434" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">
<title>Tres formas de volver texto en números</title>
<desc>One-hot deja las tres palabras a la misma distancia; en el espacio de embeddings la distancia es la información.</desc>
<rect x="0" y="0" width="888" height="434" fill="#ffffff"/>

