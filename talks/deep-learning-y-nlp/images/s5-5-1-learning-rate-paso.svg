<text x="24" y="268">Cada paso se pasa de largo y</text>
<text x="24" y="286">la loss rebota sin bajar.</text>
<text x="423" y="268">Cada paso corrige poco:</text>
<text x="423" y="286">baja, y tarda demasiado.</text>
<line x1="24" y1="300" x2="774" y2="300" stroke="#E8E3DF" stroke-width="1.2"/>
<rect x="24" y="306" width="3" height="32" fill="#DA1B2E"/>
<text x="38" y="318" font-size="12.5">El esquema es cualitativo: la curva no sale de ninguna medición.</text>
<text x="38" y="336" font-size="12.5" fill="#6E6560">Ni el rebote ni el arrastre son un problema del modelo: los dos salen del mismo número mal elegido.</text>
