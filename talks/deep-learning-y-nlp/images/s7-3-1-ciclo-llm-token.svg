<!-- talksmith-ascii-sha256: ec00df2b9fde83887e8a0af173e4dd8447569a92596f638da0d985306e5d2a82 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 539" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>El ciclo de un LLM, token a token</title>
<desc>El diagrama convierte una tabla de seis celdas en un bucle: la flecha de retorno muestra que cada token producido se agrega al texto y el ciclo vuelve a empezar.</desc>
<rect x="0" y="0" width="706" height="539" fill="#ffffff"/>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
<path d="M0,0 L9.5,4.5 L0,9 z" fill="#3B3535"/>
</marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto">
<path d="M0,0 L11,5.5 L0,11 z" fill="#DA1B2E"/>
</marker>
</defs>

<rect x="182" y="26" width="210" height="36" rx="18" fill="#ffffff" stroke="#3B3535" stroke-width="1.4"/>
<text x="287" y="49.5" text-anchor="middle" font-family="Andale Mono, monospace" font-size="13.5">&#8220;&#191;C&#243;mo est&#225;s?&#8221;</text>
<text x="404" y="49" font-size="12.5" fill="#6E6565">texto de entrada</text>

<line x1="287" y1="62" x2="287" y2="88" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="182" y="88" width="210" height="36" rx="4" fill="#F2EFEF" stroke="#B9B1B1" stroke-width="1.3"/>
<text x="287" y="111.5" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="0.6">TOKENIZAR</text>
<rect x="404" y="95" width="23" height="22" rx="3" fill="#ffffff" stroke="#B9B1B1" stroke-width="1.1"/>
<text x="415.5" y="110" text-anchor="middle" font-family="Andale Mono, monospace" font-size="11">&#191;</text>
<rect x="433" y="95" width="42" height="22" rx="3" fill="#ffffff" stroke="#B9B1B1" stroke-width="1.1"/>
<text x="454" y="110" text-anchor="middle" font-family="Andale Mono, monospace" font-size="11">C&#243;mo</text>
<rect x="481" y="95" width="36" height="22" rx="3" fill="#ffffff" stroke="#B9B1B1" stroke-width="1.1"/>
<text x="499" y="110" text-anchor="middle" font-family="Andale Mono, monospace" font-size="11">est</text>
<rect x="523" y="95" width="29" height="22" rx="3" fill="#ffffff" stroke="#B9B1B1" stroke-width="1.1"/>
<text x="537.5" y="110" text-anchor="middle" font-family="Andale Mono, monospace" font-size="11">&#225;s</text>
<rect x="558" y="95" width="23" height="22" rx="3" fill="#ffffff" stroke="#B9B1B1" stroke-width="1.1"/>
<text x="569.5" y="110" text-anchor="middle" font-family="Andale Mono, monospace" font-size="11">?</text>
<text x="404" y="136" font-size="11.5" fill="#6E6565">dos palabras, cinco tokens</text>

<line x1="287" y1="124" x2="287" y2="158" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="182" y="158" width="210" height="36" rx="4" fill="#F2EFEF" stroke="#B9B1B1" stroke-width="1.3"/>
<text x="287" y="181.5" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="0.6">EMBEDDER</text>
<text x="404" y="181" font-size="12.5" fill="#6E6565">un vector por token</text>

<line x1="287" y1="194" x2="287" y2="220" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="182" y="220" width="210" height="36" rx="4" fill="#F2EFEF" stroke="#B9B1B1" stroke-width="1.3"/>
<text x="287" y="243.5" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="0.6">TRANSFORMER</text>
<text x="404" y="243" font-size="12.5" fill="#6E6565">capas de atenci&#243;n sobre la secuencia entera</text>

<line x1="287" y1="256" x2="287" y2="282" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="182" y="282" width="210" height="36" rx="4" fill="#FCF0F1" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="287" y="305.5" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="0.6">DISTRIBUCI&#211;N</text>
<text x="404" y="295" font-size="12" fill="#6E6565">un valor por cada token del vocabulario, |V|</text>
<rect x="404" y="309" width="5" height="7" fill="#E4A7AD"/>
<rect x="411" y="305" width="5" height="11" fill="#E4A7AD"/>
<rect x="418" y="311" width="5" height="5" fill="#E4A7AD"/>
<rect x="425" y="302" width="5" height="14" fill="#E4A7AD"/>
<rect x="432" y="296" width="5" height="20" fill="#DA1B2E"/>
<rect x="439" y="306" width="5" height="10" fill="#E4A7AD"/>
<rect x="446" y="310" width="5" height="6" fill="#E4A7AD"/>
<rect x="453" y="304" width="5" height="12" fill="#E4A7AD"/>
<rect x="460" y="312" width="5" height="4" fill="#E4A7AD"/>
<rect x="467" y="307" width="5" height="9" fill="#E4A7AD"/>
<rect x="474" y="311" width="5" height="5" fill="#E4A7AD"/>
<rect x="481" y="303" width="5" height="13" fill="#E4A7AD"/>
<rect x="488" y="309" width="5" height="7" fill="#E4A7AD"/>
<rect x="495" y="312" width="5" height="4" fill="#E4A7AD"/>
<rect x="502" y="306" width="5" height="10" fill="#E4A7AD"/>
<rect x="509" y="310" width="5" height="6" fill="#E4A7AD"/>
<rect x="516" y="313" width="5" height="3" fill="#E4A7AD"/>
<rect x="523" y="308" width="5" height="8" fill="#E4A7AD"/>
<rect x="530" y="311" width="5" height="5" fill="#E4A7AD"/>
<rect x="537" y="313" width="5" height="3" fill="#E4A7AD"/>

<line x1="287" y1="318" x2="287" y2="344" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="182" y="344" width="210" height="36" rx="4" fill="#F2EFEF" stroke="#B9B1B1" stroke-width="1.3"/>
<text x="287" y="367.5" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="0.6">ELEGIR</text>
<text x="404" y="357" font-size="12.5" fill="#6E6565">se toma uno; la temperatura decide</text>
<text x="404" y="373" font-size="12.5" fill="#6E6565">cu&#225;nto se aparta del m&#225;s probable</text>

<line x1="287" y1="380" x2="287" y2="406" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="182" y="406" width="210" height="36" rx="18" fill="#ffffff" stroke="#3B3535" stroke-width="1.4"/>
<text x="287" y="429.5" text-anchor="middle" font-family="Andale Mono, monospace" font-size="13.5">&#8220;Bien&#8221;</text>
<text x="404" y="429" font-size="12.5" fill="#6E6565">token producido</text>

<path d="M182 424 L160 424 Q152 424 152 416 L152 52 Q152 44 160 44 L182 44" fill="none" stroke="#DA1B2E" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ahr)"/>
<text x="136" y="222" text-anchor="end" font-size="11.5" font-weight="bold" fill="#DA1B2E">se agrega al final</text>
<text x="136" y="237" text-anchor="end" font-size="11.5" font-weight="bold" fill="#DA1B2E">del texto y vuelve</text>
<text x="136" y="252" text-anchor="end" font-size="11.5" font-weight="bold" fill="#DA1B2E">a empezar</text>

<line x1="28" y1="472" x2="678" y2="472" stroke="#D8D2D2" stroke-width="1"/>
<text x="28" y="492" font-size="12">El modelo no escribe una respuesta de una: escribe un token, se relee entero con ese token adentro,</text>
<text x="28" y="509" font-size="12">y vuelve a decidir. Lo que se ve como una frase que aparece de a poco son N vueltas.</text>
</svg>
