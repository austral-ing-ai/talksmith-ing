<!-- talksmith-ascii-sha256: ebdf4661bb100a79d1437aa2fba988b444b33cca19a13ec72d5247c8f2a7cba6 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 556" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>El perceptrón</title>
<desc>El diagrama y la fórmula dicen lo mismo salvo en un punto: la cuarta entrada vale 1 siempre y no sale de ningún dato.</desc>
<defs>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#8A8080"/></marker>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#DA1B2E"/></marker>
<marker id="ad" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto"><path d="M0,0 L13,5 L0,10 Z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="0" width="722" height="556" fill="#ffffff"/>

<text x="80" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B6363" letter-spacing="0.8">ENTRADAS</text>
<text x="250" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B6363" letter-spacing="0.8">PESOS</text>
<text x="250" y="68" text-anchor="middle" font-size="11" fill="#8A8080">(se aprenden)</text>
<text x="430" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B6363" letter-spacing="0.8">SUMA</text>
<text x="430" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B6363" letter-spacing="0.8">PONDERADA</text>
<text x="545" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B6363" letter-spacing="0.8">ACTIVACIÓN</text>
<text x="655" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B6363" letter-spacing="0.8">SALIDA</text>
<line x1="42" y1="82" x2="680" y2="82" stroke="#E0DCDC" stroke-width="1.2"/>

<line x1="352" y1="118" x2="352" y2="292" stroke="#8A8080" stroke-width="2"/>

<circle cx="80" cy="118" r="18" fill="#ffffff" stroke="#8A8080" stroke-width="1.7"/>
<text x="80" y="124" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15">x1</text>
<line x1="99" y1="118" x2="209" y2="118" stroke="#8A8080" stroke-width="1.7" marker-end="url(#ag)"/>
<rect x="210" y="101" width="80" height="34" rx="17" fill="#F5F2F2" stroke="#8A8080" stroke-width="1.7"/>
<text x="250" y="124" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16">w1</text>
<line x1="290" y1="118" x2="352" y2="118" stroke="#8A8080" stroke-width="1.7"/>
<circle cx="352" cy="118" r="3.4" fill="#8A8080"/>

<circle cx="80" cy="170" r="18" fill="#ffffff" stroke="#8A8080" stroke-width="1.7"/>
<text x="80" y="176" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15">x2</text>
<line x1="99" y1="170" x2="209" y2="170" stroke="#8A8080" stroke-width="1.7" marker-end="url(#ag)"/>
<rect x="210" y="153" width="80" height="34" rx="17" fill="#F5F2F2" stroke="#8A8080" stroke-width="1.7"/>
<text x="250" y="176" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16">w2</text>
<line x1="290" y1="170" x2="352" y2="170" stroke="#8A8080" stroke-width="1.7"/>
<circle cx="352" cy="170" r="3.4" fill="#8A8080"/>

<circle cx="80" cy="222" r="18" fill="#ffffff" stroke="#8A8080" stroke-width="1.7"/>
<text x="80" y="228" text-anchor="middle" font-family="Andale Mono, monospace" font-size="15">x3</text>
<line x1="99" y1="222" x2="209" y2="222" stroke="#8A8080" stroke-width="1.7" marker-end="url(#ag)"/>
<rect x="210" y="205" width="80" height="34" rx="17" fill="#F5F2F2" stroke="#8A8080" stroke-width="1.7"/>
<text x="250" y="228" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16">w3</text>
<line x1="290" y1="222" x2="352" y2="222" stroke="#8A8080" stroke-width="1.7"/>
<circle cx="352" cy="222" r="3.4" fill="#8A8080"/>

<line x1="42" y1="257" x2="330" y2="257" stroke="#E0DCDC" stroke-width="1.2" stroke-dasharray="5 5"/>

<circle cx="80" cy="292" r="18" fill="#FDECEE" stroke="#DA1B2E" stroke-width="2.4"/>
<text x="80" y="298" text-anchor="middle" font-family="Andale Mono, monospace" font-size="16" font-weight="bold" fill="#DA1B2E">1</text>
<line x1="99" y1="292" x2="209" y2="292" stroke="#DA1B2E" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="210" y="275" width="80" height="34" rx="17" fill="#FDECEE" stroke="#DA1B2E" stroke-width="2.4"/>
<text x="250" y="298" text-anchor="middle" font-family="Andale Mono, monospace" font-size="17" font-weight="bold" fill="#DA1B2E">b</text>
<line x1="290" y1="292" x2="352" y2="292" stroke="#DA1B2E" stroke-width="2.2"/>
<circle cx="352" cy="292" r="4" fill="#DA1B2E"/>

<line x1="352" y1="205" x2="397" y2="205" stroke="#3B3535" stroke-width="2" marker-end="url(#ad)"/>
<circle cx="430" cy="205" r="32" fill="#F5F2F2" stroke="#3B3535" stroke-width="2"/>
<text x="430" y="216" text-anchor="middle" font-family="Andale Mono, monospace" font-size="32">+</text>
<text x="430" y="256" text-anchor="middle" font-size="11" fill="#8A8080">suma</text>

<line x1="462" y1="205" x2="512" y2="205" stroke="#3B3535" stroke-width="2" marker-end="url(#ad)"/>
<circle cx="545" cy="205" r="32" fill="#F5F2F2" stroke="#3B3535" stroke-width="2"/>
<text x="545" y="216" text-anchor="middle" font-family="Andale Mono, monospace" font-size="28">f</text>
<text x="545" y="256" text-anchor="middle" font-size="11" fill="#8A8080">activación</text>

<line x1="577" y1="205" x2="631" y2="205" stroke="#3B3535" stroke-width="2" marker-end="url(#ad)"/>
<text x="657" y="217" text-anchor="middle" font-family="Andale Mono, monospace" font-size="30" font-weight="bold">y</text>

<rect x="45" y="345" width="300" height="48" rx="6" fill="#FDECEE" stroke="#DA1B2E" stroke-width="1.6"/>
<text x="59" y="367" font-size="13">entrada constante: no sale de los datos,</text>
<text x="59" y="384" font-size="13">vale 1 siempre</text>
<line x1="80" y1="345" x2="80" y2="313" stroke="#DA1B2E" stroke-width="1.8" marker-end="url(#ar)"/>

<rect x="380" y="345" width="272" height="48" rx="6" fill="#FDECEE" stroke="#DA1B2E" stroke-width="1.6"/>
<text x="394" y="367" font-size="13">el sesgo es un peso más y se aprende</text>
<text x="394" y="384" font-size="13">igual que w1, w2 y w3</text>
<line x1="400" y1="345" x2="264" y2="313" stroke="#DA1B2E" stroke-width="1.8" marker-end="url(#ar)"/>

<rect x="170" y="415" width="460" height="48" rx="6" fill="#F5F2F2" stroke="#D8D2D2" stroke-width="1.2"/>
<text x="400" y="446" text-anchor="middle" font-family="Andale Mono, monospace" font-size="19">y = f( x1·w1 + x2·w2 + x3·w3 + b )</text>

<text x="400" y="491" text-anchor="middle" font-size="14">Aprender un perceptrón es elegir cuatro números: w1, w2, w3 y b.</text>
<text x="400" y="511" text-anchor="middle" font-size="12.5" fill="#6B6363">Las entradas cambian con cada ejemplo; esos cuatro no cambian.</text>
</svg>
