<path d="M202,211 C202,235 430,231 430,255" fill="none" stroke="#DA1B2E" stroke-width="2.2"/>
<circle cx="430" cy="255" r="4.5" fill="#3B3535"/>
<line x1="430" y1="259" x2="430" y2="283" stroke="#3B3535" stroke-width="2.6" marker-end="url(#ahb)"/>

<rect x="230" y="283" width="400" height="58" rx="7" fill="#ffffff" stroke="#3B3535" stroke-width="2"/>
<text x="430" y="307" text-anchor="middle" font-size="16">&#8220;it&#8221; reescrito con el peso</text>
<text x="430" y="329" text-anchor="middle" font-size="16">puesto sobre &#8220;animal&#8221;</text>

<text x="430" y="379" text-anchor="middle">Los pesos son una distribuci&#243;n: suman uno y salen de comparar el vector de &#8220;it&#8221; contra el de cada token.</text>
<text x="430" y="399" text-anchor="middle">Esa fila se calcula para cada token de la frase, y todas juntas, en una sola multiplicaci&#243;n de matrices.</text>
<text x="430" y="421" text-anchor="middle" font-weight="bold">Ah&#237; est&#225; la paralelizaci&#243;n: no hay orden que respetar.</text>
</svg>
