</g>
<rect x="160" y="163" width="78" height="15" rx="2" fill="#DA1B2E"/>

<g text-anchor="middle" font-size="13" fill="#6E6666">
<text x="88" y="197">bajo</text>
<text x="316" y="197">bajo</text>
<text x="430" y="197">bajo</text>
<text x="544" y="197">bajo</text>
<text x="658" y="197">medio</text>
<text x="772" y="197">bajo</text>
</g>
<text x="202" y="199" text-anchor="middle" font-size="19" font-weight="bold" fill="#DA1B2E">ALTO</text>

<g fill="none" stroke="#9A9090" stroke-width="1.4">
<path d="M88,211 C88,235 430,231 430,255"/>
<path d="M316,211 C316,235 430,231 430,255"/>
<path d="M430,211 L430,255"/>
<path d="M544,211 C544,235 430,231 430,255"/>
<path d="M658,211 C658,235 430,231 430,255"/>
