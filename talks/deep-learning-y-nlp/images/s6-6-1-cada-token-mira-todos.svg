<rect x="616" y="165" width="84" height="11" rx="2"/>
<rect x="730" y="165" width="84" height="11" rx="2"/>
</g>
<g fill="#8C8383">
<rect x="46" y="165" width="8" height="11" rx="2"/>
<rect x="274" y="165" width="8" height="11" rx="2"/>
<rect x="388" y="165" width="8" height="11" rx="2"/>
<rect x="502" y="165" width="8" height="11" rx="2"/>
