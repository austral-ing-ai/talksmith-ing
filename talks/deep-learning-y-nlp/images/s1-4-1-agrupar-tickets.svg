<rect x="498" y="219" width="44" height="24" rx="4"/>
<rect x="414" y="315" width="44" height="24" rx="4"/>
<rect x="470" y="315" width="44" height="24" rx="4"/>
<rect x="526" y="315" width="44" height="24" rx="4"/>
</g>
<g font-family="Andale Mono, monospace" font-size="12.5" text-anchor="middle">
<text x="436" y="139.5">t1</text><text x="492" y="139.5">t3</text><text x="548" y="139.5">t7</text>
<text x="464" y="235.5">t2</text><text x="520" y="235.5">t5</text>
<text x="436" y="331.5">t4</text><text x="492" y="331.5">t6</text><text x="548" y="331.5">t8</text>
</g>

<g font-size="11.5" fill="#DA1B2E">
<text x="604" y="139">nombre:</text>
<text x="604" y="235">nombre:</text>
<text x="604" y="331">nombre:</text>
</g>
<g stroke="#DA1B2E" stroke-width="1.4" stroke-dasharray="5 4">
<line x1="654" y1="141" x2="724" y2="141"/>
<line x1="654" y1="237" x2="724" y2="237"/>
<line x1="654" y1="333" x2="724" y2="333"/>
</g>

<line x1="744" y1="135" x2="744" y2="327" stroke="#DA1B2E" stroke-width="1.8"/>
<g stroke="#DA1B2E" stroke-width="1.8">
<line x1="744" y1="135" x2="732" y2="135" marker-end="url(#aha)"/>
<line x1="744" y1="231" x2="732" y2="231" marker-end="url(#aha)"/>
<line x1="744" y1="327" x2="732" y2="327" marker-end="url(#aha)"/>
<line x1="766" y1="231" x2="746" y2="231"/>
</g>

<rect x="768" y="180" width="206" height="102" rx="8" fill="#FCF3F4" stroke="#DA1B2E" stroke-width="1.8"/>
<text x="784" y="206" font-size="14" font-weight="bold" fill="#DA1B2E">una persona</text>
<text x="784" y="228" font-size="12.5">lee cada grupo y le</text>
<text x="784" y="246" font-size="12.5">pone nombre. Recién</text>
<text x="784" y="264" font-size="12.5">acá, no antes.</text>

<text x="24" y="396" font-size="12.5">El algoritmo forma los grupos midiendo parecido entre los textos.</text>
<text x="24" y="414" font-size="12.5" fill="#6E6666">No sabe que el primero es "acceso" ni el tercero "facturación":</text>
<text x="24" y="432" font-size="12.5" fill="#6E6666">los nombres los pone alguien después, mirando el resultado.</text>
</svg>
