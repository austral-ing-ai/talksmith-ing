<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 462" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Agrupar y crear datos nuevos</title>
<desc>El algoritmo forma los grupos de tickets midiendo parecido; los nombres los pone una persona después, y eso separa agrupar de clasificar.</desc>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#3B3535"/></marker>
<marker id="aha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3.5 L0 7 Z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="462" fill="#ffffff"/>

<text x="24" y="38" font-size="16" font-weight="bold" letter-spacing="1.2">ANTES</text>
<line x1="24" y1="48" x2="280" y2="48" stroke="#D9D2D2" stroke-width="1.4"/>
<text x="24" y="68" font-size="12.5" fill="#6E6666">una pila de tickets,</text>
<text x="24" y="84" font-size="12.5" fill="#6E6666">sin categoría ninguna</text>

<text x="400" y="38" font-size="16" font-weight="bold" letter-spacing="1.2">DESPUÉS DE AGRUPAR</text>
<line x1="400" y1="48" x2="724" y2="48" stroke="#D9D2D2" stroke-width="1.4"/>
<text x="400" y="68" font-size="12.5" fill="#6E6666">tres grupos, y recién ahora</text>
<text x="400" y="84" font-size="12.5" fill="#6E6666">se les puede poner nombre</text>

<g stroke="#CFC7C7" stroke-width="1">
<rect x="24" y="108" width="244" height="26" rx="5" fill="#F2EEEE"/>
<rect x="33" y="141" width="244" height="26" rx="5" fill="#F2EEEE"/>
<rect x="27" y="174" width="244" height="26" rx="5" fill="#F2EEEE"/>
<rect x="37" y="207" width="244" height="26" rx="5" fill="#F2EEEE"/>
<rect x="29" y="240" width="244" height="26" rx="5" fill="#F2EEEE"/>
<rect x="35" y="273" width="244" height="26" rx="5" fill="#F2EEEE"/>
<rect x="26" y="306" width="244" height="26" rx="5" fill="#F2EEEE"/>
<rect x="31" y="339" width="244" height="26" rx="5" fill="#F2EEEE"/>
</g>
<g font-family="Andale Mono, monospace" font-size="12.5">
<text x="36" y="125.5">t1</text><text x="62" y="125.5" fill="#5E5656">"no carga el login"</text>
<text x="45" y="158.5">t2</text><text x="71" y="158.5" fill="#5E5656">"el pago tira 500"</text>
<text x="39" y="191.5">t3</text><text x="65" y="191.5" fill="#5E5656">"no puedo entrar"</text>
<text x="49" y="224.5">t4</text><text x="75" y="224.5" fill="#5E5656">"la factura sale mal"</text>
<text x="41" y="257.5">t5</text><text x="67" y="257.5" fill="#5E5656">"timeout al pagar"</text>
<text x="47" y="290.5">t6</text><text x="73" y="290.5" fill="#5E5656">"no llega el recibo"</text>
<text x="38" y="323.5">t7</text><text x="64" y="323.5" fill="#5E5656">"usuario bloqueado"</text>
<text x="43" y="356.5">t8</text><text x="69" y="356.5" fill="#5E5656">"el importe no cierra"</text>
</g>

<line x1="290" y1="118" x2="290" y2="355" stroke="#9C9393" stroke-width="1.6"/>
<line x1="296" y1="231" x2="392" y2="231" stroke="#3B3535" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="347" y="207" font-size="11" fill="#6E6666" text-anchor="middle">el algoritmo</text>
<text x="347" y="220" font-size="11" fill="#6E6666" text-anchor="middle">mide parecido</text>
<line x1="394" y1="135" x2="394" y2="327" stroke="#9C9393" stroke-width="1.6"/>
<line x1="394" y1="135" x2="400" y2="135" stroke="#9C9393" stroke-width="1.6"/>
<line x1="394" y1="231" x2="400" y2="231" stroke="#9C9393" stroke-width="1.6"/>
<line x1="394" y1="327" x2="400" y2="327" stroke="#9C9393" stroke-width="1.6"/>

<g stroke="#DA1B2E" stroke-width="2" fill="#FAEBED">
<rect x="400" y="108" width="184" height="54" rx="7"/>
<rect x="400" y="204" width="184" height="54" rx="7"/>
<rect x="400" y="300" width="184" height="54" rx="7"/>
</g>
