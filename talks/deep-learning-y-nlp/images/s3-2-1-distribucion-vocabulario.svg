<!-- talksmith-ascii-sha256: a9e2a55bf8fdc78fb82ce7311ac094b11bf9116c80e9f2b4657da47ec6cc7136 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 622" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>La salida es un vector, no una palabra</title>
<desc>Una frase incompleta entra al modelo y lo que sale es la columna completa de barras: un valor por cada token del vocabulario.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0,1 L10,5 L0,9 Z" fill="#3B3535"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="622" fill="#ffffff"/>

<text x="360" y="49" text-anchor="middle" font-size="12" letter-spacing="2" fill="#8A8080">ENTRADA</text>
<rect x="230" y="60" width="260" height="40" rx="8" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
<text x="360" y="86" text-anchor="middle" font-size="17" font-family="Andale Mono, monospace">the cat is on the</text>

<line x1="360" y1="100" x2="360" y2="130" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>

<rect x="280" y="132" width="160" height="46" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="2.5"/>
<text x="360" y="161" text-anchor="middle" font-size="16" font-weight="bold" letter-spacing="1.5">MODELO</text>

<line x1="360" y1="178" x2="360" y2="212" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah)"/>

<rect x="40" y="214" width="640" height="312" rx="10" fill="#FCF6F6" stroke="#DA1B2E" stroke-width="2.5"/>
<rect x="56" y="203" width="86" height="22" rx="11" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
<text x="99" y="218" text-anchor="middle" font-size="11" font-weight="bold" letter-spacing="2" fill="#DA1B2E">SALIDA</text>

<text x="64" y="252" font-size="15">un valor por cada token del vocabulario</text>

<rect x="156" y="270" width="400" height="16" fill="#B4ABAB"/>
<text x="140" y="282" text-anchor="end" font-size="14" font-family="Andale Mono, monospace">mat</text>
<rect x="156" y="300" width="145" height="16" fill="#B4ABAB"/>
<text x="140" y="312" text-anchor="end" font-size="14" font-family="Andale Mono, monospace">bed</text>
<rect x="156" y="330" width="61" height="16" fill="#B4ABAB"/>
<text x="140" y="342" text-anchor="end" font-size="14" font-family="Andale Mono, monospace">floor</text>
<rect x="156" y="360" width="24" height="16" fill="#B4ABAB"/>
<text x="140" y="372" text-anchor="end" font-size="14" font-family="Andale Mono, monospace">dog</text>
<rect x="156" y="390" width="12" height="16" fill="#B4ABAB"/>
<text x="140" y="402" text-anchor="end" font-size="14" font-family="Andale Mono, monospace">the</text>
<rect x="156" y="420" width="4" height="16" fill="#B4ABAB"/>
<text x="140" y="432" text-anchor="end" font-size="14" font-family="Andale Mono, monospace">roof</text>

<path d="M182 392 L176 392 L176 434 L182 434" fill="none" stroke="#DA1B2E" stroke-width="2"/>
<line x1="176" y1="413" x2="272" y2="413" stroke="#DA1B2E" stroke-width="2"/>
<text x="280" y="417" font-size="13" fill="#DA1B2E">casi no se ven, pero también son parte de la salida</text>

<text x="140" y="462" text-anchor="end" font-size="14" font-family="Andale Mono, monospace">...</text>
<text x="156" y="462" font-size="14" font-style="italic" fill="#6B6363">y así hasta completar los |V| tokens</text>

<line x1="156" y1="484" x2="556" y2="484" stroke="#C9C2C2" stroke-width="1.5"/>
<text x="156" y="508" font-size="15" font-weight="bold" fill="#DA1B2E">los |V| valores suman 1</text>

<text x="40" y="556" font-size="15" font-weight="bold">La lista entera es la salida del modelo.</text>
<text x="40" y="578" font-size="14" fill="#6B6363">Quedarse con la barra más larga es un paso aparte.</text>
</svg>
