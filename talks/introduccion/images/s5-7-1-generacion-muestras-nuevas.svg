  <text x="170" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">el corpus de</text>
  <text x="170" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">entrenamiento</text>

  <text x="450" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">aprende la forma</text>
  <text x="450" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">de la nube, no los</text>
  <text x="450" y="338" text-anchor="middle" font-size="12.5" fill="#6B6363">puntos</text>

  <text x="730" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">cada muestra es</text>
  <text x="730" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">plausible y nueva</text>
  <text x="730" y="338" text-anchor="middle" font-size="12.5" fill="#6B6363">a la vez</text>
