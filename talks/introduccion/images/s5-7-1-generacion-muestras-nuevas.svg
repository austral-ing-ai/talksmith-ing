  <circle cx="212" cy="234" r="3.5" fill="#6B6363"/>
  <circle cx="242" cy="226" r="3.5" fill="#6B6363"/>

  <ellipse cx="450" cy="192" rx="78" ry="52" fill="none" stroke="#B9B3B3" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="450" y="186" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">distribución</text>
  <text x="450" y="212" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">P(X)</text>

  <ellipse cx="730" cy="192" rx="82" ry="54" fill="none" stroke="#B9B3B3" stroke-width="1.4" stroke-dasharray="5 4"/>
