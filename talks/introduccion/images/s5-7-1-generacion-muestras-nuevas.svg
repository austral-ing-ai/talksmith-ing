<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Generación</title>
  <desc>Encuadrar Generación señalando lo que la separa de Predicción: el modelo aprende la forma de la distribución y muestrea puntos nuevos que podrían haber pertenecido a ella.</desc>
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="170" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">ENTRADA</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">MODELO</text>
  <text x="730" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2" fill="#DA1B2E">SALIDA</text>

  <text x="170" y="96" text-anchor="middle" font-size="13" fill="#6B6363">muchos ejemplos del mismo tipo</text>
  <text x="730" y="96" text-anchor="middle" font-size="13" fill="#6B6363">muestras que nunca existieron</text>

  <rect x="60" y="116" width="220" height="152" rx="4" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>
