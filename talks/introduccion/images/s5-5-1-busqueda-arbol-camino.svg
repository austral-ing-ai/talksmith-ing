<?xml version="1.0" encoding="UTF-8"?>

<!-- talksmith-ascii-sha256: 48d328dcbf1f395f091c3f59716ca05807e81100ab0f081fc784887ee2c02cd9 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Búsqueda / Planificación</title>
  <desc>Encuadrar Búsqueda y Planificación como la familia con modelo del entorno conocido: se explora un árbol de estados y se elige el mejor camino hasta la meta.</desc>
  <defs>
    <marker id="flecha-roja" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#DA1B2E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="140" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">ESTADO INICIAL</text>
  <text x="780" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2" fill="#DA1B2E">META</text>

  <text x="140" y="96" text-anchor="middle" font-size="13" fill="#6B6363">el punto de partida</text>
  <text x="780" y="96" text-anchor="middle" font-size="13" fill="#6B6363">el estado buscado</text>

  <line x1="140" y1="173" x2="300" y2="233" stroke="#C9C4C4" stroke-width="1.5"/>
  <line x1="300" y1="116" x2="460" y2="84" stroke="#C9C4C4" stroke-width="1.5"/>
  <line x1="300" y1="233" x2="460" y2="204" stroke="#C9C4C4" stroke-width="1.5"/>
  <line x1="300" y1="233" x2="460" y2="262" stroke="#C9C4C4" stroke-width="1.5"/>

  <line x1="140" y1="173" x2="300" y2="116" stroke="#DA1B2E" stroke-width="3"/>
  <line x1="300" y1="116" x2="460" y2="148" stroke="#DA1B2E" stroke-width="3"/>
  <line x1="460" y1="148" x2="620" y2="148" stroke="#DA1B2E" stroke-width="3"/>
  <line x1="620" y1="148" x2="768" y2="148" stroke="#DA1B2E" stroke-width="3" marker-end="url(#flecha-roja)"/>

  <circle cx="460" cy="84" r="10" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>
  <circle cx="460" cy="204" r="10" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>
  <circle cx="460" cy="262" r="10" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>
  <circle cx="300" cy="233" r="10" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>

  <circle cx="140" cy="173" r="10" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>
  <circle cx="300" cy="116" r="10" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>
  <circle cx="460" cy="148" r="10" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>
  <circle cx="620" cy="148" r="10" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>
  <circle cx="780" cy="148" r="12" fill="#DA1B2E"/>

  <text x="700" y="132" text-anchor="middle" font-size="12" fill="#DA1B2E">camino elegido</text>
  <text x="486" y="267" font-size="11.5" fill="#8A8383">ramas descartadas</text>

  <text x="450" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">el modelo del entorno se conoce de antemano: cada rama</text>
  <text x="450" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">es una acción posible y su costo. El problema es elegir</text>
  <text x="450" y="338" text-anchor="middle" font-size="12.5" fill="#6B6363">el camino, no descubrir las reglas</text>
</svg>
