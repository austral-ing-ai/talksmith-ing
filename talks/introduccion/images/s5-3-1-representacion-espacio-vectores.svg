<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Representación</title>
  <desc>Encuadrar Representación como la familia que produce embeddings y espacios latentes, donde la cercanía significa parecido.</desc>
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="170" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">ENTRADA</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">MODELO</text>
  <text x="730" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2" fill="#DA1B2E">SALIDA</text>

  <text x="170" y="96" text-anchor="middle" font-size="13" fill="#6B6363">símbolos sueltos</text>
  <text x="730" y="96" text-anchor="middle" font-size="13" fill="#6B6363">espacio de vectores</text>

  <rect x="60" y="116" width="220" height="152" rx="4" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>
  <rect x="340" y="116" width="220" height="152" rx="4" fill="#ffffff" stroke="#C9C4C4" stroke-width="1.5"/>
  <rect x="620" y="116" width="220" height="152" rx="4" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>

  <text x="170" y="160" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">“rey”</text>
  <text x="170" y="192" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">“reina”</text>
  <text x="170" y="224" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">“banana”</text>

  <text x="450" y="192" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">encoder</text>

  <line x1="664" y1="238" x2="778" y2="172" stroke="#B9B3B3" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="760" y1="156" x2="778" y2="172" stroke="#DA1B2E" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="752" y="172" text-anchor="end" font-size="11.5" fill="#DA1B2E">cerca</text>
  <text x="736" y="220" font-size="11.5" fill="#8A8383">lejos</text>
  <circle cx="760" cy="156" r="4.5" fill="#DA1B2E"/>
  <circle cx="778" cy="172" r="4.5" fill="#DA1B2E"/>
  <circle cx="664" cy="238" r="4.5" fill="#6B6363"/>
  <text x="769" y="150" font-size="12.5">rey</text>
  <text x="787" y="177" font-size="12.5">reina</text>
  <text x="673" y="243" font-size="12.5">banana</text>

  <line x1="282" y1="192" x2="340" y2="192" stroke="#3B3535" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="562" y1="192" x2="620" y2="192" stroke="#3B3535" stroke-width="3" marker-end="url(#flecha)"/>

  <text x="170" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">cadenas sin</text>
  <text x="170" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">relación entre sí</text>

  <text x="450" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">aprende qué cosas</text>
  <text x="450" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">aparecen en contextos</text>
  <text x="450" y="338" text-anchor="middle" font-size="12.5" fill="#6B6363">parecidos</text>

  <text x="730" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">la distancia es</text>
  <text x="730" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">el significado</text>
</svg>
