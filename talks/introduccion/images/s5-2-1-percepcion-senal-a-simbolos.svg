<?xml version="1.0" encoding="UTF-8"?>
<!-- talksmith-ascii-sha256: 337525ec5c7ebeebaf93ef931385bd2147ea0ea962391ab724f4122b7f2fbc8d -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Percepción</title>
  <desc>Encuadrar Percepción antes de los ejemplos: el sistema lee señales crudas y las traduce a entidades sobre las que después se decide.</desc>
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="170" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">ENTRADA</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">MODELO</text>
  <text x="730" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2" fill="#DA1B2E">SALIDA</text>

  <text x="170" y="96" text-anchor="middle" font-size="13" fill="#6B6363">señal cruda</text>
  <text x="730" y="96" text-anchor="middle" font-size="13" fill="#6B6363">estructura nombrada</text>

  <rect x="60" y="116" width="220" height="152" rx="4" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>
  <rect x="340" y="116" width="220" height="152" rx="4" fill="#ffffff" stroke="#C9C4C4" stroke-width="1.5"/>
  <rect x="620" y="116" width="220" height="152" rx="4" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>

  <text x="170" y="160" text-anchor="middle" font-size="14">píxeles</text>
  <text x="170" y="192" text-anchor="middle" font-size="14">ondas</text>
  <text x="170" y="224" text-anchor="middle" font-size="14">frames</text>

  <text x="450" y="192" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">encoder</text>

  <text x="730" y="160" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">“factura”</text>
  <text x="730" y="192" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">“botón #3”</text>
  <text x="730" y="224" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">“hola, qué...”</text>

  <line x1="282" y1="192" x2="340" y2="192" stroke="#3B3535" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="562" y1="192" x2="620" y2="192" stroke="#3B3535" stroke-width="3" marker-end="url(#flecha)"/>

  <text x="170" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">el programa no</text>
  <text x="170" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">puede operar sobre</text>
  <text x="170" y="338" text-anchor="middle" font-size="12.5" fill="#6B6363">esto directamente</text>

  <text x="450" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">aprende qué rasgos</text>
  <text x="450" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">importan en la señal</text>

  <text x="730" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">cada cosa tiene</text>
  <text x="730" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">nombre y lugar</text>
</svg>
