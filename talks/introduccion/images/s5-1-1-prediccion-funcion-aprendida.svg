<?xml version="1.0" encoding="UTF-8"?>

<!-- talksmith-ascii-sha256: a50c0eb0dd38446f92919e57c0cb70154bd3eeeeb26dac59d88985fda39c2d7d -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Predicción</title>
  <desc>Presentar Predicción como una de las familias más frecuentes de problemas de IA: se aprende una función a partir de pares entrada-respuesta y se aplica a un caso nuevo.</desc>
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#3B3535"/>
    </marker>
    <marker id="flechita" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#6B6363"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="170" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">ENTRADA</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2">MODELO</text>
  <text x="730" y="72" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1.2" fill="#DA1B2E">SALIDA</text>

  <text x="170" y="96" text-anchor="middle" font-size="13" fill="#6B6363">ejemplos con respuesta conocida</text>
  <text x="730" y="96" text-anchor="middle" font-size="13" fill="#6B6363">predicción para un caso nuevo</text>

  <rect x="60" y="116" width="220" height="152" rx="4" fill="#F2F2F2" stroke="#C9C4C4" stroke-width="1.5"/>
  <rect x="340" y="116" width="220" height="152" rx="4" fill="#ffffff" stroke="#C9C4C4" stroke-width="1.5"/>
  <rect x="620" y="116" width="220" height="152" rx="4" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>

  <text x="158" y="150" text-anchor="end" font-size="13" font-family="'DejaVu Sans Mono', monospace" fill="#8A8383">X</text>
  <line x1="164" y1="146" x2="192" y2="146" stroke="#6B6363" stroke-width="1.6" marker-end="url(#flechita)"/>
  <text x="200" y="150" font-size="13" font-family="'DejaVu Sans Mono', monospace" fill="#8A8383">Y</text>

  <text x="158" y="178" text-anchor="end" font-size="13" font-family="'DejaVu Sans Mono', monospace">ticket</text>
  <line x1="164" y1="174" x2="192" y2="174" stroke="#6B6363" stroke-width="1.6" marker-end="url(#flechita)"/>
  <text x="200" y="178" font-size="13" font-family="'DejaVu Sans Mono', monospace">P1</text>

  <text x="158" y="206" text-anchor="end" font-size="13" font-family="'DejaVu Sans Mono', monospace">ticket</text>
  <line x1="164" y1="202" x2="192" y2="202" stroke="#6B6363" stroke-width="1.6" marker-end="url(#flechita)"/>
  <text x="200" y="206" font-size="13" font-family="'DejaVu Sans Mono', monospace">P3</text>

  <text x="158" y="234" text-anchor="end" font-size="13" font-family="'DejaVu Sans Mono', monospace">ticket</text>
  <line x1="164" y1="230" x2="192" y2="230" stroke="#6B6363" stroke-width="1.6" marker-end="url(#flechita)"/>
  <text x="200" y="234" font-size="13" font-family="'DejaVu Sans Mono', monospace">P1</text>

  <text x="450" y="180" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">función</text>
  <text x="450" y="208" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">f(X) = Y</text>

  <text x="730" y="158" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">X nuevo</text>
  <line x1="730" y1="172" x2="730" y2="208" stroke="#3B3535" stroke-width="2.2" marker-end="url(#flecha)"/>
  <text x="730" y="232" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', monospace">“P1”</text>

  <line x1="282" y1="192" x2="340" y2="192" stroke="#3B3535" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="562" y1="192" x2="620" y2="192" stroke="#3B3535" stroke-width="3" marker-end="url(#flecha)"/>

  <text x="170" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">cada ejemplo trae</text>
  <text x="170" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">su respuesta</text>
  <text x="170" y="338" text-anchor="middle" font-size="12.5" fill="#6B6363">ya conocida</text>

  <text x="450" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">ajusta f hasta que</text>
  <text x="450" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">el error es mínimo</text>

  <text x="730" y="300" text-anchor="middle" font-size="12.5" fill="#6B6363">responde sobre</text>
  <text x="730" y="319" text-anchor="middle" font-size="12.5" fill="#6B6363">casos que no vio</text>
</svg>
