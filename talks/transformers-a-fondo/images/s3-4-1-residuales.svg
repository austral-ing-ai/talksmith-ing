<!-- talksmith-ascii-sha256: 5f044bf7d32e3c18e86d7e5085f8e0c2795d6507336dbcb05fee4691d135c5bd -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 568" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
<title>Residuales: la salida es la entrada más una corrección</title>
<desc>Cada subcapa suma su resultado al vector de entrada: un camino directo rodea la atención y la feed-forward y lleva x intacto hasta el signo más.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="0" y="0" width="468" height="568" fill="#ffffff"/>
<g transform="translate(-56,4)">
<g stroke="#DA1B2E" stroke-width="2.5" fill="none">
<path d="M200,80 H380 V210 H216" marker-end="url(#ahr)"/>
<path d="M200,320 H380 V450 H216" marker-end="url(#ahr)"/>
</g>
<g stroke="#3B3535" stroke-width="1.5" fill="none">
<line x1="200" y1="60" x2="200" y2="100" marker-end="url(#ah)"/>
<line x1="200" y1="156" x2="200" y2="194" marker-end="url(#ah)"/>
<line x1="200" y1="226" x2="200" y2="262" marker-end="url(#ah)"/>
<line x1="200" y1="300" x2="200" y2="340" marker-end="url(#ah)"/>
<line x1="200" y1="396" x2="200" y2="434" marker-end="url(#ah)"/>
<line x1="200" y1="466" x2="200" y2="502" marker-end="url(#ah)"/>
</g>
<circle cx="200" cy="80" r="4" fill="#DA1B2E"/>
<circle cx="200" cy="320" r="4" fill="#DA1B2E"/>
<rect x="170" y="20" width="60" height="40" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
<text x="200" y="46" text-anchor="middle" font-weight="bold" font-size="18" font-family="'DejaVu Sans Mono', monospace">x</text>
<g fill="#f2f2f2" stroke="#9a9494" stroke-width="1.2">
<rect x="100" y="100" width="200" height="56" rx="8"/>
<rect x="100" y="340" width="200" height="56" rx="8"/>
</g>
<g text-anchor="middle">
<text x="200" y="124" font-weight="bold" font-size="16">atención</text>
<text x="200" y="144" font-size="13" fill="#6b6464">calcula una corrección</text>
<text x="200" y="364" font-weight="bold" font-size="16">feed-forward</text>
<text x="200" y="384" font-size="13" fill="#6b6464">calcula otra corrección</text>
</g>
<g fill="#ffffff" stroke="#DA1B2E" stroke-width="2">
<circle cx="200" cy="210" r="16"/>
<circle cx="200" cy="450" r="16"/>
</g>
<g stroke="#DA1B2E" stroke-width="2.5">
<line x1="191" y1="210" x2="209" y2="210"/>
<line x1="200" y1="201" x2="200" y2="219"/>
<line x1="191" y1="450" x2="209" y2="450"/>
<line x1="200" y1="441" x2="200" y2="459"/>
</g>
<g fill="#f2f2f2" stroke="#3B3535" stroke-width="1.2">
<rect x="80" y="262" width="240" height="38" rx="6"/>
<rect x="80" y="502" width="240" height="38" rx="6"/>
</g>
<g text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="15">
<text x="200" y="286">x' = x + atención(x)</text>
<text x="200" y="526">x'' = x' + FFN(x')</text>
</g>
<g font-size="14">
<text x="392" y="140" font-weight="bold" fill="#DA1B2E">camino residual</text>
<text x="392" y="158" font-size="13" fill="#6b6464">x pasa intacto</text>
<text x="392" y="380" font-weight="bold" fill="#DA1B2E">camino residual</text>
<text x="392" y="398" font-size="13" fill="#6b6464">x' pasa intacto</text>
</g>
</g>
</svg>
