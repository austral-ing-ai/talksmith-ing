<svg xmlns="http://www.w3.org/2000/svg" viewBox="66 -4 538 516" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Residuales: la salida es la entrada más una corrección</title>
<desc>Cada subcapa suma su resultado a la entrada por un camino directo: primero la atención y después la feed-forward.</desc>
