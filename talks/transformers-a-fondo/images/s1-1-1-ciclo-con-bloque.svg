<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 730 500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
<title>El ciclo de generación con el transformer abierto</title>
<desc>El ciclo de generación de la clase pasada con el recuadro del transformer abierto: un bloque de atención y feed-forward que se repite N veces.</desc>
<defs>
<marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#3B3535"/></marker>
<marker id="r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="-10" width="730" height="500" fill="#FFFFFF"/>
<g stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#a)">
<line x1="160" y1="56" x2="160" y2="80"/>
<line x1="160" y1="124" x2="160" y2="148"/>
<line x1="160" y1="192" x2="160" y2="220"/>
<line x1="160" y1="340" x2="160" y2="368"/>
<line x1="160" y1="412" x2="160" y2="436"/>
<path d="M60,458 H24 V38 H100"/>
</g>
<text x="18" y="250" font-size="12" fill="#7A7272" transform="rotate(-90 18 250)" text-anchor="middle">vuelve a empezar</text>
<rect x="100" y="20" width="120" height="36" rx="18" fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="160" y="43" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="14">"the cat sat"</text>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="60" y="80" width="200" height="44" rx="6"/>
<rect x="60" y="148" width="200" height="44" rx="6"/>
<rect x="60" y="368" width="200" height="44" rx="6"/>
<rect x="60" y="436" width="200" height="44" rx="6"/>
</g>
<g text-anchor="middle" font-weight="bold" fill="#1F1E1E">
<text x="160" y="107">TOKENIZAR</text>
<text x="160" y="175">EMBEDDER</text>
<text x="160" y="395">DISTRIBUCIÓN</text>
<text x="160" y="463">ELEGIR</text>
</g>
<text x="290" y="107" font-family="'DejaVu Sans Mono', monospace" font-size="14">the | cat | sat</text>
<text x="520" y="107" fill="#7A7272">3 tokens</text>
<text x="290" y="166">una fila por token</text>
<text x="290" y="185">+ posición de cada token</text>
<text x="520" y="176" font-family="'DejaVu Sans Mono', monospace" font-size="14">X : 3 × d</text>
<text x="290" y="395">un valor por token de V</text>
<text x="520" y="395" fill="#7A7272">|V| = 50.257 en GPT-2</text>
<text x="290" y="463" font-family="'DejaVu Sans Mono', monospace" font-size="14">"on"</text>
<text x="336" y="463">se agrega y vuelve a empezar</text>
<rect x="40" y="220" width="590" height="120" rx="8" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2.5"/>
<text x="62" y="250" font-size="17" font-weight="bold" fill="#DA1B2E">TRANSFORMER  =  bloque × N</text>
<rect x="128" y="264" width="398" height="62" rx="6" fill="none" stroke="#DA1B2E" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="62" y="300" fill="#1F1E1E">bloque:</text>
<g fill="#F9D2D6" stroke="#DA1B2E" stroke-width="1.5">
<rect x="142" y="274" width="150" height="42" rx="6"/>
<rect x="352" y="274" width="160" height="42" rx="6"/>
</g>
<line x1="292" y1="295" x2="352" y2="295" stroke="#DA1B2E" stroke-width="1.8" marker-end="url(#r)"/>
<g text-anchor="middle" font-weight="bold" fill="#1F1E1E">
<text x="217" y="300">atención</text>
<text x="432" y="300">feed-forward</text>
</g>
<text x="540" y="303" font-size="22" font-weight="bold" fill="#DA1B2E">× N</text>
<rect x="642" y="228" width="58" height="28" rx="14" fill="#DA1B2E"/>
<text x="671" y="247" text-anchor="middle" font-weight="bold" fill="#FFFFFF">hoy</text>
</svg>
