<g font-size="18" text-anchor="middle" fill="#6B6363">
<text x="220" y="70">(sen)</text><text x="340" y="70">(cos)</text><text x="480" y="70">(sen)</text><text x="600" y="70">(cos)</text>
</g>
<g font-size="22" font-weight="bold">
