<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 336" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Del encoder al embedding de oración</title>
<desc>Dos fragmentos pasan por el mismo BERT, se promedian sus tokens en un vector y se comparan por coseno; el ajuste con pares de frases hace que el coseno refleje similitud.</desc>
