<g stroke="#D8D2CE" stroke-width="1.5" fill="#F2EEEE">
<rect x="20" y="20" width="130" height="50" rx="6"/><rect x="20" y="180" width="130" height="50" rx="6"/>
<rect x="500" y="20" width="130" height="50" rx="6"/><rect x="500" y="180" width="130" height="50" rx="6"/>
<rect x="670" y="20" width="90" height="50" rx="6"/><rect x="670" y="180" width="90" height="50" rx="6"/>
