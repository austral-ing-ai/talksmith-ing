<text x="245" y="52" font-weight="bold" font-size="20" fill="#1F1E1E">BERT</text><text x="245" y="212" font-weight="bold" font-size="20" fill="#1F1E1E">BERT</text>
<text x="565" y="42" font-weight="bold" fill="#1F1E1E">pooling</text><text x="565" y="202" font-weight="bold" fill="#1F1E1E">pooling</text>
<text x="565" y="61" font-size="15">media</text><text x="565" y="221" font-size="15">media</text>
<text x="715" y="51" font-weight="bold" fill="#1F1E1E">u (d)</text><text x="715" y="211" font-weight="bold" fill="#1F1E1E">v (d)</text>
<text x="400" y="91" font-size="15">tokens (n × d)</text><text x="400" y="251" font-size="15">tokens (n × d)</text>
<text x="245" y="130" font-size="15">mismos pesos</text>
<text x="910" y="132" font-weight="bold" fill="#FFFFFF" font-size="20">coseno(u, v)</text>
<text x="40" y="298" font-size="17" text-anchor="start"><tspan font-weight="bold">Entrenamiento:</tspan> pares de frases etiquetadas (NLI, STS) para que coseno alto = significado parecido</text>
