<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 660 368" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Tres proyecciones del mismo vector</title>
<desc>La pregunta que hay que contestar acá es por qué tres y no una: la misma matriz X se multiplica por Wq, Wk y Wv y da Q, K y V.</desc>
<defs>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#3B3535"/></marker>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="30" y="0" width="660" height="368" fill="#FFFFFF"/>
<rect x="235" y="20" width="250" height="72" rx="8" fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="360" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F1E1E">X  (n × d)</text>
<text x="360" y="77" text-anchor="middle" font-size="16" font-family="'DejaVu Sans Mono', monospace">fila de “cat”: [0 2 0 1]</text>
<g stroke="#DA1B2E" stroke-width="3" fill="none">
<line x1="360" y1="92" x2="360" y2="118"/>
<line x1="130" y1="118" x2="590" y2="118"/>
<line x1="130" y1="118" x2="130" y2="150" marker-end="url(#ar)"/>
<line x1="360" y1="118" x2="360" y2="150" marker-end="url(#ar)"/>
<line x1="590" y1="118" x2="590" y2="150" marker-end="url(#ar)"/>
</g>
<g fill="#FFFFFF" stroke="#3B3535" stroke-width="1.5">
<rect x="50" y="150" width="160" height="46" rx="6"/>
<rect x="280" y="150" width="160" height="46" rx="6"/>
<rect x="510" y="150" width="160" height="46" rx="6"/>
</g>
<g font-size="20" font-weight="bold" fill="#1F1E1E" text-anchor="end">
<text x="134" y="180">X · W</text>
<text x="364" y="180">X · W</text>
<text x="594" y="180">X · W</text>
</g>
<g font-size="14" font-weight="bold" fill="#1F1E1E">
<text x="135" y="186">q</text>
<text x="365" y="186">k</text>
<text x="595" y="186">v</text>
</g>
<g stroke="#3B3535" stroke-width="2">
<line x1="130" y1="196" x2="130" y2="232" marker-end="url(#ag)"/>
<line x1="360" y1="196" x2="360" y2="232" marker-end="url(#ag)"/>
<line x1="590" y1="196" x2="590" y2="232" marker-end="url(#ag)"/>
</g>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="50" y="232" width="160" height="60" rx="8"/>
<rect x="280" y="232" width="160" height="60" rx="8"/>
<rect x="510" y="232" width="160" height="60" rx="8"/>
</g>
<g font-size="32" font-weight="bold" fill="#1F1E1E" text-anchor="middle">
<text x="130" y="274">Q</text>
<text x="360" y="274">K</text>
<text x="590" y="274">V</text>
</g>
<g font-size="18" font-style="italic" text-anchor="middle">
<text x="130" y="320">qué busco</text>
<text x="360" y="320">qué ofrezco</text>
<text x="590" y="320">qué entrego</text>
</g>
<g font-size="15" font-family="'DejaVu Sans Mono', monospace">
<text x="130" y="344" text-anchor="middle">(n × d)</text>
<text x="360" y="344" text-anchor="middle">(n × d)</text>
<text x="555" y="344">(n × d</text>
<text x="609" y="349" font-size="11">v</text>
<text x="616" y="344">)</text>
</g>
</svg>
