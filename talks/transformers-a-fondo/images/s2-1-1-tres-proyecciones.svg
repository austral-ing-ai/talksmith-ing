<!-- talksmith-ascii-sha256: 5868ddb1d8ccee2c1a96ecdaa3b09099397051c81bd6575cc72e3f83f4b22bee -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 0 560 360" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Tres proyecciones del mismo vector</title>
<desc>La misma matriz X se multiplica por tres matrices entrenables distintas y da Q, K y V: lo que cada token busca, lo que ofrece y lo que entrega.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/></marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/></marker>
</defs>
<rect x="60" y="0" width="560" height="360" fill="#ffffff"/>
<rect x="220" y="20" width="240" height="70" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
<text x="340" y="50" text-anchor="middle" font-size="22" font-weight="bold">X  (n × d)</text>
<text x="340" y="76" text-anchor="middle" font-size="13" font-family="'DejaVu Sans Mono', monospace">fila de “cat”: [0 2 0 1]</text>
<g stroke="#DA1B2E" stroke-width="2" fill="none">
<path d="M340,90 V115"/>
<path d="M150,115 H530"/>
<path d="M150,115 V145" marker-end="url(#ahr)"/>
<path d="M340,115 V145" marker-end="url(#ahr)"/>
<path d="M530,115 V145" marker-end="url(#ahr)"/>
</g>
<g fill="#F2F2F2" stroke="#3B3535" stroke-width="1.5">
<rect x="90" y="145" width="120" height="40" rx="5"/>
<rect x="280" y="145" width="120" height="40" rx="5"/>
<rect x="470" y="145" width="120" height="40" rx="5"/>
</g>
<g font-size="18">
<text x="129" y="171">X W<tspan dy="5" font-size="13">q</tspan></text>
<text x="319" y="171">X W<tspan dy="5" font-size="13">k</tspan></text>
<text x="509" y="171">X W<tspan dy="5" font-size="13">v</tspan></text>
</g>
<g stroke="#3B3535" stroke-width="1.5" fill="none">
<path d="M150,185 V225" marker-end="url(#ah)"/>
<path d="M340,185 V225" marker-end="url(#ah)"/>
<path d="M530,185 V225" marker-end="url(#ah)"/>
</g>
<g fill="#F2F2F2" stroke="#3B3535" stroke-width="1.5">
<rect x="80" y="225" width="140" height="56" rx="6"/>
<rect x="270" y="225" width="140" height="56" rx="6"/>
<rect x="460" y="225" width="140" height="56" rx="6"/>
</g>
<g font-size="28" font-weight="bold" text-anchor="middle">
<text x="150" y="263">Q</text>
<text x="340" y="263">K</text>
<text x="530" y="263">V</text>
</g>
<g font-size="16" font-style="italic" text-anchor="middle">
<text x="150" y="308">qué busco</text>
<text x="340" y="308">qué ofrezco</text>
<text x="530" y="308">qué entrego</text>
</g>
<g font-size="14" fill="#6B6363">
<text x="150" y="334" text-anchor="middle">n × d</text>
<text x="340" y="334" text-anchor="middle">n × d</text>
<text x="512" y="334">n × d<tspan dy="4" font-size="10">v</tspan></text>
</g>
</svg>
