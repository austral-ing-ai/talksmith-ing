<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 853 354" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Escalar y repartir: el softmax</title>
<desc>Matriz de atención A: cada fila es una distribución que suma 1, y el camino de la fila de cat desde los scores, divididos por 2, hasta los pesos del softmax.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
</defs>
<rect x="0" y="52" width="853" height="354" fill="#FFFFFF"/>
<text x="30" y="207" font-size="23" fill="#1F1E1E">A = softmax(Q K<tspan dy="-9" font-size="15">T</tspan><tspan dy="9"> / 2)</tspan></text>
<g font-family="'DejaVu Sans Mono', monospace" font-size="21" text-anchor="middle" fill="#3B3535">
<text x="431" y="106">the</text>
<text x="531" y="106">cat</text>
<text x="631" y="106">sat</text>
</g>
<g font-family="'DejaVu Sans Mono', monospace" font-size="21" text-anchor="end">
<text x="350" y="162">the</text>
<text x="350" y="207" fill="#DA1B2E" font-weight="bold">cat</text>
<text x="350" y="252">sat</text>
</g>
<rect x="386" y="182" width="286" height="34" rx="4" fill="#F9D2D6" stroke="#DA1B2E" stroke-width="1.5"/>
<path d="M 382 125 H 368 V 270 H 382" fill="none" stroke="#3B3535" stroke-width="2.5"/>
<path d="M 676 125 H 690 V 270 H 676" fill="none" stroke="#3B3535" stroke-width="2.5"/>
<g font-family="'DejaVu Sans Mono', monospace" font-size="24" text-anchor="end" fill="#1F1E1E">
<text x="460" y="162">0,12</text>
<text x="560" y="162">0,55</text>
<text x="660" y="162">0,33</text>
<text x="460" y="207" fill="#DA1B2E" font-weight="bold">0,45</text>
<text x="560" y="207" fill="#DA1B2E" font-weight="bold">0,10</text>
<text x="660" y="207" fill="#DA1B2E" font-weight="bold">0,45</text>
<text x="460" y="252">0,19</text>
<text x="560" y="252">0,31</text>
<text x="660" y="252">0,51</text>
</g>
<g font-size="19" fill="#6E6666">
<text x="708" y="161">suma 1</text>
<text x="708" y="206">suma 1</text>
<text x="708" y="251">suma 1</text>
</g>
<line x1="30" y1="296" x2="823" y2="296" stroke="#D8D2CE" stroke-width="1"/>
<text x="30" y="345" font-size="20" font-weight="bold" fill="#DA1B2E">fila cat:</text>
<g font-family="'DejaVu Sans Mono', monospace" font-size="22" fill="#1F1E1E">
<text x="128" y="345">[3 0 3]</text>
<text x="336" y="345">[1,5 0 1,5]</text>
<text x="612" y="345" fill="#DA1B2E" font-weight="bold">[0,45 0,10 0,45]</text>
</g>
<line x1="234" y1="338" x2="324" y2="338" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<line x1="494" y1="338" x2="600" y2="338" stroke="#3B3535" stroke-width="2" marker-end="url(#ah)"/>
<g font-size="17" text-anchor="middle" fill="#3B3535">
<text x="279" y="326">/ 2</text>
<text x="547" y="326">softmax</text>
</g>
<g font-size="15" text-anchor="middle" fill="#6E6666">
<text x="174" y="376">scores</text>
<text x="409" y="376">escalados</text>
<text x="717" y="376">pesos</text>
