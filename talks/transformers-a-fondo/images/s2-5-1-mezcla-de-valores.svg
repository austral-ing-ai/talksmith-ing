<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 12 644 300" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Mezclar los valores</title>
<desc>La fila de pesos de atención de «cat» multiplicada por la matriz de valores V da la nueva representación de «cat»: [1,80 1,20].</desc>
<rect x="16" y="12" width="644" height="300" fill="#ffffff"/>
<text x="130" y="72" font-size="16" font-weight="bold" text-anchor="middle">pesos de «cat»</text>
<g font-size="14" text-anchor="middle" fill="#6B6363">
<text x="75" y="100">the</text>
<text x="130" y="100">cat</text>
<text x="185" y="100">sat</text>
</g>
<g fill="#F2F2F2" stroke="#8C8585" stroke-width="1.2">
<rect x="48" y="108" width="54" height="40"/>
<rect x="103" y="108" width="54" height="40"/>
<rect x="158" y="108" width="54" height="40"/>
</g>
<g font-size="18" text-anchor="middle">
<text x="75" y="134">0,45</text>
<text x="130" y="134">0,10</text>
<text x="185" y="134">0,45</text>
</g>
<text x="265" y="137" font-size="26" text-anchor="middle">×</text>
<text x="385" y="48" font-size="16" font-weight="bold" text-anchor="middle">V</text>
<g font-size="14" text-anchor="end" fill="#6B6363">
<text x="350" y="87">the</text>
<text x="350" y="133">cat</text>
<text x="350" y="179">sat</text>
</g>
<g fill="#F2F2F2" stroke="#8C8585" stroke-width="1.2">
<rect x="358" y="62" width="50" height="40"/>
<rect x="409" y="62" width="50" height="40"/>
<rect x="358" y="108" width="50" height="40"/>
<rect x="409" y="108" width="50" height="40"/>
<rect x="358" y="154" width="50" height="40"/>
<rect x="409" y="154" width="50" height="40"/>
</g>
<g font-size="18" text-anchor="middle">
<text x="383" y="88">2</text>
<text x="434" y="88">0</text>
<text x="383" y="134">0</text>
<text x="434" y="134">3</text>
<text x="383" y="180">2</text>
<text x="434" y="180">2</text>
</g>
<text x="492" y="137" font-size="26" text-anchor="middle">=</text>
<g fill="#FBE8EA" stroke="#DA1B2E" stroke-width="2">
<rect x="518" y="108" width="58" height="40"/>
<rect x="577" y="108" width="58" height="40"/>
</g>
<g font-size="18" font-weight="bold" text-anchor="middle" fill="#DA1B2E">
<text x="547" y="134">1,80</text>
<text x="606" y="134">1,20</text>
<text x="576" y="176" font-size="16">nueva «cat»</text>
</g>
<line x1="40" y1="220" x2="632" y2="220" stroke="#D9D6D6" stroke-width="1"/>
<g font-size="14" text-anchor="end" fill="#6B6363">
<text x="190" y="256">dim 1</text>
<text x="190" y="290">dim 2</text>
</g>
<g font-family="'DejaVu Sans Mono', monospace" font-size="17">
<text x="205" y="256" xml:space="preserve">0,45·2 + 0,10·0 + 0,45·2 = <tspan font-weight="bold" fill="#DA1B2E">1,80</tspan></text>
<text x="205" y="290" xml:space="preserve">0,45·0 + 0,10·3 + 0,45·2 = <tspan font-weight="bold" fill="#DA1B2E">1,20</tspan></text>
</g>
</svg>
