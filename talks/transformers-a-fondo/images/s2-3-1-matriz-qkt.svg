<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 690 290" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>El producto punto mide afinidad</title>
<desc>Matriz Q Kᵀ de 3 por 3: cada consulta contra cada clave; la celda de cat contra the vale 3 y se calcula abajo.</desc>
<rect x="10" y="0" width="690" height="290" fill="#ffffff"/>
<text x="30" y="160" font-size="30" font-weight="bold" fill="#1F1E1E">Q K<tspan dy="-12" font-size="17">T</tspan><tspan dy="12" font-size="30"> =</tspan></text>
<text x="0" y="0" font-size="19" font-style="italic" text-anchor="middle" transform="translate(186,152) rotate(-90)">consultas</text>
<text x="400" y="36" font-size="19" font-style="italic" text-anchor="middle">claves</text>
<g font-size="22" text-anchor="middle">
<text x="322" y="72">the</text><text x="400" y="72">cat</text><text x="478" y="72">sat</text>
</g>
<rect x="290" y="130" width="222" height="36" rx="4" fill="#F2EEEE"/>
<rect x="302" y="131" width="42" height="34" rx="3" fill="#F9D2D6" stroke="#DA1B2E" stroke-width="2.5"/>
<g font-size="22" text-anchor="end">
<text x="258" y="116">the</text><text x="258" y="156" fill="#DA1B2E" font-weight="bold">cat</text><text x="258" y="196">sat</text>
</g>
<g fill="none" stroke="#3B3535" stroke-width="2.5">
<path d="M290 88 H280 V208 H290"/><path d="M510 88 H520 V208 H510"/>
</g>
<g font-family="'DejaVu Sans Mono', monospace" font-size="26" text-anchor="end">
<text x="330" y="117">0</text><text x="408" y="117">3</text><text x="486" y="117">2</text>
<text x="330" y="157" fill="#DA1B2E" font-weight="bold">3</text><text x="408" y="157">0</text><text x="486" y="157">3</text>
<text x="330" y="197">2</text><text x="408" y="197">3</text><text x="486" y="197">4</text>
</g>
<text x="556" y="157" font-size="22">n × n = 3 × 3</text>
<g font-family="'DejaVu Sans Mono', monospace" font-size="22">
<text x="190" y="262" xml:space="preserve">cat · the = 0·0 + 2·1 + 0·0 + 1·1 = </text>
<text x="667" y="262" fill="#DA1B2E" font-weight="bold">3</text>
</g>
</svg>
