<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 4 688 262" font-size="26" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Q y K en el ejemplo</title>
<desc>Lámina de cálculo puro: las consultas Q quedan iguales a X y las claves K son X con los pares de columnas intercambiados.</desc>
<rect x="44" y="4" width="688" height="262" fill="#ffffff"/>
<text x="190" y="40" text-anchor="middle" font-size="22" font-weight="bold">Q = X Wq</text>
<rect x="108" y="113" width="220" height="42" rx="6" fill="#FBE4E6" stroke="#DA1B2E" stroke-width="2"/>
<line x1="162" y1="68" x2="162" y2="200" stroke="#E4E1E1" stroke-width="1"/>
<line x1="218" y1="68" x2="218" y2="200" stroke="#E4E1E1" stroke-width="1"/>
<line x1="274" y1="68" x2="274" y2="200" stroke="#E4E1E1" stroke-width="1"/>
<path d="M114,62 H106 V206 H114" fill="none" stroke="#3B3535" stroke-width="2.5"/>
<path d="M322,62 H330 V206 H322" fill="none" stroke="#3B3535" stroke-width="2.5"/>
<text x="92" y="94.0" text-anchor="end" font-size="20">the</text>
<text x="134" y="95.0" text-anchor="middle">1</text>
<text x="190" y="95.0" text-anchor="middle">0</text>
<text x="246" y="95.0" text-anchor="middle">1</text>
<text x="302" y="95.0" text-anchor="middle">0</text>
<text x="92" y="142.0" text-anchor="end" font-size="20" fill="#DA1B2E" font-weight="bold">cat</text>
<text x="134" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">0</text>
<text x="190" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">2</text>
<text x="246" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">0</text>
<text x="302" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">1</text>
<text x="92" y="190.0" text-anchor="end" font-size="20">sat</text>
<text x="134" y="191.0" text-anchor="middle">1</text>
<text x="190" y="191.0" text-anchor="middle">1</text>
<text x="246" y="191.0" text-anchor="middle">1</text>
<text x="302" y="191.0" text-anchor="middle">1</text>
<text x="190" y="242" text-anchor="middle" font-size="16">Wq = identidad: Q queda igual a X</text>
<text x="560" y="40" text-anchor="middle" font-size="22" font-weight="bold">K = X Wk</text>
<rect x="478" y="113" width="220" height="42" rx="6" fill="#FBE4E6" stroke="#DA1B2E" stroke-width="2"/>
<line x1="532" y1="68" x2="532" y2="200" stroke="#E4E1E1" stroke-width="1"/>
<line x1="588" y1="68" x2="588" y2="200" stroke="#E4E1E1" stroke-width="1"/>
<line x1="644" y1="68" x2="644" y2="200" stroke="#E4E1E1" stroke-width="1"/>
<path d="M484,62 H476 V206 H484" fill="none" stroke="#3B3535" stroke-width="2.5"/>
<path d="M692,62 H700 V206 H692" fill="none" stroke="#3B3535" stroke-width="2.5"/>
<text x="462" y="94.0" text-anchor="end" font-size="20">the</text>
<text x="504" y="95.0" text-anchor="middle">0</text>
<text x="560" y="95.0" text-anchor="middle">1</text>
<text x="616" y="95.0" text-anchor="middle">0</text>
<text x="672" y="95.0" text-anchor="middle">1</text>
<text x="462" y="142.0" text-anchor="end" font-size="20" fill="#DA1B2E" font-weight="bold">cat</text>
<text x="504" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">2</text>
<text x="560" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">0</text>
<text x="616" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">1</text>
<text x="672" y="143.0" text-anchor="middle" fill="#DA1B2E" font-weight="bold">0</text>
<text x="462" y="190.0" text-anchor="end" font-size="20">sat</text>
<text x="504" y="191.0" text-anchor="middle">1</text>
<text x="560" y="191.0" text-anchor="middle">1</text>
<text x="616" y="191.0" text-anchor="middle">1</text>
<text x="672" y="191.0" text-anchor="middle">1</text>
<text x="560" y="242" text-anchor="middle" font-size="16">Wk intercambia columna 1 con 2 y 3 con 4</text>
