<!-- talksmith-ascii-sha256: a9acc78f8aef25d1c387d5f3ae59de018d1abfd3cc2fa600c94e6217489bca55 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 8 797 266" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Q y K en el ejemplo</title>
<desc>Lámina de cálculo puro: las consultas Q quedan iguales a X y las claves K son X con los pares de columnas intercambiados; la fila de cat se sigue en las láminas siguientes.</desc>
<rect x="0" y="0" width="840" height="290" fill="#ffffff"/>
<g transform="translate(-10,-8)">
<rect x="100" y="136" width="186" height="34" rx="4" fill="#F2EEEE"/>
<rect x="490" y="136" width="186" height="34" rx="4" fill="#F2EEEE"/>
<text x="100" y="56" font-size="26" font-weight="bold" fill="#1F1E1E">Q = X W<tspan dy="6" font-size="16">q</tspan></text>
<text x="490" y="56" font-size="26" font-weight="bold" fill="#1F1E1E">K = X W<tspan dy="6" font-size="16">k</tspan></text>
<g font-size="21" text-anchor="end">
<text x="78" y="120">the</text><text x="78" y="160" fill="#DA1B2E" font-weight="bold">cat</text><text x="78" y="200">sat</text>
<text x="468" y="120">the</text><text x="468" y="160" fill="#DA1B2E" font-weight="bold">cat</text><text x="468" y="200">sat</text>
</g>
<g fill="none" stroke="#3B3535" stroke-width="2.5">
<path d="M110 86 H100 V214 H110"/><path d="M276 86 H286 V214 H276"/>
<path d="M500 86 H490 V214 H500"/><path d="M666 86 H676 V214 H666"/>
</g>
<g font-family="'DejaVu Sans Mono', monospace" font-size="24" text-anchor="end">
<text x="140" y="121">1</text><text x="180" y="121">0</text><text x="220" y="121">1</text><text x="260" y="121">0</text>
<g fill="#DA1B2E" font-weight="bold"><text x="140" y="161">0</text><text x="180" y="161">2</text><text x="220" y="161">0</text><text x="260" y="161">1</text></g>
<text x="140" y="201">1</text><text x="180" y="201">1</text><text x="220" y="201">1</text><text x="260" y="201">1</text>
<text x="530" y="121">0</text><text x="570" y="121">1</text><text x="610" y="121">0</text><text x="650" y="121">1</text>
<g fill="#DA1B2E" font-weight="bold"><text x="530" y="161">2</text><text x="570" y="161">0</text><text x="610" y="161">1</text><text x="650" y="161">0</text></g>
<text x="530" y="201">1</text><text x="570" y="201">1</text><text x="610" y="201">1</text><text x="650" y="201">1</text>
</g>
<g font-size="17">
<text x="100" y="256">W<tspan dy="4" font-size="12">q</tspan><tspan dy="-4"> = identidad: Q queda igual a X</tspan></text>
<text x="490" y="256">W<tspan dy="4" font-size="12">k</tspan><tspan dy="-4"> intercambia columna 1 con 2 y 3 con 4</tspan></text>
</g>
</g>
</svg>
