<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 0 750 380" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="16">
<title>El problema de apilar: el gradiente se pierde</title>
<desc>Lámina de problema, sin solución todavía, para que la residual de la siguiente se lea como respuesta y no como convención.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 Z" fill="#3B3535"/></marker>
</defs>
<rect x="5" y="0" width="750" height="380" fill="#FFFFFF"/>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="25" y="20" width="90" height="44" rx="8"/>
<rect x="149" y="20" width="100" height="44" rx="8"/>
<rect x="357" y="20" width="100" height="44" rx="8"/>
<rect x="491" y="20" width="100" height="44" rx="8"/>
<rect x="625" y="20" width="110" height="44" rx="8"/>
</g>
<g text-anchor="middle" font-weight="bold" fill="#1F1E1E">
<text x="70" y="47">salida</text>
<text x="199" y="47">bloque N</text>
<text x="303" y="47">···</text>
<text x="407" y="47">bloque 2</text>
<text x="541" y="47">bloque 1</text>
<text x="680" y="47">embedding</text>
</g>
<g stroke="#3B3535" stroke-width="1.5" fill="none">
<line x1="149" y1="42" x2="115" y2="42" marker-end="url(#ah)"/>
<line x1="283" y1="42" x2="249" y2="42" marker-end="url(#ah)"/>
<line x1="357" y1="42" x2="325" y2="42" marker-end="url(#ah)"/>
<line x1="491" y1="42" x2="457" y2="42" marker-end="url(#ah)"/>
<line x1="625" y1="42" x2="591" y2="42" marker-end="url(#ah)"/>
<path d="M70,64 V86 H680 V64" stroke-dasharray="6 4" marker-end="url(#ah)"/>
</g>
<text x="380" y="106" text-anchor="middle" font-size="14" font-style="italic">el error vuelve desde la salida hasta la primera capa</text>
<rect x="25" y="124" width="710" height="52" rx="8" fill="#F2F2F2" stroke="#D8D2CE" stroke-width="1.5"/>
<text x="310" y="156" text-anchor="end" font-weight="bold" font-size="17" fill="#1F1E1E">gradiente en la capa 1</text>
<text x="322" y="156" font-family="'DejaVu Sans Mono', monospace" font-size="18" fill="#1F1E1E">= dL/dx<tspan dy="5" font-size="12">N</tspan><tspan dy="-5"> · J</tspan><tspan dy="5" font-size="12">N</tspan><tspan dy="-5"> · J</tspan><tspan dy="5" font-size="12">N−1</tspan><tspan dy="-5"> · … · J</tspan><tspan dy="5" font-size="12">2</tspan><tspan dy="-5"> · J</tspan><tspan dy="5" font-size="12">1</tspan></text>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="25" y="200" width="345" height="160" rx="8"/>
<rect x="390" y="200" width="345" height="160" rx="8"/>
</g>
<g text-anchor="middle">
<text x="197.5" y="228" font-weight="bold" fill="#1F1E1E">si cada J encoge la señal</text>
<text x="197.5" y="250" font-size="14">norma &lt; 1: el producto se desvanece</text>
<text x="562.5" y="228" font-weight="bold" fill="#1F1E1E">si cada J la agranda</text>
<text x="562.5" y="250" font-size="14">norma &gt; 1: el producto explota</text>
</g>
<g font-family="'DejaVu Sans Mono', monospace">
<text x="130" y="290" font-size="20">0,9<tspan dy="-7" font-size="13">12</tspan><tspan dy="7"> = 0,28</tspan></text>
<text x="87" y="336" font-size="30" font-weight="bold" fill="#DA1B2E">0,9<tspan dy="-11" font-size="19">48</tspan><tspan dy="11"> = 0,006</tspan></text>
<text x="479" y="314" font-size="30" font-weight="bold" fill="#1F1E1E">1,1<tspan dy="-11" font-size="19">48</tspan><tspan dy="11"> = 97</tspan></text>
</g>
</svg>
