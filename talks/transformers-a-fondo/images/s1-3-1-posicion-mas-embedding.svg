<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 19 788 397" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>La posición entra con el embedding</title>
<desc>Cada fila de X es la suma del embedding del token y un vector que codifica su posición; sin esa suma, dos frases con las mismas palabras en otro orden darían las mismas filas.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3B3535"/></marker>
<g id="plus"><circle r="11" fill="#DA1B2E"/><path d="M-6,0 H6 M0,-6 V6" stroke="#FFFFFF" stroke-width="2.5"/></g>
</defs>
<rect x="6" y="19" width="788" height="397" fill="#FFFFFF"/>
<g font-size="16" font-weight="bold" fill="#1F1E1E">
<text x="30" y="66">token</text>
<text x="30" y="126">embedding</text>
<text x="30" y="202">posición</text>
<text x="30" y="276">fila de X</text>
</g>
<g stroke="#3B3535" stroke-width="1.5">
<line x1="260" y1="77" x2="260" y2="101"/><line x1="400" y1="77" x2="400" y2="101"/><line x1="540" y1="77" x2="540" y2="101"/>
<line x1="260" y1="139" x2="260" y2="147"/><line x1="400" y1="139" x2="400" y2="147"/><line x1="540" y1="139" x2="540" y2="147"/>
<line x1="260" y1="169" x2="260" y2="177"/><line x1="400" y1="169" x2="400" y2="177"/><line x1="540" y1="169" x2="540" y2="177"/>
<line x1="260" y1="215" x2="260" y2="251" marker-end="url(#ah)"/><line x1="400" y1="215" x2="400" y2="251" marker-end="url(#ah)"/><line x1="540" y1="215" x2="540" y2="251" marker-end="url(#ah)"/>
</g>
<g fill="#FFFFFF" stroke="#D8D2CE" stroke-width="1.5">
<rect x="220" y="43" width="80" height="34" rx="17"/><rect x="360" y="43" width="80" height="34" rx="17"/><rect x="500" y="43" width="80" height="34" rx="17"/>
</g>
<g fill="#F2EEEE" stroke="#D8D2CE" stroke-width="1.5">
<rect x="205" y="101" width="110" height="38" rx="6"/><rect x="345" y="101" width="110" height="38" rx="6"/><rect x="485" y="101" width="110" height="38" rx="6"/>
<rect x="205" y="177" width="110" height="38" rx="6"/><rect x="345" y="177" width="110" height="38" rx="6"/><rect x="485" y="177" width="110" height="38" rx="6"/>
</g>
<g fill="#FFFFFF" stroke="#3B3535" stroke-width="2">
<rect x="205" y="251" width="110" height="38" rx="6"/><rect x="345" y="251" width="110" height="38" rx="6"/><rect x="485" y="251" width="110" height="38" rx="6"/>
</g>
<use href="#plus" x="260" y="158"/><use href="#plus" x="400" y="158"/><use href="#plus" x="540" y="158"/>
<g font-family="'DejaVu Sans Mono', monospace" font-size="17" fill="#1F1E1E">
<text x="260" y="66" text-anchor="middle">the</text>
<text x="400" y="66" text-anchor="middle">cat</text>
<text x="540" y="66" text-anchor="middle">sat</text>
</g>
<g font-family="'DejaVu Sans Mono', monospace" font-size="18" fill="#1F1E1E">
<text x="241" y="126">e<tspan font-size="13" dy="4">the</tspan></text>
<text x="381" y="126">e<tspan font-size="13" dy="4">cat</tspan></text>
<text x="521" y="126">e<tspan font-size="13" dy="4">sat</tspan></text>
<text x="250" y="202">p<tspan font-size="13" dy="4">0</tspan></text>
<text x="390" y="202">p<tspan font-size="13" dy="4">1</tspan></text>
<text x="530" y="202">p<tspan font-size="13" dy="4">2</tspan></text>
<text x="241" y="276">x<tspan font-size="13" dy="4">the</tspan></text>
<text x="381" y="276">x<tspan font-size="13" dy="4">cat</tspan></text>
<text x="521" y="276">x<tspan font-size="13" dy="4">sat</tspan></text>
</g>
<g font-size="14">
<text x="620" y="117">d valores cada uno,</text>
<text x="620" y="135">de la tabla |V| × d</text>
<text x="620" y="193">d valores cada uno,</text>
<text x="620" y="211">uno por lugar</text>
</g>
<text x="620" y="276" font-size="16" font-weight="bold" fill="#1F1E1E">X : n × d</text>
<rect x="30" y="322" width="740" height="70" fill="#F2F2F2"/>
<rect x="30" y="322" width="5" height="70" fill="#DA1B2E"/>
<text x="52" y="351" font-size="16"><tspan font-weight="bold" fill="#DA1B2E">sin p:</tspan> “the cat sat” y “sat cat the” darían las mismas filas en otro orden,</text>
<text x="52" y="375" font-size="16">y la atención no distinguiría una de otra</text>
</svg>
